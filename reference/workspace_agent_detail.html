<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .section-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
    .section-tab {
      border: 1px solid rgba(148, 163, 184, .22);
      background: rgba(255, 255, 255, .84);
      color: var(--t2);
      border-radius: 999px;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all .18s ease;
    }
    .section-tab:hover {
      color: var(--brand);
      border-color: rgba(124, 58, 237, .26);
      background: rgba(124, 58, 237, .08);
    }
    .section-tab.is-active {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(135deg, var(--brand), var(--accent));
      box-shadow: 0 14px 24px rgba(124, 58, 237, .18);
    }
    .section-tab .material-icons-round {
      font-size: 16px;
    }
    [data-detail-panel][hidden] {
      display: none;
    }
    .secret-value-row {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .secret-text {
      min-width: 0;
      flex: 1 1 auto;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-all;
    }
    .secret-actions {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      align-self: flex-end;
    }
    .secret-grid.two.credential-grid {
      grid-template-columns: 1fr;
    }
    .secret-icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid rgba(148, 163, 184, .24);
      border-radius: 10px;
      background: rgba(255, 255, 255, .92);
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: color .18s ease, border-color .18s ease, background .18s ease, transform .18s ease;
    }
    .secret-icon-btn:hover {
      color: var(--brand);
      border-color: rgba(124, 58, 237, .24);
      background: rgba(124, 58, 237, .08);
      transform: translateY(-1px);
    }
    .secret-icon-btn .material-icons-round {
      font-size: 18px;
    }
    @media (max-width: 720px) {
      .secret-value-row {
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function cardList(rows) {
      return rows.map((row) => `<article class="card"><div class="card-title">${row.title}</div><div class="card-desc">${row.desc}</div><div class="tag-row">${row.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}</div></article>`).join("");
    }
    function list(rows) {
      return rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div>${row.side ? `<div class="list-side">${row.side}</div>` : ""}</div>`).join("");
    }
    function table(rows) {
      return `<div class="table-wrap"><table><thead><tr><th>Step</th><th>Runtime</th><th>Dependency</th><th>Outcome</th></tr></thead><tbody>${rows.map((row) => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`).join("")}</tbody></table></div>`;
    }
    function kv(rows) {
      return rows.map((row) => `<div class="kv-item"><div class="kv-key">${row.key}</div><div class="kv-value">${row.value}</div></div>`).join("");
    }
    function maskSecretValue(value) {
      const normalized = String(value ?? "");
      if (!normalized) return "-";
      return "•".repeat(Math.max(8, Math.min(normalized.length, 24)));
    }
    function secretGrid(rows) {
      return `<div class="secret-grid two credential-grid">${rows.map((row, index) => {
        const label = String(row.label || "");
        const rawValue = String(row.value ?? "");
        const normalizedLabel = label.trim().toLowerCase();
        const isPassword = row.maskable !== undefined ? Boolean(row.maskable) : normalizedLabel === "password";
        const isAgentId = normalizedLabel === "agent id";
        const copyable = row.copyable !== undefined ? Boolean(row.copyable) : (isPassword || isAgentId);
        const fieldId = `secret-field-${index}-${normalizedLabel.replace(/[^a-z0-9]+/g, "-") || "value"}`;
        const displayValue = isPassword ? maskSecretValue(rawValue) : rawValue;
        return `
        <article class="secret-card">
          <div class="secret-label">${escapeHtml(label)}</div>
          <div class="secret-value">
            <div class="secret-value-row">
              <span
                class="mono secret-text"
                id="${fieldId}"
                data-secret-display
                data-secret-raw="${escapeHtml(rawValue)}"
                data-secret-visible="${isPassword ? "false" : "true"}"
              >${escapeHtml(displayValue)}</span>
              ${(isPassword || copyable) ? `
              <span class="secret-actions">
                ${isPassword ? `
                <button class="secret-icon-btn" type="button" data-toggle-secret="${fieldId}" aria-label="비밀번호 보기" aria-pressed="false" title="비밀번호 보기">
                  <span class="material-icons-round">visibility</span>
                </button>
                ` : ""}
                ${copyable ? `
                <button class="secret-icon-btn" type="button" data-copy-secret="${escapeHtml(rawValue)}" data-copy-default-icon="content_copy" aria-label="${isPassword ? "비밀번호 복사" : "ID 복사"}" title="${isPassword ? "비밀번호 복사" : "ID 복사"}">
                  <span class="material-icons-round">content_copy</span>
                </button>
                ` : ""}
              </span>
              ` : ""}
            </div>
          </div>
          <div class="secret-meta">${row.meta || ""}</div>
        </article>
      `;
      }).join("")}</div>`;
    }
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function resourceTimelineCards(rows) {
      return `<div class="stats-grid two">${rows.map((row) => {
      const width = 640;
      const height = 88;
      const padX = 12;
      const padY = 10;
      const series = row.series || [];
      const max = Math.max(...series, 1);
      const min = Math.min(...series, 0);
      const range = max - min || 1;
      const step = series.length > 1 ? (width - padX * 2) / (series.length - 1) : 0;
      const linePoints = series.map((value, index) => {
        const x = padX + step * index;
        const y = height - padY - ((value - min) / range) * (height - padY * 2);
        return `${x},${y}`;
      }).join(" ");
      const areaPoints = `${padX},${height - padY} ${linePoints} ${width - padX},${height - padY}`;
      const lastValue = series[series.length - 1];
      const lastY = height - padY - ((lastValue - min) / range) * (height - padY * 2);

        return `
        <article class="health-timeline-card">
          <div class="health-timeline-top">
            <div>
              <div class="health-timeline-title">${row.title}</div>
              <div class="health-timeline-meta">${row.meta}</div>
            </div>
            <div class="health-timeline-value">${row.value}</div>
          </div>
          <div class="health-timeline-chart">
            <svg viewBox="0 0 ${width} ${height}" aria-hidden="true" preserveAspectRatio="none">
              <line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" class="health-timeline-axis"></line>
              <polygon points="${areaPoints}" class="health-timeline-area"></polygon>
              <polyline points="${linePoints}" class="health-timeline-line"></polyline>
              <circle cx="${padX + step * (series.length - 1)}" cy="${lastY}" r="4" class="health-timeline-dot"></circle>
            </svg>
          </div>
          <div class="health-timeline-foot">
            <span>${row.startLabel || "6h ago"}</span>
            <span>${row.endLabel || "now"}</span>
          </div>
        </article>
      `;
      }).join("")}</div>`;
    }
    function podMetricsTable(rows) {
      return `<div class="table-wrap"><table><thead><tr><th>Pod</th><th>Ready</th><th>Status</th><th>Restarts</th><th>Age</th><th>CPU</th><th>Mem</th></tr></thead><tbody>${rows.map((row) => `<tr><td><span class="mono">${row.pod}</span></td><td>${row.ready}</td><td>${row.status}</td><td>${row.restarts}</td><td>${row.age}</td><td>${row.cpu}</td><td>${row.mem}</td></tr>`).join("")}</tbody></table></div>`;
    }
    function logViewer(logs) {
      const pods = logs.pods || [];
      const defaultPod = logs.defaultPod || (pods[0] && pods[0].pod);
      return `
        <div class="logs-pod-selector" role="tablist" aria-label="Pod log selector">
          ${pods.map((pod, index) => `
            <button
              class="logs-pod-button${pod.pod === defaultPod || (!defaultPod && index === 0) ? " is-active" : ""}"
              type="button"
              role="tab"
              aria-selected="${pod.pod === defaultPod || (!defaultPod && index === 0) ? "true" : "false"}"
              data-log-pod-button="${pod.pod}"
            >
              <span class="material-icons-round">dns</span>
              <span>${pod.pod}</span>
            </button>
          `).join("")}
        </div>
        <div class="logs-shell" data-log-viewer>
          ${pods.map((pod, index) => `
          <section class="logs-panel${pod.pod === defaultPod || (!defaultPod && index === 0) ? " is-active" : ""}" data-log-pod-panel="${pod.pod}">
          <div class="logs-toolbar">
            <div class="logs-title"><span class="material-icons-round">terminal</span>${pod.title || pod.pod}</div>
            <div class="logs-meta">
              <span class="logs-chip">${pod.stream}</span>
              <span class="logs-chip">${pod.since}</span>
              <span class="logs-chip">${pod.lines}</span>
            </div>
          </div>
          <div class="logs-body"><pre class="logs-code">${escapeHtml(pod.content)}</pre></div>
          </section>
          `).join("")}
        </div>
      `;
    }
    function buildItem(item) {
      return {
        ...item,
        layoutMode: "full-width",
        mainHtml: `
          <section class="section-tabs" aria-label="Agent detail sections">
            <button class="section-tab is-active" type="button" data-detail-tab="overview"><span class="material-icons-round">dashboard</span>Overview</button>
            <button class="section-tab" type="button" data-detail-tab="access"><span class="material-icons-round">badge</span>Access</button>
            <button class="section-tab" type="button" data-detail-tab="status"><span class="material-icons-round">dns</span>Status</button>
            <button class="section-tab" type="button" data-detail-tab="logs"><span class="material-icons-round">terminal</span>Logs</button>
            <button class="section-tab" type="button" data-detail-tab="connected"><span class="material-icons-round">hub</span>Connected</button>
          </section>

          <section class="panel section" data-detail-panel="overview">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">dashboard</span>Overview</div>
                <h2 class="section-title">Agent 개요</h2>
                <p class="section-desc">운영 목적과 현재 관리 포인트를 먼저 보고, 아래에서 핵심 메모를 이어서 확인할 수 있게 정리했습니다.</p>
              </div>
              <a class="section-link" href="${item.relatedHref}"><span class="material-icons-round">arrow_outward</span>관련 허브</a>
            </div>
            <div class="stats-grid three">
              ${cardList(item.cards)}
            </div>
            <div style="height:16px;"></div>
            <div class="list-grid two">
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Operational Notes</div>
                <div class="panel-subtitle" style="margin-bottom:16px;">운영자가 같이 보는 체크 포인트를 빠르게 정리했습니다.</div>
                <div class="info-list">${list(item.notes)}</div>
              </div>
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Agent Facts</div>
                <div class="panel-subtitle" style="margin-bottom:16px;">실행 공간과 owner 같은 기본 런타임 메타를 확인합니다.</div>
                <div class="kv-list">${kv(item.facts)}</div>
              </div>
            </div>
          </section>

          <section class="panel section" data-detail-panel="access" hidden>
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">badge</span>Access</div>
                <h2 class="section-title">접속정보</h2>
                <p class="section-desc">운영자가 바로 확인해야 하는 agent id / password 와 기본 런타임 메타를 한 화면에서 확인할 수 있게 구성했습니다.</p>
              </div>
              <a class="section-link" href="${item.relatedHref}"><span class="material-icons-round">arrow_outward</span>관련 허브</a>
            </div>
            <div class="list-grid two">
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Credentials</div>
                <div class="panel-subtitle" style="margin-bottom:16px;">agent 접근에 필요한 id / pw를 바로 확인합니다.</div>
                ${secretGrid(item.credentials)}
              </div>
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Runtime Facts</div>
                <div class="panel-subtitle" style="margin-bottom:16px;">owner, namespace, key scope 같은 기본 정보를 함께 봅니다.</div>
                <div class="kv-list">${kv(item.facts)}</div>
              </div>
            </div>
          </section>

          <section class="panel section" data-detail-panel="status" hidden>
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">dns</span>Status</div>
                <h2 class="section-title">상태</h2>
                <p class="section-desc">CPU 와 Memory 점유 상태를 시계열로 먼저 보고, 아래에서 파드 이름과 Ready, Status, Restarts, Age, CPU, Mem 을 바로 확인할 수 있게 정리했습니다.</p>
              </div>
            </div>
            ${resourceTimelineCards(item.resourceTimelines)}
            <div style="height:16px;"></div>
            ${podMetricsTable(item.podMetrics)}
          </section>

          <section class="panel section" data-detail-panel="logs" hidden>
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">terminal</span>Logs</div>
                <h2 class="section-title">로그</h2>
                <p class="section-desc">파드를 선택하면서 최근 스트림 로그를 바로 전환해 볼 수 있게 구성했습니다. 장애 조사 시 CPU/Memory 흐름과 같은 맥락으로 빠르게 이어집니다.</p>
              </div>
            </div>
            ${logViewer(item.logs)}
          </section>

          <section class="panel section" data-detail-panel="connected" hidden>
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">hub</span>Connected</div>
                <h2 class="section-title">연결 상태</h2>
                <p class="section-desc">현재 agent와 이어진 허브, tool, surface를 별도 섹션으로 분리해 관리 흐름을 따라가기 쉽게 정리했습니다.</p>
              </div>
            </div>
            <div class="list-grid two">
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Connection Status</div>
                <div class="panel-subtitle" style="margin-bottom:16px;">이 agent가 참조하거나 결과를 전달하는 연결 지점을 모았습니다.</div>
                <div class="info-list">${list(item.relatedLinks)}</div>
              </div>
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Management Notes</div>
                <div class="panel-subtitle" style="margin-bottom:16px;">운영 시 특히 같이 봐야 하는 연결성 메모를 다시 모았습니다.</div>
                <div class="info-list">${list(item.notes)}</div>
              </div>
            </div>
          </section>
        `,
        sidebarHtml: ""
      };
    }

    const sharedPodMetrics = [
      { pod: "workspace-chatbot-api-7448558d44-472pq", ready: "1/1", status: "Running", restarts: "0", age: "17d", cpu: "231m", mem: "612Mi" },
      { pod: "workspace-chatbot-frontend-75d854775c-nnvbg", ready: "1/1", status: "Running", restarts: "0", age: "17d", cpu: "118m", mem: "284Mi" },
      { pod: "workspace-chatbot-plugin-daemon-6d448947c7-8vrrg", ready: "1/1", status: "Running", restarts: "0", age: "17d", cpu: "72m", mem: "164Mi" },
      { pod: "workspace-chatbot-postgresql-0", ready: "1/1", status: "Running", restarts: "0", age: "17d", cpu: "93m", mem: "512Mi" },
      { pod: "workspace-chatbot-redis-master-0", ready: "1/1", status: "Running", restarts: "0", age: "17d", cpu: "41m", mem: "96Mi" },
      { pod: "workspace-chatbot-sandbox-76b775c9f6-z5zl5", ready: "1/1", status: "Running", restarts: "0", age: "17d", cpu: "267m", mem: "704Mi" },
      { pod: "workspace-chatbot-worker-5d6dc7bd55-v5dx7", ready: "1/1", status: "Running", restarts: "0", age: "17d", cpu: "186m", mem: "438Mi" }
    ];

    const sharedLogPods = [
      {
        pod: "workspace-chatbot-api-7448558d44-472pq",
        title: "workspace-chatbot-api-7448558d44-472pq / prod",
        stream: "kubectl logs -f",

        content: `[2026-06-16 10:41:03] INFO  ingest: publish request accepted campaignId=cmp-240618\n[2026-06-16 10:41:04] INFO  policy: approval score computed score=0.94 reviewer=growth-ops\n[2026-06-16 10:41:09] INFO  sync: bundle uploaded bucket=restaurant-static-assets version=2026.06.16-02\n[2026-06-16 10:41:12] INFO  publish: rollout completed region=ap-seoul duration=1.8s\n[2026-06-16 10:43:27] WARN  webhook: reviewer callback delayed retry=1 wait=8s\n[2026-06-16 10:43:35] INFO  webhook: reviewer callback recovered requestId=rvw-9912`
      },
      {
        pod: "workspace-chatbot-frontend-75d854775c-nnvbg",

        stream: "kubectl logs -f",
        since: "since 15m",
        lines: "74 lines",
        content: `[2026-06-16 10:40:51] INFO  web: route resolved path=/workspace/chatbot/detail\n[2026-06-16 10:40:55] INFO  assets: dashboard bundle served cache=hit version=2026.06.16-1\n[2026-06-16 10:41:08] INFO  api: upstream responded status=200 duration=184ms\n[2026-06-16 10:42:11] WARN  web-vitals: cls spike detected page=agent-detail value=0.13\n[2026-06-16 10:42:28] INFO  ui: pod metrics panel refreshed namespace=workspace-chatbot\n[2026-06-16 10:43:09] INFO  session: operator active user=ops-admin region=ap-seoul`
      },
      {

        stream: "kubectl logs -f",
        since: "since 15m",
        lines: "66 lines",
        content: `[2026-06-16 10:40:24] INFO  daemon: plugin sync started workspace=chatbot\n[2026-06-16 10:40:29] INFO  registry: plugin manifest refreshed count=12\n[2026-06-16 10:41:02] INFO  health: plugin heartbeat delivered plugin=slack-bridge\n[2026-06-16 10:41:48] WARN  plugin: retry scheduled plugin=observability-stack reason=timeout\n[2026-06-16 10:42:05] INFO  plugin: retry success plugin=observability-stack duration=1.2s\n[2026-06-16 10:42:57] INFO  daemon: idle loop complete pending=0`
      },
      {

        since: "since 15m",

  <script>
    window.initAgentDetailCredentials = function initAgentDetailCredentials() {
      const copyButtons = Array.from(document.querySelectorAll("[data-copy-secret]"));
      const toggleButtons = Array.from(document.querySelectorAll("[data-toggle-secret]"));

      const copyText = async (value) => {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(value);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = value;
        textarea.setAttribute("readonly", "true");
        textarea.style.position = "absolute";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      };

      copyButtons.forEach((button) => {
        button.onclick = async () => {
          const value = button.dataset.copySecret || "";
          if (!value) return;

          try {
            await copyText(value);
            const icon = button.querySelector(".material-icons-round");
            if (!icon) return;
            const defaultIcon = button.dataset.copyDefaultIcon || "content_copy";
            icon.textContent = "check";
            clearTimeout(button.__copyTimer);
            button.__copyTimer = window.setTimeout(() => {
              icon.textContent = defaultIcon;
            }, 1200);
          } catch (error) {
            console.error("Failed to copy secret", error);
          }
        };
      });

      toggleButtons.forEach((button) => {
        button.onclick = () => {
          const targetId = button.dataset.toggleSecret;
          const field = targetId ? document.getElementById(targetId) : null;
          if (!field) return;

          const rawValue = field.dataset.secretRaw || "";
          const nextVisible = field.dataset.secretVisible !== "true";
          field.dataset.secretVisible = String(nextVisible);
          field.textContent = nextVisible ? rawValue : maskSecretValue(rawValue);
          button.setAttribute("aria-pressed", String(nextVisible));
          button.setAttribute("aria-label", nextVisible ? "비밀번호 숨기기" : "비밀번호 보기");
          button.setAttribute("title", nextVisible ? "비밀번호 숨기기" : "비밀번호 보기");

          const icon = button.querySelector(".material-icons-round");
          if (icon) {
            icon.textContent = nextVisible ? "visibility_off" : "visibility";
          }
        };
      });
    };

    window.initAgentDetailTabs = function initAgentDetailTabs() {
      const detailTabButtons = Array.from(document.querySelectorAll("[data-detail-tab]"));
      const detailPanels = Array.from(document.querySelectorAll("[data-detail-panel]"));

      const setActiveDetailPanel = (panelName) => {
        const nextPanel = panelName || "overview";

        detailTabButtons.forEach((button) => {
          const isActive = button.dataset.detailTab === nextPanel;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", String(isActive));
        });

        detailPanels.forEach((panel) => {
          panel.hidden = panel.dataset.detailPanel !== nextPanel;
        });
      };

      if (!detailTabButtons.length || !detailPanels.length) return;

      detailTabButtons.forEach((button) => {
        button.onclick = () => {
          setActiveDetailPanel(button.dataset.detailTab);
        };
      });

      setActiveDetailPanel("overview");
    };

    window.initAgentDetailTabs();
    window.initAgentDetailCredentials();
  </script>
  <script src="ax_studio_topbar.js"></script>
  <script>
    (function () {
      const config = window.DETAIL_PAGE_CONFIG;
      const params = new URLSearchParams(window.location.search);
      const requestedKey = params.get(config?.paramName || "item");

      if (!requestedKey) return;

      const currentItem = config?.items?.[requestedKey];
      if (!currentItem || !currentItem.__isLoading) return;

      const rerender = (nextItem) => {
        window.DETAIL_PAGE_CONFIG.items[requestedKey] = buildItem(nextItem);
        window.renderWorkspaceDetailPage?.();
        window.initAgentDetailTabs?.();
        window.initAgentDetailCredentials?.();

        const topbarHost = document.querySelector("[data-ax-topbar]");
        if (topbarHost && window.mountAxStudioTopbar) {
          window.mountAxStudioTopbar(topbarHost);
        }
      };

      const renderError = (message) => {
        rerender(createAgentDetailPlaceholder(requestedKey, {
          title: requestedKey,
          description: message,
          statusLabel: "Unavailable",
          isLoading: false
        }));
      };

      fetch(`/api/v2/agents/${encodeURIComponent(requestedKey)}`, { credentials: "same-origin" })
        .then((response) => {
          if (response.ok) return response.json();

          return response.json()
            .catch(() => null)
            .then((body) => {
              throw new Error(body?.error?.message || `Request failed (${response.status})`);
            });
        })
        .then((body) => {
          if (!body?.data) {
            throw new Error("Agent detail payload is empty");
          }

          rerender(buildApiItem(body.data));
        })
        .catch((error) => {
          console.error("Failed to load agent detail", error);
          renderError(`요청한 agent 정보를 불러오지 못했습니다. ${error.message || "Unknown error"}`);
        });
    })();
  </script>
