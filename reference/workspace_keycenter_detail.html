<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keycenter Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .usage-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-soft);
      padding: 20px;
    }
    .usage-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .usage-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .usage-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      margin-top: 4px;
    }
    .usage-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.04em;
      text-align: right;
    }
    .mini-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .mini-stat {
      padding: 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--border);
    }
    .mini-stat-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .mini-stat-value {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: 4px;
    }
    .mini-stat-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .access-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .project-list {
      display: grid;
      gap: 12px;
    }
    .project-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-soft);
    }
    .project-main {
      min-width: 0;
      display: grid;
      gap: 7px;
    }
    .project-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .project-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .project-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .project-side {
      display: grid;
      gap: 8px;
      justify-items: end;
      text-align: right;
    }
    .tiny-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .tiny-value {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
    }
    .section-card-spacer {
      margin-top: 18px;
    }
    .usage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .usage-range {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }
    .usage-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: 18px;
    }
    .key-stack {
      display: grid;
      gap: 12px;
    }
    .key-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .key-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
    .key-row:first-child {
      padding-top: 0;
    }
    .key-row-label {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 4px;
    }
    .key-row-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .key-row-value {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      white-space: normal;
      word-break: break-word;
    }
    .key-row-value .material-icons-round {
      font-size: 16px;
      color: var(--subtle);
    }
    .model-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .model-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }
    .usage-total-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }
    .usage-total-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      padding: 16px;
      min-height: 104px;
    }
    .usage-total-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .usage-total-value {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -.04em;
      margin-bottom: 6px;
    }
    .usage-total-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .usage-chart-shell {
      display: grid;
      gap: 18px;
    }
    .usage-chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }
    .usage-filter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .usage-filter select {
      min-width: 180px;
      padding: 9px 36px 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font: inherit;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--subtle) 50%),
        linear-gradient(135deg, var(--subtle) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 2px),
        calc(100% - 13px) calc(50% - 2px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .usage-chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .usage-chart-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding: 16px 16px 14px;
    }
    .usage-chart-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .usage-chart-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .usage-chart-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
    }
    .usage-chart-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex: 0 0 auto;
    }
    .usage-chart-svg {
      width: 100%;
      height: 220px;
      display: block;
    }
    .usage-chart-labels {
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(var(--chart-columns, 8), minmax(0, 1fr));
      gap: 8px;
    }
    .usage-chart-label {
      color: var(--subtle);
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }
    @media (max-width: 920px) {
      .mini-stats,
      .access-grid,
      .usage-detail-grid,
      .usage-chart-grid,
      .usage-total-grid {
        grid-template-columns: 1fr;
      }
      .project-card {
        grid-template-columns: 1fr;
      }
      .project-side {
        justify-items: start;
        text-align: left;
      }
      .usage-head {
        flex-direction: column;
        align-items: flex-start;
      }
      .usage-value {
        text-align: left;
      }
      .key-row {
        grid-template-columns: 1fr;
      }
      .usage-chart-head,
      .usage-chart-toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .usage-filter {
        margin-left: 0;
      }
      .usage-filter select {
        min-width: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function list(rows) {
      return rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div>${row.side ? `<div class="list-side">${row.side}</div>` : ""}</div>`).join("");
    }
    function kv(rows) {
      return rows.map((row) => `<div class="kv-item"><div class="kv-key">${row.key}</div><div class="kv-value">${row.value}</div></div>`).join("");
    }
    function secretGrid(rows) {
      return `<div class="secret-grid two">${rows.map((row) => `
        <article class="secret-card">
          <div class="secret-label">${row.label}</div>
          <div class="secret-value"><span class="mono">${row.value}</span></div>
          <div class="secret-meta">${row.meta || ""}</div>
        </article>
      `).join("")}</div>`;
    }
    function metricSummary(rows) {
      return `<div class="mini-stats">${rows.map((row) => `
        <article class="mini-stat">
          <div class="mini-stat-label">${row.label}</div>
          <div class="mini-stat-value">${row.value}</div>
          <div class="mini-stat-meta">${row.meta}</div>
        </article>
      `).join("")}</div>`;
    }
    function healthSummary(rows) {
      return `<div class="info-list">${rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div><div class="list-side">${row.value}</div></div>`).join("")}</div>`;
    }
    function connectionCards(rows) {
      return `<div class="project-list">${rows.map((row) => `
        <article class="project-card">
          <div class="project-main">
            <div class="project-top">
              <div class="project-name">${row.title}</div>
              <span class="tag">${row.badge}</span>
            </div>
            <div class="project-meta">${row.meta}</div>
            <div class="project-tags">${(row.tags || []).map((tag) => `<span class="tag">${tag}</span>`).join("")}</div>
          </div>
          <div class="project-side">
            <div class="tiny-label">${row.sideLabel}</div>
            <div class="tiny-value">${row.sideValue}</div>
            ${row.href ? `<a class="project-link" href="${row.href}">${row.linkLabel || "자세히 보기"}<span class="material-icons-round">chevron_right</span></a>` : ""}
          </div>
        </article>
      `).join("")}</div>`;
    }
    function keyRows(rows) {
      return `<div class="key-stack">${rows.map((row) => `
        <div class="key-row">
          <div>
            <div class="key-row-label">${row.label}</div>
            <div class="key-row-meta">${row.meta}</div>
          </div>
          <div class="key-row-value">${row.value}${row.actionIcon ? `<span class="material-icons-round">${row.actionIcon}</span>` : ""}</div>
        </div>
      `).join("")}</div>`;
    }
    function modelChips(models) {
      return `<div class="model-chip-grid">${models.map((model) => `<span class="model-chip"><span class="material-icons-round" style="font-size:14px;color:var(--brand)">model_training</span>${model}</span>`).join("")}</div>`;
    }
    function usageTotals(rows) {
      return `<div class="usage-total-grid">${rows.map((row) => `
        <article class="usage-total-card">
          <div class="usage-total-label">${row.label}</div>
          <div class="usage-total-value">${row.value}</div>
          <div class="usage-total-meta">${row.meta}</div>
        </article>
      `).join("")}</div>`;
    }
    function linePath(values, width, height, paddingX, paddingTop, paddingBottom, maxValue) {
      return values.map((value, index) => {
        const x = paddingX + ((width - paddingX * 2) * index) / Math.max(values.length - 1, 1);
        const usableHeight = height - paddingTop - paddingBottom;
        const y = paddingTop + usableHeight - (Math.max(value, 0) / maxValue) * usableHeight;
        return `${index === 0 ? "M" : "L"}${x} ${y}`;
      }).join(" ");
    }
    function pointDots(values, color, width, height, paddingX, paddingTop, paddingBottom, maxValue) {
      const usableHeight = height - paddingTop - paddingBottom;
      return values.map((value, index) => {
        const x = paddingX + ((width - paddingX * 2) * index) / Math.max(values.length - 1, 1);
        const y = paddingTop + usableHeight - (Math.max(value, 0) / maxValue) * usableHeight;
        return `<circle cx="${x}" cy="${y}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"></circle>`;
      }).join("");
    }
    function usageChart(chart) {
      const width = 420;
      const height = 220;
      const paddingX = 20;
      const paddingTop = 18;
      const paddingBottom = 26;
      const values = chart.series.flatMap((serie) => serie.values);
      const maxValue = Math.max(chart.max || 0, ...values, 1);
      const grid = [0, 0.25, 0.5, 0.75, 1].map((tick) => {
        const y = paddingTop + (height - paddingTop - paddingBottom) * tick;
        return `<line x1="${paddingX}" y1="${y}" x2="${width - paddingX}" y2="${y}" stroke="rgba(148,163,184,.2)" stroke-width="1" stroke-dasharray="4 4"></line>`;
      }).join("");
      const svg = chart.series.map((serie) => `
        <path d="${linePath(serie.values, width, height, paddingX, paddingTop, paddingBottom, maxValue)}" fill="none" stroke="${serie.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        ${pointDots(serie.values, serie.color, width, height, paddingX, paddingTop, paddingBottom, maxValue)}
      `).join("");

      return `
        <article class="usage-chart-card">
          <div class="usage-chart-head">
            <div>
              <div class="usage-chart-title">${chart.title}</div>
              ${chart.meta ? `<div class="usage-chart-meta">${chart.meta}</div>` : ""}
            </div>
            <div class="usage-chart-legend">${chart.series.map((serie) => `<span class="legend-item"><span class="legend-dot" style="background:${serie.color}"></span>${serie.label}</span>`).join("")}</div>
          </div>
          <svg class="usage-chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="${chart.title}">
            ${grid}
            ${svg}
          </svg>
          <div class="usage-chart-labels" style="--chart-columns:${chart.labels.length}">${chart.labels.map((label) => `<div class="usage-chart-label">${label}</div>`).join("")}</div>
        </article>
      `;
    }
    function buildUsageSection(item) {
      const usage = usageInsightsByKey[item.key];
      const primaryMetric = item.statusCards[1];
      return `
        <section class="panel section">
          <div class="usage-toolbar">
            <div>
              <div class="section-kicker"><span class="material-icons-round">stacked_bar_chart</span>Usage Overview</div>
              <h2 class="section-title">키 사용 상세</h2>
              <p class="section-desc">선택한 기간 기준으로 key 사용량과 모델 범위를 함께 확인할 수 있습니다.</p>
            </div>
            <div class="usage-range"><span class="material-icons-round">calendar_month</span>${usage.period}</div>
          </div>
          <article class="usage-card">
            <div class="usage-head">
              <div>
                <div class="usage-name">${primaryMetric.title}</div>
                <div class="usage-meta">${primaryMetric.meta}</div>
              </div>
              <div class="usage-value">${primaryMetric.value}</div>
            </div>
            ${metricSummary(item.usageSummary)}
          </article>
          <article class="card section-card-spacer">
            <div class="card-title">상태 요약</div>
            <div class="card-desc">현재 발급 상태와 사용 흐름을 한 번에 볼 수 있습니다.</div>
            <div class="section-stack">${healthSummary(item.statusCards)}</div>
          </article>
        </section>
        <section class="panel section">
          <div class="section-head">
            <div>
              <div class="section-kicker"><span class="material-icons-round">vpn_key</span>Key Scope</div>
              <h2 class="section-title">키와 모델 범위</h2>
              <p class="section-desc">현재 연결된 key 정보와 호출 가능한 모델 범위를 함께 확인할 수 있습니다.</p>
            </div>
          </div>
          <div class="usage-detail-grid">
            <article class="card">
              <div class="card-title">키 정보</div>
              <div class="card-desc">현재 사용 중인 key와 연결 방식입니다.</div>
              ${keyRows(usage.keyInfo)}
            </article>
            <article class="card">
              <div class="card-title">사용 가능 모델</div>
              <div class="card-desc">이 key로 바로 호출할 수 있는 모델 범위입니다.</div>
              ${modelChips(usage.models)}
            </article>
          </div>
        </section>
        <section class="panel section">
          <div class="section-head">
            <div>
              <div class="section-kicker"><span class="material-icons-round">summarize</span>Usage Totals</div>
              <h2 class="section-title">총 사용량</h2>
              <p class="section-desc">선택한 기간 동안 누적된 요청, 세션, 토큰, 비용을 확인할 수 있습니다.</p>
            </div>
          </div>
          <article class="card">
            <div class="card-title">총 사용량</div>
            <div class="card-desc">선택한 기간 동안 누적된 사용량입니다.</div>
            ${usageTotals(usage.totals)}
          </article>
        </section>
        <section class="panel section">
          <div class="section-head">
            <div>
              <div class="section-kicker"><span class="material-icons-round">monitoring</span>Usage Charts</div>
              <h2 class="section-title">모델별 사용량</h2>
              <p class="section-desc">요청, 토큰, 비용, 성공률 흐름을 패널 단위로 나눠 확인할 수 있습니다.</p>
            </div>
          </div>
          <article class="card">
            <div class="usage-chart-toolbar">
              <div>
                <div class="card-title">모델별 사용량</div>
                <div class="card-desc">요청, 토큰, 비용, 성공률 흐름을 함께 볼 수 있습니다.</div>
              </div>
              <label class="usage-filter">모델
                <select>
                  ${usage.filters.map((filter) => `<option${filter === usage.selectedFilter ? " selected" : ""}>${filter}</option>`).join("")}
                </select>
              </label>
            </div>
            <div class="usage-chart-shell">
              <div class="usage-chart-grid">${usage.charts.map((chart) => usageChart(chart)).join("")}</div>
            </div>
          </article>
        </section>
      `;
    }
    function buildAccessSection(item) {
      return `
        <section class="panel section">
          <div class="section-head">
            <div>
              <div class="section-kicker"><span class="material-icons-round">vpn_key</span>Access</div>
              <h2 class="section-title">접근 정보</h2>
              <p class="section-desc">이 key의 tier, 연결 정보, 발급 메타를 함께 확인할 수 있습니다.</p>
            </div>
            <a class="section-link" href="${item.accessLink.href}">${item.accessLink.label}<span class="material-icons-round">chevron_right</span></a>
          </div>
          <div class="access-grid">
            <article class="card">
              <div class="card-title">연결 정보</div>
              <div class="kv-list">${kv(item.accessInfo)}</div>
            </article>
            <article class="card">
              <div class="card-title">발급 정보</div>
              ${secretGrid(item.registration)}
            </article>
          </div>
        </section>
      `;
    }
    function buildItem(item) {
      return {
        ...item,
        layoutMode: "full-width",
        mainHtml: `
          ${buildUsageSection(item)}
          ${buildAccessSection(item)}
          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">link</span>Connection Status</div>
                <h2 class="section-title">연결 상태</h2>
                <p class="section-desc">이 key가 어떤 chatbot, agent, tool surface와 연결되어 있는지 확인할 수 있습니다.</p>
              </div>
