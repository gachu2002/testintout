<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keycenter Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .usage-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-soft);
      padding: 20px;
    }
    .usage-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .usage-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .usage-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      margin-top: 4px;
    }
    .usage-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.04em;
      text-align: right;
    }
    .mini-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .mini-stat {
      padding: 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--border);
    }
    .mini-stat-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .mini-stat-value {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: 4px;
    }
    .mini-stat-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .access-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .project-list {
      display: grid;
      gap: 12px;
    }
    .project-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-soft);
    }
    .project-main {
      min-width: 0;
      display: grid;
      gap: 7px;
    }
    .project-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .project-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .project-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .project-side {
      display: grid;
      gap: 8px;
      justify-items: end;
      text-align: right;
    }
    .tiny-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .tiny-value {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
    }
    .author-list {
      display: grid;
      gap: 10px;
    }
    .author-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
    }
    .author-main {
      min-width: 0;
    }
    .author-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .author-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
      word-break: break-word;
    }
    .author-side {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      text-align: right;
    }
    .section-card-spacer {
      margin-top: 18px;
    }
    .usage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .usage-range {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }
    .usage-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: 18px;
    }
    .key-stack {
      display: grid;
      gap: 12px;
    }
    .key-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .key-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
    .key-row:first-child {
      padding-top: 0;
    }
    .key-row-label {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 4px;
    }
    .key-row-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .key-row-value {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      white-space: normal;
      word-break: break-word;
    }
    .key-row-value .material-icons-round {
      font-size: 16px;
      color: var(--subtle);
    }
    .model-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .model-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }
    .usage-total-groups {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .usage-total-group {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      padding: 16px;
    }
    .usage-total-group-head {
      display: grid;
      gap: 4px;
      margin-bottom: 14px;
    }
    .usage-total-group-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .usage-total-group-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .usage-total-list {
      display: grid;
      gap: 10px;
    }
    .usage-total-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .usage-total-row:first-child {
      padding-top: 0;
      border-top: 0;
    }
    .usage-total-row-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .usage-total-row-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
    }
    .usage-total-row-value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.04em;
      text-align: right;
    }
    .usage-total-row-side {
      display: grid;
      justify-items: end;
      gap: 4px;
    }
    .usage-total-row-side-meta {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .usage-total-footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .usage-total-footer-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .usage-total-footer-value {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .usage-total-footer-meta {
      width: 100%;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .usage-chart-shell {
      display: grid;
      gap: 18px;
    }
    .usage-chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }
    .usage-filter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .usage-filter select {
      min-width: 180px;
      padding: 9px 36px 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font: inherit;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--subtle) 50%),
        linear-gradient(135deg, var(--subtle) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 2px),
        calc(100% - 13px) calc(50% - 2px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .usage-chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .usage-chart-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding: 16px 16px 14px;
    }
    .usage-chart-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .usage-chart-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .usage-chart-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
    }
    .usage-chart-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex: 0 0 auto;
    }
    .usage-chart-svg {
      width: 100%;
      height: 220px;
      display: block;
    }
    .usage-chart-labels {
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(var(--chart-columns, 8), minmax(0, 1fr));
      gap: 8px;
    }
    .usage-chart-label {
      color: var(--subtle);
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }
    @media (max-width: 920px) {
      .mini-stats,
      .access-grid,
      .usage-detail-grid,
      .usage-chart-grid,
      .usage-total-groups {
        grid-template-columns: 1fr;
      }
      .project-card {
        grid-template-columns: 1fr;
      }
      .project-side {
        justify-items: start;
        text-align: left;
      }
      .usage-head {
        flex-direction: column;
        align-items: flex-start;
      }
      .usage-value {
        text-align: left;
      }
      .key-row {
        grid-template-columns: 1fr;
      }
      .usage-chart-head,
      .usage-chart-toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .usage-filter {
        margin-left: 0;
      }
      .usage-filter select {
        min-width: 0;
        width: 100%;
      }
      .usage-total-row {
        grid-template-columns: 1fr;
      }
      .usage-total-row-side {
        justify-items: start;
      }
      .author-item {
        grid-template-columns: 1fr;
      }
      .author-side {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function list(rows) {
      return rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div>${row.side ? `<div class="list-side">${row.side}</div>` : ""}</div>`).join("");
    }
    function kv(rows) {
      return rows.map((row) => `<div class="kv-item"><div class="kv-key">${row.key}</div><div class="kv-value">${row.value}</div></div>`).join("");
    }
    function secretGrid(rows) {
      return `<div class="secret-grid two">${rows.map((row) => `
        <article class="secret-card">
          <div class="secret-label">${row.label}</div>
          <div class="secret-value"><span class="mono">${row.value}</span></div>
          <div class="secret-meta">${row.meta || ""}</div>
        </article>
      `).join("")}</div>`;
    }
    function authorList(rows) {
      const items = Array.isArray(rows) && rows.length
        ? rows
        : [{ name: "등록된 author 없음", meta: "현재 이 key에 추가 author가 연결되어 있지 않습니다.", role: "None" }];
      return `<div class="author-list">${items.map((row) => `
        <article class="author-item">
          <div class="author-main">
            <div class="author-name">${escapeHtml(row?.name || "-")}</div>
            <div class="author-meta">${escapeHtml(row?.meta || "권한이 부여된 author")}</div>
          </div>
          <div class="author-side">${escapeHtml(row?.role || "Author")}</div>
        </article>
      `).join("")}</div>`;
    }
    function metricSummary(rows) {
      return `<div class="mini-stats">${rows.map((row) => `
        <article class="mini-stat">
          <div class="mini-stat-label">${row.label}</div>
          <div class="mini-stat-value">${row.value}</div>
          <div class="mini-stat-meta">${row.meta}</div>
        </article>
      `).join("")}</div>`;
    }
    function healthSummary(rows) {
      return `<div class="info-list">${rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div><div class="list-side">${row.value}</div></div>`).join("")}</div>`;
    }
    function connectionCards(rows) {
      return `<div class="project-list">${rows.map((row) => `
        <article class="project-card">
          <div class="project-main">
            <div class="project-top">
              <div class="project-name">${row.title}</div>
              <span class="tag">${row.badge}</span>
            </div>
            <div class="project-meta">${row.meta}</div>
            <div class="project-tags">${(row.tags || []).map((tag) => `<span class="tag">${tag}</span>`).join("")}</div>
          </div>
          <div class="project-side">
            <div class="tiny-label">${row.sideLabel}</div>
            <div class="tiny-value">${row.sideValue}</div>
            ${row.href ? `<a class="project-link" href="${row.href}">${row.linkLabel || "자세히 보기"}<span class="material-icons-round">chevron_right</span></a>` : ""}
          </div>
        </article>
      `).join("")}</div>`;
    }
    function keyRows(rows) {
      return `<div class="key-stack">${rows.map((row) => `
        <div class="key-row">
          <div>
            <div class="key-row-label">${row.label}</div>
            <div class="key-row-meta">${row.meta}</div>
          </div>
          <div class="key-row-value">${row.value}${row.actionIcon ? `<span class="material-icons-round">${row.actionIcon}</span>` : ""}</div>
        </div>
      `).join("")}</div>`;
    }
    function modelChips(models) {
      return `<div class="model-chip-grid">${models.map((model) => `<span class="model-chip"><span class="material-icons-round" style="font-size:14px;color:var(--brand)">model_training</span>${model}</span>`).join("")}</div>`;
    }
    function groupUsageTotals(rows) {
      if (!Array.isArray(rows) || !rows.length) {
        return [];
      }

      if (rows[0] && Array.isArray(rows[0].items)) {
        return rows;
      }

      const requestItems = rows.filter((row) => /요청|성공|실패/i.test(String(row?.label || "")));
      const tokenItems = rows.filter((row) => /토큰|input|output|cached/i.test(String(row?.label || "")));
      const miscItems = rows.filter((row) => !requestItems.includes(row) && !tokenItems.includes(row));
      const groups = [];

      if (requestItems.length) {
        groups.push({
          title: "요청 흐름",
          meta: "선택한 기간 동안 발생한 요청 결과를 함께 봅니다.",
          items: requestItems
        });
      }

      if (tokenItems.length) {
        groups.push({
          title: "토큰 사용량",
          meta: "총 토큰과 input/output/cache 구성을 함께 봅니다.",
          items: tokenItems
        });
      }

      if (miscItems.length) {
        groups.push({
          title: "추가 집계",
          meta: "비용이나 기타 부가 지표입니다.",
          items: miscItems
        });
      }

      return groups;
    }
    function usageTotals(rows) {
      const groups = groupUsageTotals(rows);
      return `<div class="usage-total-groups">${groups.map((group) => `
        <article class="usage-total-group">
          <div class="usage-total-group-head">
            <div class="usage-total-group-title">${group.title}</div>
            <div class="usage-total-group-meta">${group.meta || ""}</div>
          </div>
          <div class="usage-total-list">${(group.items || []).map((row) => `
            <div class="usage-total-row">
              <div>
                <div class="usage-total-row-label">${row.label}</div>
                <div class="usage-total-row-meta">${row.meta || ""}</div>
              </div>
              <div class="usage-total-row-side">
                <div class="usage-total-row-value">${row.value}</div>
                ${row.sideMeta ? `<div class="usage-total-row-side-meta">${row.sideMeta}</div>` : ""}
              </div>
            </div>
          `).join("")}</div>
          ${group.footer ? `
            <div class="usage-total-footer">
              <div class="usage-total-footer-label">${group.footer.label}</div>
              <div class="usage-total-footer-value">${group.footer.value}</div>
              ${group.footer.meta ? `<div class="usage-total-footer-meta">${group.footer.meta}</div>` : ""}
            </div>
          ` : ""}
        </article>
      `).join("")}</div>`;
    }
    function linePath(values, width, height, paddingX, paddingTop, paddingBottom, maxValue) {
      return values.map((value, index) => {
        const x = paddingX + ((width - paddingX * 2) * index) / Math.max(values.length - 1, 1);
        const usableHeight = height - paddingTop - paddingBottom;
        const y = paddingTop + usableHeight - (Math.max(value, 0) / maxValue) * usableHeight;
        return `${index === 0 ? "M" : "L"}${x} ${y}`;
      }).join(" ");
    }
    function pointDots(values, color, width, height, paddingX, paddingTop, paddingBottom, maxValue) {
      const usableHeight = height - paddingTop - paddingBottom;
      return values.map((value, index) => {
        const x = paddingX + ((width - paddingX * 2) * index) / Math.max(values.length - 1, 1);
        const y = paddingTop + usableHeight - (Math.max(value, 0) / maxValue) * usableHeight;
        return `<circle cx="${x}" cy="${y}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"></circle>`;
      }).join("");
    }
    function usageChart(chart) {
      const width = 420;
      const height = 220;
      const paddingX = 20;
      const paddingTop = 18;
      const paddingBottom = 26;
      const values = chart.series.flatMap((serie) => serie.values);
      const maxValue = Math.max(chart.max || 0, ...values, 1);
      const grid = [0, 0.25, 0.5, 0.75, 1].map((tick) => {
        const y = paddingTop + (height - paddingTop - paddingBottom) * tick;
        return `<line x1="${paddingX}" y1="${y}" x2="${width - paddingX}" y2="${y}" stroke="rgba(148,163,184,.2)" stroke-width="1" stroke-dasharray="4 4"></line>`;
      }).join("");
      const svg = chart.series.map((serie) => `
        <path d="${linePath(serie.values, width, height, paddingX, paddingTop, paddingBottom, maxValue)}" fill="none" stroke="${serie.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
        ${pointDots(serie.values, serie.color, width, height, paddingX, paddingTop, paddingBottom, maxValue)}
      `).join("");

      return `
        <article class="usage-chart-card">
          <div class="usage-chart-head">
            <div>
              <div class="usage-chart-title">${chart.title}</div>
              ${chart.meta ? `<div class="usage-chart-meta">${chart.meta}</div>` : ""}
            </div>
            <div class="usage-chart-legend">${chart.series.map((serie) => `<span class="legend-item"><span class="legend-dot" style="background:${serie.color}"></span>${serie.label}</span>`).join("")}</div>
          </div>
          <svg class="usage-chart-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" role="img" aria-label="${chart.title}">
            ${grid}
            ${svg}
          </svg>
          <div class="usage-chart-labels" style="--chart-columns:${chart.labels.length}">${chart.labels.map((label) => `<div class="usage-chart-label">${label}</div>`).join("")}</div>
        </article>
      `;
    }
    function buildUsageSection(item) {
      const usage = usageInsightsByKey[item.key];
      const primaryMetric = item.statusCards[1];
      return `
        <section class="panel section">
          <div class="section-head">
            <div>
              <div class="section-kicker"><span class="material-icons-round">vpn_key</span>Key Scope</div>

      if (!Number.isFinite(number)) return "0";

    function buildSyntheticUsageDays(usage) {
      if (Array.isArray(usage?.days) && usage.days.length) {
        return usage.days;
      }

      const modelNames = (Array.isArray(usage?.filters) ? usage.filters : []).filter((filter) => filter && filter !== "all");
      const charts = Array.isArray(usage?.charts) ? usage.charts : [];
      const labels = charts[0]?.labels || [];

      if (!modelNames.length || !labels.length) {
        return [];
      }

      const weightSeed = modelNames.map((_, index) => modelNames.length - index);
      const weightTotal = weightSeed.reduce((sum, value) => sum + value, 0) || 1;
      const normalizedWeights = weightSeed.map((value) => value / weightTotal);
      const getChart = (title) => charts.find((chart) => chart?.title === title) || null;
      const getSeriesValues = (chartTitle, seriesLabel) => {
        const chart = getChart(chartTitle);
        const series = (chart?.series || []).find((item) => item?.label === seriesLabel);
        return Array.isArray(series?.values) ? series.values : [];
      };

      const totalTokens = getSeriesValues("Token Consumption", "Total");
      const outputTokens = getSeriesValues("Token Consumption", "Completion");
      const inputTokens = getSeriesValues("Token Consumption", "Prompt");
      const requestCounts = getSeriesValues("Requests per Day", "Requests");
      const usageCosts = getSeriesValues("Daily Expenditure (USD)", "Spend");
      const successCounts = getSeriesValues("Success vs Failed Requests", "Success");
      const failedCounts = getSeriesValues("Success vs Failed Requests", "Failed");

      return labels.map((label, labelIndex) => ({
        date: `2026-${label}`,
        totals: {
          totalTokens: Number(totalTokens[labelIndex] || 0),
          outputTokens: Number(outputTokens[labelIndex] || 0),
          inputTokens: Number(inputTokens[labelIndex] || 0),
          requestCount: Number(requestCounts[labelIndex] || 0),
          successRequestCount: Number(successCounts[labelIndex] || 0),
          failedRequestCount: Number(failedCounts[labelIndex] || 0),
          usageCost: Number(usageCosts[labelIndex] || 0),
          cacheWriteTokens: 0,
          cacheReadTokens: 0
        },
        models: modelNames.map((model, modelIndex) => {
          const weight = normalizedWeights[modelIndex] || 0;
          return {
            model,
            totalTokens: roundMetricValue((totalTokens[labelIndex] || 0) * weight),
            outputTokens: roundMetricValue((outputTokens[labelIndex] || 0) * weight),
            inputTokens: roundMetricValue((inputTokens[labelIndex] || 0) * weight),
            requestCount: roundMetricValue((requestCounts[labelIndex] || 0) * weight),
            successRequestCount: roundMetricValue((successCounts[labelIndex] || 0) * weight),
            failedRequestCount: roundMetricValue((failedCounts[labelIndex] || 0) * weight),
            usageCost: roundMetricValue((usageCosts[labelIndex] || 0) * weight),
            cacheWriteTokens: 0,
            cacheReadTokens: 0
          };
        })
      }));
    }

    function initializeUsageInsights(usage) {
      if (!usage || typeof usage !== "object") {
        return usage;

      if (!Array.isArray(usage.days) || !usage.days.length) {
        usage.days = buildSyntheticUsageDays(usage);
      }

      usage.selectedFilter = usage.selectedFilter || "all";
      usage.charts = buildUsageCharts(usage, usage.selectedFilter);
      return usage;

    async function fetchJson(url) {
      const response = await fetch(url, {
        method: "GET",
        credentials: "same-origin",
        cache: "no-store",
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {

      }

      return response.json();

    function normalizeText(value) {

    function resolveSampleSeed(params, resolvedId) {
      const legacyItem = params.get("item");
      if (legacyItem && RAW_ITEMS_BY_KEY[legacyItem]) {
        return RAW_ITEMS_BY_KEY[legacyItem];
      }

      if (resolvedId && RAW_ITEMS_BY_ID[resolvedId]) {
        return RAW_ITEMS_BY_ID[resolvedId];
      }

      return null;
    }

    function findMatchingKeyItem(items, seedItem) {
      const list = Array.isArray(items) ? items : [];
      if (!seedItem || !list.length) return null;

      const desiredKey = normalizeText(seedItem.key);
      const desiredTitle = normalizeText(seedItem.title);
      const desiredTier = normalizeTierValue(seedItem.typeLabel);

      const exactAccountIdentifier = list.find((item) => normalizeText(item?.accountIdentifier) === desiredKey);
      if (exactAccountIdentifier) return exactAccountIdentifier;

      const exactNameAndTier = list.find((item) =>
        normalizeText(item?.name) === desiredTitle &&
        (
          normalizeTierValue(item?.tier?.label) === desiredTier ||
          normalizeTierValue(item?.tier?.code) === desiredTier
        )
      );
      if (exactNameAndTier) return exactNameAndTier;

      const exactNameMatches = list.filter((item) => normalizeText(item?.name) === desiredTitle);
      if (exactNameMatches.length === 1) {
        return exactNameMatches[0];
      }

      const looseMatches = list.filter((item) =>
        normalizeText(item?.name) === desiredTitle ||
        normalizeText(item?.accountIdentifier) === desiredKey
      );
      if (looseMatches.length === 1) {
        return looseMatches[0];
      }

      return null;
    }

    async function resolveApiKeyFromSample(seedItem) {
      if (!seedItem) return null;

      const candidates = Array.from(new Set([seedItem.key, seedItem.title].filter(Boolean)));
      for (const candidate of candidates) {
        const payload = await fetchJson(`/api/v2/keycenter/keys?limit=100&q=${encodeURIComponent(candidate)}`);
        const data = getPayloadData(payload);
        const match = findMatchingKeyItem(data?.items, seedItem);
        if (match) {
          return match;
        }
      }

      return null;
    }

    function getUsageWindow() {
      const endDate = new Date();
      const startDate = new Date(endDate);
      startDate.setDate(endDate.getDate() - 13);
      const toDateString = (value) => value.toISOString().slice(0, 10);
      return {
        startDate: toDateString(startDate),
        endDate: toDateString(endDate)
      };
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
    }

    async function bootstrapDetailConfig() {
      const params = new URLSearchParams(window.location.search);
      const legacyItem = params.get("item");
      const requestedId = params.get("id");
      const seedItem = resolveSampleSeed(params, requestedId);

      if (!requestedId && legacyItem && LEGACY_ITEM_TO_ID[legacyItem]) {
        params.set("id", LEGACY_ITEM_TO_ID[legacyItem]);
        const nextSearch = params.toString();
        const nextUrl = `${window.location.pathname}${nextSearch ? `?${nextSearch}` : ""}${window.location.hash || ""}`;
        window.history.replaceState({}, "", nextUrl);
      }

      const resolvedId = params.get("id");
      if (!resolvedId) {
        return;
      }

      try {
        let keyItem;
        try {
          const keyPayload = await fetchJson(`/api/v2/keycenter/keys/${encodeURIComponent(resolvedId)}`);
          keyItem = getPayloadData(keyPayload);
        } catch (error) {
          const resolvedFromSample = await resolveApiKeyFromSample(seedItem);
          if (!resolvedFromSample) {
            throw error;
          }

          keyItem = resolvedFromSample;
          params.set("id", keyItem.id);
          const nextSearch = params.toString();
          const nextUrl = `${window.location.pathname}${nextSearch ? `?${nextSearch}` : ""}${window.location.hash || ""}`;
          window.history.replaceState({}, "", nextUrl);
        }

        const usageWindow = getUsageWindow();
        const [usagePayload, tierPayload] = await Promise.all([
          fetchJson(`/api/v2/keycenter/tiers/usage?startDate=${encodeURIComponent(usageWindow.startDate)}&endDate=${encodeURIComponent(usageWindow.endDate)}&key=${encodeURIComponent(keyItem?.id || resolvedId)}`),
          keyItem?.tier?.id
            ? fetchJson(`/api/v2/keycenter/tiers/${encodeURIComponent(keyItem.tier.id)}`)
                .catch((error) => {
                  console.warn("Failed to load tier detail for keycenter detail", {
                    keyId: keyItem?.id || resolvedId,
                    tierId: keyItem?.tier?.id || null,
                    error
                  });
                  return { data: null };
                })
            : Promise.resolve({ data: null })
        ]);
        const usage = getPayloadData(usagePayload);
        const tierDetail = getPayloadData(tierPayload);
        DETAIL_ITEMS[keyItem.id] = buildItem(buildDynamicItemFromApi(keyItem, usage, tierDetail));
      } catch (error) {
        console.warn("Failed to hydrate keycenter detail from API", error);
        if (!DETAIL_ITEMS[resolvedId]) {
          DETAIL_ITEMS[resolvedId] = buildItem(buildUnavailableItem(resolvedId));
        }
      }
    }

    window.DETAIL_PAGE_CONFIG = {
      paramName: "id",
      pageTitle: "Keycenter Detail",
      hubLabel: "Keycenter",
      hubHref: "workspace_keycenter_hub.html",
      activeHubKey: "keycenter",
      eyebrow: "AI · Issued LLM Keys",
      searchPlaceholder: "key 이름, tier, model, connected surface를 검색하세요...",
      items: DETAIL_ITEMS
    };
  </script>
  <script>
    bootstrapDetailConfig()
      .catch((error) => {
        console.warn("Failed to initialize keycenter detail page", error);
      })
      .finally(async () => {
        try {
          await loadScript("workspace_detail_shared.js");
          await loadScript("ax_studio_topbar.js");
          initializeUsageChartFilters();
        } catch (error) {
          console.error("Failed to load keycenter detail scripts", error);
        }
      });
  </script>
</body>
</html>
