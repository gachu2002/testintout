    <script>
      function cards(rows) {
        return rows
          .map(
            (row) =>
              `<article class="card"><div class="card-title">${row.title}</div><div class="card-desc">${row.desc}</div><div class="tag-row">${row.tags.map((tag) => `<span class="tag">${tag}</span>`).join('')}</div></article>`,
          )
          .join('');
      }
      function list(rows) {
        return rows
          .map(
            (row) =>
              `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div>${row.side ? `<div class="list-side">${row.side}</div>` : ''}</div>`,
          )
          .join('');
      }
      function table(rows) {
        return `<div class="table-wrap"><table><thead><tr><th>Provider</th><th>Models</th><th>Quota / Limit</th><th>Main Consumers</th></tr></thead><tbody>${rows.map((row) => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`).join('')}</tbody></table></div>`;
      }
      function progress(rows) {
        return rows
          .map(
            (row) =>
              `<article class="progress-card"><div class="progress-top"><div class="progress-title">${row.title}</div><div class="progress-value">${row.value}</div></div><div class="progress-bar"><div class="progress-fill" style="width:${row.percent}%;"></div></div><div class="progress-meta">${row.meta}</div></article>`,
          )
          .join('');
      }
      function timeline(rows) {
        return rows
          .map(
            (row) =>
              `<div class="timeline-row"><div class="timeline-rail"><span class="timeline-dot"></span></div><div class="timeline-card"><div class="timeline-title">${row.title}</div><div class="timeline-meta">${row.meta}</div></div></div>`,
          )
          .join('');
      }
      function kv(rows) {
        return rows
          .map(
            (row) =>
              `<div class="kv-item"><div class="kv-key">${row.key}</div><div class="kv-value">${row.value}</div></div>`,
          )
          .join('');
      }

          </section>
          <section class="panel section">

            <p class="section-desc">detail 페이지에서는 tier별 provider 구성과 주요 consumer를 구체적으로 보여줍니다.</p>
            ${table(item.providers)}
          </section>
          <section class="panel section">
            <div class="list-grid two">
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Governance Notes</div>
                <div class="info-list">${list(item.notes)}</div>
              </div>
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Main Consumers</div>
                <div class="info-list">${list(item.relatedLinks)}</div>
              </div>
            </div>
          </section>
        `,
          sidebarHtml: `
          <section class="panel section">
            <div class="section-kicker"><span class="material-icons-round">donut_large</span>Quota Pulse</div>

            <div class="stats-grid">${progress(item.progress)}</div>
          </section>
          <section class="panel timeline-panel">
            <div class="panel-kicker"><span class="material-icons-round">history</span>Recent Policy</div>
            <h3 class="panel-title" style="font-size:18px;">최근 정책 변경</h3>
            <div class="timeline-list">${timeline(item.timeline)}</div>
          </section>
          <section class="panel section">
            <div class="section-kicker"><span class="material-icons-round">info</span>Tier Facts</div>
            <div class="kv-list">${kv(item.facts)}</div>
          </section>
        `,
