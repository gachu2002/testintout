<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keycenter Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .usage-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-soft);
      padding: 20px;
    }
    .usage-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }
    .usage-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .usage-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      margin-top: 4px;
    }
    .usage-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.04em;
      text-align: right;
    }
    .mini-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .mini-stat {
      padding: 14px;
      border-radius: 16px;
      background: #fff;
      border: 1px solid var(--border);
    }
    .mini-stat-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .mini-stat-value {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.03em;
      margin-bottom: 4px;
    }
    .mini-stat-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .access-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    .project-list {
      display: grid;
      gap: 12px;
    }
    .project-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--surface-soft);
    }
    .project-main {
      min-width: 0;
      display: grid;
      gap: 7px;
    }
    .project-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .project-name {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .project-meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .project-side {
      display: grid;
      gap: 8px;
      justify-items: end;
      text-align: right;
    }
    .tiny-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .tiny-value {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
    }
    .author-list {
      display: grid;
      gap: 10px;
    }
    .author-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
    }
    .author-main {
      min-width: 0;
    }
    .author-name {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .author-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
      word-break: break-word;
    }
    .author-side {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
      text-align: right;
    }
    .author-manage {
      display: flex;
      align-items: center;
      gap: 8px;
      width: auto;
      max-width: 100%;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      white-space: nowrap;
    }
    .author-members-list {
      display: flex;
      align-items: center;
      padding-left: 8px;
    }
    .author-member-avatar,
    .author-member-more {
      width: 30px;
      height: 30px;
      margin-left: -8px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(255,255,255,.92);
      box-shadow: 0 8px 18px rgba(15,23,42,.08);
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 800;
      color: #fff;
    }
    .author-member-more {
      background: rgba(15,23,42,.08);
      color: var(--text);
    }
    .author-members-caption {
      font-size: 11px;
      color: var(--subtle);
    }
    .author-members-add {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 30px;
      margin-left: auto;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(214,216,219,.92);
      background: rgba(255,255,255,.84);
      color: var(--text);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    .author-members-add .material-icons-round {
      font-size: 14px;
    }
    .keycenter-hero-side {
      display: grid;
      gap: 12px;
      justify-items: end;
      flex-shrink: 0;
      max-width: 100%;
    }
    .section-card-spacer {
      margin-top: 18px;
    }
    .usage-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .usage-range {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }
    .usage-detail-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr);
      gap: 18px;
    }
    .key-stack {
      display: grid;
      gap: 12px;
    }
    .key-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .key-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }
    .key-row:first-child {
      padding-top: 0;
    }
    .key-row-label {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 4px;
    }
    .key-row-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .key-row-value {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
      white-space: normal;
      word-break: break-word;
    }
    .key-row-value.is-secret {
      justify-content: space-between;
      min-width: min(100%, 440px);
      gap: 12px;
    }
    .key-secret-value {
      min-width: 0;
      max-width: 100%;
      white-space: normal;
      word-break: break-all;
      overflow-wrap: anywhere;
    }
    .key-secret-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .icon-action-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #eef4ff;
      color: var(--brand);
      transition: background .15s ease, transform .15s ease;
    }
    .icon-action-btn:hover {
      background: #dbeafe;
      transform: translateY(-1px);
    }
    .icon-action-btn .material-icons-round {
      font-size: 18px;
      color: currentColor;
    }
    .key-row-value .material-icons-round {
      font-size: 16px;
      color: var(--subtle);
    }
    .model-chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .model-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }
    .usage-total-groups {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .usage-total-group {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: #fff;
      padding: 16px;
    }
    .usage-total-group-head {
      display: grid;
      gap: 4px;
      margin-bottom: 14px;
    }
    .usage-total-group-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .usage-total-group-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .usage-total-list {
      display: grid;
      gap: 10px;
    }
    .usage-total-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .usage-total-row:first-child {
      padding-top: 0;
      border-top: 0;
    }
    .usage-total-row-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .usage-total-row-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
    }
    .usage-total-row-value {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -.04em;
      text-align: right;
    }
    .usage-total-row-side {
      display: grid;
      justify-items: end;
      gap: 4px;
    }
    .usage-total-row-side-meta {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .usage-total-footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .usage-total-footer-label {
      color: var(--subtle);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .usage-total-footer-value {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.03em;
    }
    .usage-total-footer-meta {
      width: 100%;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .usage-chart-shell {
      display: grid;
      gap: 18px;
    }
    .usage-chart-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 2px;
    }
    .usage-filter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .usage-filter select {
      min-width: 180px;
      padding: 9px 36px 9px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font: inherit;
      appearance: none;
      background-image:
        linear-gradient(45deg, transparent 50%, var(--subtle) 50%),
        linear-gradient(135deg, var(--subtle) 50%, transparent 50%);
      background-position:
        calc(100% - 18px) calc(50% - 2px),
        calc(100% - 13px) calc(50% - 2px);
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .usage-chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .usage-chart-card {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fff;
      padding: 16px 16px 14px;
    }
    .usage-chart-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .usage-chart-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -.02em;
    }
    .usage-chart-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 4px;
    }
    .usage-chart-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      flex: 0 0 auto;
    }
    .usage-chart-svg {
      width: 100%;
      height: 220px;
      display: block;
    }
    .usage-chart-labels {
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(var(--chart-columns, 8), minmax(0, 1fr));
      gap: 8px;
    }
    .usage-chart-label {
      color: var(--subtle);
      font-size: 11px;
      text-align: center;
      white-space: nowrap;
    }
    @media (max-width: 920px) {
      .mini-stats,
      .access-grid,
      .usage-detail-grid,
      .usage-chart-grid,
      .usage-total-groups {
        grid-template-columns: 1fr;
      }
      .project-card {
        grid-template-columns: 1fr;
      }
      .project-side {
        justify-items: start;
        text-align: left;
      }
      .usage-head {
        flex-direction: column;
        align-items: flex-start;
      }
      .usage-value {
        text-align: left;
      }
      .key-row {
        grid-template-columns: 1fr;
      }
      .usage-chart-head,
      .usage-chart-toolbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .usage-filter {
        margin-left: 0;
      }
      .usage-filter select {
        min-width: 0;
        width: 100%;
      }
      .usage-total-row {
        grid-template-columns: 1fr;
      }
      .usage-total-row-side {
        justify-items: start;
      }
      .author-item {
        grid-template-columns: 1fr;
      }
      .author-side {
        text-align: left;
      }
      .keycenter-hero-side {
        width: 100%;
        justify-items: start;
      }
      .author-manage {
        flex-wrap: wrap;
      }
      .author-members-add {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function list(rows) {
      return rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div>${row.side ? `<div class="list-side">${row.side}</div>` : ""}</div>`).join("");
    }
    function kv(rows) {
      return rows.map((row) => `<div class="kv-item"><div class="kv-key">${row.key}</div><div class="kv-value">${row.value}</div></div>`).join("");
    }
    function secretGrid(rows) {
      return `<div class="secret-grid two">${rows.map((row) => `
        <article class="secret-card">
          <div class="secret-label">${row.label}</div>
          <div class="secret-value"><span class="mono">${row.value}</span></div>
          <div class="secret-meta">${row.meta || ""}</div>
        </article>
      `).join("")}</div>`;
    }
    function authorList(rows) {
      const items = Array.isArray(rows) && rows.length
        ? rows
        : [{ name: "등록된 author 없음", meta: "현재 이 key에 추가 author가 연결되어 있지 않습니다.", role: "None" }];
      return `<div class="author-list">${items.map((row) => `
        <article class="author-item">
          <div class="author-main">
            <div class="author-name">${escapeHtml(row?.name || "-")}</div>
            <div class="author-meta">${escapeHtml(row?.meta || "권한이 부여된 author")}</div>
          </div>
          <div class="author-side">${escapeHtml(row?.role || "Author")}</div>
        </article>
      `).join("")}</div>`;
    }
    const authorInvitePool = [];
    const authorAvatarGradients = [
      "linear-gradient(135deg,#fb7185,#e11d48)",
      "linear-gradient(135deg,#22d3ee,#0284c7)",
      "linear-gradient(135deg,#fbbf24,#ea580c)",
      "linear-gradient(135deg,#34d399,#0d9488)",
      "linear-gradient(135deg,#a78bfa,#7c3aed)",
      "linear-gradient(135deg,#60a5fa,#1d4ed8)"
    ];
    function authorInitials(name) {
      return String(name || "?")
        .split(/\s+/)
        .filter(Boolean)
        .map((part) => part[0])
        .join("")
        .slice(0, 2)
        .toUpperCase();
    }
    function authorAvatarGradient(name) {
      const seed = Array.from(String(name || ""))
        .reduce((total, char) => total + char.charCodeAt(0), 0);
      return authorAvatarGradients[seed % authorAvatarGradients.length];
    }
    function authorManageBar(detailKey, rows) {
      const authors = Array.isArray(rows) ? rows : [];
      const visibleMembers = authors.slice(0, 4);
      const extraMembers = Math.max(authors.length - visibleMembers.length, 0);
      const avatarMarkup = visibleMembers.length
        ? visibleMembers.map((member) => `
              <div class="author-member-avatar" style="background:${authorAvatarGradient(member?.name)}" title="${escapeHtml(member?.name || "Author")}">
                ${escapeHtml(authorInitials(member?.name))}
              </div>
            `).join("")
        : '<div class="author-member-more">+</div>';
      return `
        <div class="author-manage" data-author-manage-key="${escapeHtml(detailKey)}">
          <div class="author-members-list">
            ${avatarMarkup}
            ${extraMembers ? `<div class="author-member-more">+${extraMembers}</div>` : ""}
          </div>
          <div class="author-members-caption">${authors.length} collaborators</div>
          <button class="author-members-add" type="button" data-author-add-key="${escapeHtml(detailKey)}"><span class="material-icons-round">person_add</span>추가</button>
        </div>
      `;
    }
    function addAuthorToDetail(detailKey) {
      const item = DETAIL_ITEMS[detailKey];
      if (!item || item.__isLoading || String(item?.statusLabel || "").toLowerCase() === "unavailable") return;
      const currentAuthors = Array.isArray(item.authorList) ? item.authorList : [];
      const nextCandidate = authorInvitePool.find((candidate) =>
        !currentAuthors.some((author) => author?.name === candidate.name)
      );
      if (!nextCandidate) return;
      const nextAuthor = nextCandidate;
      item.authorList = [...currentAuthors, nextAuthor];
      mountAuthorManageBar();
    }
    function initializeAuthorAddButtons() {
      if (window.__keycenterAuthorAddInitialized) return;
      window.__keycenterAuthorAddInitialized = true;
      document.addEventListener("click", (event) => {
        const button = event.target.closest("[data-author-add-key]");
        if (!button) return;
        addAuthorToDetail(button.dataset.authorAddKey);
      });
    }
    function mountAuthorManageBar() {
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get(window.DETAIL_PAGE_CONFIG?.paramName || "id");
      const detailKey = Object.prototype.hasOwnProperty.call(DETAIL_ITEMS, requestedId)
        ? requestedId
        : Object.keys(DETAIL_ITEMS)[0];
      const item = DETAIL_ITEMS[detailKey];
      if (!item || item.__isLoading || String(item?.statusLabel || "").toLowerCase() === "unavailable") return;

      const heroTop = document.querySelector(".hero .hero-top");
      const heroActions = heroTop?.querySelector(".hero-actions");
      if (!heroTop || !heroActions) return;

      let heroSide = heroTop.querySelector(".keycenter-hero-side");
      if (!heroSide) {
        heroSide = document.createElement("div");
        heroSide.className = "keycenter-hero-side";
        heroActions.replaceWith(heroSide);
        heroSide.appendChild(heroActions);
      }

      const nextMarkup = authorManageBar(detailKey, item.authorList);
      const existingManageNode = heroSide.querySelector(`[data-author-manage-key="${CSS.escape(detailKey)}"]`);
      if (existingManageNode) {
        existingManageNode.outerHTML = nextMarkup;
        return;
      }

      const staleManageNode = heroSide.querySelector("[data-author-manage-key]");
      if (staleManageNode) {
        staleManageNode.remove();
      }

      heroSide.insertAdjacentHTML("beforeend", nextMarkup);
    }
    function metricSummary(rows) {
      return `<div class="mini-stats">${rows.map((row) => `
        <article class="mini-stat">
          <div class="mini-stat-label">${row.label}</div>
          <div class="mini-stat-value">${row.value}</div>
          <div class="mini-stat-meta">${row.meta}</div>
        </article>
      `).join("")}</div>`;
    }
    function healthSummary(rows) {
      return `<div class="info-list">${rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div><div class="list-side">${row.value}</div></div>`).join("")}</div>`;
    }
    function connectionCards(rows) {
      return `<div class="project-list">${rows.map((row) => `
        <article class="project-card">
          <div class="project-main">
            <div class="project-top">
              <div class="project-name">${row.title}</div>
              <span class="tag">${row.badge}</span>
            </div>
            <div class="project-meta">${row.meta}</div>

    function linePath(values, width, height, paddingX, paddingTop, paddingBottom, maxValue) {
      return values.map((value, index) => {

        const usableHeight = height - paddingTop - paddingBottom;
        const y = paddingTop + usableHeight - (Math.max(value, 0) / maxValue) * usableHeight;
        return `${index === 0 ? "M" : "L"}${x} ${y}`;
      }).join(" ");
    }
    function pointDots(values, color, width, height, paddingX, paddingTop, paddingBottom, maxValue) {
      const usableHeight = height - paddingTop - paddingBottom;
      return values.map((value, index) => {

        const y = paddingTop + usableHeight - (Math.max(value, 0) / maxValue) * usableHeight;

      if (!normalized) return "-";
      if (normalized.length <= 3) return normalized;
      return `${normalized.slice(0, 3)}${"*".repeat(Math.max(normalized.length - 3, 8))}`;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function getProviderTheme(providers, tierCode) {
      return { bg: "#fff4dd", brand: "#f59e0b", brandH: "#d97706", brandBg: "#ffe5a3", brandSoft: "rgba(245,158,11,.18)", accent: "#f97316" };
    }

    function hasNumericValue(value) {
      return Number.isFinite(Number(value));
    }

    function getUsageMetricSnapshotForModel(day, selectedModel) {
      if (!selectedModel || selectedModel === "all") {
        return day?.totals || {};
      }

      const modelMetrics = (Array.isArray(day?.models) ? day.models : []).find((model) => model?.model === selectedModel);
      if (!modelMetrics) {
        return {};
      }

      const requestCount = Number(modelMetrics?.requestCount || 0);
      const explicitSuccess = hasNumericValue(modelMetrics?.successRequestCount) ? Number(modelMetrics.successRequestCount) : null;
      const explicitFailed = hasNumericValue(modelMetrics?.failedRequestCount) ? Number(modelMetrics.failedRequestCount) : null;

      if (explicitSuccess !== null || explicitFailed !== null) {
        return {
          ...modelMetrics,
          successRequestCount: explicitSuccess !== null ? explicitSuccess : Math.max(requestCount - (explicitFailed || 0), 0),
          failedRequestCount: explicitFailed !== null ? explicitFailed : Math.max(requestCount - (explicitSuccess || 0), 0)
        };
      }

      const dayModels = Array.isArray(day?.models) ? day.models : [];
      const dayFailedTotal = Number(day?.totals?.failedRequestCount || 0);
      const totalModelRequests = dayModels.reduce((sum, model) => sum + Number(model?.requestCount || 0), 0);

      if (requestCount > 0 && dayFailedTotal > 0 && totalModelRequests > 0) {
        const proportionalFailed = (dayFailedTotal * requestCount) / totalModelRequests;
        return {
          ...modelMetrics,
          successRequestCount: Math.max(requestCount - proportionalFailed, 0),
          failedRequestCount: proportionalFailed
        };
      }

      return {
        ...modelMetrics,
        successRequestCount: requestCount,
        failedRequestCount: 0
      };
    }

    function buildUsageCharts(usage, selectedModel = "all") {
      const days = Array.isArray(usage?.days) ? usage.days : [];
      const labels = days.map((day) => formatLabelDate(day?.date));
      const metricDays = days.map((day) => getUsageMetricSnapshotForModel(day, selectedModel));
      const suffix = selectedModel && selectedModel !== "all" ? ` · ${selectedModel}` : "";
      return [
        {
          title: "Token Consumption",
          meta: `기간별 token 흐름${suffix}`,
          labels,
          series: [
            { label: "Total", color: "#14b8a6", values: metricDays.map((metrics) => Number(metrics?.totalTokens || 0)) },
            { label: "Completion", color: "#2563eb", values: metricDays.map((metrics) => Number(metrics?.outputTokens || 0)) },
            { label: "Prompt", color: "#f59e0b", values: metricDays.map((metrics) => Number(metrics?.inputTokens || 0)) }
          ]
        },
        {
          title: "Requests per Day",
          meta: `일별 요청 수${suffix}`,
          labels,
          series: [
            { label: "Requests", color: "#38bdf8", values: metricDays.map((metrics) => Number(metrics?.requestCount || 0)) }
          ]
        },
        {
          title: "Daily Expenditure (USD)",
          meta: `일별 비용 추이${suffix}`,
          labels,
          series: [
            { label: "Spend", color: "#10b981", values: metricDays.map((metrics) => Number(metrics?.usageCost || 0)) }
          ]
        },
        {
          title: "Success vs Failed Requests",
          meta: `성공/실패 요청 흐름${suffix}`,
          labels,
          series: [
            { label: "Success", color: "#14b8a6", values: metricDays.map((metrics) => Number(metrics?.successRequestCount || 0)) },
            { label: "Failed", color: "#ef4444", values: metricDays.map((metrics) => Number(metrics?.failedRequestCount || 0)) }
          ]
        }
      ];
    }

    function roundMetricValue(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 0;
      return Math.round(number * 1000) / 1000;
    }

    function buildSyntheticUsageDays(usage) {
      if (Array.isArray(usage?.days) && usage.days.length) {
        return usage.days;
      }

      const modelNames = (Array.isArray(usage?.filters) ? usage.filters : []).filter((filter) => filter && filter !== "all");
      const charts = Array.isArray(usage?.charts) ? usage.charts : [];
      const labels = charts[0]?.labels || [];

      if (!modelNames.length || !labels.length) {
        return [];
      }

      const weightSeed = modelNames.map((_, index) => modelNames.length - index);
      const weightTotal = weightSeed.reduce((sum, value) => sum + value, 0) || 1;
      const normalizedWeights = weightSeed.map((value) => value / weightTotal);
      const getChart = (title) => charts.find((chart) => chart?.title === title) || null;
      const getSeriesValues = (chartTitle, seriesLabel) => {
        const chart = getChart(chartTitle);
        const series = (chart?.series || []).find((item) => item?.label === seriesLabel);
        return Array.isArray(series?.values) ? series.values : [];
      };

      const totalTokens = getSeriesValues("Token Consumption", "Total");
      const outputTokens = getSeriesValues("Token Consumption", "Completion");
      const inputTokens = getSeriesValues("Token Consumption", "Prompt");
      const requestCounts = getSeriesValues("Requests per Day", "Requests");
      const usageCosts = getSeriesValues("Daily Expenditure (USD)", "Spend");
      const successCounts = getSeriesValues("Success vs Failed Requests", "Success");
      const failedCounts = getSeriesValues("Success vs Failed Requests", "Failed");

      return labels.map((label, labelIndex) => ({
        date: `2026-${label}`,
        totals: {
          totalTokens: Number(totalTokens[labelIndex] || 0),
          outputTokens: Number(outputTokens[labelIndex] || 0),
          inputTokens: Number(inputTokens[labelIndex] || 0),
          requestCount: Number(requestCounts[labelIndex] || 0),
          successRequestCount: Number(successCounts[labelIndex] || 0),
          failedRequestCount: Number(failedCounts[labelIndex] || 0),
          usageCost: Number(usageCosts[labelIndex] || 0),
          cacheWriteTokens: 0,
          cacheReadTokens: 0
        },
        models: modelNames.map((model, modelIndex) => {
          const weight = normalizedWeights[modelIndex] || 0;
          return {
            model,
            totalTokens: roundMetricValue((totalTokens[labelIndex] || 0) * weight),
            outputTokens: roundMetricValue((outputTokens[labelIndex] || 0) * weight),
            inputTokens: roundMetricValue((inputTokens[labelIndex] || 0) * weight),
            requestCount: roundMetricValue((requestCounts[labelIndex] || 0) * weight),
            successRequestCount: roundMetricValue((successCounts[labelIndex] || 0) * weight),
            failedRequestCount: roundMetricValue((failedCounts[labelIndex] || 0) * weight),
            usageCost: roundMetricValue((usageCosts[labelIndex] || 0) * weight),
            cacheWriteTokens: 0,
            cacheReadTokens: 0
          };
        })
      }));
    }

    function initializeUsageInsights(usage) {
      if (!usage || typeof usage !== "object") {
        return usage;
      }

      if (!Array.isArray(usage.days) || !usage.days.length) {
        usage.days = buildSyntheticUsageDays(usage);
      }

      usage.selectedFilter = usage.selectedFilter || "all";
      usage.charts = buildUsageCharts(usage, usage.selectedFilter);
      return usage;
    }

    function updateUsageCharts(key, selectedModel) {
      const usage = usageInsightsByKey[key];
      if (!usage) {
        return;
      }

      usage.selectedFilter = selectedModel || "all";
      usage.charts = buildUsageCharts(usage, usage.selectedFilter);

      const chartGrid = document.querySelector(`[data-usage-chart-grid-key="${key}"]`);
      if (chartGrid) {
        chartGrid.innerHTML = usage.charts.map((chart) => usageChart(chart)).join("");
      }

    function initializeUsageChartFilters() {
      document.querySelectorAll("[data-usage-filter-key]").forEach((select) => {

        const usage = usageInsightsByKey[key];
        if (!usage) {
          return;

        select.value = usage.selectedFilter || "all";
        select.addEventListener("change", (event) => {
          updateUsageCharts(key, event.target.value);
        });
      });
    }

    function normalizeAuthorList(keyItem) {
      const source = Array.isArray(keyItem?.authors)
        ? keyItem.authors
        : Array.isArray(keyItem?.authorList)

      return source.map((entry) => {
        if (typeof entry === "string") {

            name: entry,
            meta: "권한이 부여된 author",
            role: "Author"
          };

        if (!entry || typeof entry !== "object") {
          return null;
        }

        const name = entry.name || entry.email || entry.sub || entry.id || "";
        if (!name) {
          return null;
        }

        const meta = entry.email && entry.email !== name
          ? entry.email
          : entry.description || entry.sub || "권한이 부여된 author";

          { label: "Quota", value: "0%", meta: "usage 정보 없음" },
          { label: "Spend", value: "$0.00", meta: "usage 정보 없음" },
          { label: "Surface", value: "0", meta: "연결 정보 없음" }
        ],
        connectedItems: [{
          title: "연결 정보를 확인할 수 없습니다",
          meta: "허브에서 다시 선택하거나 id와 접근 권한을 확인해 주세요.",
          badge: "Notice",
          tags: ["Unavailable"],
          sideLabel: "Binding",
          sideValue: "Unknown",
          href: "workspace_keycenter_hub.html",
          linkLabel: "Keycenter Hub 보기"
        }],
        guideTips: [
          { title: "detail 진입은 key id 기준으로 확인합니다", meta: "동일 name이 여러 개 있을 수 있어 id 기준 진입이 안전합니다.", side: "ID" },
          { title: "접근 권한이 없으면 detail 조회가 실패할 수 있습니다", meta: "owner, author, admin 또는 담당 tier manager 범위를 확인해 주세요.", side: "Access" },
          { title: "허브에서 다시 열어 최신 id를 확인합니다", meta: "오래된 링크나 잘못된 id면 허브에서 재진입하는 편이 빠릅니다.", side: "Retry" }
        ]
      };
    }

    Object.values(usageInsightsByKey).forEach((usage) => {
      if (!Array.isArray(usage?.keyInfo)) return;
      usage.keyInfo = usage.keyInfo.map((row) => {
        if (row?.label !== "API 키") {
          return row;
        }

        const rawValue = String(row?.value || "").replace(/<[^>]+>/g, "");
        return {
          ...row,
          label: "API 키 정보",
          value: `<span class="mono">${escapeHtml(maskApiKeyPreview(rawValue))}</span>`
        };
      });
    });

    Object.values(usageInsightsByKey).forEach((usage) => {
      initializeUsageInsights(usage);
    });

    function initializeKeySecretActions() {
      if (window.__keycenterSecretActionsInitialized) return;
      window.__keycenterSecretActionsInitialized = true;

      const copyText = async (text) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "true");
        textarea.style.position = "absolute";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      };

      document.addEventListener("click", async (event) => {
        const toggleButton = event.target.closest("[data-secret-toggle]");
        if (toggleButton) {
          const row = toggleButton.closest("[data-secret-row]");
          const valueNode = row?.querySelector("[data-secret-value]");
          if (!valueNode) return;

          if (valueNode.dataset.secretLoaded !== "true") {
            const secretKeyId = row?.dataset.secretKeyId || "";
            if (!secretKeyId) return;

            try {
              const revealed = await revealKeySecret(secretKeyId);
              const rawSecret = String(revealed?.secret || "").trim();
              if (!rawSecret) return;
              valueNode.dataset.secretVisible = rawSecret;
              valueNode.dataset.secretLoaded = "true";
            } catch (error) {
              console.error("[keycenter_detail] failed to reveal api key", error);
              return;
            }
          }

          const nextVisible = valueNode.dataset.secretVisibleState !== "true";
          valueNode.dataset.secretVisibleState = String(nextVisible);
          valueNode.textContent = nextVisible ? valueNode.dataset.secretVisible || "" : valueNode.dataset.secretHidden || "";
          toggleButton.setAttribute("aria-label", nextVisible ? "API 키 숨기기" : "API 키 보기");
          const toggleIcon = toggleButton.querySelector(".material-icons-round");
          if (toggleIcon) {
            toggleIcon.textContent = nextVisible ? "visibility_off" : "visibility";
          }
          return;
        }

        const copyButton = event.target.closest("[data-secret-copy]");
        if (!copyButton) return;

        const row = copyButton.closest("[data-secret-row]");
        const valueNode = row?.querySelector("[data-secret-value]");
        if (valueNode?.dataset.secretLoaded !== "true") {
          const secretKeyId = row?.dataset.secretKeyId || "";
          if (!secretKeyId) return;

          try {
            const revealed = await revealKeySecret(secretKeyId);
            const revealedSecret = String(revealed?.secret || "").trim();
            if (!revealedSecret) return;
            valueNode.dataset.secretVisible = revealedSecret;
            valueNode.dataset.secretLoaded = "true";
          } catch (error) {
            console.error("[keycenter_detail] failed to reveal api key for copy", error);
            return;
          }
        }

        const rawSecret = valueNode?.dataset.secretVisible || "";
        if (!rawSecret) return;

        try {
          await copyText(rawSecret);
          copyButton.classList.add("is-copied");
          const copyIcon = copyButton.querySelector(".material-icons-round");
          if (copyIcon) {
            copyIcon.textContent = "check";
          }

          window.setTimeout(() => {
            copyButton.classList.remove("is-copied");
            const resetIcon = copyButton.querySelector(".material-icons-round");
            if (resetIcon) {
              resetIcon.textContent = "content_copy";
            }
          }, 1200);
        } catch (error) {
          console.error("[keycenter_detail] failed to copy api key", error);
        }
      });
    }

    async function fetchJson(url, options = {}) {
      const response = await fetch(url, {
        method: options.method || "GET",
        credentials: "same-origin",
        cache: "no-store",
        headers: {
          Accept: "application/json",
          ...(options.headers || {})
        },
        body: options.body
      });

      if (!response.ok) {
        throw new Error(`Request failed: ${response.status} ${response.statusText}`);
      }

      return response.json();
    }

    async function revealKeySecret(secretKeyId) {
      const payload = await fetchJson(`/api/v2/keycenter/keys/${encodeURIComponent(secretKeyId)}/reveal`, {
        method: "POST"
      });
      return getPayloadData(payload);
    }

    async function resolveRequestedKeyItem(requestedId) {
      if (requestedId) {
        const keyPayload = await fetchJson(`/api/v2/keycenter/keys/${encodeURIComponent(requestedId)}`);
        return getPayloadData(keyPayload);
      }

      const payload = await fetchJson("/api/v2/keycenter/keys?limit=1");
      const data = getPayloadData(payload);
      const firstItem = Array.isArray(data?.items) ? data.items[0] : null;
      if (!firstItem) {
        throw new Error("등록된 key가 없습니다.");
      }
      return firstItem;
    }

    function getUsageWindow() {
      const endDate = new Date();
      const startDate = new Date(endDate);
      startDate.setDate(endDate.getDate() - 13);
      const toDateString = (value) => value.toISOString().slice(0, 10);
      return {
        startDate: toDateString(startDate),
        endDate: toDateString(endDate)
      };
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.body.appendChild(script);
      });
    }

    function remountTopbar() {
      const topbarHost = document.querySelector("[data-ax-topbar]");
      if (topbarHost && window.mountAxStudioTopbar) {
        window.mountAxStudioTopbar(topbarHost);
      }
    }

    function rerenderDetailItem(renderKey, nextItem) {
      window.DETAIL_PAGE_CONFIG.items[renderKey] = nextItem;
      window.renderWorkspaceDetailPage?.();
      remountTopbar();
      initializeUsageChartFilters();
      mountAuthorManageBar();
      initializeAuthorAddButtons();
    }

    async function bootstrapDetailConfig() {
      const params = new URLSearchParams(window.location.search);
      const requestedId = params.get("id");
      const renderKey = requestedId || initialLookupKey;

      try {
        const keyItem = await resolveRequestedKeyItem(requestedId);
        if (!requestedId && keyItem?.id) {
          params.set("id", keyItem.id);
          const nextSearch = params.toString();
          const nextUrl = `${window.location.pathname}${nextSearch ? `?${nextSearch}` : ""}${window.location.hash || ""}`;
          window.history.replaceState({}, "", nextUrl);
        }

        const usageWindow = getUsageWindow();
        const [usagePayload, tierPayload] = await Promise.all([
          fetchJson(`/api/v2/keycenter/tiers/usage?startDate=${encodeURIComponent(usageWindow.startDate)}&endDate=${encodeURIComponent(usageWindow.endDate)}&key=${encodeURIComponent(keyItem?.id || renderKey)}`),
          keyItem?.tier?.id
            ? fetchJson(`/api/v2/keycenter/tiers/${encodeURIComponent(keyItem.tier.id)}`)
                .catch((error) => {
                  console.warn("Failed to load tier detail for keycenter detail", {
                    keyId: keyItem?.id || renderKey,
                    tierId: keyItem?.tier?.id || null,
                    error
                  });
                  return { data: null };
                })
            : Promise.resolve({ data: null })
        ]);
        const usage = getPayloadData(usagePayload);
        const tierDetail = getPayloadData(tierPayload);
        rerenderDetailItem(keyItem.id, buildItem(buildDynamicItemFromApi(keyItem, usage, tierDetail)));
      } catch (error) {
        console.warn("Failed to hydrate keycenter detail from API", error);
        rerenderDetailItem(renderKey, buildItem(buildUnavailableItem(requestedId || renderKey)));
      }
    }

    window.DETAIL_PAGE_CONFIG = {
      paramName: "id",
      pageTitle: "Keycenter Detail",
      hubLabel: "Keycenter",
      hubHref: "workspace_keycenter_hub.html",
      activeHubKey: "keycenter",
      eyebrow: "AI · Issued LLM Keys",
      searchPlaceholder: "key 이름, tier, model, connected surface를 검색하세요...",
      items: DETAIL_ITEMS
    };
  </script>
  <script>
    (async () => {
      try {
        await loadScript("workspace_detail_shared.js");
        await loadScript("ax_studio_topbar.js");
        initializeUsageChartFilters();
        initializeKeySecretActions();
        await bootstrapDetailConfig();
      } catch (error) {
        console.error("Failed to load keycenter detail scripts", error);
      }
    })();
  </script>
</body>
