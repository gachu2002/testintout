<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .usage-card {
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-soft);
      padding:20px;
    }
    .usage-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:16px;
    }
    .usage-name {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .usage-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
      margin-top:4px;
    }
    .usage-value {
      font-size:28px;
      font-weight:800;
      letter-spacing:-.04em;
      text-align:right;
    }
    .mini-stats {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
    }
    .mini-stat {
      padding:14px;
      border-radius:16px;
      background:#fff;
      border:1px solid var(--border);
    }
    .mini-stat-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      margin-bottom:6px;
    }
    .mini-stat-value {
      font-size:18px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:4px;
    }
    .mini-stat-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .access-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:18px;
    }
    .project-list {
      display:grid;
      gap:12px;
    }
    .project-card {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      padding:16px 18px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-soft);
    }
    .project-main {
      min-width:0;
      display:grid;
      gap:7px;
    }
    .project-top {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }
    .project-name {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .project-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .project-tags {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .project-side {
      display:grid;
      gap:8px;
      justify-items:end;
      text-align:right;
    }
    .tiny-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    .tiny-value {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .project-link {
      display:inline-flex;
      align-items:center;
      gap:5px;
      color:var(--brand);
      font-size:12px;
      font-weight:800;
    }
    .section-card-spacer {
      margin-top:18px;
    }
    @media (max-width: 920px) {
      .mini-stats,
      .access-grid {
        grid-template-columns:1fr;
      }
      .project-card {
        grid-template-columns:1fr;
      }
      .project-side {
        justify-items:start;
        text-align:left;
      }
      .usage-head {
        flex-direction:column;
        align-items:flex-start;
      }
      .usage-value {
        text-align:left;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function list(rows) {
      return rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div>${row.side ? `<div class="list-side">${row.side}</div>` : ""}</div>`).join("");
    }
    function kv(rows) {
      return rows.map((row) => `<div class="kv-item"><div class="kv-key">${row.key}</div><div class="kv-value">${row.value}</div></div>`).join("");
    }
    function secretGrid(rows) {
      return `<div class="secret-grid two">${rows.map((row) => `
        <article class="secret-card">
          <div class="secret-label">${row.label}</div>
          <div class="secret-value"><span class="mono">${row.value}</span></div>
          <div class="secret-meta">${row.meta || ""}</div>
        </article>
      `).join("")}</div>`;
    }
    function metricSummary(rows) {
      return `<div class="mini-stats">${rows.map((row) => `
        <article class="mini-stat">
          <div class="mini-stat-label">${row.label}</div>
          <div class="mini-stat-value">${row.value}</div>
          <div class="mini-stat-meta">${row.meta}</div>
        </article>
      `).join("")}</div>`;
    }
    function healthSummary(rows) {
      return `<div class="info-list">${rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div><div class="list-side">${row.value}</div></div>`).join("")}</div>`;
    }
    function connectionCards(rows) {
      return `<div class="project-list">${rows.map((row) => `
        <article class="project-card">
          <div class="project-main">
            <div class="project-top">
              <div class="project-name">${row.title}</div>
              <span class="tag">${row.badge}</span>
            </div>
            <div class="project-meta">${row.meta}</div>
            <div class="project-tags">${(row.tags || []).map((tag) => `<span class="tag">${tag}</span>`).join("")}</div>
          </div>
          <div class="project-side">
            <div class="tiny-label">${row.sideLabel}</div>
            <div class="tiny-value">${row.sideValue}</div>
            ${row.href ? `<a class="project-link" href="${row.href}">${row.linkLabel || "자세히 보기"}<span class="material-icons-round">chevron_right</span></a>` : ""}
          </div>
        </article>
      `).join("")}</div>`;
    }
    function buildAccessSection(item) {
      const accessTitle = item.botType === "api" ? "API 접속 정보" : "웹 접속 정보";
      const accessRows = item.botType === "api" ? item.apiInfo : item.webInfo;

      return `
        <section class="panel section">
          <div class="section-head">
            <div>
              <div class="section-kicker"><span class="material-icons-round">vpn_key</span>Access</div>
              <h2 class="section-title">접근 정보</h2>
              <p class="section-desc">${item.botType === "api" ? "연결할 API 주소와 인증 방식을 확인할 수 있습니다." : "사용자가 접속할 URL과 노출 방식을 확인할 수 있습니다."}</p>
            </div>
            <a class="section-link" href="${item.accessLink.href}">${item.accessLink.label}<span class="material-icons-round">chevron_right</span></a>
          </div>
          <div class="access-grid">
            <article class="card">
              <div class="card-title">${accessTitle}</div>
              <div class="kv-list">${kv(accessRows)}</div>
            </article>
            <article class="card">
              <div class="card-title">등록 정보</div>
              ${secretGrid(item.registration)}
            </article>
          </div>
          <article class="card section-card-spacer">
            <div class="card-title">연결 확인</div>
            <div class="info-list">${list(item.connectionChecks)}</div>
          </article>
        </section>
      `;
    }
    function buildItem(item) {
      const primaryMetric = item.statusCards[1];
      return {
        ...item,
        layoutMode: "full-width",
        mainHtml: `
          <section class="panel section">
            <div class="section-head">
