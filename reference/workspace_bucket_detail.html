    <script>
      function cards(items) {
        return items
          .map(
            (item) =>
              `<article class="card"><div class="card-title">${item.title}</div><div class="card-desc">${item.desc}</div><div class="tag-row">${item.tags.map((tag) => `<span class="tag">${tag}</span>`).join('')}</div></article>`,
          )
          .join('');
      }
      function list(rows) {
        return rows
          .map(
            (row) =>
              `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div>${row.side ? `<div class="list-side">${row.side}</div>` : ''}</div>`,
          )
          .join('');
      }
      function kv(rows) {
        return rows
          .map(
            (row) =>
              `<div class="kv-item"><div class="kv-key">${row.key}</div><div class="kv-value">${row.value}</div></div>`,
          )
          .join('');
      }
      function table(rows) {
        return `<div class="table-wrap"><table><thead><tr><th>Consumer</th><th>Binding</th><th>Exposure</th><th>Note</th></tr></thead><tbody>${rows.map((row) => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td></tr>`).join('')}</tbody></table></div>`;
      }
      function progress(rows) {
        return rows
          .map(
            (row) =>
              `<article class="progress-card"><div class="progress-top"><div class="progress-title">${row.title}</div><div class="progress-value">${row.value}</div></div><div class="progress-bar"><div class="progress-fill" style="width:${row.percent}%;"></div></div><div class="progress-meta">${row.meta}</div></article>`,
          )
          .join('');
      }
      function timeline(rows) {
        return rows
          .map(
            (row) =>
              `<div class="timeline-row"><div class="timeline-rail"><span class="timeline-dot"></span></div><div class="timeline-card"><div class="timeline-title">${row.title}</div><div class="timeline-meta">${row.meta}</div></div></div>`,
          )
          .join('');
      }

            <p class="section-desc">버킷을 소비하는 프로젝트, 노출 범위, 사용 목적을 한 번에 볼 수 있게 했습니다.</p>
            ${table(item.bindings)}
          </section>
          <section class="panel section">
            <div class="list-grid two">
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Policy Notes</div>
                <div class="info-list">${list(item.notes)}</div>
              </div>
              <div class="subpanel">
                <div class="panel-title" style="font-size:16px;">Related Surfaces</div>
                <div class="info-list">${list(item.relatedLinks)}</div>
              </div>
            </div>
          </section>
        `,

            <div class="stats-grid">${progress(item.progress)}</div>
          </section>
          <section class="panel timeline-panel">
            <div class="panel-kicker"><span class="material-icons-round">history</span>Change Log</div>

            <div class="section-kicker"><span class="material-icons-round">info</span>Bucket Facts</div>
