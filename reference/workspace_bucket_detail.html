<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bucket Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .layout {
      grid-template-columns:minmax(0, 1fr);
    }
    .side-col {
      display:none;
    }
    .usage-strip {
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:16px;
    }
    .usage-card {
      padding:18px;
      border-radius:18px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }
    .usage-label {
      font-size:12px;
      font-weight:700;
      color:var(--muted);
      margin-bottom:8px;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .usage-value {
      font-size:28px;
      font-weight:800;
      letter-spacing:-.04em;
      margin-bottom:6px;
    }
    .usage-meta {
      font-size:13px;
      color:var(--muted);
      line-height:1.55;
      margin-bottom:12px;
    }
    .usage-bar {
      height:10px;
      border-radius:999px;
      background:#edf2f7;
      overflow:hidden;
      margin-bottom:10px;
    }
    .usage-fill {
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg, var(--brand), var(--accent));
    }
    .usage-foot {
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
    }
    .key-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:16px;
    }
    .key-card {
      padding:18px;
      border-radius:18px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }
    .key-head {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:12px;
    }
    .key-title {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
      margin-bottom:4px;
    }
    .key-desc {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .key-actions {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }
    .mini-btn {
      height:34px;
      padding:0 12px;
      border-radius:10px;
      border:1px solid var(--border);
      background:var(--surface-soft);
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      font-weight:700;
      color:var(--text);
    }
    .mini-btn:hover {
      color:var(--brand);
      border-color:rgba(37,99,235,.18);
    }
    .key-value {
      display:flex;
      align-items:center;
      gap:10px;
      min-height:52px;
      padding:14px 16px;
      border-radius:14px;
      background:#0f172a;
      color:#e2e8f0;
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size:12px;
      line-height:1.6;
      word-break:break-all;
    }
    .key-value .material-icons-round {
      font-size:16px;
      color:#94a3b8;
      flex:0 0 auto;
    }
    .key-note {
      margin-top:10px;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .browse-head-actions {
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .browse-summary {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 11px;
      border-radius:999px;
      background:var(--brand-bg);
      color:var(--brand);
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }
    .browse-table-wrap {
      border:1px solid var(--border);
      border-radius:18px;
      overflow:hidden;
      background:#fff;
    }
    .browse-table {
      width:100%;
      border-collapse:collapse;
    }
    .browse-table th {
      text-align:left;
      padding:12px 14px;
      background:#f8fafc;
      font-size:12px;
      color:var(--muted);
      font-weight:700;
      border-bottom:1px solid var(--border);
    }
    .browse-table td {
      padding:14px;
      font-size:13px;
      vertical-align:top;
      border-bottom:1px solid var(--border);
    }
    .browse-table tr:last-child td {
      border-bottom:0;
    }
    .browse-name {
      font-weight:700;
      margin-bottom:4px;
      word-break:break-all;
    }
    .browse-path {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
      word-break:break-all;
    }
    .browse-type {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:#f3f6fb;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .feedback-line {
      min-height:18px;
      margin-top:12px;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .feedback-line.is-success {
      color:var(--good);
    }
    @media (max-width: 960px) {
      .usage-strip,
      .key-grid {
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

  <div id="app"></div>
  <script>
    function renderUsageCards(rows) {
      return rows.map((row) => `
        <article class="usage-card">
          <div class="usage-label">${row.label}</div>
          <div class="usage-value">${row.value}</div>
          <div class="usage-meta">${row.meta}</div>
          <div class="usage-bar"><div class="usage-fill" style="width:${row.percent}%;"></div></div>
          <div class="usage-foot">${row.foot}</div>
        </article>
      `).join("");
    }

    function renderKeyCard(key, item) {
      const toggleButton = key.revealable ? `
        <button class="mini-btn" type="button" data-key-toggle="${key.id}">
          <span class="material-icons-round">visibility</span>
          보기
        </button>
      ` : "";

      return `
        <article class="key-card">
          <div class="key-head">
            <div>
              <div class="key-title">${key.title}</div>
              <div class="key-desc">${key.desc}</div>
            </div>
            <div class="key-actions">
              ${toggleButton}
              <button class="mini-btn" type="button" data-key-copy="${key.id}">
                <span class="material-icons-round">content_copy</span>
                복사
              </button>
            </div>
          </div>
          <div class="key-value" data-key-value="${key.id}" data-masked="${key.masked}" data-plain="${key.value}">
            <span class="material-icons-round">${key.icon}</span>
            <span>${key.masked}</span>
          </div>
          <div class="key-note">${item.keyNote}</div>
        </article>
      `;
    }

    function renderBrowseRows(rows) {
      return rows.map((row) => `
        <tr>
          <td>
            <div class="browse-name">${row.name}</div>
            <div class="browse-path">${row.path}</div>
          </td>
          <td><span class="browse-type"><span class="material-icons-round" style="font-size:14px;">${row.icon}</span>${row.type}</span></td>
          <td>${row.size}</td>
          <td>${row.updated}</td>
        </tr>
      `).join("");
    }

    function buildItem(item) {
      return {

          <section class="panel section" id="browse">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">donut_large</span>Usage</div>

              </div>
            </div>
            <div class="usage-strip">${renderUsageCards(item.usageCards)}</div>
          </section>

          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">vpn_key</span>Credentials</div>
                <h2 class="section-title">Access Key / Secret Key</h2>
                <p class="section-desc">이 버킷에 접근할 때 사용하는 키 정보를 확인할 수 있습니다.</p>
              </div>
            </div>
            <div class="key-grid">
              ${item.keys.map((key) => renderKeyCard(key, item)).join("")}
            </div>
            <div class="feedback-line" data-key-feedback aria-live="polite"></div>
          </section>

          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">folder_open</span>Browse</div>
                <h2 class="section-title">버킷 내용</h2>
                <p class="section-desc">이 버킷 안에 있는 폴더와 파일을 바로 살펴볼 수 있습니다.</p>
              </div>
              <div class="browse-head-actions">
                <div class="browse-summary">
                  <span class="material-icons-round">inventory_2</span>
                  ${item.browseRows.length}개 항목
                </div>
              </div>
            </div>
            <div class="browse-table-wrap">
              <table class="browse-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Type</th>
                    <th>Size</th>
                    <th>Updated</th>
                  </tr>
                </thead>
                <tbody>
                  ${renderBrowseRows(item.browseRows)}
                </tbody>
              </table>
            </div>
          </section>
        `,
        sidebarHtml: ``
      };
    }

  <script>
    (function () {
      const feedbackNode = document.querySelector("[data-key-feedback]");
      const toggleButtons = Array.from(document.querySelectorAll("[data-key-toggle]"));
      const copyButtons = Array.from(document.querySelectorAll("[data-key-copy]"));

      function setFeedback(message) {
        if (!feedbackNode) return;
        feedbackNode.textContent = message;
        feedbackNode.classList.add("is-success");
      }

      toggleButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const id = button.getAttribute("data-key-toggle");
          const valueHost = document.querySelector(`[data-key-value="${id}"]`);
          if (!valueHost) return;

          const span = valueHost.querySelector("span:last-child");
          const isMasked = span.textContent === valueHost.dataset.masked;
          span.textContent = isMasked ? valueHost.dataset.plain : valueHost.dataset.masked;
          button.innerHTML = `
            <span class="material-icons-round">${isMasked ? "visibility_off" : "visibility"}</span>
            ${isMasked ? "숨기기" : "보기"}
          `;
          setFeedback(isMasked ? "secret key를 확인할 수 있습니다." : "secret key를 다시 가렸습니다.");
        });
      });

      copyButtons.forEach((button) => {
        button.addEventListener("click", async () => {
          const id = button.getAttribute("data-key-copy");
          const valueHost = document.querySelector(`[data-key-value="${id}"]`);
          if (!valueHost) return;

          try {
            await navigator.clipboard.writeText(valueHost.dataset.plain);
            setFeedback(`${id === "access" ? "access key" : "secret key"}를 복사했습니다.`);
          } catch (error) {
            setFeedback("브라우저 환경에 따라 복사가 제한될 수 있습니다.");
          }
        });
      });
    })();
  </script>
