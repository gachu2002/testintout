<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keycenter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_resource_hub_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .key-create-progress-track {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
    }
    .hub-lite-create-progress-rail.is-hidden {
      visibility: hidden;
    }
    .resource-pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(214, 216, 219, .74);
    }
    .resource-pagination[hidden] {
      display: none !important;
    }
    .resource-pagination-summary {
      color: var(--t2);
      font-size: 13px;
      line-height: 1.5;
    }
    .resource-pagination-controls {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .resource-pagination-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(214, 216, 219, .94);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #fff;
      color: var(--t2);
      font-size: 12px;
      font-weight: 800;
      transition: all .15s ease;
    }
    .resource-pagination-btn:hover:not(:disabled) {
      border-color: rgba(245, 158, 11, .28);
      color: var(--brand);
      background: rgba(245, 158, 11, .06);
    }
    .resource-pagination-btn.is-active {
      border-color: rgba(245, 158, 11, .24);
      background: var(--brand-soft);
      color: var(--brand);
    }
    .resource-pagination-btn:disabled {
      opacity: .42;
      cursor: not-allowed;
    }
    @media (max-width: 980px) {
      .resource-pagination {
        flex-direction: column;
        align-items: stretch;
      }
      .resource-pagination-controls {
        justify-content: flex-start;
      }
    }
    .key-create-stage.is-wide {
      width: min(100%, var(--hub-lite-create-wide-width));
    }
    .key-create-field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .key-create-field {
      display: grid;
      gap: 8px;
      min-width: 0;
      position: relative;
    }
    .key-create-field label {
      font-size: 12px;
      font-weight: 800;
      color: var(--t2);
      letter-spacing: -.01em;
    }
    .key-create-tier-summary {
      display: grid;
      gap: 8px;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(214, 216, 219, .82);
      background: rgba(255, 255, 255, .82);
    }
    .key-create-tier-summary-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .key-create-tier-summary-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--t1);
      letter-spacing: -.02em;
    }
    .key-create-tier-summary-meta {
      font-size: 12px;
      color: var(--t3);
      line-height: 1.5;
    }
    .key-create-tier-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .key-create-tier-card {
      min-width: 0;
      display: grid;
      gap: 10px;
      padding: 16px;
      border: 1px solid rgba(214, 216, 219, .94);
      border-radius: 18px;
      background: rgba(255, 255, 255, .92);
      text-align: left;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .key-create-tier-card:hover {
      border-color: rgba(245, 158, 11, .26);
      box-shadow: 0 14px 26px rgba(15, 23, 42, .06);
      transform: translateY(-1px);
    }
    .key-create-tier-card.is-selected {
      border-color: rgba(245, 158, 11, .28);
      box-shadow: 0 18px 32px rgba(245, 158, 11, .12);
      background: linear-gradient(180deg, rgba(255, 251, 235, .98), rgba(255, 255, 255, .96));
    }
    .key-create-tier-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .key-create-tier-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(245, 158, 11, .12);
      color: var(--brand);
      flex-shrink: 0;
    }
    .key-create-tier-icon .material-icons-round {
      font-size: 20px;
    }
    .key-create-tier-radio {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid rgba(203, 213, 225, .96);
      background: #fff;
      position: relative;
      flex-shrink: 0;
    }
    .key-create-tier-card.is-selected .key-create-tier-radio {
      border-color: var(--brand);
    }
    .key-create-tier-card.is-selected .key-create-tier-radio::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 999px;
      background: var(--brand);
    }
    .key-create-tier-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--t1);
      line-height: 1.45;
      letter-spacing: -.02em;
    }
    .key-create-tier-meta {
      font-size: 12px;
      color: var(--t3);
      line-height: 1.55;
    }
    .key-create-owner-results {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 30;
      display: grid;
      gap: 6px;
      max-height: 240px;
      overflow: auto;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(214, 216, 219, .94);
      background: rgba(255, 255, 255, .98);
      box-shadow: 0 20px 36px rgba(15, 23, 42, .12);
    }
    .key-create-owner-results[hidden] {
      display: none !important;
    }
    .key-create-owner-option {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: rgba(248, 250, 252, .96);
      padding: 12px 14px;
      text-align: left;
      display: grid;
      gap: 4px;
      color: var(--t1);
      transition: background-color .15s ease, transform .15s ease;
    }
    .key-create-owner-option:hover,
    .key-create-owner-option:focus-visible {
      outline: none;
      background: rgba(255, 251, 235, .96);
      transform: translateY(-1px);
    }
    .key-create-owner-option-name {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.45;
    }
    .key-create-owner-option-meta {
      font-size: 12px;
      color: var(--t3);
      line-height: 1.5;
      word-break: break-word;
    }
    .key-create-owner-status {
      font-size: 12px;
      line-height: 1.5;
      color: var(--t3);
    }
    .key-create-owner-status[data-tone="error"] {
      color: #b91c1c;
    }
    .key-create-owner-selection {
      font-size: 12px;
      line-height: 1.5;
      color: var(--brand);
    }
    .hero-shell {
      position: relative;
    }
    .hero-actions {
      position: relative;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      flex-shrink: 0;
      margin-top: 18px;
    }
    .hero-actions .hero-btn {
      min-width: 188px;
      justify-content: center;
    }
    .key-create-mode-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(245, 158, 11, .08);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      width: fit-content;
    }
    .key-create-mode-note .material-icons-round {
      font-size: 15px;
    }
    .request-review-shell {
      width: min(100%, 720px);
    }
    .request-review-summary {
      display: grid;
      gap: 12px;
      padding: 18px;
      border-radius: 20px;
      border: 1px solid rgba(214, 216, 219, .82);
      background: rgba(255, 255, 255, .92);
    }
    .request-review-summary-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .request-review-summary-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--t1);
      line-height: 1.5;
      letter-spacing: -.02em;
    }
    .request-review-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: -.01em;
      background: rgba(226, 232, 240, .72);
      color: var(--t2);
    }
    .request-review-pill.is-pending {
      background: rgba(245, 158, 11, .14);
      color: #b45309;
    }
    .request-review-pill.is-approved {
      background: rgba(16, 185, 129, .14);
      color: #047857;
    }
    .request-review-pill.is-rejected {
      background: rgba(239, 68, 68, .14);
      color: #b91c1c;
    }
    .request-review-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .request-review-meta {
      display: grid;
      gap: 4px;
      min-width: 0;
    }
    .request-review-meta-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--t3);
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .request-review-meta-value {
      font-size: 13px;
      color: var(--t1);
      line-height: 1.6;
      word-break: break-word;
    }
    .request-review-note {
      display: grid;
      gap: 6px;
      padding: 14px 16px;
      border-radius: 16px;
      background: rgba(248, 250, 252, .92);
      border: 1px solid rgba(226, 232, 240, .9);
    }
    .request-review-note-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--t2);
    }
    .request-review-note-value {
      font-size: 13px;
      line-height: 1.65;
      color: var(--t1);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .request-review-note-textarea {
      width: 100%;
      min-height: 128px;
      resize: vertical;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid rgba(214, 216, 219, .94);
      background: #fff;
      color: var(--t1);
      font: inherit;
      line-height: 1.6;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .request-review-note-textarea:focus {
      border-color: rgba(245, 158, 11, .42);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, .12);
    }
    .request-review-feedback {
      font-size: 12px;
      line-height: 1.5;
      color: var(--t3);
    }
    .request-review-feedback[data-tone="error"] {
      color: #b91c1c;
    }
    .request-review-feedback[data-tone="ok"] {
      color: #047857;
    }
    .list-row.is-request-review-link {
      cursor: pointer;
      transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .list-row.is-request-review-link:hover {
      border-color: rgba(245, 158, 11, .24);
      background: rgba(255, 251, 235, .78);
      box-shadow: 0 12px 24px rgba(15, 23, 42, .05);
      transform: translateY(-1px);
    }
    .list-row.is-request-review-link:focus-visible {
      outline: none;
      border-color: rgba(245, 158, 11, .38);
      box-shadow: 0 0 0 4px rgba(245, 158, 11, .12);
    }
    @media (max-width: 1100px) {
      .key-create-tier-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 820px) {
      .key-create-field-grid,
      .key-create-tier-grid,
      .request-review-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .hero-actions {
        width: 100%;
        align-items: stretch;
        margin-top: 12px;
      }
      .hero-actions .hero-btn {
        width: 100%;
      }
    }
    @media (max-width: 640px) {
      .key-create-field-grid,
      .key-create-tier-grid,
      .request-review-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

          }
        });

        if (!response.ok) {

        return response.json();

          headers: {
            Accept: "application/json",
            ...(body ? { "Content-Type": "application/json" } : {})

          ...(body ? { body: JSON.stringify(body) } : {})

        if (!response.ok) {
          let message = `Request failed: ${response.status} ${response.statusText}`;
          try {

            message = payload?.error?.message || payload?.message || message;
          } catch (error) {

        const roleMeta = getKeyRoleMeta();

        if (icon) icon.textContent = "vpn_key";
        button.setAttribute("href", "#key-create");
        button.dataset.keyRole = roleMeta.id;
        const currentLabel = button.textContent.trim();
        if (currentLabel !== roleMeta.heroLabel) {
          button.innerHTML = `<span class="material-icons-round">vpn_key</span>${roleMeta.heroLabel}`;
        }
      };

      const mountKeyFloatingControls = () => {
        syncKeyCreateAction();
        wireRequestReviewRows();
      };

      const getRequestStatusToneClass = (status) => {
        const normalized = String(status || "").trim().toLowerCase();
        if (normalized === "approved") return "is-approved";
        if (normalized === "rejected") return "is-rejected";
        return "is-pending";
      };

      const parseRequestReviewHash = () => {
        const hash = String(window.location.hash || "");
        if (!hash.startsWith(REQUEST_REVIEW_HASH_PREFIX)) return "";
        return decodeURIComponent(hash.slice(REQUEST_REVIEW_HASH_PREFIX.length));
      };

      const ensureRequestReviewModal = () => {
        let modal = document.getElementById("requestReviewModal");
        if (modal) return modal;

        modal = document.createElement("div");
        modal.className = "hub-lite-create-backdrop";
        modal.id = "requestReviewModal";
        modal.hidden = true;
        modal.innerHTML = `
          <div class="hub-lite-create-shell request-review-shell" role="dialog" aria-modal="true" aria-labelledby="requestReviewTitle">
            <div class="hub-lite-create-head">
              <div class="hub-lite-create-copy">
                <div class="hub-lite-create-title-row">
                  <span class="hub-lite-create-step-badge">RQ</span>
                  <h2 id="requestReviewTitle">Key 요청 검토</h2>

              </div>
            </div>
            <div class="hub-lite-create-form">

                <div class="hub-lite-create-panel-title">결정 사유</div>
                <div class="hub-lite-create-note"><span class="material-icons-round">edit_note</span>승인 또는 거절에 대한 메모를 남기고 처리할 수 있습니다.</div>
                <textarea class="request-review-note-textarea" id="requestReviewReason" placeholder="승인 또는 거절 사유를 입력해 주세요."></textarea>
                <div class="request-review-feedback" id="requestReviewFeedback"></div>
              </section>

                <button class="hub-lite-create-action ghost" type="button" id="requestReviewCancel">닫기</button>

              </div>
            </div>
          </div>
        `;

        document.body.appendChild(modal);

        const summary = modal.querySelector("#requestReviewSummary");
        const subtitle = modal.querySelector("#requestReviewSubtitle");
        const feedback = modal.querySelector("#requestReviewFeedback");

        const approveButton = modal.querySelector("#requestReviewApprove");
        const rejectButton = modal.querySelector("#requestReviewReject");
        const closeButton = modal.querySelector("#requestReviewClose");
        const cancelButton = modal.querySelector("#requestReviewCancel");

        const close = ({ keepHash = false } = {}) => {
          modal.hidden = true;
          document.body.style.overflow = "";
          requestReviewState.reqId = "";

          requestReviewState.feedbackTone = "";

            reasonInput.value = "";

          if (!keepHash && parseRequestReviewHash()) {
            window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
          }

        const render = () => {
          const detail = requestReviewState.detail;
          if (requestReviewState.loading) {
            subtitle.textContent = "요청 상세를 불러오는 중입니다.";
            summary.innerHTML = `
              <div class="request-review-summary-title">요청 정보를 불러오는 중입니다.</div>

          } else if (!detail) {
            subtitle.textContent = "요청 상세를 확인하고 승인 또는 거절을 진행합니다.";
            summary.innerHTML = `

          } else {

              ? "요청 내용을 검토하고 승인 또는 거절을 선택할 수 있습니다."
              : "요청 상세와 처리 이력을 확인할 수 있습니다.";
            summary.innerHTML = `
              <div class="request-review-summary-top">
                <div class="request-review-summary-title">${escapeHtml(detail.title || "Key 요청")}</div>
                <span class="request-review-pill ${getRequestStatusToneClass(detail.status)}">${escapeHtml(String(detail.status || "pending").toUpperCase())}</span>
              </div>
              <div class="request-review-grid">
                <div class="request-review-meta">

                  <div class="request-review-meta-value">${escapeHtml(detail.requestedTierLabel || detail.requestedTierCode || "-")}</div>

                <div class="request-review-meta">
                  <div class="request-review-meta-label">요청 Key 이름</div>
                  <div class="request-review-meta-value">${escapeHtml(detail.requestedName || "-")}</div>
                </div>
                <div class="request-review-meta">
                  <div class="request-review-meta-label">요청자</div>
                  <div class="request-review-meta-value">${escapeHtml(detail.requestedByName || detail.requestedBy || "-")}</div>
                </div>
                <div class="request-review-meta">
                  <div class="request-review-meta-label">대상 Owner</div>
                  <div class="request-review-meta-value">${escapeHtml(detail.targetOwnerName || detail.targetOwner || "-")}</div>
                </div>
                <div class="request-review-meta">
                  <div class="request-review-meta-label">요청 일시</div>
                  <div class="request-review-meta-value">${escapeHtml(formatDateTime(detail.createdAt))}</div>
                </div>
                <div class="request-review-meta">
                  <div class="request-review-meta-label">처리자</div>
                  <div class="request-review-meta-value">${escapeHtml(detail.decidedByName || detail.decidedBy || "-")}</div>
                </div>
              </div>
              <div class="request-review-note">
                <div class="request-review-note-label">요청 사유</div>
                <div class="request-review-note-value">${escapeHtml(detail.requestReason || "요청 사유가 없습니다.")}</div>
              </div>
              <div class="request-review-note">
                <div class="request-review-note-label">최근 처리 메모</div>
                <div class="request-review-note-value">${escapeHtml(detail.decisionReason || "아직 처리 메모가 없습니다.")}</div>
              </div>
              ${detail.execution?.keyId ? `
              <div class="request-review-note">
                <div class="request-review-note-label">실행 결과</div>
                <div class="request-review-note-value">발급된 Key ID ${escapeHtml(detail.execution.keyId)}${detail.execution.secretPreview ? ` · ${escapeHtml(detail.execution.secretPreview)}` : ""}</div>
              </div>
              ` : ""}
            `;
          }

          feedback.textContent = requestReviewState.feedback || "";
          feedback.dataset.tone = requestReviewState.feedbackTone || "";
          reasonInput.disabled = requestReviewState.loading || requestReviewState.submitting || !(detail?.capabilities?.canApprove || detail?.capabilities?.canReject);
          if (!requestReviewState.loading && !requestReviewState.submitting && reasonInput.value !== requestReviewState.draftReason) {
            reasonInput.value = requestReviewState.draftReason || "";
          }
          approveButton.hidden = !detail?.capabilities?.canApprove;
          rejectButton.hidden = !detail?.capabilities?.canReject;
          approveButton.disabled = requestReviewState.loading || requestReviewState.submitting;
          rejectButton.disabled = requestReviewState.loading || requestReviewState.submitting;
        };

        const loadDetail = async (reqId) => {
          requestReviewState.reqId = reqId;
          requestReviewState.detail = null;
          requestReviewState.loading = true;
          requestReviewState.submitting = false;
          requestReviewState.feedback = "";
          requestReviewState.feedbackTone = "";
          requestReviewState.draftReason = "";
          modal.hidden = false;
          document.body.style.overflow = "hidden";
          render();
          try {
            const payload = await fetchJson(`${API_BASE}/requests/${encodeURIComponent(reqId)}`);
            requestReviewState.detail = getPayloadData(payload);
          } catch (error) {
            requestReviewState.feedback = error && error.message ? error.message : "요청 상세를 불러오지 못했습니다.";
            requestReviewState.feedbackTone = "error";
          } finally {
            requestReviewState.loading = false;
            render();
            if (!requestReviewState.feedback && !reasonInput.disabled) {
              window.requestAnimationFrame(() => {
                reasonInput.focus();
              });
            }
          }
        };

        const submitDecision = async (action) => {
          if (!requestReviewState.reqId || requestReviewState.submitting) return;
          const reason = String(reasonInput.value || "").trim();
          if (!reason) {
            requestReviewState.feedback = "승인 또는 거절 사유를 입력해 주세요.";
            requestReviewState.feedbackTone = "error";
            render();
            reasonInput.focus();
            return;
          }

          requestReviewState.submitting = true;
          requestReviewState.feedback = action === "approve" ? "승인 처리 중입니다." : "거절 처리 중입니다.";
          requestReviewState.feedbackTone = "";
          requestReviewState.draftReason = reason;
          render();

          try {
            const payload = await requestJson(`/requests/${encodeURIComponent(requestReviewState.reqId)}/${action}`, {
              method: "POST",
              body: { reason }
            });
            requestReviewState.detail = getPayloadData(payload);
            requestReviewState.feedback = action === "approve" ? "요청을 승인했습니다." : "요청을 거절했습니다.";
            requestReviewState.feedbackTone = "ok";
            requestReviewState.draftReason = "";
            reasonInput.value = "";
            await bootstrap();
          } catch (error) {
            requestReviewState.feedback = error && error.message ? error.message : "요청 처리에 실패했습니다.";
            requestReviewState.feedbackTone = "error";
          } finally {
            requestReviewState.submitting = false;
            render();
          }
        };

        modal.addEventListener("click", (event) => {
          if (event.target === modal) {
            close();
          }
        });
        modal.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !modal.hidden) {
            close();
          }
        });
        reasonInput.addEventListener("input", () => {
          requestReviewState.draftReason = String(reasonInput.value || "");
          if (requestReviewState.feedbackTone === "error") {
            requestReviewState.feedback = "";
            requestReviewState.feedbackTone = "";
            render();
          }
        });
        closeButton.addEventListener("click", () => close());
        cancelButton.addEventListener("click", () => close());
        approveButton.addEventListener("click", () => submitDecision("approve"));
        rejectButton.addEventListener("click", () => submitDecision("reject"));

        modal.__closeRequestReview = close;
        modal.__loadRequestReview = loadDetail;
        modal.__renderRequestReview = render;
        return modal;
      };

      const openRequestReviewModal = (reqId) => {
        const normalized = String(reqId || "").trim();
        if (!normalized) return;
        const modal = ensureRequestReviewModal();
        modal.__loadRequestReview(normalized);
      };

      const wireRequestReviewRows = () => {
        document.querySelectorAll(".list-row").forEach((row) => {
          const anchor = row.querySelector(`.list-row-title a[href^="${REQUEST_REVIEW_HASH_PREFIX}"]`);
          if (!anchor) return;

          row.classList.add("is-request-review-link");
          row.setAttribute("role", "link");
          row.setAttribute("tabindex", "0");
          row.setAttribute("aria-label", `${anchor.textContent || "요청"} 상세 열기`);

          if (row.dataset.requestReviewRowBound === "true") return;
          row.dataset.requestReviewRowBound = "true";

          const openFromRow = () => {
            const href = String(anchor.getAttribute("href") || "").trim();
            if (!href) return;
            if (window.location.hash === href) {
              openRequestReviewModal(decodeURIComponent(href.slice(REQUEST_REVIEW_HASH_PREFIX.length)));
              return;
            }
            window.location.hash = href;
          };

          row.addEventListener("click", (event) => {
            if (event.target.closest("a, button, input, textarea, select, label")) return;
            openFromRow();
          });

          row.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            openFromRow();
          });
        });
      };

      const wireRequestReviewHash = () => {
        if (window.__requestReviewHashBound) return;
        window.__requestReviewHashBound = true;

        window.addEventListener("hashchange", () => {
          const reqId = parseRequestReviewHash();
          const modal = document.getElementById("requestReviewModal");
          if (reqId) {
            openRequestReviewModal(reqId);
            return;
          }
          if (modal && typeof modal.__closeRequestReview === "function" && !modal.hidden) {
            modal.__closeRequestReview({ keepHash: true });
          }
        });

        const initialReqId = parseRequestReviewHash();
        if (initialReqId) {
          openRequestReviewModal(initialReqId);
        }
      };

      const ensureKeyCreateModal = () => {
        let modal = document.getElementById("keyCreateModal");
        if (modal) return modal;

        modal = document.createElement("div");
        modal.className = "hub-lite-create-backdrop";
        modal.id = "keyCreateModal";
        modal.hidden = true;
        modal.innerHTML = `
          <div class="hub-lite-create-shell" role="dialog" aria-modal="true" aria-labelledby="keyCreateTitle">
            <div class="hub-lite-create-head">
              <div class="hub-lite-create-copy">
                <div class="hub-lite-create-title-row">
                  <span class="hub-lite-create-step-badge" id="keyCreateStepBadge">1</span>
                  <h2 id="keyCreateTitle">새 Key 발급 요청을 등록합니다</h2>
                </div>
                <p class="hub-lite-create-subtitle" id="keyCreateSubtitle">먼저 key 이름을 입력해주세요. 소유자는 현재 사용자로 고정됩니다.</p>
              </div>
              <div class="hub-lite-create-head-actions">
                <div class="hub-lite-create-hero" aria-hidden="true"><span class="material-icons-round">vpn_key</span></div>
                <button class="hub-lite-create-close" type="button" id="keyCreateClose" aria-label="Key 생성 닫기">
                  <span class="material-icons-round">close</span>
                </button>
              </div>
            </div>
            <div class="hub-lite-create-progress">
              <div class="hub-lite-create-progress-track key-create-progress-track" id="keyCreateProgress"></div>
            </div>
            <form class="hub-lite-create-form" id="keyCreateForm">
              <section class="key-create-stage" data-key-create-step="1">
                <div class="hub-lite-create-panel">
                  <div class="hub-lite-create-panel-title" id="keyCreatePanelTitle">Key 요청 정보를 입력해주세요.</div>
                  <div class="key-create-mode-note" id="keyCreateModeNote">
                    <span class="material-icons-round">lock</span>일반 사용자는 Key 발급 요청만 할 수 있고 소유자를 변경할 수 없습니다.
                  </div>
                  <div class="key-create-field-grid">
                    <div class="key-create-field">
                      <label for="keyCreateName">Key 이름</label>
                      <input class="hub-lite-create-input" id="keyCreateName" type="text" placeholder="예: workspace-rag-prod-key" required />
                    </div>
                    <div class="key-create-field">
                      <label for="keyCreateOwner">소유자</label>
                      <input class="hub-lite-create-input" id="keyCreateOwner" type="text" placeholder="현재 로그인 사용자" required />
                      <div class="key-create-owner-selection" id="keyCreateOwnerSelection" hidden></div>
                      <div class="key-create-owner-status" id="keyCreateOwnerStatus" hidden></div>
                      <div class="key-create-owner-results" id="keyCreateOwnerResults" hidden></div>
                    </div>
                  </div>
                  <div class="hub-lite-create-note" id="keyCreateOwnerNote"><span class="material-icons-round">info</span>소유자는 현재 로그인 사용자로 자동 지정됩니다.</div>
                </div>
              </section>
              <section class="key-create-stage is-wide" data-key-create-step="2" hidden>
                <div class="hub-lite-create-panel">
                  <div class="hub-lite-create-panel-title">Key Tier를 선택해주세요.</div>
                  <div class="key-create-tier-summary" id="keyCreateSummary"></div>
                  <div class="key-create-tier-grid" id="keyCreateTierGrid"></div>
                </div>
              </section>
              <div class="hub-lite-create-actions">
                <button class="hub-lite-create-action ghost" type="button" id="keyCreateBack">취소</button>
                <button class="hub-lite-create-action primary" type="button" id="keyCreateNext">다음</button>
                <button class="hub-lite-create-action primary" type="submit" id="keyCreateSubmit" hidden disabled><span class="material-icons-round">check_circle</span>Key 발급 요청</button>
              </div>
              <div class="request-review-feedback" id="keyCreateFeedback"></div>
            </form>
          </div>
        `;

        document.body.appendChild(modal);

        const form = modal.querySelector("#keyCreateForm");
        const stepBadge = modal.querySelector("#keyCreateStepBadge");
        const title = modal.querySelector("#keyCreateTitle");
        const subtitle = modal.querySelector("#keyCreateSubtitle");
        const progress = modal.querySelector("#keyCreateProgress");
        const stages = Array.from(modal.querySelectorAll("[data-key-create-step]"));
        const nameInput = modal.querySelector("#keyCreateName");
        const ownerInput = modal.querySelector("#keyCreateOwner");
        const panelTitle = modal.querySelector("#keyCreatePanelTitle");
        const modeNote = modal.querySelector("#keyCreateModeNote");
        const ownerNote = modal.querySelector("#keyCreateOwnerNote");
        const ownerSelection = modal.querySelector("#keyCreateOwnerSelection");
        const ownerStatus = modal.querySelector("#keyCreateOwnerStatus");
        const ownerResults = modal.querySelector("#keyCreateOwnerResults");
        const summary = modal.querySelector("#keyCreateSummary");
        const tierGrid = modal.querySelector("#keyCreateTierGrid");
        const feedback = modal.querySelector("#keyCreateFeedback");
        const back = modal.querySelector("#keyCreateBack");
        const next = modal.querySelector("#keyCreateNext");
        const submit = modal.querySelector("#keyCreateSubmit");
        const stepMeta = [
          { label: "기본 정보", getSubtitle: () => getKeyRoleMeta().stepOneSubtitle },
          { label: "Key Tier", getSubtitle: () => getKeyRoleMeta().stepTwoSubtitle }
        ];

        const formatOwnerCandidate = (candidate) => {
          const attributes = candidate?.attributes || {};
          const attributeDisplayName = Array.isArray(attributes.displayname) ? attributes.displayname[0] : attributes.displayname;
          const name = String(
            attributeDisplayName
            || candidate?.displayName
            || candidate?.displayname
            || candidate?.name
            || [candidate?.firstName, candidate?.lastName].filter(Boolean).join(" ")
            || candidate?.username
            || candidate?.email
            || candidate?.id
            || ""
          ).trim();
          const sub = String(candidate?.id || candidate?.sub || "").trim();
          const email = String(candidate?.email || "").trim();
          const username = String(candidate?.username || candidate?.preferred_username || "").trim();
          return {
            name: name || sub || "사용자",
            sub,
            email,
            username
          };
        };

        const renderOwnerSearch = () => {
          const roleMeta = getKeyRoleMeta();
          if (roleMeta.ownerLocked) {
            ownerSelection.hidden = true;
            ownerSelection.textContent = "";
            ownerStatus.hidden = true;
            ownerStatus.textContent = "";
            ownerStatus.dataset.tone = "";
            ownerResults.hidden = true;
            ownerResults.innerHTML = "";
            return;
          }

          ownerSelection.hidden = !keyCreateState.selectedOwnerSub;
          ownerSelection.textContent = keyCreateState.selectedOwnerSub
            ? `선택된 사용자 sub: ${keyCreateState.selectedOwnerSub}`
            : "";

          const hasStatus = keyCreateState.ownerSearchLoading || keyCreateState.ownerSearchMessage;
          ownerStatus.hidden = !hasStatus;
          ownerStatus.dataset.tone = keyCreateState.ownerSearchTone || "";
          ownerStatus.textContent = keyCreateState.ownerSearchLoading
            ? "사용자를 검색하는 중입니다."
            : (keyCreateState.ownerSearchMessage || "");

          ownerResults.hidden = !keyCreateState.ownerResultsOpen || !keyCreateState.ownerResults.length;
          ownerResults.innerHTML = keyCreateState.ownerResults.map((item, index) => `
            <button class="key-create-owner-option" type="button" data-owner-option-index="${index}">
              <div class="key-create-owner-option-name">${escapeHtml(item.name)}</div>
              <div class="key-create-owner-option-meta">${escapeHtml([item.email, item.username, item.sub].filter(Boolean).join(" · "))}</div>
            </button>
          `).join("");
        };

        const applyOwnerCandidate = (candidate) => {
          const item = formatOwnerCandidate(candidate);
          if (!item.sub) {
            return;
          }

          keyCreateState.owner = item.sub;
          keyCreateState.selectedOwnerSub = item.sub;
          keyCreateState.ownerSearchKeyword = item.name;
          keyCreateState.ownerResults = [];
          keyCreateState.ownerResultsOpen = false;
          keyCreateState.ownerSearchLoading = false;
          keyCreateState.ownerSearchMessage = item.email || item.username || item.sub;
          keyCreateState.ownerSearchTone = "";
          ownerInput.value = item.name;
          renderProgress();
          renderSummary();
          syncActions();
          renderOwnerSearch();
        };

        const runOwnerSearch = async (keyword) => {
          const normalized = String(keyword || "").trim();
          const roleMeta = getKeyRoleMeta();
          if (roleMeta.ownerLocked) {
            return;
          }

          if (normalized.length < 2) {
            keyCreateState.ownerResults = [];
            keyCreateState.ownerResultsOpen = false;
            keyCreateState.ownerSearchLoading = false;
            keyCreateState.ownerSearchMessage = normalized ? "두 글자 이상 입력하면 검색합니다." : "";
            keyCreateState.ownerSearchTone = "";
            renderOwnerSearch();
            return;
          }

          const searchSeq = ++keyCreateState.ownerSearchSeq;
          keyCreateState.ownerSearchLoading = true;
          keyCreateState.ownerSearchMessage = "";
          keyCreateState.ownerSearchTone = "";
          keyCreateState.ownerResultsOpen = false;
          renderOwnerSearch();

          try {
            const results = await searchAccountUsers(normalized);
            if (searchSeq !== keyCreateState.ownerSearchSeq) return;

            keyCreateState.ownerResults = results
              .map(formatOwnerCandidate)
              .filter((item) => item.sub);
            keyCreateState.ownerResultsOpen = keyCreateState.ownerResults.length > 0;
            keyCreateState.ownerSearchLoading = false;
            keyCreateState.ownerSearchMessage = keyCreateState.ownerResults.length
              ? "검색 결과에서 사용자를 선택해 주세요."
              : "일치하는 사용자를 찾지 못했습니다.";
            keyCreateState.ownerSearchTone = keyCreateState.ownerResults.length ? "" : "error";
            renderOwnerSearch();
          } catch (error) {
            if (searchSeq !== keyCreateState.ownerSearchSeq) return;

            keyCreateState.ownerResults = [];
            keyCreateState.ownerResultsOpen = false;
            keyCreateState.ownerSearchLoading = false;
            keyCreateState.ownerSearchMessage = error && error.message ? error.message : "사용자 검색에 실패했습니다.";
            keyCreateState.ownerSearchTone = "error";
            renderOwnerSearch();
          }
        };

        const syncRolePresentation = () => {
          const roleMeta = getKeyRoleMeta();
          title.textContent = roleMeta.modalTitle;
          panelTitle.textContent = roleMeta.stepOneTitle;
          modeNote.innerHTML = `<span class="material-icons-round">${roleMeta.ownerLocked ? "lock" : "tune"}</span>${roleMeta.modeHint}`;
          ownerInput.disabled = roleMeta.ownerLocked;
          ownerInput.readOnly = roleMeta.ownerLocked;
          ownerInput.placeholder = roleMeta.ownerLocked ? roleMeta.ownerValue : "이름, 메일, sub로 사용자 검색";
          ownerNote.innerHTML = roleMeta.ownerLocked
            ? '<span class="material-icons-round">info</span>소유자는 현재 로그인 사용자로 자동 지정됩니다.'
            : '<span class="material-icons-round">info</span>Admin은 이름, 메일, sub로 사용자를 검색한 뒤 목록에서 선택할 수 있습니다. 비워두면 현재 로그인 사용자로 발급합니다.';
          if (roleMeta.ownerLocked) {
            keyCreateState.owner = roleMeta.ownerValue;
            keyCreateState.selectedOwnerSub = "";
            keyCreateState.ownerSearchKeyword = "";
            keyCreateState.ownerResults = [];
            keyCreateState.ownerResultsOpen = false;
            keyCreateState.ownerSearchLoading = false;
            keyCreateState.ownerSearchMessage = "";
            keyCreateState.ownerSearchTone = "";
            ownerInput.value = roleMeta.ownerValue;
          } else {
            ownerInput.value = keyCreateState.ownerSearchKeyword || "";
          }
          submit.innerHTML = `<span class="material-icons-round">check_circle</span>${roleMeta.submitLabel}`;
          renderOwnerSearch();
        };

        const renderProgress = () => {
          progress.innerHTML = stepMeta.map((item, index) => {
            const step = index + 1;
            const isCurrent = step === keyCreateState.step;
            const isComplete = step < keyCreateState.step;
            const value = step === 1
              ? [keyCreateState.name, keyCreateState.owner].filter(Boolean).join(" · ")
              : getKeyTierMeta(keyCreateState.tierId).title;
            return `
              <div class="hub-lite-create-progress-item ${isCurrent ? "is-current" : ""} ${isComplete ? "is-complete" : ""}">
                <div class="hub-lite-create-progress-line">
                  <span class="hub-lite-create-progress-rail ${index === 0 ? "is-hidden" : ""}"></span>
                  <span class="hub-lite-create-progress-dot">${isComplete ? '<span class="material-icons-round" style="font-size:15px">done</span>' : step}</span>
                  <span class="hub-lite-create-progress-rail ${index === stepMeta.length - 1 ? "is-hidden" : ""}"></span>
                </div>
                <div class="hub-lite-create-progress-label">${item.label}</div>
                <div class="hub-lite-create-progress-value">${value || " "}</div>
              </div>
            `;
          }).join("");
        };

        const renderSummary = () => {
          const tierMeta = getKeyTierMeta(keyCreateState.tierId);
          summary.innerHTML = `
            <div class="key-create-tier-summary-line">
              <div class="key-create-tier-summary-title">${keyCreateState.name || "새 Key"} · ${keyCreateState.owner || "소유자 미지정"}</div>
              <div class="key-create-tier-summary-meta">${tierMeta.title}</div>
            </div>
            <div class="key-create-tier-summary-meta">${tierMeta.description}</div>
          `;
        };

        const renderTierGrid = () => {
          tierGrid.innerHTML = keyTierOptions.map((item) => `
            <button class="key-create-tier-card ${keyCreateState.tierId === item.id ? "is-selected" : ""}" type="button" data-key-tier="${item.id}">
              <div class="key-create-tier-head">
                <span class="key-create-tier-icon" aria-hidden="true"><span class="material-icons-round">${item.icon}</span></span>
                <span class="key-create-tier-radio" aria-hidden="true"></span>
              </div>
              <div class="key-create-tier-title">${item.title}</div>
              <div class="key-create-tier-meta">${item.description}</div>
            </button>
          `).join("");
        };

        const renderStages = () => {
          stages.forEach((stage) => {
            stage.hidden = Number(stage.dataset.keyCreateStep) !== keyCreateState.step;
          });
        };

        const syncHeader = () => {
          const meta = stepMeta[keyCreateState.step - 1];
          stepBadge.textContent = String(keyCreateState.step);
          subtitle.textContent = meta.getSubtitle();
        };

        const syncActions = () => {
          const roleMeta = getKeyRoleMeta();
          const hasValidOwner = roleMeta.ownerLocked
            ? Boolean(keyCreateState.owner.trim())
            : Boolean(keyCreateState.selectedOwnerSub);
          const canAdvance = Boolean(keyCreateState.name.trim() && hasValidOwner);
          back.textContent = keyCreateState.step === 1 ? "취소" : "뒤로";
          next.hidden = keyCreateState.step === 2;
          submit.hidden = keyCreateState.step !== 2;
          nameInput.disabled = keyCreateState.submitting;
          ownerInput.disabled = roleMeta.ownerLocked || keyCreateState.submitting;
          tierGrid.querySelectorAll("[data-key-tier]").forEach((button) => {
            button.disabled = keyCreateState.submitting;
          });
          back.disabled = keyCreateState.submitting;
          next.disabled = keyCreateState.submitting || !canAdvance;
          submit.disabled = keyCreateState.submitting || !(canAdvance && keyCreateState.tierId);
          submit.innerHTML = keyCreateState.submitting
            ? '<span class="material-icons-round">hourglass_top</span>처리 중...'
            : `<span class="material-icons-round">check_circle</span>${roleMeta.submitLabel}`;
          feedback.textContent = keyCreateState.feedback || "";
          feedback.dataset.tone = keyCreateState.feedbackTone || "";
        };

        const rerender = () => {
          syncRolePresentation();
          syncHeader();
          renderProgress();
          renderSummary();
          renderTierGrid();
          renderStages();
          syncActions();
        };

        const close = () => {
          modal.hidden = true;
          document.body.style.overflow = "";
          resetKeyCreateState();
          form.reset();
          if (window.location.hash === "#key-create") {
            window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
          }
          rerender();
        };

        modal.addEventListener("click", (event) => {
          if (event.target === modal) close();
        });

        modal.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !modal.hidden) close();
        });

        modal.querySelector("#keyCreateClose").addEventListener("click", close);

        nameInput.addEventListener("input", () => {
          if (keyCreateState.feedbackTone === "error") {
            keyCreateState.feedback = "";
            keyCreateState.feedbackTone = "";
          }
          keyCreateState.name = String(nameInput.value || "").trim();
          renderProgress();
          renderSummary();
          syncActions();
        });

        ownerInput.addEventListener("input", () => {
          if (getKeyRoleMeta().ownerLocked) return;
          if (keyCreateState.feedbackTone === "error") {
            keyCreateState.feedback = "";
            keyCreateState.feedbackTone = "";
          }
          const keyword = String(ownerInput.value || "").trim();
          keyCreateState.ownerSearchKeyword = keyword;
          keyCreateState.owner = "";
          keyCreateState.selectedOwnerSub = "";
          keyCreateState.ownerResults = [];
          keyCreateState.ownerResultsOpen = false;
          keyCreateState.ownerSearchTone = "";
          if (keyCreateState.ownerSearchDebounce) {
            window.clearTimeout(keyCreateState.ownerSearchDebounce);
            keyCreateState.ownerSearchDebounce = null;
          }
          keyCreateState.ownerSearchMessage = keyword ? "검색 결과에서 사용자를 선택해 주세요." : "";
          renderProgress();
          renderSummary();
          syncActions();
          renderOwnerSearch();
          keyCreateState.ownerSearchDebounce = window.setTimeout(() => {
            runOwnerSearch(keyword);
          }, 220);
        });

        ownerInput.addEventListener("focus", () => {
          if (getKeyRoleMeta().ownerLocked) return;
          if (keyCreateState.ownerResults.length) {
            keyCreateState.ownerResultsOpen = true;
            renderOwnerSearch();
          }
        });

        ownerInput.addEventListener("blur", () => {
          window.setTimeout(() => {
            keyCreateState.ownerResultsOpen = false;
            renderOwnerSearch();
          }, 120);
        });

        ownerResults.addEventListener("mousedown", (event) => {
          const button = event.target.closest("[data-owner-option-index]");
          if (!button) return;
          event.preventDefault();
          const index = Number(button.dataset.ownerOptionIndex);
          const candidate = keyCreateState.ownerResults[index];
          if (!candidate) return;
          applyOwnerCandidate(candidate);
        });

        tierGrid.addEventListener("click", (event) => {
          if (keyCreateState.submitting) return;
          const button = event.target.closest("[data-key-tier]");
          if (!button) return;
          keyCreateState.tierId = button.dataset.keyTier || keyTierOptions[0]?.id || DEFAULT_KEY_TIER_OPTIONS[0].id;
          renderProgress();
          renderSummary();
          renderTierGrid();
          syncActions();
        });

        back.addEventListener("click", () => {
          if (keyCreateState.submitting) return;
          if (keyCreateState.step === 1) {
            close();
            return;
          }
          keyCreateState.step = 1;
          rerender();
        });

        next.addEventListener("click", () => {
          if (keyCreateState.submitting) return;
          const canAdvance = getKeyRoleMeta().ownerLocked
            ? Boolean(keyCreateState.name.trim() && keyCreateState.owner.trim())
            : Boolean(keyCreateState.name.trim() && keyCreateState.selectedOwnerSub);
          if (!canAdvance) return;
          keyCreateState.step = 2;
          rerender();
          requestAnimationFrame(() => {
            modal.querySelector("[data-key-tier]")?.focus();
          });
        });

        form.addEventListener("submit", async (event) => {
          event.preventDefault();
          if (keyCreateState.submitting) return;
          const roleMeta = getKeyRoleMeta();
          const resolvedOwner = roleMeta.ownerLocked ? keyCreateState.owner.trim() : keyCreateState.selectedOwnerSub.trim();
          if (!(keyCreateState.name.trim() && resolvedOwner && keyCreateState.tierId)) {
            syncActions();
            return;
          }

          keyCreateState.submitting = true;
          keyCreateState.feedback = "Key 요청을 전송하는 중입니다.";
          keyCreateState.feedbackTone = "";
          rerender();

          const owner = String(resolvedOwner || "").trim();
          const requestBody = {
            name: keyCreateState.name.trim(),
            tierId: keyCreateState.tierId,
            ...(!roleMeta.ownerLocked && owner ? { owner } : {})
          };

          try {
            const payload = await requestJson("/keys", {
              method: "POST",
              body: requestBody
            });
            const createdItem = getPayloadData(payload);
            clearLegacyStoredKeys();
            close();
            await bootstrap();

            if (createdItem?.status && createdItem?.id) {
              window.location.hash = `${REQUEST_REVIEW_HASH_PREFIX}${encodeURIComponent(createdItem.id)}`;
            }
          } catch (error) {
            keyCreateState.submitting = false;
            keyCreateState.feedback = error && error.message ? error.message : "Key 요청 처리에 실패했습니다.";
            keyCreateState.feedbackTone = "error";
            rerender();
          }
        });

        modal.__rerenderKeyCreate = rerender;
        rerender();
        return modal;
      };

      const syncKeyModalRole = () => {
        const modal = document.getElementById("keyCreateModal");
        if (!modal || typeof modal.__rerenderKeyCreate !== "function") return;
        if (getKeyRoleMeta().ownerLocked) {
          keyCreateState.owner = getKeyRoleMeta().ownerValue;
        } else if (keyCreateState.owner === KEY_ROLE_OPTIONS.user.ownerValue) {
          keyCreateState.owner = "";
        }
        modal.__rerenderKeyCreate();
      };

      const openKeyCreateModal = () => {
        resetKeyCreateState();
        const modal = ensureKeyCreateModal();
        modal.hidden = false;
        document.body.style.overflow = "hidden";
        requestAnimationFrame(() => {
          modal.querySelector("#keyCreateName")?.focus();
        });
      };

      const wireKeyCreateAction = () => {
        const button = document.querySelector(".control-actions .create-btn");
        if (!button || button.dataset.keyCreateBound === "true") return;
        button.dataset.keyCreateBound = "true";
        button.addEventListener("click", (event) => {
          event.preventDefault();
          openKeyCreateModal();
        });
      };

      const wireKeyCreateHash = () => {
        if (window.__keyCreateHashBound) return;
        window.__keyCreateHashBound = true;

        window.addEventListener("hashchange", () => {
          if (window.location.hash === "#key-create") {
            openKeyCreateModal();
          }
        });

        if (window.location.hash === "#key-create") {
          openKeyCreateModal();
        }
      };

      const bootstrap = async () => {
        const [
          statsResult,
          filtersResult,
          tiersResult,
          keysResult,
          modelUsagePanelResult,
          quotaAlertsPanelResult,
          myRequestsPanelResult,
          requestQueuePanelResult
        ] = await Promise.allSettled([
          fetchJson(`${API_BASE}/tiers/stats`),
          fetchJson(`${API_BASE}/tiers/filters`),
          fetchPagedItems("/tiers"),
          fetchPagedItems("/keys"),
          fetchJson(`${API_BASE}/panels/model-usage`),
          fetchJson(`${API_BASE}/panels/quota-alerts`),
          fetchJson(`${API_BASE}/panels/my-requests`),
          fetchJson(`${API_BASE}/panels/request-queue`)
        ]);

        const nextConfig = {
          ...fallbackConfig
        };

        if (statsResult.status === "fulfilled") {
          nextConfig.heroStats = buildHeroStats(getPayloadData(statsResult.value));
        }

        const tierItems = tiersResult.status === "fulfilled" ? toArray(tiersResult.value) : [];
        keyTierOptions = buildKeyTierOptionsFromApi(tierItems);
        if (!keyTierOptions.some((item) => item.id === keyCreateState.tierId)) {
          keyCreateState.tierId = keyTierOptions[0]?.id || DEFAULT_KEY_TIER_OPTIONS[0].id;
        }
        const tierLookup = buildTierLookup(tierItems);
        const filterItems = filtersResult.status === "fulfilled"
          ? toArray(getPayloadData(filtersResult.value).items)
          : deriveFilterItemsFromTiers(tierItems);

        keyRoleState.current = (
          requestQueuePanelResult.status === "fulfilled"
          && String(getPayloadData(requestQueuePanelResult.value)?.scope?.type || "").trim().toLowerCase() === "admin"
        ) ? "admin" : "user";
        syncKeyModalRole();

        if (filterItems.length) {
          nextConfig.filters = buildFilters(filterItems);
        }

        if (keysResult.status === "fulfilled") {
          const keyItems = toArray(keysResult.value);
          nextConfig.resources = keyItems.map((item) => buildKeyResource(item, tierLookup));
          nextConfig.resourceDescription = buildResourceDescription(keyItems.length);
          nextConfig.resourceEmptyStateMessage = DEFAULT_RESOURCE_EMPTY_STATE_MESSAGE;
        } else {
          nextConfig.resources = [];
          nextConfig.resourceDescription = "Keycenter 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";
          nextConfig.resourceEmptyStateMessage = "Keycenter 데이터를 불러오지 못했습니다.";
        }

        if (quotaAlertsPanelResult.status === "fulfilled") {
          const sidebarPanels = toArray(nextConfig.sidebarPanels).slice();
          sidebarPanels[0] = buildQuotaAlertsSidebarPanel(quotaAlertsPanelResult.value);
          nextConfig.sidebarPanels = sidebarPanels;
        }

        const requestPanelResult = requestQueuePanelResult.status === "fulfilled"
          ? requestQueuePanelResult
          : myRequestsPanelResult;

        if (requestPanelResult.status === "fulfilled") {
          const sidebarPanels = toArray(nextConfig.sidebarPanels).slice();
          sidebarPanels[1] = buildRequestsSidebarPanel(requestPanelResult.value);
          nextConfig.sidebarPanels = sidebarPanels;
        }

        if (modelUsagePanelResult.status === "fulfilled") {
          const modelUsagePanel = buildModelUsageSidebarPanel(modelUsagePanelResult.value);
          if (modelUsagePanel) {
            const sidebarPanels = toArray(nextConfig.sidebarPanels).slice();
            const existingIndex = sidebarPanels.findIndex((panel) => String(panel?.label || "").toLowerCase() === "model usage");
            if (existingIndex >= 0) {
              sidebarPanels[existingIndex] = modelUsagePanel;
            } else {
              sidebarPanels.push(modelUsagePanel);
            }
            nextConfig.sidebarPanels = sidebarPanels;
          }
        }

        window.HUB_CONFIG = nextConfig;
        if (typeof window.renderWorkspaceResourceHub === "function") {
          window.renderWorkspaceResourceHub(window.HUB_CONFIG);
          window.setTimeout(mountKeyFloatingControls, 0);
        }
      };

      hookRenderer();
      window.setTimeout(mountKeyFloatingControls, 0);
      wireKeyCreateHash();
      wireRequestReviewHash();
      clearLegacyStoredKeys();

      bootstrap().catch((error) => {
        window.HUB_CONFIG = {
          ...fallbackConfig,
          resources: [],
          resourceDescription: "Keycenter 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.",
          resourceEmptyStateMessage: "Keycenter 데이터를 불러오지 못했습니다."
        };
        if (typeof window.renderWorkspaceResourceHub === "function") {
          window.renderWorkspaceResourceHub(window.HUB_CONFIG);
        }
        console.warn("Failed to load /api/v2/keycenter hub data", error);
      });
    })();
  </script>
  <script src="ax_studio_topbar.js"></script>
  <script src="concept_endpoint_overlay.js"></script>
</body>
</html>
