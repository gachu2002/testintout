  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    .key-create-progress-track {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
    }
    .hub-lite-create-progress-rail.is-hidden {
      visibility: hidden;
    }
    .resource-pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(214, 216, 219, .74);
    }
    .resource-pagination[hidden] {
      display: none !important;
    }
    .resource-pagination-summary {
      color: var(--t2);
      font-size: 13px;
      line-height: 1.5;
    }
    .resource-pagination-controls {
      display: inline-flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .resource-pagination-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(214, 216, 219, .94);
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #fff;
      color: var(--t2);
      font-size: 12px;
      font-weight: 800;
      transition: all .15s ease;
    }
    .resource-pagination-btn:hover:not(:disabled) {
      border-color: rgba(245, 158, 11, .28);
      color: var(--brand);
      background: rgba(245, 158, 11, .06);
    }
    .resource-pagination-btn.is-active {
      border-color: rgba(245, 158, 11, .24);
      background: var(--brand-soft);
      color: var(--brand);
    }
    .resource-pagination-btn:disabled {
      opacity: .42;
      cursor: not-allowed;
    }
    @media (max-width: 980px) {
      .resource-pagination {
        flex-direction: column;
        align-items: stretch;
      }
      .resource-pagination-controls {
        justify-content: flex-start;
      }
    }
    .key-create-stage.is-wide {
      width: min(100%, var(--hub-lite-create-wide-width));
    }
    .key-create-field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .key-create-field {
      display: grid;
      gap: 8px;
      min-width: 0;
    }
    .key-create-field label {
      font-size: 12px;
      font-weight: 800;
      color: var(--t2);
      letter-spacing: -.01em;
    }
    .key-create-tier-summary {
      display: grid;
      gap: 8px;
      padding: 16px 18px;
      border-radius: 18px;
      border: 1px solid rgba(214, 216, 219, .82);
      background: rgba(255, 255, 255, .82);
    }
    .key-create-tier-summary-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .key-create-tier-summary-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--t1);
      letter-spacing: -.02em;
    }
    .key-create-tier-summary-meta {
      font-size: 12px;
      color: var(--t3);
      line-height: 1.5;
    }
    .key-create-tier-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .key-create-tier-card {
      min-width: 0;
      display: grid;
      gap: 10px;
      padding: 16px;
      border: 1px solid rgba(214, 216, 219, .94);
      border-radius: 18px;
      background: rgba(255, 255, 255, .92);
      text-align: left;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .key-create-tier-card:hover {
      border-color: rgba(245, 158, 11, .26);
      box-shadow: 0 14px 26px rgba(15, 23, 42, .06);
      transform: translateY(-1px);
    }
    .key-create-tier-card.is-selected {
      border-color: rgba(245, 158, 11, .28);
      box-shadow: 0 18px 32px rgba(245, 158, 11, .12);
      background: linear-gradient(180deg, rgba(255, 251, 235, .98), rgba(255, 255, 255, .96));
    }
    .key-create-tier-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .key-create-tier-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(245, 158, 11, .12);
      color: var(--brand);
      flex-shrink: 0;
    }
    .key-create-tier-icon .material-icons-round {
      font-size: 20px;
    }
    .key-create-tier-radio {
      width: 18px;
      height: 18px;
      border-radius: 999px;
      border: 2px solid rgba(203, 213, 225, .96);
      background: #fff;
      position: relative;
      flex-shrink: 0;
    }
    .key-create-tier-card.is-selected .key-create-tier-radio {
      border-color: var(--brand);
    }
    .key-create-tier-card.is-selected .key-create-tier-radio::after {
      content: "";
      position: absolute;
      inset: 3px;
      border-radius: 999px;
      background: var(--brand);
    }
    .key-create-tier-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--t1);
      line-height: 1.45;
      letter-spacing: -.02em;
    }
    .key-create-tier-meta {
      font-size: 12px;
      color: var(--t3);
      line-height: 1.55;
    }
    .key-role-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid rgba(214, 216, 219, .94);
      border-radius: 16px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 10px 20px rgba(15, 23, 42, .04);
    }
    .key-role-switch.is-floating {
      position: fixed;
      top: 84px;
      right: 28px;
      z-index: 40;
      width: fit-content;
      backdrop-filter: blur(10px);
    }
    .hero-shell {
      position: relative;
    }
    .hero-actions {
      position: relative;
      flex-direction: column;
      align-items: flex-end;
      justify-content: flex-start;
      flex-shrink: 0;
      margin-top: 18px;
    }
    .hero-actions .hero-btn {
      min-width: 188px;
      justify-content: center;
    }
    .key-role-switch-btn {
      min-width: 96px;
      height: 38px;
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      color: var(--t2);
      font-size: 12px;
      font-weight: 800;
      transition: background .15s ease, color .15s ease, box-shadow .15s ease;
    }
    .key-role-switch-btn.is-active {
      background: linear-gradient(135deg, rgba(245, 158, 11, .12), rgba(249, 115, 22, .12));
      color: var(--brand);
      box-shadow: inset 0 0 0 1px rgba(245, 158, 11, .18);
    }
    .key-role-switch-btn .material-icons-round {
      font-size: 16px;
    }
    .key-create-mode-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(245, 158, 11, .08);
      color: var(--brand);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.4;
      width: fit-content;
    }
    .key-create-mode-note .material-icons-round {
      font-size: 15px;
    }
    @media (max-width: 1100px) {
      .key-create-tier-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }
    @media (max-width: 820px) {
      .key-create-field-grid,
      .key-create-tier-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .key-role-switch.is-floating {
        top: 76px;
        right: 16px;
      }
      .hero-actions {
        width: 100%;
        align-items: stretch;
        margin-top: 12px;
      }
      .hero-actions .hero-btn {
        width: 100%;
      }
    }
    @media (max-width: 640px) {
      .key-create-field-grid,
      .key-create-tier-grid {
        grid-template-columns: 1fr;
      }
      .key-role-switch.is-floating {
        top: 72px;
        right: 12px;
      }
    }

            { title: "Tool Inventory Hub", meta: "tool 호출과 retrieval 경계가 어떤 key로 보호되는지 확인합니다.", href: "workspace_tool_inventory_hub.html" }
          ],
          footerLink: { href: "portal_launchpad.html", label: "런치패드로 돌아가기" }
        }
      ],
      sidebarPanels: [
        {
          icon: "published_with_changes",
          label: "Rotate Soon",
          title: "회전 예정 Key",
          description: "곧 교체가 필요한 key를 먼저 확인할 수 있습니다.",
          rows: [
            { title: "azure-ops-briefing-key", meta: "9일 후 회전 예정 · ops-briefing-bot", pill: { label: "Soon", tone: "review" } },
            { title: "openai-support-prod-key", meta: "11일 후 회전 예정 · support-assistant-api", pill: { label: "Soon", tone: "review" } },
            { title: "partner-pricing-review-key", meta: "검토 완료 후 정식 key 발급 필요", pill: { label: "Review", tone: "review" } }
          ]
        },
        {
          icon: "model_training",
          label: "Model Usage",
          title: "주요 모델 사용 현황",
          description: "현재 선택한 기간에 실제 usage가 발생한 모델 흐름을 요약해서 볼 수 있습니다.",
          rows: [
            { title: "gpt-4.1", meta: "최근 7일 요청과 비용 비중이 가장 큰 운영 모델", pill: { label: "Top Usage", tone: "healthy" } },
            { title: "gpt-4o", meta: "고속 응답 흐름에서 호출량이 꾸준히 유지됨", pill: { label: "Active", tone: "info" } },
            { title: "claude-3.7-sonnet", meta: "review와 문서 reasoning 구간에서 집중 사용", pill: { label: "Focused", tone: "healthy" } },
            { title: "internal-rag-1", meta: "retrieval 및 tool runtime 전용으로 제한적 사용", pill: { label: "Scoped", tone: "pending" } }
          ]
        }
      ]
    };
  </script>
  <script src="workspace_resource_hub_shared.js"></script>
  <script>
    (() => {
      const API_BASE = "/api/v2/keycenter";
      const fallbackConfig = window.HUB_CONFIG || {};
      const PAGE_LIMIT = 100;
      const PAGE_SIZE = 6;
      const KEYCENTER_STORAGE_KEY = "workspace.sample.keycenter.drafts.v1";
      const KEY_ROLE_OPTIONS = {
        user: {
          id: "user",
          label: "일반 사용자",
          icon: "person",
          heroLabel: "새 Key 발급 요청",
          modalTitle: "새 Key 발급 요청을 등록합니다",
          stepOneTitle: "Key 요청 정보를 입력해주세요.",
          stepOneSubtitle: "먼저 key 이름을 입력해주세요. 소유자는 현재 사용자로 고정됩니다.",
          stepTwoSubtitle: "이제 요청할 key tier를 선택해주세요.",
          submitLabel: "Key 발급 요청",
          ownerLocked: true,
          ownerValue: "현재 로그인 사용자",
          modeHint: "일반 사용자는 Key 발급 요청만 할 수 있고 소유자를 변경할 수 없습니다."
        },
        admin: {
          id: "admin",
          label: "Admin",
          icon: "admin_panel_settings",
          heroLabel: "새 Key 발급",
          modalTitle: "새 Key를 발급합니다",
          stepOneTitle: "Key 기본 정보를 입력해주세요.",
          stepOneSubtitle: "먼저 key 이름과 소유자를 입력해주세요.",
          stepTwoSubtitle: "이제 발급할 key tier를 선택해주세요.",
          submitLabel: "Key 발급",
          ownerLocked: false,
          ownerValue: "",
          modeHint: "Admin은 Key를 바로 발급할 수 있고 소유자를 직접 지정하거나 변경할 수 있습니다."
        }
      };
      const HERO_GRADIENTS = [
        "linear-gradient(135deg,#f59e0b,#f97316)",
        "linear-gradient(135deg,#d97706,#f59e0b)",
        "linear-gradient(135deg,#ea580c,#fb923c)",
        "linear-gradient(135deg,#f59e0b,#fbbf24)",
        "linear-gradient(135deg,#b45309,#f59e0b)"
      ];
      const KEY_TIER_OPTIONS = [
        { id: "free-tier", title: "Free Tier", description: "$5 monthly limit, 10 requests per minute", icon: "auto_awesome" },
        { id: "paid-tier", title: "Paid Tier", description: "$100 monthly limit, 60 requests per minute", icon: "paid" },
        { id: "hw-deposit-tier", title: "HW Deposit Tier", description: "Dynamic RPM based on hardware performance", icon: "memory" },
        { id: "aidd-tier", title: "AIDD Tier", description: "AIDD token deposited Tier", icon: "confirmation_number" },
        { id: "asf-playground-tier", title: "ASF Playground Tier", description: "ASF Playground token deposited Tier", icon: "stadia_controller" },
        { id: "asf-base-tier", title: "ASF Base Tier", description: "ASF Base token deposited Tier", icon: "view_in_ar" },
        { id: "asf-advanced-tier", title: "ASF Advanced Tier", description: "ASF Advanced token deposited Tier", icon: "rocket_launch" },
        { id: "asf-max-tier", title: "ASF Max Tier", description: "ASF Max token deposited Tier", icon: "bolt" },
        { id: "asf-standard-tier", title: "ASF Standard Tier", description: "ASF Production Standard token deposited Tier", icon: "apartment" },
        { id: "asf-plus-tier", title: "ASF Plus Tier", description: "ASF Production Plus token deposited Tier", icon: "workspace_premium" },
        { id: "asf-premium-tier", title: "ASF Premium Tier", description: "ASF Production Premium token deposited Tier", icon: "diamond" },
        { id: "asf-enterprise-tier", title: "ASF Enterprise Tier", description: "ASF Production Enterprise token deposited Tier", icon: "domain_verification" },
        { id: "dej-base-tier", title: "DEJ Base Tier", description: "DEJ Base token deposited Tier", icon: "apartment" }
      ];
      const paginationState = {
        currentPage: 1,
        activeFilter: "all"
      };
      const keyCreateState = {
        step: 1,
        name: "",
        owner: "",
        tierId: KEY_TIER_OPTIONS[0].id
      };
      const keyRoleState = {
        current: "user"
      };
      let lastResolvedConfig = fallbackConfig;

      const normalizeKey = (value) => String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "");

      const toArray = (value) => Array.isArray(value) ? value : [];
      const getPayloadData = (payload) => (
        payload && typeof payload === "object" && !Array.isArray(payload) && payload.data && typeof payload.data === "object"
          ? payload.data
          : (payload && typeof payload === "object" && !Array.isArray(payload) ? payload : {})
      );

      const formatCompactNumber = (value) => {
        const number = Number(value);
        if (!Number.isFinite(number)) return "0";
        return new Intl.NumberFormat("en-US", {
          notation: "compact",
          maximumFractionDigits: number >= 100 ? 0 : 1
        }).format(number);
      };

      const formatCurrency = (value) => {
        const number = Number(value);
        if (!Number.isFinite(number)) return "$0.00";
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(number);
      };

      const formatShortDate = (value) => {
        const normalized = String(value || "").trim();
        if (!normalized) return "";
        return normalized.slice(0, 10);
      };

      const capitalize = (value) => {
        const normalized = String(value || "").trim();
        if (!normalized) return "";
        return normalized.charAt(0).toUpperCase() + normalized.slice(1);
      };

      const parseStoredKeys = () => {
        try {
          const parsed = JSON.parse(window.localStorage.getItem(KEYCENTER_STORAGE_KEY) || "[]");
          return toArray(parsed).filter((item) => item && typeof item === "object");
        } catch (error) {
          console.warn("Failed to parse stored key drafts", error);
          return [];
        }
      };

      const saveStoredKeys = (items) => {
        window.localStorage.setItem(KEYCENTER_STORAGE_KEY, JSON.stringify(toArray(items)));
      };

      const getKeyTierMeta = (tierId) => KEY_TIER_OPTIONS.find((item) => item.id === tierId) || KEY_TIER_OPTIONS[0];
      const getKeyRoleMeta = () => KEY_ROLE_OPTIONS[keyRoleState.current] || KEY_ROLE_OPTIONS.user;

      const resetKeyCreateState = () => {
        const roleMeta = getKeyRoleMeta();
        keyCreateState.step = 1;
        keyCreateState.name = "";
        keyCreateState.owner = roleMeta.ownerLocked ? roleMeta.ownerValue : "";
        keyCreateState.tierId = KEY_TIER_OPTIONS[0].id;
      };

      const toTitleWords = (value) => String(value || "")
        .split(/[\s._:/-]+/)
        .filter(Boolean)
        .map((part) => capitalize(part.toLowerCase()))
        .join(" ");

      const getInitials = (value) => String(value || "")
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .map((part) => part[0] || "")
        .join("")
        .slice(0, 2)
        .toUpperCase() || "KC";

      const buildHeroStats = (statsPayload) => {
        const period = statsPayload?.period || {};
        const stats = statsPayload?.stats || {};
        const startDate = String(period.startDate || "").trim();
        const endDate = String(period.endDate || "").trim();
        const periodLabel = startDate && endDate ? `${startDate} ~ ${endDate}` : "최근 집계 기준";
        const requestedDays = Math.max(1, Number(fallbackConfig.defaultStatsDays || 7));

        return [
          {
            icon: "vpn_key",
            value: formatCompactNumber(stats.issuedKeys),
            label: "Issued Keys",
            note: "접근 가능한 key 기준",
            color: HERO_GRADIENTS[0]
          },
          {
            icon: "query_stats",
            value: formatCompactNumber(stats.requestCount),
            label: `Requests (${requestedDays}d)`,
            note: periodLabel,
            color: HERO_GRADIENTS[1]
          },
          {
            icon: "token",
            value: formatCompactNumber(stats.totalTokens),
            label: `Tokens (${requestedDays}d)`,
            note: "input · output · cache 포함",
            color: HERO_GRADIENTS[2]
          },
          {
            icon: "paid",
            value: formatCurrency(stats.usageCost),
            label: `Usage Cost (${requestedDays}d)`,
            note: "LiteLLM aggregate spend",
            color: HERO_GRADIENTS[3]
          }
        ];
      };

      const inferFilterIcon = (item) => {
        const candidates = [
          normalizeKey(item?.code),
          normalizeKey(item?.label),
          normalizeKey(item?.id)
        ].filter(Boolean);

        if (candidates.some((value) => value.includes("free"))) return "auto_awesome";
        if (candidates.some((value) => value.includes("paid"))) return "paid";
        if (candidates.some((value) => value.includes("dej"))) return "apartment";
        if (candidates.some((value) => value.includes("asf"))) return "apartment";
        if (candidates.some((value) => value.includes("deposit"))) return "savings";
        if (candidates.some((value) => value.includes("playground"))) return "stadia_controller";
        if (candidates.some((value) => value.includes("review"))) return "fact_check";
        return "vpn_key";
      };

      const buildFilters = (filterItems) => toArray(filterItems).map((item, index) => ({
        id: item?.id || (index === 0 ? "all" : `tier-${index}`),
        icon: inferFilterIcon(item),
        label: item?.label || item?.code || item?.id || `Tier ${index + 1}`
      }));

      const resourceSignals = (resource) => {
        const tags = toArray(resource?.tags).map((tag) => tag?.text || "");
        const detailTexts = toArray(resource?.details).map((detail) => detail?.text || "");
        return [
          resource?.engine,
          resource?.name,
          resource?.meta,
          ...tags,
          ...detailTexts
        ]
          .map((value) => normalizeKey(value))
          .filter(Boolean);
      };

      const findMatchingTierIds = (resource, filterItems) => {
        const signals = resourceSignals(resource);
        return toArray(filterItems)
          .filter((item) => item?.id && item.id !== "all")
          .filter((item) => {
            const aliases = [
              normalizeKey(item?.id).replace(/-tier$/g, ""),
              normalizeKey(item?.code),
              normalizeKey(item?.label)
            ]
              .flatMap((value) => [value, ...String(value || "").split("-")])
              .filter((value) => value && value.length >= 3);

            return aliases.some((alias) => signals.some((signal) => signal === alias || signal.includes(alias) || alias.includes(signal)));
          })
          .map((item) => item.id);
      };

      const applyFilterCategories = (resources, filterItems) => toArray(resources).map((resource) => {
        const categories = new Set(["all", ...toArray(resource?.categories)]);
        findMatchingTierIds(resource, filterItems).forEach((filterId) => categories.add(filterId));
        return {
          ...resource,
          categories: Array.from(categories)
        };
      });

      const fetchJson = async (url) => {
        const response = await fetch(url, {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            Accept: "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`Request failed: ${response.status} ${response.statusText}`);
        }

        return response.json();
      };

      const getResourcePanel = () => document.getElementById("resource-panel");
      const getResourceGrid = () => document.getElementById("resourceGrid");
      const getResourceCards = () => Array.from(document.querySelectorAll("[data-resource-card]"));
      const getEmptyState = () => document.getElementById("resourceEmptyState");
      const getActiveFilter = () => {
        const activeTab = document.querySelector("[data-resource-filter].is-active");
        return activeTab?.dataset?.resourceFilter || "all";
      };
      const getCardTags = (card) => String(card?.dataset?.resourceTags || "")
        .split(/\s+/)
        .filter(Boolean);

      const ensurePagination = () => {
        const panel = getResourcePanel();
        const emptyState = getEmptyState();
        if (!panel || !emptyState) return null;

        let pagination = document.getElementById("keycenterFleetPagination");
        if (pagination) return pagination;

        pagination = document.createElement("nav");
        pagination.id = "keycenterFleetPagination";
        pagination.className = "resource-pagination";
        pagination.hidden = true;
        pagination.setAttribute("aria-label", "LLM Keys pagination");
        pagination.innerHTML = `
          <div class="resource-pagination-summary" id="keycenterFleetPaginationSummary"></div>
          <div class="resource-pagination-controls" id="keycenterFleetPaginationControls"></div>
        `;
        emptyState.insertAdjacentElement("afterend", pagination);
        return pagination;
      };

      const renderPaginationControls = (totalItems, totalPages) => {
        const pagination = ensurePagination();
        if (!pagination) return;

        const summary = document.getElementById("keycenterFleetPaginationSummary");
        const controls = document.getElementById("keycenterFleetPaginationControls");
        if (!summary || !controls) return;

        if (totalItems <= PAGE_SIZE) {
          pagination.hidden = true;
          controls.innerHTML = "";
          summary.textContent = totalItems ? `총 ${totalItems}개` : "";
          return;
        }

        pagination.hidden = false;
        const startItem = (paginationState.currentPage - 1) * PAGE_SIZE + 1;
        const endItem = Math.min(totalItems, paginationState.currentPage * PAGE_SIZE);
        summary.textContent = `${startItem}-${endItem} / 총 ${totalItems}개`;

        const pageButtons = Array.from({ length: totalPages }, (_, index) => {
          const page = index + 1;
          return `
            <button
              class="resource-pagination-btn${page === paginationState.currentPage ? " is-active" : ""}"
              type="button"
              data-resource-page="${page}"
              aria-label="${page}페이지"
              aria-current="${page === paginationState.currentPage ? "page" : "false"}"
            >${page}</button>
          `;
        }).join("");

        controls.innerHTML = `
          <button
            class="resource-pagination-btn"
            type="button"
            data-resource-page-nav="prev"
            ${paginationState.currentPage === 1 ? "disabled" : ""}
            aria-label="이전 페이지"
          >
            <span class="material-icons-round">chevron_left</span>
          </button>
          ${pageButtons}
          <button
            class="resource-pagination-btn"
            type="button"
            data-resource-page-nav="next"
            ${paginationState.currentPage === totalPages ? "disabled" : ""}
            aria-label="다음 페이지"
          >
            <span class="material-icons-round">chevron_right</span>
          </button>
        `;
      };

      const applyPagination = ({ resetPage = false } = {}) => {
        const grid = getResourceGrid();
        if (!grid) return;

        const cards = getResourceCards();
        const activeFilter = getActiveFilter();
        if (resetPage || paginationState.activeFilter !== activeFilter) {
          paginationState.currentPage = 1;
          paginationState.activeFilter = activeFilter;
        }

        const filteredCards = cards.filter((card) => {
          const tags = getCardTags(card);
          return activeFilter === "all" || tags.includes(activeFilter);
        });

        const totalItems = filteredCards.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
        paginationState.currentPage = Math.min(paginationState.currentPage, totalPages);

        const startIndex = (paginationState.currentPage - 1) * PAGE_SIZE;
        const endIndex = startIndex + PAGE_SIZE;
        const visibleCards = new Set(filteredCards.slice(startIndex, endIndex));

        cards.forEach((card) => {
          card.hidden = !visibleCards.has(card);
        });

        const emptyState = getEmptyState();
        if (emptyState) {
          emptyState.classList.toggle("is-visible", totalItems === 0);
        }

        renderPaginationControls(totalItems, totalPages);
      };

      const bindPagination = () => {
        if (window.__keycenterPaginationBound) return;
        window.__keycenterPaginationBound = true;

        document.addEventListener("click", (event) => {
          const filterButton = event.target.closest("[data-resource-filter]");
          if (filterButton) {
            window.setTimeout(() => applyPagination({ resetPage: true }), 0);
            return;
          }

          const pageButton = event.target.closest("[data-resource-page]");
          if (pageButton) {
            const nextPage = Number(pageButton.dataset.resourcePage || 1);
            if (Number.isFinite(nextPage) && nextPage > 0) {
              paginationState.currentPage = nextPage;
              applyPagination();
            }
            return;
          }

          const navButton = event.target.closest("[data-resource-page-nav]");
          if (!navButton) return;

          const totalCards = getResourceCards().filter((card) => {
            const tags = getCardTags(card);
            const activeFilter = getActiveFilter();
            return activeFilter === "all" || tags.includes(activeFilter);
          }).length;
          const totalPages = Math.max(1, Math.ceil(totalCards / PAGE_SIZE));

          if (navButton.dataset.resourcePageNav === "prev" && paginationState.currentPage > 1) {
            paginationState.currentPage -= 1;
          }

          if (navButton.dataset.resourcePageNav === "next" && paginationState.currentPage < totalPages) {
            paginationState.currentPage += 1;
          }

          applyPagination();
        });
      };

      const hookRenderer = () => {
        if (window.__keycenterPaginationHooked) return;
        if (typeof window.renderWorkspaceResourceHub !== "function") {
          window.setTimeout(hookRenderer, 100);
          return;
        }

        window.__keycenterPaginationHooked = true;
        const originalRender = window.renderWorkspaceResourceHub;
        window.renderWorkspaceResourceHub = (config) => {
          lastResolvedConfig = config;
          originalRender(config);
          ensureKeyRoleSwitch();
          syncKeyHeroAction();
          wireKeyCreateAction();
          window.setTimeout(() => applyPagination({ resetPage: true }), 0);
        };
      };

      const fetchPagedItems = async (path) => {
        const items = [];
        const seenCursors = new Set();
        let cursor = "";

        for (;;) {
          const params = new URLSearchParams({ limit: String(PAGE_LIMIT) });
          if (cursor) params.set("cursor", cursor);
          const separator = path.includes("?") ? "&" : "?";
          const payload = getPayloadData(await fetchJson(`${API_BASE}${path}${separator}${params.toString()}`));

          items.push(...toArray(payload.items));

          const nextCursor = String(payload?.page?.nextCursor || "").trim();
          const hasNext = Boolean(payload?.page?.hasNext && nextCursor);
          if (!hasNext || seenCursors.has(nextCursor)) {
            break;
          }

          seenCursors.add(nextCursor);
          cursor = nextCursor;
        }

        return items;
      };

      const buildTierLookup = (tiers) => new Map(toArray(tiers).map((tier) => [tier.id, tier]));

      const deriveFilterItemsFromTiers = (tiers) => [
        { id: "all", label: "전체" },
        ...toArray(tiers).map((tier) => ({
          id: tier.id,
          label: tier.label,
          code: tier.code
        }))
      ];

      const getProviderGradient = (providers, tierCode) => {
        const normalizedProviders = toArray(providers).map((value) => String(value || "").toLowerCase());
        const normalizedTier = String(tierCode || "").toLowerCase();

        if (normalizedProviders.includes("openai")) return "linear-gradient(135deg,#f59e0b,#f97316)";
        if (normalizedProviders.includes("anthropic")) return "linear-gradient(135deg,#2563eb,#60a5fa)";
        if (normalizedProviders.includes("azure")) return "linear-gradient(135deg,#7c3aed,#a78bfa)";
        if (normalizedProviders.includes("internal")) return "linear-gradient(135deg,#0f766e,#34d399)";
        if (normalizedProviders.includes("google")) return "linear-gradient(135deg,#16a34a,#84cc16)";
        if (normalizedTier.includes("free")) return "linear-gradient(135deg,#ef4444,#f97316)";
        return "linear-gradient(135deg,#b45309,#f59e0b)";
      };

      const getDraftTierGradient = (tierId) => {
        const normalizedTier = String(tierId || "").toLowerCase();
        if (normalizedTier.includes("free")) return "linear-gradient(135deg,#ef4444,#f97316)";
        if (normalizedTier.includes("paid")) return "linear-gradient(135deg,#f59e0b,#fbbf24)";
        if (normalizedTier.includes("hw")) return "linear-gradient(135deg,#475569,#60a5fa)";
        if (normalizedTier.includes("aidd")) return "linear-gradient(135deg,#0f766e,#34d399)";
        if (normalizedTier.includes("asf")) return "linear-gradient(135deg,#7c3aed,#a78bfa)";
        if (normalizedTier.includes("dej")) return "linear-gradient(135deg,#b45309,#f59e0b)";
        return "linear-gradient(135deg,#b45309,#f59e0b)";
      };

      const normalizeOwnerDisplay = (owner) => {
        const raw = String(owner || "").trim();
        if (!raw) {
          return {
            name: "Workspace User",
            initials: "WU",
            meta: "owner 정보 없음"
          };
        }

        const shortValue = raw.includes("@")
          ? raw.split("@")[0]
          : raw.split(/[/:]/).filter(Boolean).pop() || raw;
        const compact = String(shortValue || "").trim();
        const looksLikeOpaqueId = compact.length >= 24 && !/[A-Z]/.test(compact) && !compact.includes(".");
        const name = looksLikeOpaqueId ? `User ${compact.slice(0, 8)}` : (toTitleWords(compact) || compact);

        return {
          name,
          initials: getInitials(name),
          meta: raw
        };
      };

      const buildUsageMeta = (usage) => {
        const spend = Number(usage?.spend);
        const limit = Number(usage?.limit);

        if (Number.isFinite(limit)) {
          return `${formatCurrency(spend)} / ${formatCurrency(limit)} budget`;
        }

        return `${formatCurrency(spend)} used · limit 없음`;
      };

      const buildModelTags = (tier, keyItem) => {
        const models = toArray(tier?.availableModels).slice(0, 3);
        if (models.length) {
          return models.map((model) => ({
            icon: "model_training",
            text: model
          }));
        }

        return [
          { icon: "sell", text: keyItem?.tier?.label || "Unknown Tier" },
          { icon: "vpn_key", text: keyItem?.secret || "masked key" }
        ];
      };

      const buildResourceMeta = (keyItem) => {
        const projects = toArray(keyItem?.consumerProjects);
        const summary = projects.length
          ? `${projects.length} connected project${projects.length > 1 ? "s" : ""}`
          : "연결된 project 없음";
        return [keyItem?.accountIdentifier, summary].filter(Boolean).join(" · ");
      };

      const buildKeyResource = (keyItem, tierLookup) => {
        const tier = tierLookup.get(keyItem?.tier?.id) || null;
        const providers = toArray(tier?.providers).length ? toArray(tier.providers) : toArray(keyItem?.providers);
        const color = getProviderGradient(providers, keyItem?.tier?.code);
        const ownerInfo = normalizeOwnerDisplay(keyItem?.owner);
        const modelTags = buildModelTags(tier, keyItem);
        const projects = toArray(keyItem?.consumerProjects);

        return {
          categories: [
            "all",
            keyItem?.tier?.id || "unknown-tier",
            ...providers.map((provider) => normalizeKey(provider)).filter(Boolean)
          ],
          status: {
            label: capitalize(keyItem?.status || "active"),
            tone: String(keyItem?.status || "active").toLowerCase() === "active" ? "healthy" : "review"
          },
          engine: keyItem?.tier?.label || keyItem?.tier?.code || "Tier",
          icon: "vpn_key",
          name: keyItem?.name || keyItem?.accountIdentifier || keyItem?.id || "llm-key",
          meta: buildResourceMeta(keyItem),
          color,
          usage: {
            label: "Usage",
            value: Number(keyItem?.usage?.percent || 0),
            meta: buildUsageMeta(keyItem?.usage),
            color: `linear-gradient(90deg,${color.match(/#(?:[0-9a-fA-F]{3}){1,2}/)?.[0] || "#f59e0b"},#fbbf24)`
          },
          details: [
            { icon: "model_training", text: `Models ${toArray(tier?.availableModels).length}` },
            { icon: "link", text: `Bound Surfaces ${projects.length}` }
          ],
          owner: {
            label: "Owner",
            initials: ownerInfo.initials,
            name: ownerInfo.name,
            meta: ownerInfo.meta,
            color
          },
          connections: projects.map((project) => ({
            name: project?.name || project?.id || "project",
            meta: "Connected project",
            _type: "project"
          })),
          tagsLabel: "Allowed Models",
          tags: modelTags,
          footer: keyItem?.updatedAt ? `Updated ${formatShortDate(keyItem.updatedAt)}` : "",
          actions: [
            {
              label: "Open",
              icon: "open_in_new",
              kind: "open",
              href: `workspace_keycenter_detail.html?id=${encodeURIComponent(keyItem?.id || "")}`
            }
          ]
        };
      };

      const buildKeyDraftRecord = () => ({
        id: `draft-${normalizeKey(keyCreateState.name || "key")}-${Date.now()}`,
        name: keyCreateState.name,
        owner: keyCreateState.owner,
        tierId: keyCreateState.tierId,
        createdAt: new Date().toISOString()
      });

      const buildStoredKeyResource = (item) => {
        const tierMeta = getKeyTierMeta(item?.tierId);
        const ownerInfo = normalizeOwnerDisplay(item?.owner);
        const color = getDraftTierGradient(item?.tierId);
        return {
          _draftStored: true,
          categories: ["all", tierMeta.id],
          status: { label: "Draft", tone: "draft" },
          engine: tierMeta.title,
          icon: "vpn_key",
          name: item?.name || "new-key",
          meta: `${ownerInfo.name} · 발급 요청 준비 중`,
          color,
          usage: {
            label: "Usage",
            value: 0,
            meta: "아직 사용량이 없습니다.",
            color: `linear-gradient(90deg,${color.match(/#(?:[0-9a-fA-F]{3}){1,2}/)?.[0] || "#f59e0b"},#fbbf24)`
          },
          details: [
            { icon: "sell", text: tierMeta.title },
            { icon: "person", text: ownerInfo.name }
          ],
          owner: {
            label: "Owner",
            initials: ownerInfo.initials,
            name: ownerInfo.name,
            meta: ownerInfo.meta,
            color
          },
          tagsLabel: "Tier Summary",
          tags: [
            { icon: "info", text: tierMeta.description },
            { icon: "schedule", text: "발급 전 검토 필요" }
          ],
          footer: item?.createdAt ? `Requested ${formatShortDate(item.createdAt)}` : "",
          actions: []
        };
      };

      const mergeStoredResources = (config) => ({
        ...config,
        resources: [
          ...parseStoredKeys().map(buildStoredKeyResource),
          ...toArray(config?.resources).filter((item) => !item?._draftStored)
        ]
      });

      const syncKeyHeroAction = () => {
        const button = document.querySelector(".hero-actions .hero-btn.primary");
        if (!button) return;
        const roleMeta = getKeyRoleMeta();
        const icon = button.querySelector(".material-icons-round");
        if (icon) icon.textContent = "vpn_key";
        button.setAttribute("href", "#key-create");
        button.dataset.keyRole = roleMeta.id;
        const currentLabel = button.textContent.trim();
        if (currentLabel !== roleMeta.heroLabel) {
          button.innerHTML = `<span class="material-icons-round">vpn_key</span>${roleMeta.heroLabel}`;
        }
      };

      const syncKeyRoleSwitch = () => {
        const switcher = document.getElementById("keyRoleSwitch");
        if (!switcher) return;
        switcher.querySelectorAll("[data-key-role]").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.keyRole === keyRoleState.current);
        });
      };

      const ensureKeyRoleSwitch = () => {
        const app = document.body;
        if (!app) return;

        let switcher = document.getElementById("keyRoleSwitch");
        if (!switcher) {
          switcher = document.createElement("div");
          switcher.id = "keyRoleSwitch";
          switcher.className = "key-role-switch is-floating";
          switcher.innerHTML = `
            <button class="key-role-switch-btn" type="button" data-key-role="user">
              <span class="material-icons-round">person</span>일반 사용자
            </button>
            <button class="key-role-switch-btn" type="button" data-key-role="admin">
              <span class="material-icons-round">admin_panel_settings</span>Admin
            </button>
          `;
          app.appendChild(switcher);
          switcher.addEventListener("click", (event) => {
            const button = event.target.closest("[data-key-role]");
            if (!button) return;
            const nextRole = button.dataset.keyRole === "admin" ? "admin" : "user";
            if (nextRole === keyRoleState.current) return;
            keyRoleState.current = nextRole;
            syncKeyRoleSwitch();
            syncKeyHeroAction();
            syncKeyModalRole();
          });
        }

        if (switcher.parentElement !== app) {
          app.appendChild(switcher);
        }

        syncKeyRoleSwitch();
      };

      const mountKeyFloatingControls = () => {
        ensureKeyRoleSwitch();
        syncKeyHeroAction();
      };

      const ensureKeyCreateModal = () => {
        let modal = document.getElementById("keyCreateModal");
        if (modal) return modal;

        modal = document.createElement("div");
        modal.className = "hub-lite-create-backdrop";
        modal.id = "keyCreateModal";
        modal.hidden = true;
        modal.innerHTML = `
          <div class="hub-lite-create-shell" role="dialog" aria-modal="true" aria-labelledby="keyCreateTitle">
            <div class="hub-lite-create-head">
              <div class="hub-lite-create-copy">
                <div class="hub-lite-create-title-row">
                  <span class="hub-lite-create-step-badge" id="keyCreateStepBadge">1</span>
                  <h2 id="keyCreateTitle">새 Key 발급 요청을 등록합니다</h2>
                </div>
                <p class="hub-lite-create-subtitle" id="keyCreateSubtitle">먼저 key 이름을 입력해주세요. 소유자는 현재 사용자로 고정됩니다.</p>
              </div>
              <div class="hub-lite-create-head-actions">
                <div class="hub-lite-create-hero" aria-hidden="true"><span class="material-icons-round">vpn_key</span></div>
                <button class="hub-lite-create-close" type="button" id="keyCreateClose" aria-label="Key 생성 닫기">
                  <span class="material-icons-round">close</span>
                </button>
              </div>
            </div>
            <div class="hub-lite-create-progress">
              <div class="hub-lite-create-progress-track key-create-progress-track" id="keyCreateProgress"></div>
            </div>
            <form class="hub-lite-create-form" id="keyCreateForm">
              <section class="key-create-stage" data-key-create-step="1">
                <div class="hub-lite-create-panel">
                  <div class="hub-lite-create-panel-title" id="keyCreatePanelTitle">Key 요청 정보를 입력해주세요.</div>
                  <div class="key-create-mode-note" id="keyCreateModeNote">
                    <span class="material-icons-round">lock</span>일반 사용자는 Key 발급 요청만 할 수 있고 소유자를 변경할 수 없습니다.
                  </div>
                  <div class="key-create-field-grid">
                    <div class="key-create-field">
                      <label for="keyCreateName">Key 이름</label>
                      <input class="hub-lite-create-input" id="keyCreateName" type="text" placeholder="예: workspace-rag-prod-key" required />
                    </div>
                    <div class="key-create-field">
                      <label for="keyCreateOwner">소유자</label>
                      <input class="hub-lite-create-input" id="keyCreateOwner" type="text" placeholder="현재 로그인 사용자" required />
                    </div>
                  </div>
                  <div class="hub-lite-create-note" id="keyCreateOwnerNote"><span class="material-icons-round">info</span>소유자는 현재 로그인 사용자로 자동 지정됩니다.</div>
                </div>
              </section>
              <section class="key-create-stage is-wide" data-key-create-step="2" hidden>
                <div class="hub-lite-create-panel">
                  <div class="hub-lite-create-panel-title">Key Tier를 선택해주세요.</div>
                  <div class="key-create-tier-summary" id="keyCreateSummary"></div>
                  <div class="key-create-tier-grid" id="keyCreateTierGrid"></div>
                </div>
              </section>
              <div class="hub-lite-create-actions">
                <button class="hub-lite-create-action ghost" type="button" id="keyCreateBack">취소</button>
                <button class="hub-lite-create-action primary" type="button" id="keyCreateNext">다음</button>
                <button class="hub-lite-create-action primary" type="submit" id="keyCreateSubmit" hidden disabled><span class="material-icons-round">check_circle</span>Key 발급 요청</button>
              </div>
            </form>
          </div>
        `;

        document.body.appendChild(modal);

        const form = modal.querySelector("#keyCreateForm");
        const stepBadge = modal.querySelector("#keyCreateStepBadge");
        const title = modal.querySelector("#keyCreateTitle");
        const subtitle = modal.querySelector("#keyCreateSubtitle");
        const progress = modal.querySelector("#keyCreateProgress");
        const stages = Array.from(modal.querySelectorAll("[data-key-create-step]"));
        const nameInput = modal.querySelector("#keyCreateName");
        const ownerInput = modal.querySelector("#keyCreateOwner");
        const panelTitle = modal.querySelector("#keyCreatePanelTitle");
        const modeNote = modal.querySelector("#keyCreateModeNote");
        const ownerNote = modal.querySelector("#keyCreateOwnerNote");
        const summary = modal.querySelector("#keyCreateSummary");
        const tierGrid = modal.querySelector("#keyCreateTierGrid");
        const back = modal.querySelector("#keyCreateBack");
        const next = modal.querySelector("#keyCreateNext");
        const submit = modal.querySelector("#keyCreateSubmit");
        const stepMeta = [
          { label: "기본 정보", getSubtitle: () => getKeyRoleMeta().stepOneSubtitle },
          { label: "Key Tier", getSubtitle: () => getKeyRoleMeta().stepTwoSubtitle }
        ];

        const syncRolePresentation = () => {
          const roleMeta = getKeyRoleMeta();
          title.textContent = roleMeta.modalTitle;
          panelTitle.textContent = roleMeta.stepOneTitle;
          modeNote.innerHTML = `<span class="material-icons-round">${roleMeta.ownerLocked ? "lock" : "tune"}</span>${roleMeta.modeHint}`;
          ownerInput.disabled = roleMeta.ownerLocked;
          ownerInput.readOnly = roleMeta.ownerLocked;
          ownerInput.placeholder = roleMeta.ownerLocked ? roleMeta.ownerValue : "예: Taehun Nam 또는 Support Platform";
          ownerNote.innerHTML = roleMeta.ownerLocked
            ? '<span class="material-icons-round">info</span>소유자는 현재 로그인 사용자로 자동 지정됩니다.'
            : '<span class="material-icons-round">info</span>Admin은 실제 사용자, 팀, 혹은 운영 조직 이름으로 소유자를 직접 지정할 수 있습니다.';
          if (roleMeta.ownerLocked) {
            keyCreateState.owner = roleMeta.ownerValue;
            ownerInput.value = roleMeta.ownerValue;
          } else {
            ownerInput.value = keyCreateState.owner;
          }
          submit.innerHTML = `<span class="material-icons-round">check_circle</span>${roleMeta.submitLabel}`;
        };

        const renderProgress = () => {
          progress.innerHTML = stepMeta.map((item, index) => {
            const step = index + 1;
            const isCurrent = step === keyCreateState.step;
            const isComplete = step < keyCreateState.step;
            const value = step === 1
              ? [keyCreateState.name, keyCreateState.owner].filter(Boolean).join(" · ")
              : getKeyTierMeta(keyCreateState.tierId).title;
            return `
              <div class="hub-lite-create-progress-item ${isCurrent ? "is-current" : ""} ${isComplete ? "is-complete" : ""}">
                <div class="hub-lite-create-progress-line">
                  <span class="hub-lite-create-progress-rail ${index === 0 ? "is-hidden" : ""}"></span>
                  <span class="hub-lite-create-progress-dot">${isComplete ? '<span class="material-icons-round" style="font-size:15px">done</span>' : step}</span>
                  <span class="hub-lite-create-progress-rail ${index === stepMeta.length - 1 ? "is-hidden" : ""}"></span>
                </div>
                <div class="hub-lite-create-progress-label">${item.label}</div>
                <div class="hub-lite-create-progress-value">${value || " "}</div>
              </div>
            `;
          }).join("");
        };

        const renderSummary = () => {
          const tierMeta = getKeyTierMeta(keyCreateState.tierId);
          summary.innerHTML = `
            <div class="key-create-tier-summary-line">
              <div class="key-create-tier-summary-title">${keyCreateState.name || "새 Key"} · ${keyCreateState.owner || "소유자 미지정"}</div>
              <div class="key-create-tier-summary-meta">${tierMeta.title}</div>
            </div>
            <div class="key-create-tier-summary-meta">${tierMeta.description}</div>
          `;
        };

        const renderTierGrid = () => {
          tierGrid.innerHTML = KEY_TIER_OPTIONS.map((item) => `
            <button class="key-create-tier-card ${keyCreateState.tierId === item.id ? "is-selected" : ""}" type="button" data-key-tier="${item.id}">
              <div class="key-create-tier-head">
                <span class="key-create-tier-icon" aria-hidden="true"><span class="material-icons-round">${item.icon}</span></span>
                <span class="key-create-tier-radio" aria-hidden="true"></span>
              </div>
              <div class="key-create-tier-title">${item.title}</div>
              <div class="key-create-tier-meta">${item.description}</div>
            </button>
          `).join("");
        };

        const renderStages = () => {
          stages.forEach((stage) => {
            stage.hidden = Number(stage.dataset.keyCreateStep) !== keyCreateState.step;
          });
        };

        const syncHeader = () => {
          const meta = stepMeta[keyCreateState.step - 1];
          stepBadge.textContent = String(keyCreateState.step);
          subtitle.textContent = meta.getSubtitle();
        };

        const syncActions = () => {
          const canAdvance = Boolean(keyCreateState.name.trim() && keyCreateState.owner.trim());
          const roleMeta = getKeyRoleMeta();
          back.textContent = keyCreateState.step === 1 ? "취소" : "뒤로";
          next.hidden = keyCreateState.step === 2;
          submit.hidden = keyCreateState.step !== 2;
          next.disabled = !canAdvance;
          submit.disabled = !(canAdvance && keyCreateState.tierId);
          submit.innerHTML = `<span class="material-icons-round">check_circle</span>${roleMeta.submitLabel}`;
        };

        const rerender = () => {
          syncRolePresentation();
          syncHeader();
          renderProgress();
          renderSummary();
          renderTierGrid();
          renderStages();
          syncActions();
        };

        const close = () => {
          modal.hidden = true;
          document.body.style.overflow = "";
          resetKeyCreateState();
          form.reset();
          if (window.location.hash === "#key-create") {
            window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
          }
          rerender();
        };

        modal.addEventListener("click", (event) => {
          if (event.target === modal) close();
        });

        modal.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !modal.hidden) close();
        });

        modal.querySelector("#keyCreateClose").addEventListener("click", close);

        nameInput.addEventListener("input", () => {
          keyCreateState.name = String(nameInput.value || "").trim();
          renderProgress();
          renderSummary();
          syncActions();
        });

        ownerInput.addEventListener("input", () => {
          if (getKeyRoleMeta().ownerLocked) return;
          keyCreateState.owner = String(ownerInput.value || "").trim();
          renderProgress();
          renderSummary();
          syncActions();
        });

        tierGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-key-tier]");
          if (!button) return;
          keyCreateState.tierId = button.dataset.keyTier || KEY_TIER_OPTIONS[0].id;
          renderProgress();
          renderSummary();
          renderTierGrid();
          syncActions();
        });

        back.addEventListener("click", () => {
          if (keyCreateState.step === 1) {
            close();
            return;
          }
          keyCreateState.step = 1;
          rerender();
        });

        next.addEventListener("click", () => {
          if (!(keyCreateState.name.trim() && keyCreateState.owner.trim())) return;
          keyCreateState.step = 2;
          rerender();
          requestAnimationFrame(() => {
            modal.querySelector("[data-key-tier]")?.focus();
          });
        });

        form.addEventListener("submit", (event) => {
          event.preventDefault();
          if (!(keyCreateState.name.trim() && keyCreateState.owner.trim() && keyCreateState.tierId)) {
            syncActions();
            return;
          }
          saveStoredKeys([buildKeyDraftRecord(), ...parseStoredKeys()]);
          close();
          if (typeof window.renderWorkspaceResourceHub === "function") {
            window.renderWorkspaceResourceHub(mergeStoredResources(lastResolvedConfig));
          }
        });

        modal.__rerenderKeyCreate = rerender;
        rerender();
        return modal;
      };

      const syncKeyModalRole = () => {
        const modal = document.getElementById("keyCreateModal");
        if (!modal || typeof modal.__rerenderKeyCreate !== "function") return;
        if (getKeyRoleMeta().ownerLocked) {
          keyCreateState.owner = getKeyRoleMeta().ownerValue;
        } else if (keyCreateState.owner === KEY_ROLE_OPTIONS.user.ownerValue) {
          keyCreateState.owner = "";
        }
        modal.__rerenderKeyCreate();
      };

      const openKeyCreateModal = () => {
        resetKeyCreateState();
        const modal = ensureKeyCreateModal();
        modal.hidden = false;
        document.body.style.overflow = "hidden";
        requestAnimationFrame(() => {
          modal.querySelector("#keyCreateName")?.focus();
        });
      };

      const wireKeyCreateAction = () => {
        const button = document.querySelector(".hero-actions .hero-btn.primary");
        if (!button || button.dataset.keyCreateBound === "true") return;
        button.dataset.keyCreateBound = "true";
        button.addEventListener("click", (event) => {
          event.preventDefault();
          openKeyCreateModal();
        });
      };

      const wireKeyCreateHash = () => {
        if (window.__keyCreateHashBound) return;
        window.__keyCreateHashBound = true;

        window.addEventListener("hashchange", () => {
          if (window.location.hash === "#key-create") {
            openKeyCreateModal();
          }
        });

        if (window.location.hash === "#key-create") {
          openKeyCreateModal();
        }
      };

      const bootstrap = async () => {
        const [statsResult, filtersResult, tiersResult, keysResult] = await Promise.allSettled([
          fetchJson(`${API_BASE}/tiers/stats`),
          fetchJson(`${API_BASE}/tiers/filters`),
          fetchPagedItems("/tiers"),
          fetchPagedItems("/keys")
        ]);

        const nextConfig = {
          ...fallbackConfig
        };

        if (statsResult.status === "fulfilled") {
          nextConfig.heroStats = buildHeroStats(getPayloadData(statsResult.value));
        }

        const tierItems = tiersResult.status === "fulfilled" ? toArray(tiersResult.value) : [];
        const tierLookup = buildTierLookup(tierItems);
        const filterItems = filtersResult.status === "fulfilled"
          ? toArray(getPayloadData(filtersResult.value).items)
          : deriveFilterItemsFromTiers(tierItems);

        if (filterItems.length) {
          nextConfig.filters = buildFilters(filterItems);
        }

        if (keysResult.status === "fulfilled") {
          const keyItems = toArray(keysResult.value);
          nextConfig.resources = keyItems.map((item) => buildKeyResource(item, tierLookup));
        } else if (filterItems.length) {
          nextConfig.resources = applyFilterCategories(fallbackConfig.resources, filterItems);
        }

        window.HUB_CONFIG = mergeStoredResources(nextConfig);
        if (typeof window.renderWorkspaceResourceHub === "function") {
          window.renderWorkspaceResourceHub(window.HUB_CONFIG);
          window.setTimeout(mountKeyFloatingControls, 0);
        }
      };

      bindPagination();
      hookRenderer();
      window.setTimeout(mountKeyFloatingControls, 0);
      wireKeyCreateHash();
      window.setTimeout(() => applyPagination({ resetPage: true }), 0);

      bootstrap().catch((error) => {
        console.warn("Failed to load /api/v2/keycenter hub stats/filters", error);
      });
    })();
  </script>
  <script src="ax_studio_topbar.js"></script>
  <script src="concept_endpoint_overlay.js"></script>
</body>
</html>
