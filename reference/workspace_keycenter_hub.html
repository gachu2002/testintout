  <script>
    (() => {
      const API_BASE = "/api/v2/keycenter";
      const fallbackConfig = window.HUB_CONFIG || {};
      const PAGE_LIMIT = 100;
      const PAGE_SIZE = 6;
      const HERO_GRADIENTS = [
        "linear-gradient(135deg,#f59e0b,#f97316)",
        "linear-gradient(135deg,#d97706,#f59e0b)",
        "linear-gradient(135deg,#ea580c,#fb923c)",
        "linear-gradient(135deg,#f59e0b,#fbbf24)",
        "linear-gradient(135deg,#b45309,#f59e0b)"
      ];
      const paginationState = {
        currentPage: 1,
        activeFilter: "all"
      };

      const normalizeKey = (value) => String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "");

      const toArray = (value) => Array.isArray(value) ? value : [];
      const getPayloadData = (payload) => (
        payload && typeof payload === "object" && !Array.isArray(payload) && payload.data && typeof payload.data === "object"
          ? payload.data
          : (payload && typeof payload === "object" && !Array.isArray(payload) ? payload : {})
      );

      const formatCompactNumber = (value) => {
        const number = Number(value);
        if (!Number.isFinite(number)) return "0";
        return new Intl.NumberFormat("en-US", {
          notation: "compact",
          maximumFractionDigits: number >= 100 ? 0 : 1
        }).format(number);
      };

      const formatCurrency = (value) => {
        const number = Number(value);
        if (!Number.isFinite(number)) return "$0.00";
        return new Intl.NumberFormat("en-US", {
          style: "currency",
          currency: "USD",
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }).format(number);
      };

      const formatShortDate = (value) => {
        const normalized = String(value || "").trim();
        if (!normalized) return "";
        return normalized.slice(0, 10);
      };

      const capitalize = (value) => {
        const normalized = String(value || "").trim();
        if (!normalized) return "";
        return normalized.charAt(0).toUpperCase() + normalized.slice(1);
      };

      const toTitleWords = (value) => String(value || "")
        .split(/[\s._:/-]+/)
        .filter(Boolean)
        .map((part) => capitalize(part.toLowerCase()))
        .join(" ");

      const getInitials = (value) => String(value || "")
        .trim()
        .split(/\s+/)
        .filter(Boolean)
        .map((part) => part[0] || "")
        .join("")
        .slice(0, 2)
        .toUpperCase() || "KC";

      const buildHeroStats = (statsPayload) => {
        const period = statsPayload?.period || {};
        const stats = statsPayload?.stats || {};
        const startDate = String(period.startDate || "").trim();
        const endDate = String(period.endDate || "").trim();
        const periodLabel = startDate && endDate ? `${startDate} ~ ${endDate}` : "최근 집계 기준";
        const requestedDays = Math.max(1, Number(fallbackConfig.defaultStatsDays || 7));

        return [
          {
            icon: "vpn_key",
            value: formatCompactNumber(stats.issuedKeys),
            label: "Issued Keys",
            note: "접근 가능한 key 기준",
            color: HERO_GRADIENTS[0]
          },
          {
            icon: "query_stats",
            value: formatCompactNumber(stats.requestCount),
            label: `Requests (${requestedDays}d)`,
            note: periodLabel,
            color: HERO_GRADIENTS[1]
          },
          {
            icon: "token",
            value: formatCompactNumber(stats.totalTokens),
            label: `Tokens (${requestedDays}d)`,
            note: "input · output · cache 포함",
            color: HERO_GRADIENTS[2]
          },
          {
            icon: "paid",
            value: formatCurrency(stats.usageCost),
            label: `Usage Cost (${requestedDays}d)`,
            note: "LiteLLM aggregate spend",
            color: HERO_GRADIENTS[3]
          }
        ];
      };

      const inferFilterIcon = (item) => {
        const candidates = [
          normalizeKey(item?.code),
          normalizeKey(item?.label),
          normalizeKey(item?.id)
        ].filter(Boolean);

        if (candidates.some((value) => value.includes("free"))) return "auto_awesome";
        if (candidates.some((value) => value.includes("paid"))) return "paid";
        if (candidates.some((value) => value.includes("dej"))) return "apartment";
        if (candidates.some((value) => value.includes("asf"))) return "apartment";
        if (candidates.some((value) => value.includes("deposit"))) return "savings";
        if (candidates.some((value) => value.includes("playground"))) return "stadia_controller";
        if (candidates.some((value) => value.includes("review"))) return "fact_check";
        return "vpn_key";
      };

      const buildFilters = (filterItems) => toArray(filterItems).map((item, index) => ({
        id: item?.id || (index === 0 ? "all" : `tier-${index}`),
        icon: inferFilterIcon(item),
        label: item?.label || item?.code || item?.id || `Tier ${index + 1}`
      }));

      const resourceSignals = (resource) => {
        const tags = toArray(resource?.tags).map((tag) => tag?.text || "");
        const detailTexts = toArray(resource?.details).map((detail) => detail?.text || "");
        return [
          resource?.engine,
          resource?.name,
          resource?.meta,
          ...tags,
          ...detailTexts
        ]
          .map((value) => normalizeKey(value))
          .filter(Boolean);
      };

      const findMatchingTierIds = (resource, filterItems) => {
        const signals = resourceSignals(resource);
        return toArray(filterItems)
          .filter((item) => item?.id && item.id !== "all")
          .filter((item) => {
            const aliases = [
              normalizeKey(item?.id).replace(/-tier$/g, ""),
              normalizeKey(item?.code),
              normalizeKey(item?.label)
            ]
              .flatMap((value) => [value, ...String(value || "").split("-")])
              .filter((value) => value && value.length >= 3);

            return aliases.some((alias) => signals.some((signal) => signal === alias || signal.includes(alias) || alias.includes(signal)));
          })
          .map((item) => item.id);
      };

      const applyFilterCategories = (resources, filterItems) => toArray(resources).map((resource) => {
        const categories = new Set(["all", ...toArray(resource?.categories)]);
        findMatchingTierIds(resource, filterItems).forEach((filterId) => categories.add(filterId));
        return {
          ...resource,
          categories: Array.from(categories)
        };
      });

      const fetchJson = async (url) => {
        const response = await fetch(url, {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            Accept: "application/json"
          }
        });

        if (!response.ok) {
          throw new Error(`Request failed: ${response.status} ${response.statusText}`);
        }

        return response.json();
      };

      const getResourcePanel = () => document.getElementById("resource-panel");
      const getResourceGrid = () => document.getElementById("resourceGrid");
      const getResourceCards = () => Array.from(document.querySelectorAll("[data-resource-card]"));
      const getEmptyState = () => document.getElementById("resourceEmptyState");
      const getActiveFilter = () => {
        const activeTab = document.querySelector("[data-resource-filter].is-active");
        return activeTab?.dataset?.resourceFilter || "all";
      };
      const getCardTags = (card) => String(card?.dataset?.resourceTags || "")
        .split(/\s+/)
        .filter(Boolean);

      const ensurePagination = () => {
        const panel = getResourcePanel();
        const emptyState = getEmptyState();
        if (!panel || !emptyState) return null;

        let pagination = document.getElementById("keycenterFleetPagination");
        if (pagination) return pagination;

        pagination = document.createElement("nav");
        pagination.id = "keycenterFleetPagination";
        pagination.className = "resource-pagination";
        pagination.hidden = true;
        pagination.setAttribute("aria-label", "LLM Keys pagination");
        pagination.innerHTML = `
          <div class="resource-pagination-summary" id="keycenterFleetPaginationSummary"></div>
          <div class="resource-pagination-controls" id="keycenterFleetPaginationControls"></div>
        `;
        emptyState.insertAdjacentElement("afterend", pagination);
        return pagination;
      };

      const renderPaginationControls = (totalItems, totalPages) => {
        const pagination = ensurePagination();
        if (!pagination) return;

        const summary = document.getElementById("keycenterFleetPaginationSummary");
        const controls = document.getElementById("keycenterFleetPaginationControls");
        if (!summary || !controls) return;

        if (totalItems <= PAGE_SIZE) {
          pagination.hidden = true;
          controls.innerHTML = "";
          summary.textContent = totalItems ? `총 ${totalItems}개` : "";
          return;
        }

        pagination.hidden = false;
        const startItem = (paginationState.currentPage - 1) * PAGE_SIZE + 1;
        const endItem = Math.min(totalItems, paginationState.currentPage * PAGE_SIZE);
        summary.textContent = `${startItem}-${endItem} / 총 ${totalItems}개`;

        const pageButtons = Array.from({ length: totalPages }, (_, index) => {
          const page = index + 1;
          return `
            <button
              class="resource-pagination-btn${page === paginationState.currentPage ? " is-active" : ""}"
              type="button"
              data-resource-page="${page}"
              aria-label="${page}페이지"
              aria-current="${page === paginationState.currentPage ? "page" : "false"}"
            >${page}</button>
          `;
        }).join("");

        controls.innerHTML = `
          <button
            class="resource-pagination-btn"
            type="button"
            data-resource-page-nav="prev"
            ${paginationState.currentPage === 1 ? "disabled" : ""}
            aria-label="이전 페이지"
          >
            <span class="material-icons-round">chevron_left</span>
          </button>
          ${pageButtons}
          <button
            class="resource-pagination-btn"
            type="button"
            data-resource-page-nav="next"
            ${paginationState.currentPage === totalPages ? "disabled" : ""}
            aria-label="다음 페이지"
          >
            <span class="material-icons-round">chevron_right</span>
          </button>
        `;
      };

      const applyPagination = ({ resetPage = false } = {}) => {
        const grid = getResourceGrid();
        if (!grid) return;

        const cards = getResourceCards();
        const activeFilter = getActiveFilter();
        if (resetPage || paginationState.activeFilter !== activeFilter) {
          paginationState.currentPage = 1;
          paginationState.activeFilter = activeFilter;
        }

        const filteredCards = cards.filter((card) => {
          const tags = getCardTags(card);
          return activeFilter === "all" || tags.includes(activeFilter);
        });

        const totalItems = filteredCards.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
        paginationState.currentPage = Math.min(paginationState.currentPage, totalPages);

        const startIndex = (paginationState.currentPage - 1) * PAGE_SIZE;
        const endIndex = startIndex + PAGE_SIZE;
        const visibleCards = new Set(filteredCards.slice(startIndex, endIndex));

        cards.forEach((card) => {
          card.hidden = !visibleCards.has(card);
        });

        const emptyState = getEmptyState();
        if (emptyState) {
          emptyState.classList.toggle("is-visible", totalItems === 0);
        }

        renderPaginationControls(totalItems, totalPages);
      };

      const bindPagination = () => {
        if (window.__keycenterPaginationBound) return;
        window.__keycenterPaginationBound = true;

        document.addEventListener("click", (event) => {
          const filterButton = event.target.closest("[data-resource-filter]");
          if (filterButton) {
            window.setTimeout(() => applyPagination({ resetPage: true }), 0);
            return;
          }

          const pageButton = event.target.closest("[data-resource-page]");
          if (pageButton) {
            const nextPage = Number(pageButton.dataset.resourcePage || 1);
            if (Number.isFinite(nextPage) && nextPage > 0) {
              paginationState.currentPage = nextPage;
              applyPagination();
            }
            return;
          }

          const navButton = event.target.closest("[data-resource-page-nav]");
          if (!navButton) return;

          const totalCards = getResourceCards().filter((card) => {
            const tags = getCardTags(card);
            const activeFilter = getActiveFilter();
            return activeFilter === "all" || tags.includes(activeFilter);
          }).length;
          const totalPages = Math.max(1, Math.ceil(totalCards / PAGE_SIZE));

          if (navButton.dataset.resourcePageNav === "prev" && paginationState.currentPage > 1) {
            paginationState.currentPage -= 1;
          }

          if (navButton.dataset.resourcePageNav === "next" && paginationState.currentPage < totalPages) {
            paginationState.currentPage += 1;
          }

          applyPagination();
        });
      };

      const hookRenderer = () => {
        if (window.__keycenterPaginationHooked) return;
        if (typeof window.renderWorkspaceResourceHub !== "function") {
          window.setTimeout(hookRenderer, 100);
          return;
        }

        window.__keycenterPaginationHooked = true;
        const originalRender = window.renderWorkspaceResourceHub;
        window.renderWorkspaceResourceHub = (config) => {
          originalRender(config);
          window.setTimeout(() => applyPagination({ resetPage: true }), 0);
        };
      };

      const fetchPagedItems = async (path) => {
        const items = [];
        const seenCursors = new Set();
        let cursor = "";

        for (;;) {
          const params = new URLSearchParams({ limit: String(PAGE_LIMIT) });
          if (cursor) params.set("cursor", cursor);
          const separator = path.includes("?") ? "&" : "?";
          const payload = getPayloadData(await fetchJson(`${API_BASE}${path}${separator}${params.toString()}`));

          items.push(...toArray(payload.items));

          const nextCursor = String(payload?.page?.nextCursor || "").trim();
          const hasNext = Boolean(payload?.page?.hasNext && nextCursor);
          if (!hasNext || seenCursors.has(nextCursor)) {
            break;
          }

          seenCursors.add(nextCursor);
          cursor = nextCursor;
        }

        return items;
      };

      const buildTierLookup = (tiers) => new Map(toArray(tiers).map((tier) => [tier.id, tier]));

      const deriveFilterItemsFromTiers = (tiers) => [
        { id: "all", label: "전체" },
        ...toArray(tiers).map((tier) => ({
          id: tier.id,
          label: tier.label,
          code: tier.code
        }))
      ];

      const getProviderGradient = (providers, tierCode) => {
        const normalizedProviders = toArray(providers).map((value) => String(value || "").toLowerCase());
        const normalizedTier = String(tierCode || "").toLowerCase();

        if (normalizedProviders.includes("openai")) return "linear-gradient(135deg,#f59e0b,#f97316)";
        if (normalizedProviders.includes("anthropic")) return "linear-gradient(135deg,#2563eb,#60a5fa)";
        if (normalizedProviders.includes("azure")) return "linear-gradient(135deg,#7c3aed,#a78bfa)";
        if (normalizedProviders.includes("internal")) return "linear-gradient(135deg,#0f766e,#34d399)";
        if (normalizedProviders.includes("google")) return "linear-gradient(135deg,#16a34a,#84cc16)";
        if (normalizedTier.includes("free")) return "linear-gradient(135deg,#ef4444,#f97316)";
        return "linear-gradient(135deg,#b45309,#f59e0b)";
      };

      const normalizeOwnerDisplay = (owner) => {
        const raw = String(owner || "").trim();
        if (!raw) {
          return {
            name: "Workspace User",
            initials: "WU",
            meta: "owner 정보 없음"
          };
        }

        const shortValue = raw.includes("@")
          ? raw.split("@")[0]
          : raw.split(/[/:]/).filter(Boolean).pop() || raw;
        const compact = String(shortValue || "").trim();
        const looksLikeOpaqueId = compact.length >= 24 && !/[A-Z]/.test(compact) && !compact.includes(".");
        const name = looksLikeOpaqueId ? `User ${compact.slice(0, 8)}` : (toTitleWords(compact) || compact);

        return {
          name,
          initials: getInitials(name),
          meta: raw
        };
      };

      const buildUsageMeta = (usage) => {
        const spend = Number(usage?.spend);
        const limit = Number(usage?.limit);

        if (Number.isFinite(limit)) {
          return `${formatCurrency(spend)} / ${formatCurrency(limit)} budget`;
        }

        return `${formatCurrency(spend)} used · limit 없음`;
      };

      const buildModelTags = (tier, keyItem) => {
        const models = toArray(tier?.availableModels).slice(0, 3);
        if (models.length) {
          return models.map((model) => ({
            icon: "model_training",
            text: model
          }));
        }

        return [
          { icon: "sell", text: keyItem?.tier?.label || "Unknown Tier" },
          { icon: "vpn_key", text: keyItem?.secret || "masked key" }
        ];
      };

      const buildResourceMeta = (keyItem) => {
        const projects = toArray(keyItem?.consumerProjects);
        const summary = projects.length
          ? `${projects.length} connected project${projects.length > 1 ? "s" : ""}`
          : "연결된 project 없음";
        return [keyItem?.accountIdentifier, summary].filter(Boolean).join(" · ");
      };

      const buildKeyResource = (keyItem, tierLookup) => {
        const tier = tierLookup.get(keyItem?.tier?.id) || null;
        const providers = toArray(tier?.providers).length ? toArray(tier.providers) : toArray(keyItem?.providers);
        const color = getProviderGradient(providers, keyItem?.tier?.code);
        const ownerInfo = normalizeOwnerDisplay(keyItem?.owner);
        const modelTags = buildModelTags(tier, keyItem);
        const projects = toArray(keyItem?.consumerProjects);

        return {
          categories: [
            "all",
            keyItem?.tier?.id || "unknown-tier",
            ...providers.map((provider) => normalizeKey(provider)).filter(Boolean)
          ],
          status: {
            label: capitalize(keyItem?.status || "active"),
            tone: String(keyItem?.status || "active").toLowerCase() === "active" ? "healthy" : "review"
          },
          engine: keyItem?.tier?.label || keyItem?.tier?.code || "Tier",
          icon: "vpn_key",
          name: keyItem?.name || keyItem?.accountIdentifier || keyItem?.id || "llm-key",
          meta: buildResourceMeta(keyItem),
          color,
          usage: {
            label: "Usage",
            value: Number(keyItem?.usage?.percent || 0),
            meta: buildUsageMeta(keyItem?.usage),
            color: `linear-gradient(90deg,${color.match(/#(?:[0-9a-fA-F]{3}){1,2}/)?.[0] || "#f59e0b"},#fbbf24)`
          },
          details: [
            { icon: "model_training", text: `Models ${toArray(tier?.availableModels).length}` },
            { icon: "link", text: `Bound Surfaces ${projects.length}` }
          ],
          owner: {
            label: "Owner",
            initials: ownerInfo.initials,
            name: ownerInfo.name,
            meta: ownerInfo.meta,
            color
          },
          connections: projects.map((project) => ({
            name: project?.name || project?.id || "project",
            meta: "Connected project",
            _type: "project"
          })),
          tagsLabel: "Allowed Models",
          tags: modelTags,
          footer: keyItem?.updatedAt ? `Updated ${formatShortDate(keyItem.updatedAt)}` : "",
          actions: [
            {
              label: "Open",
              icon: "open_in_new",
              kind: "open",
              href: `workspace_keycenter_detail.html?id=${encodeURIComponent(keyItem?.id || "")}`
            }
          ]
        };
      };

      const bootstrap = async () => {
        const [statsResult, filtersResult, tiersResult, keysResult] = await Promise.allSettled([
          fetchJson(`${API_BASE}/tiers/stats`),
          fetchJson(`${API_BASE}/tiers/filters`),
          fetchPagedItems("/tiers"),
          fetchPagedItems("/keys")
        ]);

        const nextConfig = {
          ...fallbackConfig
        };

        if (statsResult.status === "fulfilled") {
          nextConfig.heroStats = buildHeroStats(getPayloadData(statsResult.value));
        }

        const tierItems = tiersResult.status === "fulfilled" ? toArray(tiersResult.value) : [];
        const tierLookup = buildTierLookup(tierItems);
        const filterItems = filtersResult.status === "fulfilled"
          ? toArray(getPayloadData(filtersResult.value).items)
          : deriveFilterItemsFromTiers(tierItems);

        if (filterItems.length) {
          nextConfig.filters = buildFilters(filterItems);
        }

        if (keysResult.status === "fulfilled") {
          const keyItems = toArray(keysResult.value);
          nextConfig.resources = keyItems.map((item) => buildKeyResource(item, tierLookup));
        } else if (filterItems.length) {
          nextConfig.resources = applyFilterCategories(fallbackConfig.resources, filterItems);
        }

        window.HUB_CONFIG = nextConfig;
        if (typeof window.renderWorkspaceResourceHub === "function") {
          window.renderWorkspaceResourceHub(nextConfig);
        }
      };

      bindPagination();
      hookRenderer();
      window.setTimeout(() => applyPagination({ resetPage: true }), 0);

      bootstrap().catch((error) => {
        console.warn("Failed to load /api/v2/keycenter hub stats/filters", error);
      });
    })();
  </script>
  <script src="ax_studio_topbar.js"></script>
  <script src="concept_endpoint_overlay.js"></script>
</body>
