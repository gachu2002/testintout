<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domain Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .layout {
      grid-template-columns: minmax(0, 1fr);
    }
    .side-col {
      display: none;
    }
    .hero-stats {
      grid-template-columns: minmax(0, 1fr);
      max-width: 320px;
    }
    .tls-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }
    .tls-metric {
      padding: 18px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }
    .tls-metric-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .tls-metric-value {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -.04em;
      margin-bottom: 6px;
    }
    .tls-metric-meta {
      font-size: 13px;
      line-height: 1.55;
      color: var(--muted);
    }
    .mock-modal-backdrop[hidden] { display:none; }
    .mock-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 320;
      background: rgba(15,23,42,.48);
      display: grid;
      place-items: center;
      padding: 20px;
      backdrop-filter: blur(6px);
    }
    .mock-modal {
      width: min(560px, 100%);
      border-radius: 24px;
      background: #fff;
      border: 1px solid rgba(226,232,240,.9);
      box-shadow: 0 28px 80px rgba(15,23,42,.24);
      overflow: hidden;
    }
    .mock-modal-head,
    .mock-modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 22px;
    }
    .mock-modal-head {
      border-bottom: 1px solid #e6ebf2;
      align-items: flex-start;
    }
    .mock-modal-title {
      font-size: 22px;
      line-height: 1.15;
      letter-spacing: -.03em;
      margin-bottom: 6px;
    }
    .mock-modal-desc {
      color: #667085;
      font-size: 13px;
      line-height: 1.6;
    }
    .mock-modal-close {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid #e6ebf2;
      background: #f8fafc;
      display: grid;
      place-items: center;
      color: #475467;
    }
    .mock-modal-body {
      padding: 22px;
      display: grid;
      gap: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }
    .modal-field {
      display: grid;
      gap: 8px;
    }
    .modal-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #667085;
    }
    .modal-input,
    .modal-select,
    .modal-textarea {
      width: 100%;
      height: 44px;
      border-radius: 14px;
      border: 1px solid #dbe3ee;
      background: #fff;
      padding: 0 14px;
      color: #111827;
      outline: none;
      font-size: 14px;
    }
    .modal-textarea {
      min-height: 120px;
      height: auto;
      padding: 12px 14px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      line-height: 1.45;
    }
    .modal-input:focus,
    .modal-select:focus,
    .modal-textarea:focus {
      border-color: rgba(37,99,235,.45);
      box-shadow: 0 0 0 4px rgba(37,99,235,.08);
    }
    .mock-modal-foot {
      border-top: 1px solid #e6ebf2;
      justify-content: flex-end;
      background: #fff;
    }
    .mock-inline-note {
      padding: 12px 14px;
      border-radius: 14px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 600;
    }
    @media (max-width: 900px) {
      .tls-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

        </div>
        <button class="mock-modal-close" type="button" data-modal-close>

        </button>
      </div>
      <div class="mock-modal-body">
        <label class="modal-field">
          <span class="modal-label">Certificate Ref</span>
          <input class="modal-input" id="tlsEditorCertRef" type="text" />
        </label>

        <div class="mock-inline-note" id="tlsEditHint">실제 저장 없이 현재 샘플 화면만 갱신합니다.</div>
      </div>
      <div class="mock-modal-foot">
        <button class="action-btn secondary" type="button" data-modal-close>
          <span class="material-icons-round" style="font-size:18px;">close</span>
          닫기
        </button>
        <button class="action-btn primary" type="button" id="tlsEditSaveButton">
          <span class="material-icons-round" style="font-size:18px;">check</span>
          업데이트
        </button>
      </div>
    </div>
  </div>
  <script>
    function formatPemState(value, emptyLabel) {
      const trimmed = (value || "").trim();
      return trimmed ? `입력됨 · ${trimmed.split("\n")[0]}` : emptyLabel;
    }

    function buildTlsSummary(item) {
      return `
        <div class="tls-summary">
          <article class="tls-metric">
            <div class="tls-metric-label">TLS Remaining</div>
            <div class="tls-metric-value" data-tls-field="remainingDays">${item.remainingDays}</div>
            <div class="tls-metric-meta">${item.remainingMeta}</div>
          </article>
          <article class="tls-metric">
            <div class="tls-metric-label">Certificate Ref</div>
            <div class="tls-metric-value" style="font-size:20px;" data-tls-field="certRef">${item.tlsEditor.certRef}</div>
            <div class="tls-metric-meta">Gateway API HTTPRoute TLS reference</div>
          </article>
          <article class="tls-metric">
            <div class="tls-metric-label">TLS Material</div>
            <div class="tls-metric-value" style="font-size:20px;">PEM Input</div>
            <div class="tls-metric-meta"><span data-tls-field="crtStatus">${formatPemState(item.tlsEditor.crt, "CRT 미입력")}</span><br /><span data-tls-field="keyStatus">${formatPemState(item.tlsEditor.key, "KEY 미입력")}</span></div>
          </article>
        </div>
      `;
    }

    function buildItem(item) {

        ...item,
        mainHtml: `
          <section class="panel section">

  <script src="workspace_detail_shared.js"></script>
  <script src="ax_studio_topbar.js"></script>
  <script>
    (function () {
      const config = window.DETAIL_PAGE_CONFIG;
      if (!config || !config.items) return;

      const params = new URLSearchParams(window.location.search);
      const requestedKey = params.get(config.paramName || "item");
      const keys = Object.keys(config.items);
      const currentKey = Object.prototype.hasOwnProperty.call(config.items, requestedKey) ? requestedKey : keys[0];
      const currentItem = config.items[currentKey];

      const modal = document.getElementById("tlsEditModal");
      if (!modal || !currentItem) return;

      const certRefInput = document.getElementById("tlsEditorCertRef");
      const crtInput = document.getElementById("tlsEditorCrt");
      const keyInput = document.getElementById("tlsEditorKey");
      const saveButton = document.getElementById("tlsEditSaveButton");
      const hint = document.getElementById("tlsEditHint");

      function syncModal() {
        certRefInput.value = currentItem.tlsEditor.certRef || "";
        crtInput.value = currentItem.tlsEditor.crt || "";
        keyInput.value = currentItem.tlsEditor.key || "";
      }

      function openModal() {
        syncModal();
        modal.hidden = false;
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        modal.hidden = true;
        document.body.style.overflow = "";
      }

      function applySummaryUpdates() {
        const mapping = {
          certRef: certRefInput.value,
          crtStatus: formatPemState(crtInput.value, "CRT 미입력"),
          keyStatus: formatPemState(keyInput.value, "KEY 미입력")
        };

        Object.entries(mapping).forEach(([key, value]) => {
          document.querySelectorAll(`[data-tls-field="${key}"]`).forEach((node) => {
            node.textContent = value;
          });
        });
      }

      document.querySelectorAll('[data-action-key="tls-edit"]').forEach((button) => {
        button.addEventListener("click", openModal);
      });

      modal.querySelectorAll("[data-modal-close]").forEach((button) => {
        button.addEventListener("click", closeModal);
      });

      modal.addEventListener("click", (event) => {
        if (event.target === modal) closeModal();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) closeModal();
      });

      saveButton.addEventListener("click", () => {
        currentItem.tlsEditor.certRef = certRefInput.value;
        currentItem.tlsEditor.crt = crtInput.value;
        currentItem.tlsEditor.key = keyInput.value;
        applySummaryUpdates();
        hint.textContent = "TLS 업데이트 샘플이 현재 화면에 반영되었습니다.";
        closeModal();
      });
    })();
  </script>
