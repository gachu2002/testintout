<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permission Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_resource_hub_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .permission-request-lines {
      display: grid;
      gap: 3px;
    }

    .permission-request-line {
      display: block;
      line-height: 1.55;
    }

    .permission-request-label {
      font-weight: 700;
      color: var(--t2);
      margin-right: 4px;
    }

    .permission-request-value {
      color: var(--t3);
    }

    .tag.is-requestable-role {
      appearance: none;
      cursor: pointer;
      transition: border-color .16s ease, background .16s ease, color .16s ease, box-shadow .16s ease;
    }

    .tag.is-requestable-role:hover {
      color: var(--brand);
      border-color: color-mix(in srgb, var(--brand) 24%, transparent);
      background: var(--brand-bg);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 10%, transparent);
    }

    .tag.is-requestable-role:disabled {
      cursor: default;
      opacity: 1;
    }

    .permission-request-modal[hidden] {
      display: none;
    }

    .permission-request-modal {
      position: fixed;
      inset: 0;
      z-index: 320;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(31, 22, 50, .44);
      backdrop-filter: blur(8px);
    }

    .permission-request-modal-card {
      width: min(100%, 520px);
      padding: 22px;
      border-radius: 24px;
      border: 1px solid rgba(236, 231, 244, .96);
      background: linear-gradient(180deg, rgba(255,255,255,.99), rgba(255,247,251,.98));
      box-shadow: 0 24px 52px rgba(31,22,50,.18);
      display: grid;
      gap: 16px;
    }

    .permission-request-modal-head {
      display: grid;
      gap: 6px;
    }

    .permission-request-modal-kicker {
      color: var(--brand);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .permission-request-modal-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.03em;
      color: var(--t1);
    }

    .permission-request-modal-desc,
    .permission-request-modal-target {
      color: var(--t2);
      font-size: 13px;
      line-height: 1.65;
    }

    .permission-request-modal-target {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.82);
    }

    .permission-request-modal-field {
      display: grid;
      gap: 8px;
    }

    .permission-request-modal-note,
    .permission-request-modal-feedback {
      font-size: 12px;
      line-height: 1.6;
      color: var(--t2);
    }

    .permission-request-modal-feedback {
      min-height: 20px;
    }

    .permission-request-modal-feedback[data-tone="error"] {
      color: #be123c;
    }

    .permission-request-modal-feedback[data-tone="ok"] {
      color: #047857;
    }

    .permission-request-modal-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--t1);
    }

    .permission-request-modal-input,
    .permission-request-modal-textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 16px;
      padding: 14px 16px;
      background: #fff;
      color: var(--t1);
      font: inherit;
      font-size: 13px;
      line-height: 1.65;
      outline: none;
      transition: border .16s ease, box-shadow .16s ease;
    }

    .permission-request-modal-input {
      min-height: 52px;
    }

    .permission-request-modal-textarea {
      min-height: 140px;
      resize: vertical;
    }

    .permission-request-modal-input:focus,
    .permission-request-modal-textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(190,24,93,.10);
    }

    .permission-request-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .permission-request-send-btn:disabled {
      opacity: .48;
      cursor: not-allowed;
      box-shadow: none;
    }

    .resource-action-btn.delete {
      background: #fff1f2;
      border-color: rgba(225, 29, 72, .18);
      color: #be123c;
    }

    .resource-action-btn.delete:hover {
      background: #ffe4e6;
    }

    .permission-delete-modal[hidden] {
      display: none;
    }

    .permission-delete-modal {
      position: fixed;
      inset: 0;
      z-index: 340;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(31, 22, 50, .52);
      backdrop-filter: blur(8px);
    }

    .permission-delete-modal-card {
      width: min(100%, 500px);
      padding: 22px;
      border-radius: 24px;
      border: 1px solid rgba(251, 205, 214, .96);
      background: linear-gradient(180deg, rgba(255,255,255,.99), rgba(255,244,246,.98));
      box-shadow: 0 24px 52px rgba(31,22,50,.2);
      display: grid;
      gap: 16px;
    }

    .permission-delete-modal-head {
      display: grid;
      gap: 6px;
    }

    .permission-delete-modal-kicker {
      color: #be123c;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .permission-delete-modal-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -.03em;
      color: var(--t1);
    }

    .permission-delete-modal-desc,
    .permission-delete-modal-target,
    .permission-delete-modal-note {
      color: var(--t2);
      font-size: 13px;
      line-height: 1.65;
    }

    .permission-delete-modal-target {
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(251, 191, 36, .28);
      background: rgba(255, 251, 235, .9);
      color: var(--t1);
      font-weight: 700;
    }

    .permission-delete-modal-note {
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(244, 63, 94, .16);
      background: rgba(255, 241, 242, .92);
    }

    .permission-delete-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .permission-delete-confirm-btn {
      background: #e11d48;
      border-color: transparent;
      color: #fff;
      box-shadow: 0 14px 30px rgba(225, 29, 72, .22);
    }

    .permission-delete-confirm-btn:hover {
      background: #be123c;
    }

    .permission-delete-confirm-btn:disabled {
      opacity: .48;
      cursor: not-allowed;
      box-shadow: none;
    }

    .permission-request-expand-row {
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .permission-request-expand-row:hover,
    .permission-request-expand-row:focus-within {
      background: color-mix(in srgb, var(--brand) 4%, white);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 10%, transparent);
    }

    .permission-request-expand-row .list-row-copy {
      gap: 2px;
    }

    .permission-request-expand-row .list-row-title {
      font-size: 12px;
      color: var(--t1);
      font-weight: 700;
    }

    .permission-request-expand-row .list-row-subtitle {
      display: none;
    }

    .permission-request-expand-row .list-row-meta {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      transition: max-height .18s ease, opacity .16s ease, margin-top .16s ease;
      pointer-events: none;
    }

    .permission-request-expand-row.is-expanded .list-row-meta {
      max-height: 220px;
      opacity: 1;
      margin-top: 6px;
      pointer-events: auto;
    }

    @media (max-width: 820px) {
      .permission-request-modal {
        padding: 16px;
      }

      .permission-request-modal-card,
      .permission-delete-modal-card {
        padding: 18px;
        border-radius: 20px;
      }

      .permission-delete-modal {
        padding: 16px;
      }
    }
  </style>
</head>

  <script src="workspace_resource_hub_shared.js"></script>
  <script src="ax_studio_topbar.js"></script>
  <script>
    (() => {
      const API_BASE = "/api/v2";
      const REALM_PAGE_LIMIT = 100;
      const REQUEST_PANEL_LIMIT = 8;
      const FALLBACK_CONFIG = window.HUB_CONFIG;
      const KIND_META = {
        platform: {
          label: "플랫폼",
          engine: "Platform Realm",
          icon: "admin_panel_settings",
          color: "linear-gradient(135deg,#be185d,#fb7185)"
        },
        project: {
          label: "프로젝트",
          engine: "Project Realm",
          icon: "task_alt",
          color: "linear-gradient(135deg,#2563eb,#60a5fa)"
        },
        resource: {
          label: "리소스",
          engine: "Resource Realm",
          icon: "storage",
          color: "linear-gradient(135deg,#0f766e,#5eead4)"
        },
        scoped: {
          label: "Scoped",
          engine: "Scoped Realm",
          icon: "vpn_key",
          color: "linear-gradient(135deg,#db2777,#f472b6)"
        }
      };
      const STATUS_META = {
        active: { label: "Active", tone: "healthy" },
        review: { label: "Review", tone: "review" }
      };
      const REQUEST_STATUS_META = {
        pending: { label: "Pending", tone: "pending" },
        approved: { label: "Approved", tone: "healthy" },
        rejected: { label: "Rejected", tone: "incident" },
        cancelled: { label: "Cancelled", tone: "muted" }
      };
      const PANEL_TONE_CLASS = {
        healthy: "tone-healthy",
        stable: "tone-healthy",
        review: "tone-review",
        pending: "tone-pending",
        info: "tone-info",
        warn: "tone-warn",
        incident: "tone-incident",
        draft: "tone-draft",
        muted: "tone-muted"
      };
      const createdRealmResources = [];
      let lastRenderedConfig = FALLBACK_CONFIG;
      const hubState = {
        realmItems: [],
        realmMap: new Map(),
        statsPayload: null,
        filtersPayload: null,
        requestsPayload: null
      };

      function buildQuery(params) {
        const searchParams = new URLSearchParams();
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value === undefined || value === null || value === "") {
            return;
          }
          searchParams.set(key, String(value));
        });

        const query = searchParams.toString();
        return query ? `?${query}` : "";
      }

      async function requestJson(path, options) {
        const response = await fetch(`${API_BASE}${path}`, {
          credentials: "same-origin",
          headers: {
            Accept: "application/json"
          },
          ...(options || {})
        });

        const payload = await response.json().catch(() => null);

        if (!response.ok) {
          const message = payload && payload.error && payload.error.message
            ? payload.error.message
            : `${response.status} ${response.statusText}`;
          const error = new Error(message);
          error.status = response.status;
          error.payload = payload;
          throw error;
        }

        return payload;
      }

      async function fetchJson(path, params) {
        return requestJson(`${path}${buildQuery(params)}`);
      }

      function extractData(payload, fallback) {
        if (payload && typeof payload === "object" && "data" in payload) {
          return payload.data;
        }
        return payload ?? fallback;
      }

      function extractItems(payload) {
        if (payload && Array.isArray(payload.items)) {
          return payload.items;
        }
        if (payload && payload.data && Array.isArray(payload.data.items)) {
          return payload.data.items;
        }
        return [];
      }

      function extractNextCursor(payload) {
        if (payload && payload.page && typeof payload.page.nextCursor === "string") {
          return payload.page.nextCursor;
        }
        if (payload && payload.data && payload.data.page && typeof payload.data.page.nextCursor === "string") {
          return payload.data.page.nextCursor;
        }
        return null;
      }

      function extractPageTotal(payload, fallback) {
        if (payload && payload.page && Number.isFinite(payload.page.total)) {
          return payload.page.total;
        }
        if (payload && payload.data && payload.data.page && Number.isFinite(payload.data.page.total)) {
          return payload.data.page.total;
        }
        return fallback;
      }

      function formatNumber(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) {
          return "-";
        }
        return new Intl.NumberFormat("ko-KR").format(amount);
      }

      function formatDateTime(value) {
        if (!value) {
          return "최근 수정 정보 없음";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "최근 수정 정보 없음";
        }

        return `Updated ${new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date)}`;
      }

      function formatRequestDate(value) {
        if (!value) {
          return "시간 정보 없음";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "시간 정보 없음";
        }

        return new Intl.DateTimeFormat("ko-KR", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function normalizeText(value) {
        return String(value || "").trim();
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderRequestLine(label, value) {
        return `
          <div class="permission-request-line">
            <span class="permission-request-label">${escapeHtml(label)}:</span>
            <span class="permission-request-value">${escapeHtml(value)}</span>
          </div>
        `;
      }

      function refineSectionDescription(value, fallback) {
        const text = normalizeText(value) || normalizeText(fallback);
        if (!text) {
          return "";
        }

        return text
          .replace(/\s+/g, " ")
          .replace(/permission request inbox/gi, "Permission Request Inbox")
          .replace(/permission realm/gi, "Permission Realm")
          .replace(/우측\s*레일/g, "우측 패널")
          .replace(/빠르게 오갈 수 있게 구성합니다\./g, "한 번에 이어 볼 수 있게 정리했습니다.")
          .replace(/빠르게 파악하는 역할에 집중합니다\./g, "빠르게 읽을 수 있게 정리했습니다.")
          .trim();
      }

      function truncateText(value, maxLength) {
        const text = normalizeText(value);
        if (!text || text.length <= maxLength) {
          return text;
        }
        return `${text.slice(0, maxLength - 1)}...`;
      }

      function toAbbr(value, fallback) {
        const text = normalizeText(value);
        if (!text) {
          return fallback;
        }

        const parts = text.split(/[^a-zA-Z0-9]+/).filter(Boolean);
        if (parts.length >= 2) {
          return parts.slice(0, 2).map(part => part.charAt(0).toUpperCase()).join("");
        }

        return text.slice(0, 2).toUpperCase();
      }

      function getKindMeta(kind) {
        return KIND_META[kind] || {
          label: "Realm",
          engine: "Permission Realm",
          icon: "admin_panel_settings",
          color: "linear-gradient(135deg,#be185d,#fb7185)"
        };
      }

      function getStatusMeta(status) {
        return STATUS_META[status] || { label: "Unknown", tone: "info" };
      }

      function getRequestStatusMeta(status) {
        return REQUEST_STATUS_META[status] || { label: "Unknown", tone: "info" };
      }

      function buildKindCounts(realms, filterData) {
        const counts = new Map(Object.keys(KIND_META).map(kind => [kind, 0]));

        (realms || []).forEach(realm => {
          const key = normalizeText(realm.kind);
          if (!counts.has(key)) {
            counts.set(key, 0);
          }
          counts.set(key, (counts.get(key) || 0) + 1);
        });

        const apiKinds = Array.isArray(filterData && filterData.kinds) ? filterData.kinds : [];
        apiKinds.forEach(item => {
          const key = normalizeText(item && item.value);
          if (!key) {
            return;
          }
          counts.set(key, Number(item && item.count) || 0);
        });

        return counts;
      }

      function buildHeroStats(stats, realms, filterData) {
        const kindCounts = buildKindCounts(realms, filterData);
        const totalAssignedUsers = (realms || []).reduce((sum, realm) => (
          sum + (Array.isArray(realm && realm.roles)
            ? realm.roles.reduce((roleSum, role) => roleSum + (Number(role && role.memberCount) || 0), 0)
            : 0)
        ), 0);
        const totalMembers = Number(stats && stats.totalMembers);
        const pendingRequests = Number(stats && stats.pendingRequests);
        const boundProjectCount = Number(stats && stats.boundProjectCount);
        const manageableRealms = Number(stats && stats.manageableRealms);

        return [
          {
            icon: "admin_panel_settings",
            value: formatNumber(Number(stats && stats.totalRealms) || (realms || []).length),
            label: "등록 Realm",
            note: `scoped ${formatNumber(kindCounts.get("scoped") || 0)}`,
            color: "linear-gradient(135deg,#be185d,#ec4899)"
          },
          {
            icon: "groups",
            value: formatNumber(Number.isFinite(totalMembers) ? totalMembers : totalAssignedUsers),
            label: "배정 인원",
            note: "중복 포함 총 사용자수",
            color: "linear-gradient(135deg,#9d174d,#fb7185)"
          },
          {
            icon: "account_tree",
            value: formatNumber(Number.isFinite(boundProjectCount) ? boundProjectCount : (realms || []).reduce((sum, realm) => sum + Number(realm && realm.projectCount || 0), 0)),
            label: "연결된 프로젝트",
            note: "프로젝트 바인딩 기준",
            color: "linear-gradient(135deg,#db2777,#f472b6)"
          },
          {
            icon: "approval",
            value: formatNumber(Number.isFinite(pendingRequests) ? pendingRequests : 0),
            label: "요청 대기",
            note: `manageable realms ${formatNumber(Number.isFinite(manageableRealms) ? manageableRealms : 0)}`,
            color: "linear-gradient(135deg,#e11d48,#fb7185)"
          }
        ];
      }

      function buildFilters(filterData, realms) {
        const kindCounts = buildKindCounts(realms, filterData);

        return [
          { id: "all", icon: "apps", label: "전체" },
          ...Object.keys(KIND_META)
            .filter(kind => (kindCounts.get(kind) || 0) > 0)
            .map(kind => ({
              id: kind,
              icon: KIND_META[kind].icon,
              label: `${KIND_META[kind].label} (${formatNumber(kindCounts.get(kind) || 0)})`
            }))
        ];
      }

      function buildResourceDescription(total) {
        if (!Number.isFinite(total) || total <= 0) {
          return refineSectionDescription(
            "",
            "조회 가능한 Permission Realm이 없습니다. 권한과 연동 상태를 확인해 주세요."
          );
        }

        return refineSectionDescription(

        const directRoles = Array.isArray(realm && realm.currentUserRoles) ? realm.currentUserRoles : [];

      function buildResource(realm) {
        const kindMeta = getKindMeta(realm && realm.kind);

        const boundProjects = Array.isArray(realm && realm.boundProjects) ? realm.boundProjects : [];
        const roles = Array.isArray(realm && realm.roles) ? realm.roles : [];
        const currentUserRoles = new Set(getViewerRoleNames(realm));
        const canRequest = Boolean(realm && realm.capabilities && realm.capabilities.canRequest);
        const canDelete = Boolean(realm && realm.capabilities && realm.capabilities.canDelete);
        const projectCount = Number(realm && realm.projectCount) || boundProjects.length;
        const capabilityChips = [];
        const hasAdminRole = Array.from(currentUserRoles).some(role => role.toLowerCase() === "admin");
        const actions = [];

        if ((realm && realm.capabilities && realm.capabilities.canApprove) || hasAdminRole) {
          capabilityChips.push({ icon: "verified_user", text: "Manage enabled", className: "is-manage-enabled" });

            label: "Delete",
            icon: "delete",

            attributes: {

          kind: "open",
          label: "Detail",
          icon: "open_in_new",
          href: toPermissionDetailHref(realm)
        });

        return {
          id: realm.id,
          categories: ["all", normalizeText(realm.kind)].filter(Boolean),
          status: statusMeta,
          engine: kindMeta.engine,
          icon: kindMeta.icon,
          name: normalizeText(realm.name) || "Unnamed Realm",

                className: hasRole ? "is-active-role" : (isRequestable ? "is-requestable-role" : ""),

            submit.disabled = !currentValue;

          sync();

        closeButtons.forEach((button) => {
          button.addEventListener("click", close);

      async function fetchAllPages(path, params) {
        const items = [];
        let cursor = null;
        let total = 0;
        let hasNext = true;

        while (hasNext) {
          const payload = await fetchJson(path, {
            ...(params || {}),
            limit: params && params.limit ? params.limit : REALM_PAGE_LIMIT,
            ...(cursor ? { cursor } : {})
          });
          const pageItems = extractItems(payload);
          const nextCursor = extractNextCursor(payload);
          const pageTotal = extractPageTotal(payload, total || pageItems.length);

          items.push(...pageItems);
          total = pageTotal;
          cursor = nextCursor;
          hasNext = Boolean(nextCursor);

          if (!pageItems.length || (pageTotal > 0 && items.length >= pageTotal)) {
            hasNext = false;
          }
        }

        return {
          items,
          page: {
            total: total || items.length
          }
        };
      }

        }

        modal = document.createElement("div");
        modal.className = "permission-request-modal";
        modal.id = "permissionRealmCreateModal";
        modal.hidden = true;
        modal.innerHTML = `
          <div class="permission-request-modal-card" role="dialog" aria-modal="true" aria-labelledby="permissionRealmCreateTitle">
            <div class="permission-request-modal-head">
              <div class="permission-request-modal-kicker">Create Realm</div>
              <div class="permission-request-modal-title" id="permissionRealmCreateTitle">Realm 생성</div>
              <div class="permission-request-modal-desc">중복되지 않은 이름이면 새 Permission Realm을 바로 생성합니다.</div>
            </div>
            <div class="permission-request-modal-field">
              <label class="permission-request-modal-label" for="permissionRealmCreateNameInput">Realm 이름</label>
              <input
                class="permission-request-modal-input"
                id="permissionRealmCreateNameInput"
                type="text"
                placeholder="예: workspace-analytics"
                autocomplete="off"
              />
              <div class="permission-request-modal-note">새 Realm은 기본적으로 scoped 타입으로 생성됩니다.</div>
              <div class="permission-request-modal-feedback" id="permissionRealmCreateFeedback"></div>
            </div>
            <div class="permission-request-modal-actions">
              <button class="resource-action-btn" id="permissionRealmCreateCancelBtn" type="button">
                <span class="material-icons-round">close</span>취소
              </button>
              <button class="resource-action-btn create-btn permission-request-send-btn" id="permissionRealmCreateConfirmBtn" type="button" disabled>
                <span class="material-icons-round">add_circle</span>생성
              </button>
            </div>
          </div>
        `;

        document.body.appendChild(modal);
        return modal;
      }

      function wirePermissionRequestListInteractions() {
        const rows = Array.from(document.querySelectorAll(".permission-request-expand-row"));
        if (!rows.length) {
          return;
        }

        rows.forEach((row) => {
          row.setAttribute("role", "button");
          row.setAttribute("tabindex", "0");
          row.setAttribute("aria-expanded", "false");

          const toggleRow = () => {
            const shouldExpand = !row.classList.contains("is-expanded");
            rows.forEach((candidate) => {
              candidate.classList.remove("is-expanded");
              candidate.setAttribute("aria-expanded", "false");
            });

            if (shouldExpand) {
              row.classList.add("is-expanded");
              row.setAttribute("aria-expanded", "true");
            }
          };

          row.addEventListener("click", () => toggleRow());
          row.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              toggleRow();
            }

            if (event.key === "Escape" && row.classList.contains("is-expanded")) {
              row.classList.remove("is-expanded");
              row.setAttribute("aria-expanded", "false");
              row.focus();
            }
          });
        });
      }

      function wireRealmDeleteInteractions() {
        const modal = ensureRealmDeleteModal();
        const target = document.getElementById("permissionRealmDeleteTarget");
        const note = document.getElementById("permissionRealmDeleteNote");
        const confirmBtn = document.getElementById("permissionRealmDeleteConfirmBtn");
        const cancelBtn = document.getElementById("permissionRealmDeleteCancelBtn");
        const state = buildRealmDeleteModalState();

        if (!modal || !target || !note || !confirmBtn || !cancelBtn) {
          return;
        }

        const closeModal = () => {
          modal.hidden = true;
          target.textContent = "선택된 Realm이 없습니다.";
          note.textContent = "Realm에 연결된 프로젝트가 남아 있으면 삭제할 수 없습니다.";
          confirmBtn.disabled = false;
          confirmBtn.innerHTML = `<span class="material-icons-round">delete</span>Delete Realm`;
          cancelBtn.disabled = false;
          if (state.triggerButton) {
            state.triggerButton.disabled = false;
          }
          document.body.style.overflow = "";
          state.realmId = "";
          state.realmName = "";
          state.projectCount = 0;
          state.triggerButton = null;
        };

        document.querySelectorAll("[data-realm-delete-id]").forEach((button) => {
          button.addEventListener("click", () => {
            state.realmId = button.getAttribute("data-realm-delete-id") || "";
            state.realmName = button.getAttribute("data-realm-delete-name") || "Permission Realm";
            state.projectCount = Number(button.getAttribute("data-realm-delete-project-count") || "0");
            state.triggerButton = button;
            target.textContent = state.realmName;
            note.textContent = state.projectCount > 0
              ? `현재 ${formatNumber(state.projectCount)}개의 프로젝트가 연결되어 있습니다. 바인딩을 먼저 해제해야 삭제할 수 있습니다.`
              : "이 Realm의 Keycloak client와 local permission request 기록이 함께 정리됩니다.";
            confirmBtn.disabled = state.projectCount > 0;
            modal.hidden = false;
            document.body.style.overflow = "hidden";
            requestAnimationFrame(() => {
              (state.projectCount > 0 ? cancelBtn : confirmBtn).focus();
            });
          });
        });

        cancelBtn.onclick = () => closeModal();
        modal.onclick = (event) => {
          if (event.target === modal) {
            closeModal();
          }
        };
        confirmBtn.onclick = async () => {
          if (!state.realmId || state.projectCount > 0) {
            return;
          }

          confirmBtn.disabled = true;
          cancelBtn.disabled = true;
          confirmBtn.innerHTML = `<span class="material-icons-round">hourglass_top</span>Deleting...`;
          if (state.triggerButton) {
            state.triggerButton.disabled = true;
          }

          try {
            await requestJson(`/permissions/realms/${encodeURIComponent(state.realmId)}`, {
              method: "DELETE",
              headers: {
                Accept: "application/json"
              }
            });
            closeModal();
            await loadPermissionHub();
          } catch (error) {
            confirmBtn.disabled = false;
            cancelBtn.disabled = false;
            confirmBtn.innerHTML = `<span class="material-icons-round">delete</span>Delete Realm`;
            if (state.triggerButton) {
              state.triggerButton.disabled = false;
            }
            window.alert(error && error.message ? error.message : "Realm 삭제에 실패했습니다.");
          }
        };
        modal.onkeydown = (event) => {
          if (event.key === "Escape" && !modal.hidden) {
            closeModal();
          }
        };
      }

      function wireRealmCreateInteractions() {
        const modal = ensureRealmCreateModal();
        const nameInput = document.getElementById("permissionRealmCreateNameInput");
        const feedback = document.getElementById("permissionRealmCreateFeedback");
        const confirmBtn = document.getElementById("permissionRealmCreateConfirmBtn");
        const cancelBtn = document.getElementById("permissionRealmCreateCancelBtn");
        const state = buildRealmCreateModalState();

        if (!modal || !nameInput || !feedback || !confirmBtn || !cancelBtn) {
          return;
        }

        const getExistingRealmNames = () => new Set(
          (hubState.realmItems || [])
            .map((realm) => normalizeText(realm && realm.name).toLowerCase())
            .filter(Boolean)
        );

        const setFeedback = (message, tone) => {
          feedback.textContent = message || "";
          if (tone) {
            feedback.dataset.tone = tone;
          } else {
            delete feedback.dataset.tone;
          }
        };

        const syncCreateEnabled = () => {
          const name = normalizeText(nameInput.value);
          if (!name) {
            confirmBtn.disabled = true;
            setFeedback("Realm 이름을 입력해 주세요.");
            return false;
          }

          const exists = getExistingRealmNames().has(name.toLowerCase());
          if (exists) {
            confirmBtn.disabled = true;
            setFeedback("같은 이름의 Realm이 이미 있습니다.", "error");
            return false;
          }

          confirmBtn.disabled = false;
          setFeedback("사용 가능한 이름입니다.", "ok");
          return true;
        };

        const closeModal = () => {
          modal.hidden = true;
          nameInput.value = "";
          confirmBtn.disabled = true;
          confirmBtn.innerHTML = `<span class="material-icons-round">add_circle</span>생성`;
          cancelBtn.disabled = false;
          setFeedback("");
          if (state.triggerButton) {
            state.triggerButton.disabled = false;
          }
          state.triggerButton = null;
          document.body.style.overflow = "";
        };

        const openModal = (triggerButton) => {
          state.triggerButton = triggerButton || null;
          if (state.triggerButton) {
            state.triggerButton.disabled = true;
          }
          modal.hidden = false;
          document.body.style.overflow = "hidden";
          nameInput.value = "";
          syncCreateEnabled();
          requestAnimationFrame(() => {
            nameInput.focus();
          });
        };

        const heroPrimaryButton = document.querySelector(".control-actions .create-btn");
        if (heroPrimaryButton) {
          heroPrimaryButton.onclick = (event) => {
            event.preventDefault();
            openModal(heroPrimaryButton);
          };
        }

        cancelBtn.onclick = () => closeModal();
        modal.onclick = (event) => {
          if (event.target === modal) {
            closeModal();
          }
        };
        nameInput.oninput = () => syncCreateEnabled();
        nameInput.onkeydown = (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key === "Enter" && !confirmBtn.disabled) {
            confirmBtn.click();
          }
          if (event.key === "Escape" && !modal.hidden) {
            closeModal();
          }
        };
        confirmBtn.onclick = async () => {
          const realmName = normalizeText(nameInput.value);
          if (!realmName || !syncCreateEnabled()) {
            return;
          }

          confirmBtn.disabled = true;
          cancelBtn.disabled = true;
          confirmBtn.innerHTML = `<span class="material-icons-round">hourglass_top</span>생성중...`;

          try {
            await requestJson("/permissions/realms", {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                name: realmName,
                kind: "scoped"
              })
            });
            closeModal();
            await loadPermissionHub();
          } catch (error) {
            cancelBtn.disabled = false;
            confirmBtn.innerHTML = `<span class="material-icons-round">add_circle</span>생성`;
            const duplicateError = error && error.payload && error.payload.error && error.payload.error.code === "ALREADY_EXISTS";
            setFeedback(
              duplicateError
                ? "같은 이름의 Realm이 이미 있습니다."
                : (error && error.message ? error.message : "Realm 생성에 실패했습니다."),
              "error"
            );
            confirmBtn.disabled = duplicateError ? true : !realmName;
            if (state.triggerButton) {
              state.triggerButton.disabled = false;
            }
          }
        };
        modal.onkeydown = (event) => {
          if (event.key === "Escape" && !modal.hidden) {
            closeModal();
          }
        };
      }

      function wirePermissionRequestInteractions() {
        const modal = ensurePermissionRequestModal();
        const target = document.getElementById("permissionRequestTarget");
        const reasonInput = document.getElementById("permissionRequestReasonInput");
        const sendBtn = document.getElementById("permissionRequestSendBtn");
        const cancelBtn = document.getElementById("permissionRequestCancelBtn");
        const state = buildPermissionRequestModalState();

        if (!modal || !target || !reasonInput || !sendBtn || !cancelBtn) {
          return;
        }

        const closeModal = () => {
          modal.hidden = true;
          target.textContent = "선택된 role이 없습니다.";
          reasonInput.value = "";
          sendBtn.disabled = true;
          sendBtn.innerHTML = `<span class="material-icons-round">send</span>SEND`;
          cancelBtn.disabled = false;
          if (state.triggerButton) {
            state.triggerButton.disabled = false;
            state.triggerButton.classList.remove("is-requesting");
          }
          document.body.style.overflow = "";
          state.realmId = "";
          state.realmName = "";
          state.roleName = "";
          state.triggerButton = null;
        };

        const syncSendEnabled = () => {
          sendBtn.disabled = !reasonInput.value.trim();
        };

        document.querySelectorAll("[data-permission-request-role]").forEach((button) => {
          button.addEventListener("click", () => {
            state.realmId = button.getAttribute("data-permission-request-realm-id") || "";
            state.realmName = button.getAttribute("data-permission-request-realm-name") || "Permission Realm";
            state.roleName = button.getAttribute("data-permission-request-role") || "";
            state.triggerButton = button;
            target.textContent = `${state.realmName} · ${state.roleName}`;
            reasonInput.value = "";
            syncSendEnabled();
            modal.hidden = false;
            document.body.style.overflow = "hidden";
            requestAnimationFrame(() => {
              reasonInput.focus();
            });
          });
        });

        cancelBtn.onclick = () => closeModal();
        modal.onclick = (event) => {
          if (event.target === modal) {
            closeModal();
          }
        };
        reasonInput.oninput = () => syncSendEnabled();
        reasonInput.onkeydown = (event) => {
          if ((event.metaKey || event.ctrlKey) && event.key === "Enter" && !sendBtn.disabled) {
            sendBtn.click();
          }
          if (event.key === "Escape" && !modal.hidden) {
            closeModal();
          }
        };
        sendBtn.onclick = async () => {
          if (!state.realmId || !state.roleName || !reasonInput.value.trim()) {
            syncSendEnabled();
            return;
          }

          sendBtn.disabled = true;
          cancelBtn.disabled = true;
          sendBtn.innerHTML = `<span class="material-icons-round">hourglass_top</span>SENDING...`;
          if (state.triggerButton) {
            state.triggerButton.disabled = true;
            state.triggerButton.classList.add("is-requesting");
          }

          try {
            await requestJson(`/permissions/realms/${encodeURIComponent(state.realmId)}/requests`, {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                roleName: state.roleName,
                reason: reasonInput.value.trim()
              })
            });
            closeModal();
            const refreshResults = await Promise.allSettled([
              fetchJson("/permissions/requests", { limit: REQUEST_PANEL_LIMIT, sort: "-createdAt" }),
              fetchJson("/permissions/realms/stats")
            ]);
            const nextRequestsPayload = refreshResults[0].status === "fulfilled"
              ? refreshResults[0].value
              : hubState.requestsPayload;
            const nextStatsPayload = refreshResults[1].status === "fulfilled"
              ? extractData(refreshResults[1].value, null)
              : hubState.statsPayload;
            if (!syncHubRequestSections({ requestsPayload: nextRequestsPayload, statsPayload: nextStatsPayload })) {
              await loadPermissionHub();
            }
          } catch (error) {
            sendBtn.innerHTML = `<span class="material-icons-round">send</span>SEND`;
            cancelBtn.disabled = false;
            syncSendEnabled();
            if (state.triggerButton) {
              state.triggerButton.disabled = false;
              state.triggerButton.classList.remove("is-requesting");
            }
            window.alert(error && error.message ? error.message : "권한 요청 생성에 실패했습니다.");
          }
        };
      }

      async function loadPermissionHub() {
        const results = await Promise.allSettled([
          fetchAllPages("/permissions/realms", { limit: REALM_PAGE_LIMIT, sort: "-updatedAt" }),
          fetchJson("/permissions/realms/stats"),
          fetchJson("/permissions/realms/filters"),
          fetchJson("/permissions/requests", { limit: REQUEST_PANEL_LIMIT, sort: "-createdAt" }),
          fetchJson("/panels/tips", { surface: "permissions" }),
          fetchJson("/panels/guide-links", { surface: "permissions" })
        ]);

        const [
          realmsResult,
          statsResult,
          filtersResult,
          requestsResult,
          tipsResult,
          guideResult
        ] = results;

        if (realmsResult.status !== "fulfilled") {
          throw realmsResult.reason;
        }

        const realmsPayload = realmsResult.value;
        const realmItems = extractItems(realmsPayload);
        const statsPayload = statsResult.status === "fulfilled" ? extractData(statsResult.value, null) : null;
        const filtersPayload = filtersResult.status === "fulfilled" ? extractData(filtersResult.value, null) : null;
        const requestsPayload = requestsResult.status === "fulfilled" ? requestsResult.value : null;
        const tipsPayload = tipsResult.status === "fulfilled" ? extractData(tipsResult.value, null) : null;
        const guidePayload = guideResult.status === "fulfilled" ? extractData(guideResult.value, null) : null;
        setHubSnapshot({
          realmItems,
          statsPayload,
          filtersPayload,
          requestsPayload
        });
        const resourceTotal = extractPageTotal(realmsPayload, realmItems.length);

        renderConfig({
          ...FALLBACK_CONFIG,
          heroStats: buildHeroStats(statsPayload, realmItems, filtersPayload),
          filters: buildFilters(filtersPayload, realmItems),
          resourceDescription: buildResourceDescription(resourceTotal),
          resources: realmItems.map(buildResource),
          mainPanels: [
            buildTipsPanel(tipsPayload),
            buildGuidePanel(guidePayload)
          ],
          sidebarPanels: [
            buildRequestPanel(extractItems(requestsPayload), hubState.realmMap)
          ]
        });
        wirePermissionRequestListInteractions();
        wireRealmCreateInteractions();
        wirePermissionRequestInteractions();
        wireRealmDeleteInteractions();
      }

      const handleLoadError = (error) => {
        console.warn("[permission_hub] Failed to load permission hub data", error);

        renderConfig({
          ...FALLBACK_CONFIG,
          heroStats: [],
          resources: [],
          resourceDescription: "Permission Hub 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.",
          mainPanels: [
            {
              icon: "error",
              label: "Load Error",
              title: "Permission Hub 데이터를 읽지 못했습니다.",
              description: "권한 또는 API 응답 상태를 확인해 주세요.",
              rows: [
                { title: "API 호출 실패", meta: String(error && error.message || error || "Unknown error") }
              ]
            }
          ],
          sidebarPanels: [
            {
              icon: "pending_actions",
              label: "Request List",
              title: "현재 요청 목록",
              description: "Request inbox를 불러오지 못했습니다.",
              rows: [
                {
                  title: "상태 동기화 실패",
                  meta: "permission requests",
                  pill: { label: "Error", tone: "incident" }
                }
              ]
            }
          ]
        });
        wireRealmCreateInteractions();
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          loadPermissionHub().catch(handleLoadError);
        }, { once: true });
      } else {
        loadPermissionHub().catch(handleLoadError);
      }
    })();
  </script>
  <script src="concept_endpoint_overlay.js"></script>
</body>
</html>
