<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permission Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_resource_hub_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
</head>
<body>
  <div id="app"></div>
  <script>
    window.HUB_CONFIG = {
      documentTitle: "Permission Hub",
      activeKey: "permission",
      panelVariant: "briefing",
      connectionsType: "project",
      searchSource: "permissions",
      searchSourceLabel: "Permission Hub",
      searchDefaultType: "hub",
      theme: {
        bg: "#fff5fa",
        brand: "#be185d",
        brandH: "#9d174d",
        brandBg: "#fce7f3",
        brandSoft: "rgba(190,24,93,.14)",
        accent2: "#fb7185"
      },
      searchPlaceholder: "Realm, Role, 요청 상태를 검색하세요...",
      eyebrow: "Accessibility · IAM & Approvals",
      title: "Permission Hub",
      description: "Permission Realm 모음입니다. 각 카드에서 Realm 안에 포함된 Role, 프로젝트 바인딩, 요청 Inbox를 한 화면에서 확인합니다.",
      primaryAction: { href: "workspace_permission_detail.html", icon: "person_add", label: "새권한 요청" },
      secondaryAction: { href: "workspace_projects_hub.html", icon: "inventory_2", label: "프로젝트 목록" },
      utilityAction: null,
      createAction: null,
      heroStats: [
        { icon: "admin_panel_settings", value: "-", label: "등록 Realm", note: "데이터를 불러오는 중입니다.", color: "linear-gradient(135deg,#be185d,#ec4899)" },
        { icon: "badge", value: "-", label: "포함 Role", note: "데이터를 불러오는 중입니다.", color: "linear-gradient(135deg,#db2777,#f472b6)" },
        { icon: "groups", value: "-", label: "배정 인원", note: "데이터를 불러오는 중입니다.", color: "linear-gradient(135deg,#9d174d,#fb7185)" },
        { icon: "approval", value: "-", label: "요청 대기", note: "데이터를 불러오는 중입니다.", color: "linear-gradient(135deg,#e11d48,#fb7185)" }
      ],
      filters: [
        { id: "all", icon: "apps", label: "전체" }
      ],
      resourceSectionIcon: "admin_panel_settings",
      resourceSectionLabel: "Permission Realms",
      resourceTitle: "Realms",
      resourceDescription: "Permission Realm 목록을 불러오는 중입니다.",
      resourceHeaderLink: { href: "workspace_projects_hub.html", label: "프로젝트 연결 보기" },
      resources: [],
      mainPanels: [
        {
          icon: "tips_and_updates",
          label: "Tips",
          title: "권한 운영 팁",
          description: "운영 팁을 불러오는 중입니다.",
          rows: []
        },
        {
          icon: "menu_book",
          label: "Guide Links",
          title: "가이드 링크",
          description: "가이드 링크를 불러오는 중입니다.",
          rows: []
        }
      ],
      summary: null,
      sidebarPanels: [
        {
          icon: "pending_actions",
          label: "Request List",
          title: "현재 요청 목록",
          description: "Permission request inbox를 불러오는 중입니다.",
          rows: []
        }
      ]
    };
  </script>
  <script src="workspace_resource_hub_shared.js"></script>
  <script src="ax_studio_topbar.js"></script>
  <script>
    (() => {
      const API_BASE = "/api/v2";
      const REALM_PAGE_LIMIT = 100;
      const REQUEST_PANEL_LIMIT = 8;
      const FALLBACK_CONFIG = window.HUB_CONFIG;
      const KIND_META = {
        platform: {
          label: "플랫폼",
          engine: "Platform Realm",
          icon: "admin_panel_settings",
          color: "linear-gradient(135deg,#be185d,#fb7185)"
        },
        project: {
          label: "프로젝트",
          engine: "Project Realm",
          icon: "task_alt",
          color: "linear-gradient(135deg,#2563eb,#60a5fa)"
        },
        resource: {
          label: "리소스",
          engine: "Resource Realm",
          icon: "storage",
          color: "linear-gradient(135deg,#0f766e,#5eead4)"
        },
        scoped: {
          label: "Scoped",
          engine: "Scoped Realm",
          icon: "vpn_key",
          color: "linear-gradient(135deg,#db2777,#f472b6)"
        }
      };
      const STATUS_META = {
        active: { label: "Active", tone: "healthy" },
        review: { label: "Review", tone: "review" }
      };
      const REQUEST_STATUS_META = {
        pending: { label: "Pending", tone: "pending" },
        approved: { label: "Approved", tone: "healthy" },
        rejected: { label: "Rejected", tone: "incident" },
        cancelled: { label: "Cancelled", tone: "muted" }
      };

      function buildQuery(params) {
        const searchParams = new URLSearchParams();
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value === undefined || value === null || value === "") {
            return;
          }
          searchParams.set(key, String(value));
        });

        const query = searchParams.toString();
        return query ? `?${query}` : "";
      }

      async function requestJson(path, options) {
        const response = await fetch(`${API_BASE}${path}`, {
          credentials: "same-origin",
          headers: {
            Accept: "application/json"
          },
          ...(options || {})
        });

        if (!response.ok) {
          throw new Error(`${response.status} ${response.statusText}`);
        }

        return response.json();
      }

      async function fetchJson(path, params) {
        return requestJson(`${path}${buildQuery(params)}`);
      }

      function extractData(payload, fallback) {
        if (payload && typeof payload === "object" && "data" in payload) {
          return payload.data;
        }
        return payload ?? fallback;
      }

      function extractItems(payload) {
        if (payload && Array.isArray(payload.items)) {
          return payload.items;
        }
        if (payload && payload.data && Array.isArray(payload.data.items)) {
          return payload.data.items;
        }
        return [];
      }

      function extractNextCursor(payload) {
        if (payload && payload.page && typeof payload.page.nextCursor === "string") {
          return payload.page.nextCursor;
        }
        if (payload && payload.data && payload.data.page && typeof payload.data.page.nextCursor === "string") {
          return payload.data.page.nextCursor;
        }
        return null;
      }

      function extractPageTotal(payload, fallback) {
        if (payload && payload.page && Number.isFinite(payload.page.total)) {
          return payload.page.total;
        }
        if (payload && payload.data && payload.data.page && Number.isFinite(payload.data.page.total)) {
          return payload.data.page.total;
        }
        return fallback;
      }

      function formatNumber(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) {
          return "-";
        }
        return new Intl.NumberFormat("ko-KR").format(amount);
      }

      function formatDateTime(value) {
        if (!value) {
          return "최근 수정 정보 없음";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "최근 수정 정보 없음";
        }

        return `Updated ${new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date)}`;
      }

      function formatRequestDate(value) {
        if (!value) {
          return "시간 정보 없음";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "시간 정보 없음";
        }

        return new Intl.DateTimeFormat("ko-KR", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function normalizeText(value) {
        return String(value || "").trim();
      }

      function refineSectionDescription(value, fallback) {
        const text = normalizeText(value) || normalizeText(fallback);
        if (!text) {
          return "";
        }

        return text
          .replace(/\s+/g, " ")
          .replace(/permission request inbox/gi, "Permission Request Inbox")
          .replace(/permission realm/gi, "Permission Realm")
          .replace(/우측\s*레일/g, "우측 패널")
          .replace(/빠르게 오갈 수 있게 구성합니다\./g, "한 번에 이어 볼 수 있게 정리했습니다.")
          .replace(/빠르게 파악하는 역할에 집중합니다\./g, "빠르게 읽을 수 있게 정리했습니다.")
          .trim();
      }

      function truncateText(value, maxLength) {
        const text = normalizeText(value);
        if (!text || text.length <= maxLength) {
          return text;
        }
        return `${text.slice(0, maxLength - 1)}...`;
      }

      function toAbbr(value, fallback) {
        const text = normalizeText(value);
        if (!text) {
          return fallback;
        }

        const parts = text.split(/[^a-zA-Z0-9]+/).filter(Boolean);
        if (parts.length >= 2) {
          return parts.slice(0, 2).map(part => part.charAt(0).toUpperCase()).join("");
        }

        return text.slice(0, 2).toUpperCase();
      }

      function getKindMeta(kind) {
        return KIND_META[kind] || {
          label: "Realm",
          engine: "Permission Realm",
          icon: "admin_panel_settings",
          color: "linear-gradient(135deg,#be185d,#fb7185)"
        };
      }

      function getStatusMeta(status) {
        return STATUS_META[status] || { label: "Unknown", tone: "info" };
      }

      function getRequestStatusMeta(status) {
        return REQUEST_STATUS_META[status] || { label: "Unknown", tone: "info" };
      }

      function buildKindCounts(realms, filterData) {
        const counts = new Map(Object.keys(KIND_META).map(kind => [kind, 0]));

        (realms || []).forEach(realm => {
          const key = normalizeText(realm.kind);
          if (!counts.has(key)) {
            counts.set(key, 0);
          }
          counts.set(key, (counts.get(key) || 0) + 1);
        });

        const apiKinds = Array.isArray(filterData && filterData.kinds) ? filterData.kinds : [];
        apiKinds.forEach(item => {
          const key = normalizeText(item && item.value);
          if (!key) {
            return;
          }
          counts.set(key, Number(item && item.count) || 0);
        });

        return counts;
      }

      function buildHeroStats(stats, realms, filterData) {
        const kindCounts = buildKindCounts(realms, filterData);
        const totalAssignedUsers = (realms || []).reduce((sum, realm) => (
          sum + (Array.isArray(realm && realm.roles)
            ? realm.roles.reduce((roleSum, role) => roleSum + (Number(role && role.memberCount) || 0), 0)
            : 0)
        ), 0);
        const totalMembers = Number(stats && stats.totalMembers);
        const pendingRequests = Number(stats && stats.pendingRequests);
        const boundProjectCount = Number(stats && stats.boundProjectCount);
        const manageableRealms = Number(stats && stats.manageableRealms);

        return [
          {
            icon: "admin_panel_settings",
            value: formatNumber(Number(stats && stats.totalRealms) || (realms || []).length),
            label: "등록 Realm",
            note: `scoped ${formatNumber(kindCounts.get("scoped") || 0)}`,
            color: "linear-gradient(135deg,#be185d,#ec4899)"
          },
          {
            icon: "groups",
            value: formatNumber(Number.isFinite(totalMembers) ? totalMembers : totalAssignedUsers),
            label: "배정 인원",
            note: "중복 포함 총 사용자수",
            color: "linear-gradient(135deg,#9d174d,#fb7185)"
          },
          {
            icon: "account_tree",
            value: formatNumber(Number.isFinite(boundProjectCount) ? boundProjectCount : (realms || []).reduce((sum, realm) => sum + Number(realm && realm.projectCount || 0), 0)),
            label: "연결된 프로젝트",
            note: "프로젝트 바인딩 기준",
            color: "linear-gradient(135deg,#db2777,#f472b6)"
          },
          {
            icon: "approval",
            value: formatNumber(Number.isFinite(pendingRequests) ? pendingRequests : 0),
            label: "요청 대기",
            note: `manageable realms ${formatNumber(Number.isFinite(manageableRealms) ? manageableRealms : 0)}`,
            color: "linear-gradient(135deg,#e11d48,#fb7185)"
          }
        ];
      }

      function buildFilters(filterData, realms) {
        const kindCounts = buildKindCounts(realms, filterData);

        return [
          { id: "all", icon: "apps", label: "전체" },
          ...Object.keys(KIND_META)
            .filter(kind => (kindCounts.get(kind) || 0) > 0)
            .map(kind => ({
              id: kind,
              icon: KIND_META[kind].icon,
              label: `${KIND_META[kind].label} (${formatNumber(kindCounts.get(kind) || 0)})`
            }))
        ];
      }

      function buildResourceDescription(total) {
        if (!Number.isFinite(total) || total <= 0) {
          return refineSectionDescription(
            "",
            "조회 가능한 Permission Realm이 없습니다. 권한과 연동 상태를 확인해 주세요."
          );
        }

        return refineSectionDescription(
          `${formatNumber(total)}개의 Permission Realm을 한곳에 모았습니다. 각 카드에서는 연결된 프로젝트와 포함된 Role을 함께 보고, 요청 흐름은 우측 패널에서 이어서 확인합니다.`,
          FALLBACK_CONFIG.resourceDescription
        );
      }

      function buildTipsPanel(panel) {
        if (!panel) {
          return FALLBACK_CONFIG.mainPanels[0];
        }

        return {
          icon: panel.icon || "tips_and_updates",
          label: panel.label || "Tips",
          title: panel.title || "권한 운영 팁",
          description: refineSectionDescription(
            panel.description,
            FALLBACK_CONFIG.mainPanels[0] && FALLBACK_CONFIG.mainPanels[0].description
          ),
          rows: panel.rows || [],
          footerLink: panel.footerLink
        };
      }

      function buildGuidePanel(panel) {
        if (!panel) {
          return FALLBACK_CONFIG.mainPanels[1];
        }

        return {
          icon: panel.icon || "menu_book",
          label: panel.label || "Guide Links",
          title: panel.title || "가이드 링크",
          description: refineSectionDescription(
            panel.description,
            FALLBACK_CONFIG.mainPanels[1] && FALLBACK_CONFIG.mainPanels[1].description
          ),
          rows: panel.rows || [],
          footerLink: panel.footerLink
        };
      }

      function buildRequestPanel(requests, realmMap) {
        const rows = (requests || []).slice(0, REQUEST_PANEL_LIMIT).map(request => {
          const statusMeta = getRequestStatusMeta(request && request.status);
          const realm = realmMap.get(normalizeText(request && request.realmId));
          const requesterName = normalizeText(request && request.requester && request.requester.name) || "unknown";
          const roleName = normalizeText(request && request.roleName) || "role";
          const realmName = normalizeText(realm && realm.name) || "Unknown Realm";
          const metaParts = [
            realmName,
            roleName,
            requesterName,
            formatRequestDate(request && request.createdAt)
          ];
          const reason = truncateText(request && request.reason, 48);

          return {
            title: `${requesterName} · ${roleName}`,
            meta: reason ? `${metaParts.join(" · ")} · ${reason}` : metaParts.join(" · "),
            pill: statusMeta
          };
        });

        return {
          icon: "pending_actions",
          label: "Request List",
          title: "현재 요청 목록",
          description: refineSectionDescription(
            (requests || []).length
              ? `${formatNumber((requests || []).length)}개의 최신 권한 요청을 우측 패널에서 바로 확인합니다.`
              : "현재 조회 가능한 권한 요청은 없지만, 새 요청이 들어오면 우측 패널에서 바로 확인합니다.",
            "Permission request inbox의 최신 요청을 실제 API 응답 기준으로 보여줍니다."
          ),
          rows: rows.length ? rows : [
            {
              title: "표시할 요청이 없습니다.",
              meta: "현재 조회 가능한 permission request가 없습니다."
            }
          ]
        };
      }

      function toConnection(binding, color) {
        return {
          abbr: toAbbr(binding && binding.label, "PR"),
          name: normalizeText(binding && binding.label) || "Unnamed Project",
          meta: normalizeText(binding && binding.role) ? `binding role · ${binding.role}` : "project binding",
          color,
          href: toProjectDetailHref(binding)
        };
      }

      function toPermissionDetailHref(realm) {
        const realmId = normalizeText(realm && realm.id);
        if (!realmId) {
          return "workspace_permission_detail.html";
        }

        return `workspace_permission_detail.html?realm=${encodeURIComponent(realmId)}&name=${encodeURIComponent(normalizeText(realm && realm.name) || realmId)}&kind=${encodeURIComponent(normalizeText(realm && realm.kind) || "scoped")}&status=${encodeURIComponent(normalizeText(realm && realm.status) || "active")}`;
      }

      function toProjectDetailHref(binding) {
        const projectId = normalizeText(binding && binding.id);
        const projectName = normalizeText(binding && binding.label);
        const projectKey = projectName || projectId;
        if (!projectKey) {
          return "workspace_projects_hub.html";
        }

        return `workspace_project_detail.html?project=${encodeURIComponent(projectKey)}`;
      }

      function getViewerRoleNames(realm) {
        const directRoles = Array.isArray(realm && realm.currentUserRoles) ? realm.currentUserRoles : [];
        if (directRoles.length) {
          return [...new Set(directRoles.map(role => normalizeText(role)).filter(Boolean))];
        }

        const capabilityRoles = [];
        if (realm && realm.capabilities && realm.capabilities.canApprove) {
          capabilityRoles.push("admin");
        }

        return capabilityRoles;
      }

      function buildResource(realm) {
        const kindMeta = getKindMeta(realm && realm.kind);
        const statusMeta = getStatusMeta(realm && realm.status);
        const boundProjects = Array.isArray(realm && realm.boundProjects) ? realm.boundProjects : [];
        const roles = Array.isArray(realm && realm.roles) ? realm.roles : [];
        const currentUserRoles = new Set(getViewerRoleNames(realm));
        const capabilityChips = [];

        if (realm && realm.capabilities && realm.capabilities.canApprove) {
          capabilityChips.push({ icon: "verified_user", text: "Manage enabled" });
        } else if (realm && realm.capabilities && realm.capabilities.canRequest) {
          capabilityChips.push({ icon: "person_add", text: "Request enabled" });
        }

        return {
          id: realm.id,
          categories: ["all", normalizeText(realm.kind)].filter(Boolean),
          status: statusMeta,
          engine: kindMeta.engine,
          icon: kindMeta.icon,
          name: normalizeText(realm.name) || "Unnamed Realm",
          meta: refineSectionDescription(
            realm && realm.description,
            `${kindMeta.label} Permission Realm`
          ),
          color: kindMeta.color,
          details: [
            { icon: "groups", text: `Members ${formatNumber(realm && realm.memberCount)}` },
            ...capabilityChips
          ],
          tagsFirst: true,
          connectionsLabel: "Projects",
          connectionsEqualWidth: true,
          connectionsMaxItems: 4,
          connectionsLayoutClass: "is-fixed-projects",
          connections: boundProjects.map(binding => toConnection(binding, kindMeta.color)),
          tagsLabel: "Roles",
          tags: roles.map(role => ({
            icon: "badge",
            text: `${normalizeText(role && role.name) || "role"}(${formatNumber(role && role.memberCount)})`,
            className: currentUserRoles.has(normalizeText(role && role.name)) ? "is-active-role" : "",
            title: currentUserRoles.has(normalizeText(role && role.name))
              ? "현재 접속자가 가진 role"
              : ""
          })),
          footer: formatDateTime(realm && realm.updatedAt),
          actions: [
            {
              kind: "open",
              label: "Detail",
              icon: "open_in_new",
              href: toPermissionDetailHref(realm)
            }
          ]
        };
      }

      async function fetchAllPages(path, params) {
        const items = [];
        let cursor = null;
        let total = 0;
        let hasNext = true;

        while (hasNext) {
          const payload = await fetchJson(path, {
            ...(params || {}),
            limit: params && params.limit ? params.limit : REALM_PAGE_LIMIT,
            ...(cursor ? { cursor } : {})
          });
          const pageItems = extractItems(payload);
          const nextCursor = extractNextCursor(payload);
          const pageTotal = extractPageTotal(payload, total || pageItems.length);

          items.push(...pageItems);
          total = pageTotal;
          cursor = nextCursor;
          hasNext = Boolean(nextCursor);

          if (!pageItems.length || (pageTotal > 0 && items.length >= pageTotal)) {
            hasNext = false;
          }
        }

        return {
          items,
          page: {
            total: total || items.length
          }
        };
      }

      function renderConfig(config) {
        window.HUB_CONFIG = config;
        if (typeof window.renderWorkspaceResourceHub === "function") {
          window.renderWorkspaceResourceHub(config);
          if (typeof window.refreshConceptEndpointOverlay === "function") {
            requestAnimationFrame(() => {
              window.refreshConceptEndpointOverlay();
            });
          }
        }
      }

      async function loadPermissionHub() {
        const results = await Promise.allSettled([
          fetchAllPages("/permissions/realms", { limit: REALM_PAGE_LIMIT, sort: "-updatedAt" }),
          fetchJson("/permissions/realms/stats"),
          fetchJson("/permissions/realms/filters"),
          fetchJson("/permissions/requests", { limit: REQUEST_PANEL_LIMIT, sort: "-createdAt" }),
          fetchJson("/panels/tips", { surface: "permissions" }),
          fetchJson("/panels/guide-links", { surface: "permissions" })
        ]);

        const [
          realmsResult,
          statsResult,
          filtersResult,
          requestsResult,
          tipsResult,
          guideResult
        ] = results;

        if (realmsResult.status !== "fulfilled") {
          throw realmsResult.reason;
        }

        const realmsPayload = realmsResult.value;
        const realmItems = extractItems(realmsPayload);
        const statsPayload = statsResult.status === "fulfilled" ? extractData(statsResult.value, null) : null;
        const filtersPayload = filtersResult.status === "fulfilled" ? extractData(filtersResult.value, null) : null;
        const requestsPayload = requestsResult.status === "fulfilled" ? requestsResult.value : null;
        const tipsPayload = tipsResult.status === "fulfilled" ? extractData(tipsResult.value, null) : null;
        const guidePayload = guideResult.status === "fulfilled" ? extractData(guideResult.value, null) : null;
        const realmMap = new Map(realmItems.map(item => [normalizeText(item && item.id), item]));
        const resourceTotal = extractPageTotal(realmsPayload, realmItems.length);

        renderConfig({
          ...FALLBACK_CONFIG,
          heroStats: buildHeroStats(statsPayload, realmItems, filtersPayload),
          filters: buildFilters(filtersPayload, realmItems),
          resourceDescription: buildResourceDescription(resourceTotal),
          resources: realmItems.map(buildResource),
          mainPanels: [
            buildTipsPanel(tipsPayload),
            buildGuidePanel(guidePayload)
          ],
          sidebarPanels: [
            buildRequestPanel(extractItems(requestsPayload), realmMap)
          ]
        });
      }

      const handleLoadError = (error) => {
        console.warn("[permission_hub] Failed to load permission hub data", error);

        renderConfig({
          ...FALLBACK_CONFIG,
          heroStats: [],
          resources: [],
          resourceDescription: "Permission Hub 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.",
          mainPanels: [
            {
              icon: "error",
              label: "Load Error",
              title: "Permission Hub 데이터를 읽지 못했습니다.",
              description: "권한 또는 API 응답 상태를 확인해 주세요.",
              rows: [
                { title: "API 호출 실패", meta: String(error && error.message || error || "Unknown error") }
              ]
            }
          ],
          sidebarPanels: [
            {
              icon: "pending_actions",
              label: "Request List",
              title: "현재 요청 목록",
              description: "Request inbox를 불러오지 못했습니다.",
              rows: [
                {
                  title: "상태 동기화 실패",
                  meta: "permission requests",
                  pill: { label: "Error", tone: "incident" }
                }
              ]
            }
          ]
        });
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          loadPermissionHub().catch(handleLoadError);
        }, { once: true });
      } else {
        loadPermissionHub().catch(handleLoadError);
      }
    })();
  </script>
  <script src="concept_endpoint_overlay.js"></script>
</body>
</html>
