<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <style>
    .form-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(320px, .8fr);
      gap: 18px;
      align-items: start;
    }
    .stack,
    .type-grid,
    .preview-list {
      display: grid;
      gap: 16px;
    }
    .field-card,
    .preview-card,
    .type-card {
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
      box-shadow: 0 14px 28px rgba(15, 23, 42, .04);
    }
    .field-card,
    .preview-card {
      padding: 20px;
    }
    .field-label,
    .mini-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .text-input {
      width: 100%;
      height: 48px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      padding: 0 14px;
      font: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .text-input:focus {
      border-color: rgba(8, 145, 178, .34);
      box-shadow: 0 0 0 4px rgba(8, 145, 178, .08);
    }
    .field-help,
    .preview-help,
    .form-note {
      margin-top: 10px;
      color: var(--subtle);
      font-size: 12px;
      line-height: 1.55;
    }
    .type-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .type-card {
      position: relative;
      padding: 18px;
      cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .type-card:hover {
      border-color: rgba(8, 145, 178, .22);
      box-shadow: 0 16px 30px rgba(15, 23, 42, .08);
      transform: translateY(-1px);
    }
    .type-card.is-active {
      border-color: rgba(8, 145, 178, .3);
      box-shadow: 0 16px 30px rgba(15, 23, 42, .08), inset 0 0 0 1px rgba(8, 145, 178, .1);
      background: linear-gradient(180deg, #ffffff 0%, #f3fbff 100%);
    }
    .type-card input {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }
    .type-top,
    .preview-top,
    .preview-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .type-icon,
    .preview-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
    }
    .type-card[data-type="API"] .type-icon,
    .preview-icon.api {
      background: linear-gradient(135deg, #2563eb, #06b6d4);
    }
    .type-card[data-type="WEB"] .type-icon,
    .preview-icon.web {
      background: linear-gradient(135deg, #0f766e, #34d399);
    }
    .type-title,
    .preview-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.02em;
      margin-bottom: 4px;
    }
    .type-desc,
    .preview-meta,
    .preview-value {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .preview-list {
      gap: 14px;
      margin-top: 18px;
    }
    .preview-item {
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #fbfcfe;
    }
    .preview-value strong {
      color: var(--text);
      font-weight: 800;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(8, 145, 178, .1);
      color: var(--brand);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }
    .action-row {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 22px;
    }
    .action-row .action-btn {
      min-width: 148px;
      justify-content: center;
    }
    @media (max-width: 980px) {
      .form-layout {
        grid-template-columns: 1fr;
      }
    }
    @media (max-width: 720px) {
      .type-grid {
        grid-template-columns: 1fr;
      }
      .action-row {
        flex-direction: column-reverse;
      }
      .action-row .action-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      const STORAGE_KEY = "workspace.chatbotHub.customResources";
      const RESERVED_KEYS = [
        "support-assistant-api",
        "docs-guide-widget",
        "ops-briefing-bot",
        "pricing-advisor-bot"
      ];

      const parseStoredChatbots = () => {
        try {
          const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          console.warn("Failed to parse stored chatbots", error);
          return [];
        }
      };

      const normalizeKey = (value) => String(value || "")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/(^-|-$)/g, "") || "chatbot";

      const isValidUrl = (value) => {
        try {
          const parsed = new URL(value);
          return parsed.protocol === "http:" || parsed.protocol === "https:";
        } catch (error) {
          return false;
        }
      };

      const app = document.getElementById("app");
      app.innerHTML = `
        <div
          data-ax-topbar
          data-active-key="chatbot-hub"
          data-search-placeholder="챗봇 이름, API, WEB을 검색하세요..."
          data-search-source="workspace-chatbot-register"
          data-search-source-label="Chatbot Register"
          data-search-default-type="chatbot"
        ></div>

        <main class="page">
          <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a href="portal_launchpad.html">Launchpad</a>
            <span class="material-icons-round" aria-hidden="true">chevron_right</span>
            <a href="workspace_chatbot_hub.html">Chatbot Hub</a>
            <span class="material-icons-round" aria-hidden="true">chevron_right</span>
            <span>New Chatbot</span>
          </nav>

          <section class="panel hero">
            <div class="hero-top">
              <div>
                <div class="eyebrow"><span class="material-icons-round" style="font-size:16px;">chat</span>AI · Chat Endpoints</div>
                <div class="hero-title-row">
                  <h1 class="hero-title">새 Chatbot 등록</h1>
                  <span class="pill engine">API / WEB</span>
                </div>
                <p class="hero-desc">이름, Type, Current URL만 입력하면 Chatbot Hub에 새 카드가 추가됩니다. 샘플 페이지 기준으로 브라우저 localStorage에 저장한 뒤 허브에서 바로 보이도록 연결합니다.</p>
              </div>
              <div class="hero-actions">
                <a class="action-btn secondary" href="workspace_chatbot_hub.html"><span class="material-icons-round">arrow_back</span>Chatbot Hub</a>
              </div>
            </div>
          </section>

          <form class="form-layout" id="chatbotRegisterForm">
            <div class="stack">
              <section class="panel section">
                <div class="section-head">
                  <div>
                    <div class="section-kicker"><span class="material-icons-round">badge</span>Basic</div>
                    <h2 class="section-title">기본 정보</h2>
                    <p class="section-desc">허브 카드에 바로 노출할 핵심 정보만 입력합니다.</p>
                  </div>
                </div>
                <div class="stack">
                  <article class="field-card">
                    <label class="field-label" for="chatbotName"><span class="material-icons-round" style="font-size:16px;">smart_toy</span>Chatbot 이름</label>
                    <input class="text-input" id="chatbotName" name="name" type="text" placeholder="예: sales-assistant-api" autocomplete="off" required />
                    <div class="field-help">허브 카드 제목과 초대 모달 제목에 그대로 사용됩니다.</div>
                  </article>

                  <article class="field-card">
                    <div class="field-label"><span class="material-icons-round" style="font-size:16px;">category</span>Type</div>
                    <div class="type-grid" id="typeGrid">
                      <label class="type-card is-active" data-type="API">
                        <input type="radio" name="type" value="API" checked />
                        <div class="type-top">
                          <div>
                            <div class="type-title">API</div>
                            <div class="type-desc">OpenAI-compatible 또는 직접 호출하는 chatbot endpoint</div>
                          </div>
                          <div class="type-icon"><span class="material-icons-round">api</span></div>
                        </div>
                      </label>
                      <label class="type-card" data-type="WEB">
                        <input type="radio" name="type" value="WEB" />
                        <div class="type-top">
                          <div>
                            <div class="type-title">WEB</div>
                            <div class="type-desc">사용자가 직접 접속하는 hosted page 또는 widget URL</div>
                          </div>
                          <div class="type-icon"><span class="material-icons-round">language</span></div>
                        </div>
                      </label>
                    </div>
                  </article>

                  <article class="field-card">
                    <label class="field-label" for="chatbotUrl"><span class="material-icons-round" style="font-size:16px;">link</span>Current URL</label>
                    <input class="text-input" id="chatbotUrl" name="currentUrl" type="url" inputmode="url" placeholder="https://chat.example.com/assistant" required />
                    <div class="field-help"><code>http://</code> 또는 <code>https://</code> 로 시작하는 실제 접속 URL을 입력합니다.</div>
                  </article>
                </div>
              </section>
            </div>

            <aside class="stack">
              <section class="panel section">
                <div class="section-head">
                  <div>
                    <div class="section-kicker"><span class="material-icons-round">preview</span>Preview</div>
                    <h2 class="section-title">생성 미리보기</h2>
                    <p class="section-desc">입력값으로 Chatbot Hub 카드가 어떻게 보일지 간단히 확인합니다.</p>
                  </div>
                </div>
                <article class="preview-card">
                  <div class="preview-top">
                    <div>
                      <div class="preview-title" id="previewName">새 chatbot</div>
                      <div class="preview-meta" id="previewMeta">사용자 등록 chatbot endpoint</div>
                    </div>
                    <div class="preview-icon api" id="previewIcon"><span class="material-icons-round" id="previewIconGlyph">api</span></div>
                  </div>
                  <div class="preview-list">
                    <div class="preview-item">
                      <div>
                        <div class="mini-kicker"><span class="material-icons-round" style="font-size:16px;">sell</span>Type</div>
                        <div class="preview-value"><strong id="previewType">API</strong></div>
                      </div>
                      <div class="status-chip"><span class="material-icons-round" style="font-size:16px;">check_circle</span>Live</div>
                    </div>
                    <div class="preview-item">
                      <div>
                        <div class="mini-kicker"><span class="material-icons-round" style="font-size:16px;">link</span>Current URL</div>
                        <div class="preview-value" id="previewUrl">https://chat.example.com/assistant</div>
                      </div>
                    </div>
                  </div>
                  <div class="preview-help">생성된 항목은 현재 브라우저의 localStorage에 저장되며, Chatbot Hub 상단 카드 목록과 Publish Queue에 함께 반영됩니다.</div>
                </article>
              </section>

              <section class="panel section">
                <div class="section-head">
                  <div>
                    <div class="section-kicker"><span class="material-icons-round">done</span>Create</div>
                    <h2 class="section-title">등록 실행</h2>
                    <p class="section-desc">입력이 끝나면 바로 Chatbot Hub로 돌아가 새 항목을 확인할 수 있습니다.</p>
                  </div>
                </div>
                <div class="form-note">같은 이름의 Chatbot은 중복 등록하지 않도록 막아두었습니다.</div>
                <div class="action-row">
                  <a class="action-btn secondary" href="workspace_chatbot_hub.html"><span class="material-icons-round">close</span>취소</a>
                  <button class="action-btn primary" type="submit"><span class="material-icons-round">check_circle</span>Chatbot 생성</button>
                </div>
              </section>
            </aside>
          </form>
        </main>
      `;

      const form = document.getElementById("chatbotRegisterForm");
      const nameInput = document.getElementById("chatbotName");
      const urlInput = document.getElementById("chatbotUrl");
      const typeGrid = document.getElementById("typeGrid");
      const previewName = document.getElementById("previewName");
      const previewMeta = document.getElementById("previewMeta");
      const previewType = document.getElementById("previewType");
      const previewUrl = document.getElementById("previewUrl");
      const previewIcon = document.getElementById("previewIcon");
      const previewIconGlyph = document.getElementById("previewIconGlyph");

      const getSelectedType = () => form.querySelector('input[name="type"]:checked')?.value || "API";

      const updateTypeCards = () => {
        typeGrid.querySelectorAll('.type-card').forEach((card) => {
          const radio = card.querySelector('input[type="radio"]');
          card.classList.toggle('is-active', Boolean(radio?.checked));
        });
      };

      const updatePreview = () => {
        const type = getSelectedType();
        const isApi = type === "API";
        previewName.textContent = nameInput.value.trim() || "새 chatbot";
        previewMeta.textContent = isApi ? "사용자 등록 chatbot API endpoint" : "사용자 등록 chatbot web endpoint";
        previewType.textContent = type;
        previewUrl.textContent = urlInput.value.trim() || "https://chat.example.com/assistant";
        previewIcon.className = `preview-icon ${isApi ? "api" : "web"}`;
        previewIconGlyph.textContent = isApi ? "api" : "language";
        updateTypeCards();
      };

      [nameInput, urlInput].forEach((input) => {
        input.addEventListener("input", () => {
          input.setCustomValidity("");
          updatePreview();
        });
      });

      form.querySelectorAll('input[name="type"]').forEach((radio) => {
        radio.addEventListener("change", updatePreview);
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        nameInput.setCustomValidity("");
        urlInput.setCustomValidity("");

        const name = nameInput.value.trim();
        const type = getSelectedType();
        const currentUrl = urlInput.value.trim();

        if (!name) {
          nameInput.reportValidity();
          return;
        }

        if (!isValidUrl(currentUrl)) {
          urlInput.setCustomValidity("http:// 또는 https:// URL을 입력하세요.");
          urlInput.reportValidity();
          urlInput.focus();
          return;
        }

        const key = normalizeKey(name);
        const stored = parseStoredChatbots();
        const reserved = new Set([...RESERVED_KEYS, ...stored.map((item) => item.key)]);
        if (reserved.has(key)) {
          nameInput.setCustomValidity("이미 등록된 이름입니다. 다른 이름을 입력하세요.");
          nameInput.reportValidity();
          nameInput.focus();
          return;
        }

        stored.unshift({
          key,
          name,
          type,
          currentUrl,
          createdAt: new Date().toISOString()
        });

        localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
        window.location.href = "workspace_chatbot_hub.html";
      });

      updatePreview();
    })();
  </script>
  <script src="ax_studio_topbar.js"></script>
</body>
</html>
