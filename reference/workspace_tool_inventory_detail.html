<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool Inventory Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .metric-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:12px;
    }
    .usage-card {
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-soft);
      padding:20px;
    }
    .usage-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:14px;
    }
    .usage-name {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .usage-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      margin-top:4px;
    }
    .usage-value {
      font-size:28px;
      font-weight:800;
      letter-spacing:-.04em;
      text-align:right;
    }
    .usage-track {
      height:14px;
      border-radius:999px;
      background:#e8edf5;
      overflow:hidden;
      margin-bottom:12px;
    }
    .usage-fill {
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,var(--brand),var(--accent));
    }
    .usage-legend {
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .mini-stats {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
      margin-top:16px;
    }
    .mini-stat {
      padding:14px;
      border-radius:16px;
      background:#fff;
      border:1px solid var(--border);
    }
    .mini-stat-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      margin-bottom:6px;
    }
    .mini-stat-value {
      font-size:18px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:4px;
    }
    .mini-stat-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .access-grid {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:18px;
    }
    .project-list {
      display:grid;
      gap:12px;
    }
    .project-card {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      padding:16px 18px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-soft);
    }
    .project-main {
      min-width:0;
      display:grid;
      gap:7px;
    }
    .project-top {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }
    .project-name {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .project-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .project-tags {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .project-side {
      display:grid;
      gap:8px;
      justify-items:end;
      text-align:right;
    }
    .tiny-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    .tiny-value {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .project-link {
      display:inline-flex;
      align-items:center;
      gap:5px;
      color:var(--brand);
      font-size:12px;
      font-weight:800;
    }
    .section-card-spacer {
      margin-top:18px;
    }
    .linked-row {
      color:inherit;
      text-decoration:none;
      border-radius:14px;
      padding:14px 16px;
      margin:0 -4px;
      border:1px solid transparent;
      transition:border-color .15s ease, background .15s ease, transform .15s ease;
    }
    .linked-row:hover {
      border-color:rgba(37,99,235,.14);
      background:#f8fbff;
      transform:translateY(-1px);
    }
    .linked-row .list-side {
      color:var(--brand);
      font-weight:700;
    }
    .section-stack {
      margin-top:16px;
    }
    @media (max-width: 920px) {
      .metric-grid,
      .mini-stats,
      .access-grid {
        grid-template-columns:1fr;
      }
      .project-card {
        grid-template-columns:1fr;
      }
      .project-side {
        justify-items:start;
        text-align:left;
      }
      .usage-head,
      .usage-legend {
        flex-direction:column;
        align-items:flex-start;
      }
      .usage-value {
        text-align:left;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function cards(rows) {
      return rows.map((row) => `<article class="card"><div class="card-title">${row.title}</div><div class="card-desc">${row.desc}</div><div class="tag-row">${row.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}</div></article>`).join("");
    }
    function list(rows) {
      return rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div>${row.side ? `<div class="list-side">${row.side}</div>` : ""}</div>`).join("");
    }
    function table(rows) {
      return `<div class="table-wrap"><table><thead><tr><th>Function</th><th>Tool</th><th>Usage</th><th>Used By</th><th>Purpose</th></tr></thead><tbody>${rows.map((row) => `<tr><td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td>${row[3]}</td><td>${row[4]}</td></tr>`).join("")}</tbody></table></div>`;
    }
    function progress(rows) {
      return rows.map((row) => `<article class="progress-card"><div class="progress-top"><div class="progress-title">${row.title}</div><div class="progress-value">${row.value}</div></div><div class="progress-bar"><div class="progress-fill" style="width:${row.percent}%;"></div></div><div class="progress-meta">${row.meta}</div></article>`).join("");
    }
    function timeline(rows) {
      return rows.map((row) => `<div class="timeline-row"><div class="timeline-rail"><span class="timeline-dot"></span></div><div class="timeline-card"><div class="timeline-title">${row.title}</div><div class="timeline-meta">${row.meta}</div></div></div>`).join("");
    }
    function kv(rows) {
      return rows.map((row) => `<div class="kv-item"><div class="kv-key">${row.key}</div><div class="kv-value">${row.value}</div></div>`).join("");
    }
    function metrics(rows) {
      return `<div class="metric-grid">${rows.map((row) => `<article class="metric-card"><div class="metric-label">${row.title}</div><div class="metric-value">${row.value}</div><div class="metric-meta">${row.meta}</div></article>`).join("")}</div>`;
    }
    function linkedList(rows) {
      return rows.map((row) => `<a class="list-row linked-row" href="${row.href}"><div class="list-main"><div class="list-title">${row.title}</div><div class="list-meta">${row.meta}</div></div>${row.side ? `<div class="list-side">${row.side}</div>` : ""}</a>`).join("");
    }
    function toolUsageList(rows) {
      return `<div class="info-list">${rows.map((row) => `<div class="list-row"><div class="list-main"><div class="list-title">${row[0]}</div><div class="list-meta">${row[1]} · ${row[4]}</div></div><div class="list-side">${row[2]}</div></div>`).join("")}</div>`;
    }
    function keyBindingCards(rows) {
      return `<div class="project-list">${rows.map((row) => `
        <article class="project-card">
          <div class="project-main">
            <div class="project-top">
              <div class="project-name">${row.title}</div>
              <span class="tag">Keycenter 발급</span>
            </div>
            <div class="project-meta">${row.meta}</div>
            <div class="project-tags">
              <span class="tag">현재 바인딩</span>
              <span class="tag">${row.side || "Connected"}</span>
            </div>
          </div>
          <div class="project-side">
            <div class="tiny-label">Key Scope</div>
            <div class="tiny-value">${row.side || "Connected"}</div>
            <a class="project-link" href="workspace_keycenter_hub.html">Keycenter 보기<span class="material-icons-round">chevron_right</span></a>
          </div>
        </article>
      `).join("")}</div>`;
    }
    function consumerCards(rows) {
      return `<div class="project-list">${rows.map((row) => `
        <article class="project-card">
          <div class="project-main">
            <div class="project-top">
              <div class="project-name">${row.title}</div>
              <span class="tag">${row.badge || "Consumer"}</span>
            </div>
            <div class="project-meta">${row.meta}</div>
            <div class="project-tags">
              ${(row.tags || []).map((tag) => `<span class="tag">${tag}</span>`).join("")}
            </div>
          </div>
          <div class="project-side">
            <div class="tiny-label">${row.sideLabel || "Kind"}</div>
            <div class="tiny-value">${row.sideValue || "-"}</div>
            <a class="project-link" href="${row.href || "workspace_tool_inventory_hub.html"}">${row.linkLabel || "상세 보기"}<span class="material-icons-round">chevron_right</span></a>
          </div>
        </article>
      `).join("")}</div>`;
    }
    function buildItem(item) {
      const usageRow = item.progress[0];
      const healthRow = item.progress[1];
      const accessFacts = item.facts.filter((fact) => ["Type", "Format", "Endpoint", "대표 function tool"].includes(fact.key));
      return {
        ...item,
        layoutMode: "full-width",
        mainHtml: `
          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">stacked_bar_chart</span>Usage Overview</div>
                <h2 class="section-title">사용 현황</h2>
                <p class="section-desc">현재 호출량과 자주 쓰는 function을 중심으로 볼 수 있습니다.</p>
              </div>
            </div>
            <article class="usage-card">
              <div class="usage-head">
                <div>
                  <div class="usage-name">${usageRow.title}</div>
                  <div class="usage-meta">${usageRow.meta}</div>
                </div>
                <div class="usage-value">${usageRow.value}</div>
              </div>
              <div class="usage-track"><div class="usage-fill" style="width:${usageRow.percent}%;"></div></div>
              <div class="usage-legend">
                <span>최근 24시간 기준</span>
                <span>${healthRow.value} health</span>
              </div>
              <div class="mini-stats">
                <article class="mini-stat">
                  <div class="mini-stat-label">Health</div>
                  <div class="mini-stat-value">${healthRow.value}</div>
                  <div class="mini-stat-meta">${healthRow.meta}</div>
                </article>
                <article class="mini-stat">
                  <div class="mini-stat-label">Function Tool</div>
                  <div class="mini-stat-value">${item.tools.length}</div>
                  <div class="mini-stat-meta">현재 등록된 function, tool 수</div>
                </article>
                <article class="mini-stat">
                  <div class="mini-stat-label">Key Bindings</div>
                  <div class="mini-stat-value">${item.boundKeys.length}</div>
                  <div class="mini-stat-meta">Keycenter에서 연결된 key 수</div>
                </article>
                <article class="mini-stat">
                  <div class="mini-stat-label">Format</div>
                  <div class="mini-stat-value">${item.facts.find((fact) => fact.key === "Format")?.value || "-"}</div>
                  <div class="mini-stat-meta">현재 등록된 연결 포맷</div>
                </article>
              </div>
            </article>
            <article class="card section-card-spacer">
              <div class="card-title">많이 쓰는 Function</div>
              <div class="card-desc">사용량이 높은 function과 tool을 먼저 확인할 수 있습니다.</div>
              <div class="section-stack">${toolUsageList(item.tools.slice(0, 3))}</div>
            </article>
          </section>
          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">vpn_key</span>Access</div>
                <h2 class="section-title">접근 정보</h2>
                <p class="section-desc">엔드포인트와 바인딩된 key를 함께 확인할 수 있습니다.</p>
              </div>
              <a class="section-link" href="workspace_keycenter_hub.html">Keycenter 보기<span class="material-icons-round">chevron_right</span></a>
            </div>
            <article class="card">
              <div class="card-title">접속 정보</div>
              <div class="kv-list">${kv(accessFacts)}</div>
            </article>
          </section>
          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">link</span>Connection Status</div>
                <h2 class="section-title">연결 상태</h2>
                <p class="section-desc">Keycenter에서 생성된 바인딩 key와 현재 연결 상태를 확인할 수 있습니다.</p>
              </div>
              <a class="section-link" href="workspace_keycenter_hub.html">Keycenter 보기<span class="material-icons-round">chevron_right</span></a>
            </div>
            ${keyBindingCards(item.boundKeys)}
          </section>
          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">functions</span>Function Catalog</div>
                <h2 class="section-title">Function, Tool 목록</h2>
                <p class="section-desc">실제로 등록된 function과 tool을 사용량과 함께 확인할 수 있습니다.</p>
              </div>
            </div>
            ${table(item.tools)}
          </section>
          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">lightbulb</span>Usage Tips</div>
                <h2 class="section-title">사용 팁</h2>
                <p class="section-desc">자주 쓰는 흐름과 주의할 점을 빠르게 확인합니다.</p>
              </div>
            </div>
            <div class="info-list">${list(item.tips)}</div>
          </section>
        `,
        sidebarHtml: ""
      };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function mono(value) {
      return `<span class="mono">${escapeHtml(value || "-")}</span>`;
    }

    function formatDateLabel(value) {
      if (!value) {
        return "N/A";
      }

      const date = new Date(value);
      if (Number.isNaN(date.valueOf())) {
        return "N/A";
      }

      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function formatRelativeTimeLabel(value) {
      if (!value) {
        return "갱신 시각 정보 없음";
      }

      const date = new Date(value);
      if (Number.isNaN(date.valueOf())) {
        return "갱신 시각 정보 없음";
      }

      const diffMs = Date.now() - date.valueOf();
      const diffMinutes = Math.max(0, Math.round(diffMs / 60000));
      if (diffMinutes < 1) {
        return "방금 갱신";
      }
      if (diffMinutes < 60) {
        return `${diffMinutes}분 전 갱신`;
      }
      const diffHours = Math.round(diffMinutes / 60);
      if (diffHours < 24) {
        return `${diffHours}시간 전 갱신`;
      }
      const diffDays = Math.round(diffHours / 24);
      return `${diffDays}일 전 갱신`;
    }

    function clampPercent(value, fallback = 0) {
      const number = Number(value);
      if (!Number.isFinite(number)) {
        return fallback;
      }
      return Math.max(0, Math.min(100, Math.round(number)));
    }

    function buildToolInventoryPlaceholder(key, options = {}) {
      const title = escapeHtml(options.title || key || "tool-inventory");
      const description = escapeHtml(options.description || "Tool Inventory 상세를 실제 API에서 불러오는 중입니다.");
      const statusLabel = escapeHtml(options.statusLabel || "Loading");
      const statusTone = options.statusTone || "review";

      return {
        key,
        id: key,
        title,
        description,
        heroIcon: "inventory_2",
        typeLabel: "Tool Inventory",
        statusLabel,
        statusTone,
        heroBadges: ["API detail"],
        theme: { bg: "#ebf1ff", brand: "#3b5ccc", brandH: "#314ca6", brandBg: "#d4deff", brandSoft: "rgba(59,92,204,.18)", accent: "#38bdf8" },
        actions: [
          { label: "Tool Inventory Hub", icon: "inventory_2", href: "workspace_tool_inventory_hub.html" }
        ],
        heroStats: [
          { label: "Lookup", value: "1", meta: mono(key || "-") },
          { label: "Functions", value: "0", meta: "detail 로딩 중" },
          { label: "Consumers", value: "0", meta: "detail 로딩 중" },
          { label: "Status", value: statusLabel, meta: "API 응답 대기" }
        ],
        layoutMode: "full-width",
        mainHtml: `
          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">sync</span>Loading</div>
                <h2 class="section-title">현재 정보를 불러오는 중입니다</h2>
                <p class="section-desc">${description}</p>
              </div>
            </div>
            <article class="card">
              <div class="card-title">Lookup Key</div>
              <div class="kv-list">${kv([
                { key: "item", value: mono(key || "-") },
                { key: "상태", value: escapeHtml(statusLabel) }
              ])}</div>
            </article>
          </section>
        `,
        sidebarHtml: "",
        __isLoading: Boolean(options.isLoading ?? true)
      };
    }

    function buildConsumerRows(detail) {
      const refs = Array.isArray(detail?.consumers?.refs) ? detail.consumers.refs : [];
      if (!refs.length) {
        return [{
          title: "연결된 consumer 없음",
          meta: "현재 agent/chatbot consumer ref가 등록되지 않았습니다.",
          badge: "None",
          tags: ["No Consumer"],
          sideLabel: "Status",
          sideValue: "Empty",
          href: "workspace_tool_inventory_hub.html",
          linkLabel: "허브로 돌아가기"
        }];
      }

      return refs.map((ref) => {
        const kind = String(ref?.kind || "consumer").toLowerCase();
        const id = String(ref?.id || "").trim();
        const label = escapeHtml(ref?.label || ref?.id || "consumer");
        const href = kind === "agent"
          ? `workspace_agent_detail.html?item=${encodeURIComponent(id || ref?.label || "")}`
          : kind === "chatbot"
            ? `workspace_chatbot_detail.html?item=${encodeURIComponent(id || ref?.label || "")}`
            : "workspace_tool_inventory_hub.html";

        return {
          title: label,
          meta: `${escapeHtml(id || "consumer-id 없음")} · Tool Inventory consumer reference`,
          badge: kind === "agent" ? "Agent" : kind === "chatbot" ? "Chatbot" : "Consumer",
          tags: [escapeHtml(kind), escapeHtml(detail?.statusLabel || detail?.status || "-")],
          sideLabel: "Kind",
          sideValue: kind === "agent" ? "Agent" : kind === "chatbot" ? "Chatbot" : "Consumer",
          href,
          linkLabel: kind === "agent" ? "Agent detail 보기" : kind === "chatbot" ? "Chatbot detail 보기" : "상세 보기"
        };
      });
    }

    function buildDynamicToolInventoryItem(detail) {
      const endpoint = detail?.accessEndpointUrl || detail?.openUrl || detail?.endpointUrl || detail?.openapiSpecUrl || "";
      const sourceUrl = detail?.endpointUrl || detail?.openapiSpecUrl || "";
      const canViewSource = Boolean(sourceUrl);
      const toolCount = Number(detail?.toolCount || detail?.tooling?.itemCount || 0);
      const consumerCount = Number(detail?.consumerCount || 0);
      const tools = Array.isArray(detail?.tools) ? detail.tools : [];
      const topToolLabels = tools.slice(0, 3).map((tool) => escapeHtml(tool?.name || tool?.id || "tool"));
      const consumerRows = buildConsumerRows(detail);
      const toolRows = tools.length
        ? tools.map((tool) => [
          escapeHtml(tool?.name || tool?.id || "tool"),
          escapeHtml(detail?.name || detail?.slug || "inventory"),
          escapeHtml(detail?.formatLabel || detail?.format || "Registered"),
          escapeHtml(
            consumerRows[0]?.title === "연결된 consumer 없음"
              ? "No consumer"
              : consumerRows.map((row) => row.title.replace(/<[^>]+>/g, "")).slice(0, 2).join(", ")
          ),
          escapeHtml(tool?.summary || "등록된 tool descriptor")
        ])
        : [[
          escapeHtml(detail?.slug || detail?.id || "inventory"),
          escapeHtml(detail?.name || detail?.slug || "inventory"),
          "Registered",
          consumerCount > 0 ? escapeHtml(String(consumerCount)) : "No consumer",
          "등록된 tool descriptor가 없습니다."
        ]];
      const accessFacts = [
        { key: "Type", value: escapeHtml(detail?.typeLabel || detail?.type || "-") },
        { key: "Scope", value: escapeHtml(detail?.scopeLabel || detail?.scopeType || "-") },
        { key: "Format", value: escapeHtml(detail?.formatLabel || detail?.format || "-") },
        { key: "Endpoint", value: mono(endpoint || "-") },
        { key: "Transport", value: escapeHtml(detail?.transport || "-") },
        { key: "Auth", value: escapeHtml(detail?.authMode || "-") },
        { key: "Slug", value: mono(detail?.slug || detail?.id || "-") }
      ];
      if (canViewSource) {
        accessFacts.splice(4, 0, { key: "Source", value: mono(sourceUrl) });
      }
      const tips = [
        {
          title: "Access endpoint는 LiteLLM runtime 기준입니다",
          meta: endpoint
            ? `현재 endpoint는 ${escapeHtml(detail?.slug || detail?.id || "-")} slug를 기준으로 계산한 runtime 접근 경로입니다.`

  <script src="workspace_detail_shared.js"></script>
  <script src="ax_studio_topbar.js"></script>
  <script>
    (function () {
      const config = window.DETAIL_PAGE_CONFIG;
      const params = new URLSearchParams(window.location.search);
      const requestedKey = params.get(config?.paramName || "item");
      const renderKey = requestedKey || "__auto__";

      function requestJson(url) {
        return fetch(url, {
          method: "GET",
          credentials: "same-origin",
          cache: "no-store",
          headers: {
            Accept: "application/json"
          }
        })
          .then(async (response) => {
            const payload = await response.json().catch(() => null);
            if (!response.ok) {
              throw new Error(payload?.error?.message || `Request failed (${response.status})`);
            }
            return payload;
          });
      }

      function remountTopbar() {
        const topbarHost = document.querySelector("[data-ax-topbar]");
        if (topbarHost && window.mountAxStudioTopbar) {
          window.mountAxStudioTopbar(topbarHost);
        }
      }

      function rerender(nextItem) {
        window.DETAIL_PAGE_CONFIG.items[renderKey] = nextItem;
        window.renderWorkspaceDetailPage?.();
        remountTopbar();
      }

      const loadDetail = requestedKey
        ? requestJson(`/api/v2/tool-inventory/${encodeURIComponent(requestedKey)}`)
        : requestJson("/api/v2/tool-inventory?limit=1")
          .then((payload) => {
            const firstItem = Array.isArray(payload?.items) ? payload.items[0] : null;
            if (!firstItem) {
              throw new Error("등록된 tool inventory가 없습니다.");
            }
            return { data: firstItem };
          });

      loadDetail
        .then((payload) => {
          if (!payload?.data) {
            throw new Error("Tool inventory detail payload is empty");
          }

          rerender(buildDynamicToolInventoryItem(payload.data));
        })
        .catch((error) => {
          console.error("Failed to load tool inventory detail", error);
          rerender(buildToolInventoryPlaceholder(renderKey, {
            title: requestedKey || "tool-inventory",
            description: `요청한 tool inventory 정보를 불러오지 못했습니다. ${error?.message || "Unknown error"}`,
            statusLabel: "Unavailable",
            statusTone: "review",
            isLoading: false
          }));
        });
    })();
  </script>
