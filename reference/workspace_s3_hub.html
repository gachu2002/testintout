  <style>
    .bucket-bind-shell {
      width:min(760px, calc(100vw - 32px));
    }
    .bucket-bind-search-wrap {
      display:grid;
      gap:12px;
    }
    .bucket-bind-search {
      display:flex;
      align-items:center;
      gap:10px;
      min-height:54px;
      padding:0 16px;
      border:1px solid rgba(15,118,110,.14);
      border-radius:16px;
      background:#fff;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
    }
    .bucket-bind-search .material-icons-round {
      color:#0f766e;
      font-size:20px;
    }
    .bucket-bind-search input {
      flex:1 1 auto;
      min-width:0;
      height:54px;
      border:none;
      outline:none;
      background:transparent;
      font:inherit;
      color:#0f172a;
    }
    .bucket-bind-search-meta {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      color:#475569;
      font-size:12px;
      line-height:1.5;
    }
    .bucket-bind-status {
      display:flex;
      align-items:center;
      gap:6px;
      min-height:20px;
    }
    .bucket-bind-status.is-error {
      color:#b91c1c;
    }
    .bucket-bind-results {
      display:grid;
      gap:10px;
      max-height:360px;
      overflow:auto;
      padding-right:4px;
    }
    .bucket-bind-results::-webkit-scrollbar {
      width:10px;
    }
    .bucket-bind-results::-webkit-scrollbar-thumb {
      border-radius:999px;
      background:rgba(148,163,184,.45);
      border:2px solid transparent;
      background-clip:padding-box;
    }
    .bucket-bind-section {
      display:grid;
      gap:10px;
    }
    .bucket-bind-section-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      color:#475569;
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .bucket-bind-option {
      display:grid;
      gap:10px;
      width:100%;
      padding:16px 18px;
      border:1px solid rgba(148,163,184,.22);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.96) 0%, rgba(248,250,252,.98) 100%);
      text-align:left;
      transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .bucket-bind-option:hover {
      transform:translateY(-1px);
      border-color:rgba(15,118,110,.28);
      box-shadow:0 12px 24px rgba(15,23,42,.07);
    }
    .bucket-bind-option.is-selected {
      border-color:#0f766e;
      box-shadow:0 0 0 3px rgba(15,118,110,.12);
    }
    .bucket-bind-option.is-bound {
      background:rgba(241,245,249,.72);
      border-style:dashed;
      color:#64748b;
    }
    .bucket-bind-option[disabled] {
      cursor:not-allowed;
      transform:none;
      box-shadow:none;
      opacity:.88;
    }
    .bucket-bind-option-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .bucket-bind-option-copy {
      display:grid;
      gap:4px;
      min-width:0;
    }
    .bucket-bind-option-name {
      font-size:15px;
      font-weight:800;
      color:#0f172a;
      line-height:1.35;
      word-break:break-word;
    }
    .bucket-bind-option-meta {
      color:#475569;
      font-size:12px;
      line-height:1.5;
      word-break:break-word;
    }
    .bucket-bind-option-tags {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .bucket-bind-tag {
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:28px;
      padding:0 10px;
      border-radius:999px;
      background:rgba(15,118,110,.08);
      color:#0f766e;
      font-size:11px;
      font-weight:700;
    }
    .bucket-bind-tag.tone-muted {
      background:rgba(148,163,184,.14);
      color:#64748b;
    }
    .bucket-bind-tag.tone-danger {
      background:rgba(185,28,28,.08);
      color:#b91c1c;
    }
    .bucket-bind-tag .material-icons-round {
      font-size:14px;
    }
    .bucket-bind-inline-action {
      display:inline-flex;
      align-items:center;
      gap:5px;
      min-height:28px;
      padding:0 10px;
      border:none;
      border-radius:999px;
      background:rgba(185,28,28,.08);
      color:#b91c1c;
      font-size:11px;
      font-weight:700;
      transition:background .16s ease, opacity .16s ease;
    }
    .bucket-bind-inline-action:hover {
      background:rgba(185,28,28,.14);
    }
    .bucket-bind-inline-action[disabled] {
      opacity:.56;
      cursor:not-allowed;
    }
    .bucket-bind-inline-action .material-icons-round {
      font-size:14px;
    }
    .bucket-bind-empty {
      padding:18px;
      border:1px dashed rgba(148,163,184,.42);
      border-radius:18px;
      background:rgba(248,250,252,.82);
      color:#64748b;
      font-size:13px;
      line-height:1.6;
      text-align:center;
    }
    @media (max-width: 720px) {
      .bucket-bind-shell {
        width:min(100vw - 20px, 100%);
      }
      .bucket-bind-option-top {
        flex-direction:column;
      }
    }
  </style>

  </script>
  <script>
    window.HUB_CONFIG = {
      ...window.HUB_CONFIG,
      resources: [],
      resourceDescription: "실제 bucket 정보를 불러오는 중입니다."
    };
  </script>
  <script src="workspace_resource_hub_shared.js"></script>
  <script src="ax_studio_topbar.js"></script>
  <script>
    (() => {
      const API_BASE = "/api/v2";
      const FETCH_LIMIT = 100;
      const FALLBACK_CONFIG = window.HUB_CONFIG;
      let lastRenderedConfig = FALLBACK_CONFIG;
      const pendingBucketActions = new Set();
      const bucketHubState = {
        items: [],
        detailById: new Map(),
        currentUser: null
      };
      const bucketMutationState = {
        bucketId: "",
        triggerButton: null
      };
      const bucketBindingState = {
        bucketId: "",
        query: "",
        results: [],
        selectedProjectId: "",
        loading: false,
        unbindingProjectId: "",
        feedback: "",
        feedbackTone: "",
        requestId: 0,
        searchTimer: 0,
        triggerButton: null
      };
      const TYPE_META = {
        private: {
          label: "Private Bucket",
          icon: "lock",
          color: "linear-gradient(135deg,#0f766e,#14b8a6)"
        },
        public: {
          label: "Public Bucket",
          icon: "language",
          color: "linear-gradient(135deg,#0ea5e9,#22d3ee)"
        },
        shared: {
          label: "Shared Bucket",
          icon: "hub",
          color: "linear-gradient(135deg,#0891b2,#5eead4)"
        },
        archive: {
          label: "Archive Bucket",
          icon: "archive",
          color: "linear-gradient(135deg,#f59e0b,#fbbf24)"
        },
        unknown: {
          label: "Bucket",
          icon: "folder",
          color: "linear-gradient(135deg,#0f766e,#2dd4bf)"
        }
      };
      const STATUS_META = {
        active: { label: "Active", tone: "healthy" },
        archived: { label: "Archived", tone: "muted" },
        review: { label: "Review", tone: "review" },
        error: { label: "Error", tone: "incident" },
        pending: { label: "Pending", tone: "pending" },
        unknown: { label: "Unknown", tone: "info" }
      };
      const AVATAR_COLORS = [
        "linear-gradient(135deg,#0f766e,#2dd4bf)",
        "linear-gradient(135deg,#6366f1,#818cf8)",
        "linear-gradient(135deg,#ec4899,#f9a8d4)",
        "linear-gradient(135deg,#f97316,#fdba74)",
        "linear-gradient(135deg,#0891b2,#67e8f9)",
        "linear-gradient(135deg,#16a34a,#86efac)"
      ];
      function buildQuery(params) {
        const searchParams = new URLSearchParams();
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value === undefined || value === null || value === "") {
            return;
          }
          searchParams.set(key, String(value));
        });

        const query = searchParams.toString();
        return query ? `?${query}` : "";
      }

      function buildApiError(response, payload) {
        const apiMessage = normalizeText(payload?.error?.message);
        const apiCode = normalizeText(payload?.error?.code);
        const message = apiMessage || `${response.status} ${response.statusText}`;
        const error = new Error(apiCode ? `${message} (${apiCode})` : message);
        error.status = response.status;
        error.code = apiCode || "";
        error.payload = payload || null;
        return error;
      }

      async function requestJson(path, options) {
        const headers = new Headers({
          Accept: "application/json"
        });
        const requestOptions = {
          credentials: "same-origin",
          ...(options || {})
        };

        Object.entries(requestOptions.headers || {}).forEach(([key, value]) => {
          if (value !== undefined && value !== null) {
            headers.set(key, value);
          }
        });

        if (
          requestOptions.body &&
          typeof requestOptions.body === "object" &&
          !(requestOptions.body instanceof FormData) &&
          !(requestOptions.body instanceof Blob)
        ) {
          if (!headers.has("Content-Type")) {
            headers.set("Content-Type", "application/json");
          }
          requestOptions.body = JSON.stringify(requestOptions.body);
        }

        requestOptions.headers = headers;

        const response = await fetch(`${API_BASE}${path}`, requestOptions);
        const contentType = response.headers.get("content-type") || "";
        const isJson = contentType.includes("application/json");
        const payload = isJson ? await response.json().catch(() => null) : null;

        if (!response.ok) {
          throw buildApiError(response, payload);
        }

        return payload;
      }

      async function fetchJson(path, params) {
        return requestJson(`${path}${buildQuery(params)}`);
      }

      function extractData(payload, fallback) {
        if (payload && typeof payload === "object" && "data" in payload) {
          return payload.data;
        }
        return payload ?? fallback;
      }

      function extractItems(payload) {
        if (payload && Array.isArray(payload.items)) {
          return payload.items;
        }
        if (payload && payload.data && Array.isArray(payload.data.items)) {
          return payload.data.items;
        }
        return [];
      }

      function extractPageTotal(payload, fallback) {
        if (payload && payload.page && Number.isFinite(payload.page.total)) {
          return payload.page.total;
        }
        if (payload && payload.data && payload.data.page && Number.isFinite(payload.data.page.total)) {
          return payload.data.page.total;
        }
        return fallback;
      }

      function extractNextCursor(payload) {
        if (payload && payload.page && typeof payload.page.nextCursor === "string") {
          return payload.page.nextCursor;
        }
        if (payload && payload.data && payload.data.page && typeof payload.data.page.nextCursor === "string") {
          return payload.data.page.nextCursor;
        }
        return null;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      async function fetchAllBuckets(limit = FETCH_LIMIT) {
        const items = [];
        let cursor = null;
        let total = 0;
        let hasNext = true;

        while (hasNext) {
          const payload = await fetchJson("/buckets", {
            limit,
            ...(cursor ? { cursor } : {})
          });
          const pageItems = extractItems(payload);
          const nextCursor = extractNextCursor(payload);
          const pageTotal = extractPageTotal(payload, total || pageItems.length);

          items.push(...pageItems);
          total = pageTotal;
          cursor = nextCursor;
          hasNext = Boolean(nextCursor);

          if (!pageItems.length || (pageTotal > 0 && items.length >= pageTotal)) {
            hasNext = false;
          }
        }

        return {
          items,
          page: {
            total: total || items.length
          }
        };
      }

      async function fetchBucketDetails(items) {
        const detailEntries = await Promise.allSettled(
          (items || []).map((item) => fetchJson(`/buckets/${encodeURIComponent(item.id)}`))
        );

        return detailEntries.reduce((acc, result, index) => {
          if (result.status === "fulfilled") {
            acc.set(items[index].id, extractData(result.value, null));
          }
          return acc;
        }, new Map());
      }

      async function fetchCurrentUser() {
        const payload = await fetchJson("/me");
        return extractData(payload, null);
      }

      async function openBucketById(bucketId) {
        const payload = await requestJson(`/buckets/${encodeURIComponent(bucketId)}/open`, {
          method: "POST"
        });
        const data = extractData(payload, null);
        if (data?.url) {
          window.open(data.url, "_blank", "noopener,noreferrer");
        }
      }

	      async function createBucketByApi({ name, sizeGb }) {
	        return requestJson("/buckets", {
	          method: "POST",
	          body: {
	            name,
	            bucketSize: String(sizeGb)
	          }
	        });
	      }

      async function updateBucketAuthorsByApi(bucketId, authorSubs) {
        return requestJson(`/buckets/${encodeURIComponent(bucketId)}`, {
          method: "PATCH",
          body: {
            author: authorSubs
          }
        });
      }

      async function deleteBucketByApi(bucketId) {
        return requestJson(`/buckets/${encodeURIComponent(bucketId)}`, {
          method: "DELETE"
        });
      }

      async function bindBucketToProjectByApi(bucketId, projectId) {
        return requestJson(`/buckets/${encodeURIComponent(bucketId)}/bind`, {
          method: "POST",
          body: {
            projectId
          }
        });
      }

      async function unbindBucketFromProjectByApi(bucketId, projectId) {
        return requestJson(`/buckets/${encodeURIComponent(bucketId)}/bind/${encodeURIComponent(projectId)}`, {
          method: "DELETE"
        });
      }

      async function searchProjectsByApi(query = "") {
        const payload = await fetchJson("/search", {
          q: query,
          types: "projects",
          source: "buckets",
          defaultType: "project"
        });
        const data = extractData(payload, {});
        const items = Array.isArray(data?.items) ? data.items : [];
        return items
          .filter((item) => normalizeKey(item?.resourceType || item?.type || item?.groupType) === "projects")
          .map((item) => ({
            id: normalizeText(item?.id),
            name: normalizeText(item?.label) || "프로젝트",
            description: normalizeText(item?.description),
            status: normalizeText(item?.status) || "active",
            owner: item?.owner || null,
            updatedAt: normalizeText(item?.updatedAt),
            matchedOn: Array.isArray(item?.matchedOn) ? item.matchedOn.map((value) => normalizeText(value)).filter(Boolean) : []
          }))
          .filter((item) => item.id && item.name);
      }

      function normalizeText(value) {
        return String(value || "").trim();
      }

      function normalizeKey(value) {
        return normalizeText(value).toLowerCase();
      }

      function parseBucketSizeGb(value) {
        const normalized = normalizeText(value).replace(/,/g, "");
        if (!normalized) {
          return null;
        }

        if (!/^\d+$/.test(normalized)) {
          return null;
        }

        const amount = Number(normalized);
        if (!Number.isInteger(amount) || amount <= 0 || amount > 1000) {
          return null;
        }

        return amount;
      }

      function formatBucketSizeLabel(value) {
        const amount = parseBucketSizeGb(value);
        if (amount === null) {
          return "";
        }

        return `${amount}GB`;
      }

      function splitAuthorInput(value) {
        return [...new Set(
          String(value || "")
            .split(/[\n,]/)
            .map((entry) => normalizeText(entry))
            .filter(Boolean)
        )];
      }

      function joinAuthorInput(values) {
        return Array.isArray(values) ? values.map((entry) => normalizeText(entry)).filter(Boolean).join("\n") : "";
      }

      function getBucketState(bucketId) {
        if (!bucketId) {
          return null;
        }

        const item = (bucketHubState.items || []).find((entry) => normalizeText(entry?.id) === normalizeText(bucketId)) || null;
        const detail = bucketHubState.detailById.get(bucketId) || null;
        return {
          ...(item || {}),
          ...(detail || {}),
          id: bucketId,
          boundProjects: Array.isArray(detail?.boundProjects) ? detail.boundProjects : [],
          collaborators: Array.isArray(detail?.collaborators)
            ? detail.collaborators
          : Array.isArray(item?.collaborators)
              ? item.collaborators
              : []
        };
      }

      function getBucketBindingCount(bucket) {
        if (Array.isArray(bucket?.boundProjects) && bucket.boundProjects.length > 0) {
          return bucket.boundProjects.length;
        }

        return Number(bucket?.boundProjectCount || 0);
      }

      function getBucketBoundProjectIds(bucket) {
        if (!Array.isArray(bucket?.boundProjects)) {
          return new Set();
        }

        return new Set(
          bucket.boundProjects
            .map((project) => normalizeText(project?.id))
            .filter(Boolean)
        );
      }

      function getUserSub(user) {
        return normalizeText(user?.sub);
      }

      function normalizeRoles(roles) {
        if (Array.isArray(roles)) {
          return roles.map((value) => normalizeKey(value)).filter(Boolean);
        }

        if (roles && typeof roles === "object") {
          return Object.entries(roles)
            .filter(([, enabled]) => Boolean(enabled))
            .map(([role]) => normalizeKey(role))
            .filter(Boolean);
        }

        const single = normalizeKey(roles);
        return single ? [single] : [];
      }

      function isAdminUser(user) {
        return normalizeRoles(user?.roles).includes("admin");
      }

      function getBucketCollaboratorSubs(bucket) {
        if (Array.isArray(bucket?.collaborators)) {
          return bucket.collaborators.map((entry) => normalizeText(entry?.sub)).filter(Boolean);
        }

        if (Array.isArray(bucket?.author)) {
          return bucket.author
            .map((entry) => normalizeText(typeof entry === "string" ? entry : entry?.sub))
            .filter(Boolean);
        }

        return [];
      }

      function canManageBucketBindings(bucket, user = bucketHubState.currentUser) {
        if (!bucket || !user) {
          return false;
        }

        if (isAdminUser(user)) {
          return true;
        }

        const userSub = getUserSub(user);
        const ownerSub = getUserSub(bucket?.owner);
        const collaboratorSubs = getBucketCollaboratorSubs(bucket);
        return Boolean(userSub) && (userSub === ownerSub || collaboratorSubs.includes(userSub));
      }

	      function hasExistingBucketName(value) {
	        const normalized = normalizeKey(value);
	        if (!normalized) {
	          return false;
	        }

	        const bucketItems = Array.isArray(bucketHubState.items) ? bucketHubState.items : [];
	        return bucketItems.some((bucket) => normalizeKey(bucket?.name) === normalized);
	      }

      function formatNumber(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) {
          return "-";
        }
        return new Intl.NumberFormat("ko-KR").format(amount);
      }

      function formatBytes(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount) || amount <= 0) {
          return "0B";
        }

        const units = ["B", "KB", "MB", "GB", "TB", "PB"];
        let size = amount;
        let unitIndex = 0;

        while (size >= 1024 && unitIndex < units.length - 1) {
          size /= 1024;
          unitIndex += 1;
        }

        const digits = size >= 100 || unitIndex === 0 ? 0 : size >= 10 ? 1 : 2;
        return `${size.toFixed(digits)}${units[unitIndex]}`;
      }

      function toStorageLabel(bytes, fallbackLabel = "") {
        const amount = Number(bytes);
        if (Number.isFinite(amount) && amount > 0) {
          return formatBytes(amount);
        }

        return normalizeText(fallbackLabel) || "0B";
      }

      function formatDateTime(value) {
        if (!value) {
          return "최근 수정 정보 없음";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "최근 수정 정보 없음";
        }

        return `Updated ${new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date)}`;
      }

      function toInitials(value) {
        const source = normalizeText(value);
        if (!source) {
          return "BK";
        }

        const parts = source
          .replace(/[@._-]+/g, " ")
          .split(/\s+/)
          .filter(Boolean);

        if (parts.length === 1) {
          return parts[0].slice(0, 2).toUpperCase();
        }

        return parts
          .slice(0, 2)
          .map((part) => part.charAt(0).toUpperCase())
          .join("");
      }

      function hashIndex(value, mod) {
        const text = normalizeText(value);
        let total = 0;
        for (let index = 0; index < text.length; index += 1) {
          total = (total + text.charCodeAt(index) * (index + 1)) % mod;
        }
        return total;
      }

      function getAvatarColor(value) {
        return AVATAR_COLORS[hashIndex(value, AVATAR_COLORS.length)] || AVATAR_COLORS[0];
      }

      function getTypeMeta(value) {
        const normalized = normalizeKey(value);
        return TYPE_META[normalized] || TYPE_META.unknown;
      }

      function getStatusMeta(value) {
        const normalized = normalizeKey(value);
        return STATUS_META[normalized] || STATUS_META.unknown;
      }

      function getUsageTone(percent) {
        if (!Number.isFinite(percent)) {
          return "info";
        }
        if (percent >= 80) {
          return "review";
        }
        if (percent >= 60) {
          return "info";
        }
        return "healthy";
      }

      function getBucketUsageInfo(bucket) {
        const usedBytes = Number(bucket?.usage?.usedBytes);
        const quotaBytes = Number(bucket?.usage?.quotaBytes);
        const usagePercent = Number(bucket?.usage?.usagePercent);

        return {
          usedBytes: Number.isFinite(usedBytes) && usedBytes > 0 ? usedBytes : 0,
          quotaBytes: Number.isFinite(quotaBytes) && quotaBytes > 0 ? quotaBytes : 0,
          usagePercent: Number.isFinite(usagePercent) ? usagePercent : null,
          hasUsageSignal:
            (Number.isFinite(usedBytes) && usedBytes > 0)
            || (Number.isFinite(quotaBytes) && quotaBytes > 0)
            || Number.isFinite(usagePercent)
        };
      }

      function isCapacityWatchBucket(bucket) {
        const usage = getBucketUsageInfo(bucket);
        if (usage.quotaBytes <= 0) {
          return true;
        }

        return Number.isFinite(usage.usagePercent) && usage.usagePercent >= 80;
      }

      function isUnlinkedBucket(bucket) {
        return getBucketBindingCount(bucket) === 0;
      }

      function isSharedBucket(bucket) {
        return getBucketBindingCount(bucket) >= 2;
      }

      function buildUsageSummary(items) {
        const bucketItems = Array.isArray(items) ? items : [];
        return {
          total: bucketItems.length,
          stats: [
            {
              label: "Capacity Watch",
              value: bucketItems.filter(isCapacityWatchBucket).length,
              description: "quota 임박 또는 quota 미설정 bucket 수"
            },
            {
              label: "Unlinked",
              value: bucketItems.filter(isUnlinkedBucket).length,
              description: "어떤 프로젝트에도 연결되지 않은 bucket 수"
            },
            {
              label: "Shared",
              value: bucketItems.filter(isSharedBucket).length,
              description: "2개 이상 프로젝트에 연결된 bucket 수"
            }
          ]
        };
      }

      function getOwnerName(owner) {
        return owner?.displayName || owner?.userId || owner?.email || "Workspace Owner";
      }

      function buildHeroStats(stats, items) {
        const totalBuckets = Number(stats?.totalBuckets ?? items.length ?? 0);
        const boundProjectCount = Number(stats?.boundProjectCount ?? 0);
        const totalUsedBytes = Number(stats?.totalUsedBytes ?? 0);
        const privateCount = items.filter((item) => normalizeKey(item?.type) === "private").length;
        const sharedCount = items.filter((item) => normalizeKey(item?.type) === "shared").length;

        return [
          {
            icon: "folder",
            value: formatNumber(totalBuckets),
            label: "등록 버킷",
            note: `Private ${formatNumber(privateCount)} · Shared ${formatNumber(sharedCount)}`,
            color: "linear-gradient(135deg,#0f766e,#14b8a6)"
          },
          {
            icon: "link",
            value: formatNumber(boundProjectCount),
            label: "바인딩 프로젝트",
            note: "프로젝트 기준 연결 수",
            color: "linear-gradient(135deg,#0d9488,#2dd4bf)"
          },
          {
            icon: "storage",
            value: formatBytes(totalUsedBytes),
            label: "총 사용량",
            note: "버킷 사용량 집계 기준",
            color: "linear-gradient(135deg,#0f766e,#5eead4)"
          },
          {
            icon: "visibility",
            value: formatNumber(totalBuckets),
            label: "접근 가능 버킷",
            note: "현재 사용자 권한 기준",
            color: "linear-gradient(135deg,#14b8a6,#99f6e4)"
          }
        ];
      }

      function buildFilters(filtersPayload, items) {
        const typeItems = Array.isArray(filtersPayload?.types) && filtersPayload.types.length
          ? filtersPayload.types
          : Array.from(
              items.reduce((acc, item) => {
                const key = normalizeKey(item?.type);
                if (!key) {
                  return acc;
                }
                acc.set(key, (acc.get(key) || 0) + 1);
                return acc;
              }, new Map()).entries()
            ).map(([value, count]) => ({ value, count }));

        const labelMap = {
          private: "프라이빗",
          public: "퍼블릭",
          shared: "공용",
          archive: "아카이브"
        };

        return [
          { id: "all", icon: "apps", label: "전체" },
          ...typeItems.map((item) => ({
            id: normalizeKey(item?.value),
            icon: getTypeMeta(item?.value).icon,
            label: labelMap[normalizeKey(item?.value)] || normalizeText(item?.value) || "기타"
          }))
        ];
      }

      function buildTipsPanel(panel) {
        return {
          ...FALLBACK_CONFIG.mainPanels[0],
          rows: Array.isArray(panel?.rows) ? panel.rows : FALLBACK_CONFIG.mainPanels[0].rows,
          footerLink: panel?.footerLink || FALLBACK_CONFIG.mainPanels[0].footerLink
        };
      }

      function buildGuidePanel(panel) {
        return {
          ...FALLBACK_CONFIG.mainPanels[1],
          rows: Array.isArray(panel?.rows) ? panel.rows : FALLBACK_CONFIG.mainPanels[1].rows,
          footerLink: panel?.footerLink || FALLBACK_CONFIG.mainPanels[1].footerLink
        };
      }

      function buildUsagePanel(panel, items) {
        const rows = Array.isArray(panel?.items)
          ? panel.items.map((item) => {
              const usagePercent = Number(item?.usagePercent);
              return {
                title: normalizeText(item?.name) || "Bucket",
                meta: `${formatBytes(item?.usedBytes)} used${Number(item?.quotaBytes) > 0 ? ` / ${formatBytes(item?.quotaBytes)} quota` : ""}`,
                pill: {
                  label: Number.isFinite(usagePercent) ? `${usagePercent}%` : "N/A",
                  tone: getUsageTone(usagePercent)
                }
              };
            })
          : FALLBACK_CONFIG.sidebarPanels[0].rows;

        return {
          ...FALLBACK_CONFIG.sidebarPanels[0],
          summary: buildUsageSummary(items),
          rows
        };
      }

      function getProjectBindingName(project) {
        return normalizeText(project?.label) || normalizeText(project?.name) || normalizeText(project?.id) || "";
      }

      function toProjectDetailHref(project) {
        const projectKey = getProjectBindingName(project);
        if (projectKey) {
          return `workspace_project_detail.html?project=${encodeURIComponent(projectKey)}&menu=settings&section=config`;
        }

        return "";
      }

      function toProjectConnection(project, color) {
        const name = getProjectBindingName(project) || "project";
        const role = normalizeText(project?.role);
        const description = normalizeText(project?.description);
        return {
          abbr: normalizeText(project?.abbr) || toInitials(name),
          name,
          meta: role
            ? `binding role · ${role}`
            : description || "project binding",
          color,
          href: toProjectDetailHref(project)
        };
      }

      function buildProjectConnections(bucket, detail, color) {
        const boundProjects = Array.isArray(detail?.boundProjects) ? detail.boundProjects : [];
        if (boundProjects.length > 0) {
          return boundProjects.map((project) => toProjectConnection(project, color));
        }

        const boundProjectCount = Number(bucket?.boundProjectCount ?? 0);
        if (boundProjectCount > 0) {
          return [
            {
              abbr: String(boundProjectCount),
              name: `${formatNumber(boundProjectCount)}개 프로젝트`,
              meta: "connected project count is available, but project details are not yet loaded.",
              color
            }
          ];
        }

        return [];
      }

      function buildBucketResource(bucket, detail) {
        const resolved = detail || bucket || {};
        const typeMeta = getTypeMeta(resolved.type || bucket?.type);
        const statusMeta = getStatusMeta(resolved.status || bucket?.status);
        const owner = resolved.owner || bucket?.owner || null;
        const ownerName = getOwnerName(owner);
        const collaborators = Array.isArray(resolved.collaborators)
          ? resolved.collaborators
          : Array.isArray(bucket?.collaborators)
            ? bucket.collaborators
            : [];
        const usage = resolved?.usage || bucket?.usage || {};
        const usagePercent = Number(usage?.value ?? usage?.usagePercent);
        const usedBytes = Number(usage?.usedBytes);
        const quotaBytes = Number(usage?.quotaBytes);
        const connections = buildProjectConnections(bucket, detail, typeMeta.color);
        const bindingCount = Array.isArray(detail?.boundProjects) && detail.boundProjects.length > 0
          ? detail.boundProjects.length
          : Number(bucket?.boundProjectCount || connections.length || 0);
        const detailHref = `workspace_bucket_detail.html?id=${encodeURIComponent(bucket?.id || "")}&item=${encodeURIComponent(bucket?.name || "")}`;
        const quotaLabel = normalizeText(usage?.quotaLabel) || toStorageLabel(quotaBytes, resolved.capacity?.label);
        const usedLabel = normalizeText(usage?.usedLabel) || toStorageLabel(usedBytes, usage?.label);
        const usageDisplayLabel = normalizeText(usage?.valueLabel) || (quotaLabel ? `${usedLabel} / ${quotaLabel}` : usedLabel);
        const isPending = pendingBucketActions.has(bucket?.id);
        const canDelete = bindingCount === 0;
        const canManageBindings = canManageBucketBindings({
          ...bucket,
          ...resolved,
          owner,
          collaborators
        });

        return {
          id: bucket?.id,
          renderSource: "api-bucket",
          categories: ["all", normalizeKey(resolved.type || bucket?.type)].filter(Boolean),
          status: statusMeta,
          engine: `${typeMeta.label} · ${quotaLabel} quota`,
          icon: typeMeta.icon,
          name: normalizeText(bucket?.name) || "Bucket",
          meta: `${usedLabel} used · ${formatNumber(bucket?.boundProjectCount || connections.length)}개 프로젝트 연결`,
          color: typeMeta.color,
          owner: owner
            ? {
                initials: toInitials(ownerName),
                name: ownerName,
                meta: owner?.email || owner?.userId || "owner",
                color: typeMeta.color
              }
            : null,
          sharing: {
            collaborators: collaborators.map((collaborator) => ({
              initials: toInitials(getOwnerName(collaborator)),
              color: getAvatarColor(getOwnerName(collaborator))
            }))
          },
          details: [
            {
              icon: "link",
              text: `Bindings ${formatNumber(bindingCount)}`,
              ...(canManageBindings
                ? {
                    button: true,
                    className: "bucket-bind-chip",
                    title: "프로젝트 바인딩 관리",
                    attributes: {
                      "data-bucket-bind-id": bucket?.id,
                      "data-bucket-bind-name": normalizeText(bucket?.name) || "Bucket"
                    }
                  }
                : {
                    className: "tone-muted",
                    title: "버킷의 admin, owner, author만 프로젝트 검색과 binding을 수행할 수 있습니다."
                  })
            }
          ],
          usage: {
            label: "Storage",
            value: Number.isFinite(usagePercent) ? usagePercent : 0,
            visualValue: usedBytes > 0
              ? Math.max(Number.isFinite(usagePercent) ? usagePercent : 0, 1.5)
              : 0,
            color: typeMeta.color,
            meta: usageDisplayLabel
          },
          connectionsLabel: "PROJECTS",
          connectionsEqualWidth: true,
          connectionsMaxItems: 4,
          connectionsLayoutClass: "is-fixed-projects",
          connections,
          footer: formatDateTime(resolved.updatedAt || bucket?.updatedAt),
          actions: [
            {
              label: "Detail",
              icon: "open_in_new",
              kind: "open",
              href: detailHref
            },
            {
              label: "Delete",
              icon: "delete",
              kind: "neutral",
              disabled: !bucket?.id || isPending || !canDelete,
              attributes: {
                "data-bucket-id": bucket?.id,
                "data-bucket-action": "delete",
                title: canDelete
                  ? "Bucket 삭제"
                  : "연결된 프로젝트를 먼저 해제해야 삭제할 수 있습니다."
              }
            },
            {
              label: "MinIO Open",
              icon: "open_in_new",
              kind: "open",
              disabled: !bucket?.id || isPending,
              attributes: {
                "data-bucket-id": bucket?.id,
                "data-bucket-action": "open"
              }
            }
          ]
        };
      }

      function wireBucketMutations() {
        const editModal = ensureBucketEditModal();
        const editForm = editModal.querySelector("#bucketEditForm");
        const editAuthors = editModal.querySelector("#bucketEditAuthors");
        const editTarget = editModal.querySelector("#bucketEditTarget");
        const editSubmit = editModal.querySelector("#bucketEditSubmit");
        const deleteModal = ensureBucketDeleteModal();
        const deleteTarget = deleteModal.querySelector("#bucketDeleteTarget");
        const deleteNote = deleteModal.querySelector("#bucketDeleteNote");
        const deleteSubmit = deleteModal.querySelector("#bucketDeleteSubmit");

        const closeEdit = () => {
          editModal.hidden = true;
          document.body.style.overflow = "";
          editForm.reset();
          bucketMutationState.bucketId = "";
          bucketMutationState.triggerButton = null;
          editSubmit.disabled = false;
          editSubmit.innerHTML = `<span class="material-icons-round">save</span>저장`;
        };

        const closeDelete = () => {
          deleteModal.hidden = true;
          document.body.style.overflow = "";
          bucketMutationState.bucketId = "";
          bucketMutationState.triggerButton = null;
          deleteSubmit.disabled = false;
          deleteSubmit.innerHTML = `<span class="material-icons-round">delete</span>삭제`;
        };

        if (editModal.dataset.bucketMutationReady !== "true") {
          [editModal.querySelector("#bucketEditClose"), editModal.querySelector("#bucketEditCancel")].filter(Boolean).forEach((button) => {
            button.addEventListener("click", closeEdit);
          });
          [deleteModal.querySelector("#bucketDeleteClose"), deleteModal.querySelector("#bucketDeleteCancel")].filter(Boolean).forEach((button) => {
            button.addEventListener("click", closeDelete);
          });

          editModal.addEventListener("click", (event) => {
            if (event.target === editModal) {
              closeEdit();
            }
          });
          deleteModal.addEventListener("click", (event) => {
            if (event.target === deleteModal) {
              closeDelete();
            }
          });

          editModal.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !editModal.hidden) {
              closeEdit();
            }
          });
          deleteModal.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !deleteModal.hidden) {
              closeDelete();
            }
          });

          editForm.addEventListener("submit", (event) => {
            event.preventDefault();
            (async () => {
              if (!bucketMutationState.bucketId) {
                return;
              }

              editSubmit.disabled = true;
              editSubmit.innerHTML = `<span class="material-icons-round">hourglass_top</span>저장 중...`;

              try {
                await updateBucketAuthorsByApi(bucketMutationState.bucketId, splitAuthorInput(editAuthors.value));
                closeEdit();
                await loadBucketHub();
              } catch (error) {
                editSubmit.disabled = false;
                editSubmit.innerHTML = `<span class="material-icons-round">save</span>저장`;
                window.alert(error && error.message ? error.message : "Bucket 수정에 실패했습니다.");
              }
            })();
          });

          deleteSubmit.addEventListener("click", () => {
            (async () => {
              if (!bucketMutationState.bucketId) {
                return;
              }

              const bucket = getBucketState(bucketMutationState.bucketId);
              const bindingCount = getBucketBindingCount(bucket);
              if (bindingCount > 0) {
                deleteSubmit.disabled = true;
                deleteNote.innerHTML = `<span class="material-icons-round">info</span>현재 ${formatNumber(bindingCount)}개의 프로젝트가 연결되어 있어 삭제할 수 없습니다. 바인딩을 먼저 해제해 주세요.`;
                return;
              }

              deleteSubmit.disabled = true;
              deleteSubmit.innerHTML = `<span class="material-icons-round">hourglass_top</span>삭제 중...`;

              try {
                await deleteBucketByApi(bucketMutationState.bucketId);
                closeDelete();
                await loadBucketHub();
              } catch (error) {
                deleteSubmit.disabled = false;
                deleteSubmit.innerHTML = `<span class="material-icons-round">delete</span>삭제`;
                window.alert(error && error.message ? error.message : "Bucket 삭제에 실패했습니다.");
              }
            })();
          });

          editModal.dataset.bucketMutationReady = "true";
        }

        document.querySelectorAll("[data-bucket-id][data-bucket-action]").forEach((button) => {
          if (button.dataset.bucketMutationBound === "true") {
            return;
          }

          button.dataset.bucketMutationBound = "true";
          button.addEventListener("click", async (event) => {
            const bucketId = button.getAttribute("data-bucket-id");
            const action = button.getAttribute("data-bucket-action");
            if (!bucketId || !action || button.disabled || button.classList.contains("is-disabled")) {
              return;
            }

            if (action === "open") {
              return;
            }

            event.preventDefault();
            const bucket = getBucketState(bucketId);
            if (!bucket) {
              window.alert("선택한 bucket 정보를 다시 불러와 주세요.");
              return;
            }

            bucketMutationState.bucketId = bucketId;
            bucketMutationState.triggerButton = button;

            if (action === "edit") {
              editTarget.textContent = normalizeText(bucket.name) || "Bucket";
              editAuthors.value = joinAuthorInput((bucket.collaborators || []).map((entry) => entry?.sub));
              editModal.hidden = false;
              document.body.style.overflow = "hidden";
              requestAnimationFrame(() => {
                editAuthors.focus();
              });
              return;
            }

            if (action === "delete") {
              const bindingCount = getBucketBindingCount(bucket);
              deleteTarget.textContent = normalizeText(bucket.name) || "Bucket";
              deleteNote.innerHTML = `<span class="material-icons-round">info</span>${
                bindingCount > 0
                  ? `현재 ${formatNumber(bindingCount)}개의 프로젝트가 연결되어 있어 삭제할 수 없습니다. 바인딩을 먼저 해제해 주세요.`
                  : "삭제하면 Hub 목록과 MinIO bucket이 함께 정리됩니다."
              }`;
              deleteSubmit.disabled = bindingCount > 0;
              deleteModal.hidden = false;
              document.body.style.overflow = "hidden";
              requestAnimationFrame(() => {
                (bindingCount > 0 ? deleteModal.querySelector("#bucketDeleteCancel") : deleteSubmit).focus();
              });
            }
          });
        });
      }

      function getProjectStatusLabel(status) {
        const normalized = normalizeKey(status);
        if (!normalized) {
          return "검색 결과";
        }

        const labelMap = {
          public: "Public",
          private: "Private",
          active: "Active",
          paused: "Paused",
          archived: "Archived"
        };

        return labelMap[normalized] || normalized;
      }

      function formatProjectSearchMeta(project) {
        const parts = [];

        if (project.description) {
          parts.push(project.description);
        }

        if (!project.description && Array.isArray(project.matchedOn) && project.matchedOn.length > 0) {
          parts.push(`matched on ${project.matchedOn.slice(0, 2).join(", ")}`);
        }

        if (project.updatedAt) {
          const date = new Date(project.updatedAt);
          if (!Number.isNaN(date.getTime())) {
            parts.push(`updated ${new Intl.DateTimeFormat("ko-KR", {
              month: "2-digit",
              day: "2-digit"
            }).format(date)}`);
          }
        }

        return parts.join(" · ") || "연결 가능한 프로젝트";
      }

      function renderConnectedProjectSection(bucket) {
        const boundProjects = Array.isArray(bucket?.boundProjects) ? bucket.boundProjects : [];

        if (!boundProjects.length) {
          return `
            <div class="bucket-bind-section">
              <div class="bucket-bind-section-head">
                <span>Connected Projects</span>
                <span>0</span>
              </div>
              <div class="bucket-bind-empty">현재 연결된 프로젝트가 없습니다. 아래 검색 결과에서 새 프로젝트를 연결할 수 있습니다.</div>
            </div>
          `;
        }

        return `
          <div class="bucket-bind-section">
            <div class="bucket-bind-section-head">
              <span>Connected Projects</span>
              <span>${formatNumber(boundProjects.length)}</span>
            </div>
            ${boundProjects.map((project) => {
              const projectId = normalizeText(project?.id);
              const isUnbinding = bucketBindingState.unbindingProjectId === projectId;
              const name = normalizeText(project?.name) || normalizeText(project?.label) || "프로젝트";
              const meta = normalizeText(project?.description) || "현재 이 버킷과 연결된 프로젝트";

              return `
                <div class="bucket-bind-option is-bound">
                  <div class="bucket-bind-option-top">
                    <div class="bucket-bind-option-copy">
                      <div class="bucket-bind-option-name">${escapeHtml(name)}</div>
                      <div class="bucket-bind-option-meta">${escapeHtml(meta)}</div>
                    </div>
                    <div class="bucket-bind-option-tags">
                      <span class="bucket-bind-tag tone-muted">
                        <span class="material-icons-round">link</span>연결됨
                      </span>
                      <button
                        class="bucket-bind-inline-action"
                        type="button"
                        data-bucket-unbind-project-id="${escapeHtml(projectId)}"
                        ${isUnbinding ? "disabled" : ""}
                      >
                        <span class="material-icons-round">${isUnbinding ? "hourglass_top" : "link_off"}</span>
                        ${isUnbinding ? "해제 중..." : "연결 해제"}
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `;
      }

      function renderBucketBindResults(bucket) {
        const boundProjectIds = getBucketBoundProjectIds(bucket);
        const searchResults = (Array.isArray(bucketBindingState.results) ? bucketBindingState.results : [])
          .filter((project) => !boundProjectIds.has(project.id));

        const searchSection = !searchResults.length
          ? `<div class="bucket-bind-empty">${
              bucketBindingState.loading
                ? "프로젝트를 검색하는 중입니다."
                : bucketBindingState.query
                  ? "검색 결과가 없습니다. 다른 이름이나 설명으로 다시 검색해 주세요."
                  : "프로젝트 이름이나 설명을 입력하면 연결 가능한 실제 프로젝트를 검색합니다."
            }</div>`
          : searchResults.map((project) => {
          const isBound = boundProjectIds.has(project.id);
          const isSelected = project.id === bucketBindingState.selectedProjectId;
          const optionClassName = [
            "bucket-bind-option",
            isSelected ? "is-selected" : "",
            isBound ? "is-bound" : ""
          ].filter(Boolean).join(" ");

          return `
            <button
              class="${optionClassName}"
              type="button"
              data-bucket-bind-option="${escapeHtml(project.id)}"
              ${isBound ? "disabled" : ""}
            >
              <div class="bucket-bind-option-top">
                <div class="bucket-bind-option-copy">
                  <div class="bucket-bind-option-name">${escapeHtml(project.name)}</div>
                  <div class="bucket-bind-option-meta">${escapeHtml(formatProjectSearchMeta(project))}</div>
                </div>
                <div class="bucket-bind-option-tags">
                  <span class="bucket-bind-tag">
                    <span class="material-icons-round">inventory_2</span>${escapeHtml(getProjectStatusLabel(project.status))}
                  </span>
                  ${isBound
                    ? '<span class="bucket-bind-tag tone-muted"><span class="material-icons-round">link_off</span>이미 연결됨</span>'
                    : isSelected
                      ? '<span class="bucket-bind-tag"><span class="material-icons-round">check_circle</span>선택됨</span>'
                      : ""}
                </div>
              </div>
            </button>
          `;
        }).join("");

        return `
          ${renderConnectedProjectSection(bucket)}
          <div class="bucket-bind-section">
            <div class="bucket-bind-section-head">
              <span>Search Results</span>
              <span>${formatNumber(searchResults.length)}</span>
            </div>
            ${searchSection}
          </div>
        `;
      }

      function ensureBucketBindModal() {
        let modal = document.getElementById("bucketBindModal");
        if (modal) {
          return modal;
        }

        modal = document.createElement("div");
        modal.className = "hub-lite-create-backdrop";
        modal.id = "bucketBindModal";
        modal.hidden = true;
        modal.innerHTML = `
          <div class="hub-lite-create-shell bucket-bind-shell" role="dialog" aria-modal="true" aria-labelledby="bucketBindTitle">
            <div class="hub-lite-create-head">
              <div class="hub-lite-create-copy">
                <div class="hub-lite-create-title-row">
                  <span class="hub-lite-create-step-badge">3</span>
                  <h2 id="bucketBindTitle">연결할 프로젝트를 검색합니다</h2>
                </div>
                <p class="hub-lite-create-subtitle" id="bucketBindSubtitle">선택한 버킷에 실제 프로젝트 binding을 추가합니다.</p>
              </div>
              <div class="hub-lite-create-head-actions">
                <div class="hub-lite-create-hero" aria-hidden="true"><span class="material-icons-round">link</span></div>
                <button class="hub-lite-create-close" type="button" id="bucketBindClose" aria-label="프로젝트 검색 닫기">
                  <span class="material-icons-round">close</span>
                </button>
              </div>
            </div>
            <div class="hub-lite-create-stage">
              <div class="hub-lite-create-panel">
                <div class="hub-lite-create-panel-title" id="bucketBindTarget">선택된 버킷이 없습니다.</div>
                <div class="bucket-bind-search-wrap">
                  <label class="bucket-bind-search" for="bucketBindSearchInput">
                    <span class="material-icons-round">search</span>
                    <input id="bucketBindSearchInput" type="search" placeholder="프로젝트 이름이나 설명을 검색하세요" autocomplete="off" />
                  </label>
                  <div class="bucket-bind-search-meta">
                    <div class="bucket-bind-status" id="bucketBindStatus"><span class="material-icons-round">info</span><span>검색어 없이 열면 최근 접근 가능한 프로젝트를 먼저 보여줍니다.</span></div>
                    <div id="bucketBindCount">0개 결과</div>
                  </div>
                  <div class="bucket-bind-results" id="bucketBindResults"></div>
                </div>
              </div>
            </div>
            <div class="hub-lite-create-actions">
              <button class="hub-lite-create-action ghost" type="button" id="bucketBindCancel">취소</button>
              <button class="hub-lite-create-action primary" type="button" id="bucketBindSubmit" disabled><span class="material-icons-round">link</span>선택한 프로젝트 연결</button>
            </div>
          </div>
        `;

        document.body.appendChild(modal);
        return modal;
      }

      function wireBucketBindingModal() {
        const modal = ensureBucketBindModal();
        const target = modal.querySelector("#bucketBindTarget");
        const subtitle = modal.querySelector("#bucketBindSubtitle");
        const input = modal.querySelector("#bucketBindSearchInput");
        const status = modal.querySelector("#bucketBindStatus");
        const count = modal.querySelector("#bucketBindCount");
        const results = modal.querySelector("#bucketBindResults");
        const submit = modal.querySelector("#bucketBindSubmit");

        const close = () => {
          modal.hidden = true;
          document.body.style.overflow = "";
          if (bucketBindingState.searchTimer) {
            clearTimeout(bucketBindingState.searchTimer);
            bucketBindingState.searchTimer = 0;
          }
          bucketBindingState.bucketId = "";
          bucketBindingState.query = "";
          bucketBindingState.results = [];
          bucketBindingState.selectedProjectId = "";
          bucketBindingState.loading = false;
          bucketBindingState.unbindingProjectId = "";
          bucketBindingState.feedback = "";
          bucketBindingState.feedbackTone = "";
          bucketBindingState.triggerButton = null;
          bucketBindingState.requestId += 1;
          input.value = "";
          submit.disabled = true;
          submit.innerHTML = `<span class="material-icons-round">link</span>선택한 프로젝트 연결`;
          target.textContent = "선택된 버킷이 없습니다.";
          subtitle.textContent = "선택한 버킷에 실제 프로젝트 binding을 추가합니다.";
          count.textContent = "0개 결과";
          status.classList.remove("is-error");
          status.innerHTML = `<span class="material-icons-round">info</span><span>검색어 없이 열면 최근 접근 가능한 프로젝트를 먼저 보여줍니다.</span>`;
          results.innerHTML = "";
        };

        const render = () => {
          const bucket = getBucketState(bucketBindingState.bucketId);
          const bucketName = normalizeText(bucket?.name) || "Bucket";
          const selectedProject = (bucketBindingState.results || []).find((item) => item.id === bucketBindingState.selectedProjectId);
          const boundProjectIds = getBucketBoundProjectIds(bucket);
          const selectedBound = selectedProject ? boundProjectIds.has(selectedProject.id) : false;
          const searchResultCount = (Array.isArray(bucketBindingState.results) ? bucketBindingState.results : [])
            .filter((item) => !boundProjectIds.has(item.id))
            .length;

          target.textContent = `${bucketName}에 연결할 프로젝트를 선택하세요`;
          subtitle.textContent = `${formatNumber(getBucketBindingCount(bucket))}개 프로젝트가 현재 연결되어 있습니다.`;
          count.textContent = `검색 ${formatNumber(searchResultCount)}개 · 연결 ${formatNumber(getBucketBindingCount(bucket))}개`;
          results.innerHTML = renderBucketBindResults(bucket);
          submit.disabled = !bucketBindingState.selectedProjectId || bucketBindingState.loading || Boolean(bucketBindingState.unbindingProjectId) || selectedBound;

          if (bucketBindingState.loading) {
            status.classList.remove("is-error");
            status.innerHTML = `<span class="material-icons-round">hourglass_top</span><span>실제 프로젝트를 검색하고 있습니다.</span>`;
            return;
          }

          if (bucketBindingState.feedback) {
            status.classList.toggle("is-error", bucketBindingState.feedbackTone === "error");
            status.innerHTML = `<span class="material-icons-round">${
              bucketBindingState.feedbackTone === "error" ? "error" : "info"
            }</span><span>${escapeHtml(bucketBindingState.feedback)}</span>`;
            return;
          }

          status.classList.remove("is-error");
          status.innerHTML = `<span class="material-icons-round">info</span><span>${
            bucketBindingState.query
              ? `검색어 "${escapeHtml(bucketBindingState.query)}" 기준 결과입니다.`
              : "검색어 없이 열면 최근 접근 가능한 프로젝트를 먼저 보여줍니다."
          }</span>`;
        };

        const performSearch = async (query) => {
          const requestId = ++bucketBindingState.requestId;
          bucketBindingState.query = normalizeText(query);
          bucketBindingState.loading = true;
          bucketBindingState.feedback = "";
          render();

          try {
            const nextResults = await searchProjectsByApi(bucketBindingState.query);
            if (requestId !== bucketBindingState.requestId) {
              return;
            }

            bucketBindingState.results = nextResults;
            if (!nextResults.some((item) => item.id === bucketBindingState.selectedProjectId)) {
              bucketBindingState.selectedProjectId = "";
            }
          } catch (error) {
            if (requestId !== bucketBindingState.requestId) {
              return;
            }

            bucketBindingState.results = [];
            bucketBindingState.selectedProjectId = "";
            bucketBindingState.feedback = error && error.message
              ? error.message
              : "프로젝트 검색에 실패했습니다.";
            bucketBindingState.feedbackTone = "error";
          } finally {
            if (requestId !== bucketBindingState.requestId) {
              return;
            }
            bucketBindingState.loading = false;
            render();
          }
        };

        const scheduleSearch = (query) => {
          if (bucketBindingState.searchTimer) {
            clearTimeout(bucketBindingState.searchTimer);
          }

          bucketBindingState.searchTimer = window.setTimeout(() => {
            bucketBindingState.searchTimer = 0;
            performSearch(query);
          }, 180);
        };

        if (modal.dataset.bucketBindReady !== "true") {
          [modal.querySelector("#bucketBindClose"), modal.querySelector("#bucketBindCancel")].filter(Boolean).forEach((button) => {
            button.addEventListener("click", close);
          });

          modal.addEventListener("click", (event) => {
            if (event.target === modal) {
              close();
              return;
            }

            const unbindButton = event.target.closest("[data-bucket-unbind-project-id]");
            if (unbindButton && !unbindButton.disabled) {
              const projectId = normalizeText(unbindButton.getAttribute("data-bucket-unbind-project-id"));
              if (!projectId || !bucketBindingState.bucketId || bucketBindingState.loading) {
                return;
              }

              (async () => {
                bucketBindingState.unbindingProjectId = projectId;
                bucketBindingState.feedback = "";
                bucketBindingState.feedbackTone = "";
                render();

                try {
                  const payload = await unbindBucketFromProjectByApi(bucketBindingState.bucketId, projectId);
                  const nextBucket = extractData(payload, null);
                  if (nextBucket && bucketBindingState.bucketId) {
                    bucketHubState.detailById.set(bucketBindingState.bucketId, nextBucket);
                  }
                  if (bucketBindingState.selectedProjectId === projectId) {
                    bucketBindingState.selectedProjectId = "";
                  }
                  await loadBucketHub();
                  bucketBindingState.feedback = "프로젝트 연결을 해제했습니다.";
                  bucketBindingState.feedbackTone = "info";
                } catch (error) {
                  bucketBindingState.feedback = error && error.message
                    ? error.message
                    : "프로젝트 연결 해제에 실패했습니다.";
                  bucketBindingState.feedbackTone = "error";
                } finally {
                  bucketBindingState.unbindingProjectId = "";
                  render();
                }
              })();
              return;
            }

            const option = event.target.closest("[data-bucket-bind-option]");
            if (!option || option.disabled) {
              return;
            }

            bucketBindingState.selectedProjectId = normalizeText(option.getAttribute("data-bucket-bind-option"));
            render();
          });

          modal.addEventListener("keydown", (event) => {
            if (event.key === "Escape" && !modal.hidden) {
              close();
            }
          });

          input.addEventListener("input", () => {
            bucketBindingState.feedback = "";
            bucketBindingState.feedbackTone = "";
            scheduleSearch(input.value);
          });

          submit.addEventListener("click", () => {
            (async () => {
              const bucketId = normalizeText(bucketBindingState.bucketId);
              const projectId = normalizeText(bucketBindingState.selectedProjectId);
              if (!bucketId || !projectId || bucketBindingState.loading || bucketBindingState.unbindingProjectId) {
                return;
              }

              submit.disabled = true;
              submit.innerHTML = `<span class="material-icons-round">hourglass_top</span>연결 중...`;

              try {
                await bindBucketToProjectByApi(bucketId, projectId);
                close();
                await loadBucketHub();
              } catch (error) {
                bucketBindingState.feedback = error && error.message
                  ? error.message
                  : "프로젝트 연결에 실패했습니다.";
                bucketBindingState.feedbackTone = "error";
                submit.innerHTML = `<span class="material-icons-round">link</span>선택한 프로젝트 연결`;
                render();
              }
            })();
          });

          modal.dataset.bucketBindReady = "true";
        }

        document.querySelectorAll("[data-bucket-bind-id]").forEach((button) => {
          if (button.dataset.bucketBindTriggerReady === "true") {
            return;
          }

          button.dataset.bucketBindTriggerReady = "true";
          button.addEventListener("click", (event) => {
            event.preventDefault();
            const bucketId = normalizeText(button.getAttribute("data-bucket-bind-id"));
            if (!bucketId) {
              return;
            }

            const bucket = getBucketState(bucketId);
            if (!canManageBucketBindings(bucket)) {
              window.alert("버킷의 admin, owner, author 권한이 있는 사용자만 프로젝트 검색과 binding을 수행할 수 있습니다.");
              return;
            }

            bucketBindingState.bucketId = bucketId;
            bucketBindingState.triggerButton = button;
            bucketBindingState.selectedProjectId = "";
            bucketBindingState.results = [];
            bucketBindingState.feedback = "";
            bucketBindingState.feedbackTone = "";
            bucketBindingState.loading = false;
            bucketBindingState.unbindingProjectId = "";
            modal.hidden = false;
            document.body.style.overflow = "hidden";
            input.value = "";
            render();
            scheduleSearch("");
            requestAnimationFrame(() => {
              input.focus();
            });
          });
        });
      }

      function wireBucketCreateAction() {
        const button = document.querySelector(".control-actions .create-btn");
        if (!button || button.dataset.bucketCreateBound === "true") {
          return;
        }

	        button.dataset.bucketCreateBound = "true";
	        button.addEventListener("click", (event) => {
	          event.preventDefault();
	          const modal = ensureBucketCreateModal();
	          const sync = modal && modal.querySelector("#bucketCreateName") ? (() => {
	            const event = new Event("input", { bubbles: true });
	            modal.querySelector("#bucketCreateName").dispatchEvent(event);
	          }) : null;
	          modal.hidden = false;
	          document.body.style.overflow = "hidden";
	          const input = modal.querySelector("#bucketCreateName");
	          if (typeof sync === "function") {
	            sync();
	          }
	          requestAnimationFrame(() => {
	            if (input) {
	              input.focus();
            }
          });
        });
      }

      function renderConfig(config) {
        lastRenderedConfig = config;
        window.HUB_CONFIG = config;
        if (typeof window.renderWorkspaceResourceHub === "function") {
          window.renderWorkspaceResourceHub(config);
          attachActionHandlers();
          wireBucketCreateAction();
          wireBucketMutations();
          wireBucketBindingModal();
          if (typeof window.refreshConceptEndpointOverlay === "function") {
            requestAnimationFrame(() => {
              window.refreshConceptEndpointOverlay();
            });
          }
        }
      }

      async function loadBucketHub() {
        const results = await Promise.allSettled([
          fetchCurrentUser(),
          fetchAllBuckets(),
          fetchJson("/buckets/stats"),
          fetchJson("/buckets/filters"),
          fetchJson("/buckets/panels/usage"),
          fetchJson("/panels/tips", { surface: "buckets" }),
          fetchJson("/panels/guide-links", { surface: "buckets" })
        ]);

        const mePayload = results[0].status === "fulfilled" ? results[0].value : null;
        bucketHubState.currentUser = mePayload;

        const bucketsResult = results[1];
        if (bucketsResult.status !== "fulfilled") {
          throw bucketsResult.reason;
        }

        const bucketsPayload = bucketsResult.value;
        const bucketItems = extractItems(bucketsPayload);
        const bucketDetails = await fetchBucketDetails(bucketItems);
        bucketHubState.items = bucketItems;
        bucketHubState.detailById = bucketDetails;
        const statsPayload = results[2].status === "fulfilled" ? extractData(results[2].value, {}) : {};
        const filtersPayload = results[3].status === "fulfilled" ? extractData(results[3].value, null) : null;
        const usagePayload = results[4].status === "fulfilled" ? extractData(results[4].value, null) : null;
        const tipsPayload = results[5].status === "fulfilled" ? extractData(results[5].value, null) : null;
        const guidePayload = results[6].status === "fulfilled" ? extractData(results[6].value, null) : null;
        const total = extractPageTotal(bucketsPayload, bucketItems.length);

        renderConfig({
          ...FALLBACK_CONFIG,
          searchSource: "buckets",
          searchSourceLabel: "Bucket Hub",
          searchDefaultType: "hub",
          heroStats: buildHeroStats(statsPayload, bucketItems),
          filters: buildFilters(filtersPayload, bucketItems),
          resourceDescription: buildResourceDescription(total, statsPayload),
          resources: bucketItems.map((bucket) => buildBucketResource(bucket, bucketDetails.get(bucket.id))),
          mainPanels: [
            buildTipsPanel(tipsPayload),
            buildGuidePanel(guidePayload)
          ],
          sidebarPanels: [
            buildUsagePanel(usagePayload, bucketItems)
          ]
        });
      }

      function attachActionHandlers() {
        document.querySelectorAll("[data-bucket-id][data-bucket-action]").forEach((button) => {
          if (button.dataset.bucketActionBound === "true") {
            return;
          }

          button.dataset.bucketActionBound = "true";
          button.addEventListener("click", async (event) => {
            event.preventDefault();

            const bucketId = button.getAttribute("data-bucket-id");
            const action = button.getAttribute("data-bucket-action");
            if (!bucketId || action !== "open" || button.disabled || button.classList.contains("is-disabled")) {
              return;
            }

            button.disabled = true;
            button.classList.add("is-disabled");
            pendingBucketActions.add(bucketId);

            try {
              await openBucketById(bucketId);
            } catch (error) {
              console.error("[workspace_s3_hub] bucket open failed", error);
              window.alert(error && error.message ? error.message : "Bucket open 동작에 실패했습니다.");
            } finally {
              pendingBucketActions.delete(bucketId);
              await loadBucketHub().catch((error) => {
                console.warn("[workspace_s3_hub] reload after action failed", error);
              });
            }
          });
        });
      }

      function handleLoadError(error) {
        console.warn("[workspace_s3_hub] Failed to load bucket hub data", error);
        bucketHubState.items = [];
        bucketHubState.detailById = new Map();
        bucketHubState.currentUser = null;
        renderConfig({
          ...FALLBACK_CONFIG,
          resources: [],
          resourceDescription: "실제 bucket 정보를 불러오지 못했습니다. 권한 또는 API 상태를 확인해 주세요."
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", () => {
          loadBucketHub().catch(handleLoadError);
        }, { once: true });
      } else {
        loadBucketHub().catch(handleLoadError);
      }
    })();
  </script>
  <script src="concept_endpoint_overlay.js"></script>
</body>
</html>
