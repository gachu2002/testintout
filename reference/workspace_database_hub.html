<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    .db-create-progress-track {
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:0;
    }

    .hub-lite-create-progress-rail.is-hidden {
      visibility:hidden;
    }

    .db-create-stage[hidden] {
      display:none !important;
    }

    .hub-lite-create-actions [hidden] {
      display:none !important;
    }

    .db-create-stage {
      width:min(100%, var(--hub-lite-create-wide-width, 920px));
      margin:0 auto;
    }

    .db-create-stage.is-compact {
      width:min(100%, var(--hub-lite-create-content-width, 680px));
    }

    .db-create-size-input-wrap {
      position:relative;
    }

    .db-create-size-input-wrap .hub-lite-create-input {
      padding-right:52px;
    }

    .db-create-size-suffix {
      position:absolute;
      right:16px;
      top:50%;
      transform:translateY(-50%);
      color:var(--t2);
      font-size:13px;
      font-weight:700;
      pointer-events:none;
    }

    .db-create-engine-grid {
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:14px;
    }

    .db-create-engine-card {
      min-width:0;
      display:grid;
      gap:12px;
      padding:18px;
      border:1px solid rgba(214,216,219,.94);
      border-radius:18px;
      background:
        radial-gradient(circle at top left, rgba(76,106,136,.08), transparent 45%),
        #fff;
      text-align:left;
      transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }

    .db-create-engine-card:hover {
      transform:translateY(-1px);
      border-color:color-mix(in srgb, var(--brand) 24%, transparent);
      box-shadow:0 14px 26px rgba(15,23,42,.08);
    }

    .db-create-engine-card.is-selected {
      border-color:var(--brand);
      box-shadow:0 18px 32px color-mix(in srgb, var(--brand) 14%, transparent);
    }

    .db-create-engine-head {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .db-create-engine-icon {
      width:48px;
      height:48px;
      border-radius:16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:10px;
      background:#fff;
      border:1px solid rgba(214,216,219,.92);
      box-shadow:0 12px 24px rgba(15,23,42,.08);
      flex-shrink:0;
    }

    .db-create-engine-icon svg,
    .db-create-size-pill svg {
      width:100%;
      height:100%;
      display:block;
    }

    .db-create-engine-radio {
      width:18px;
      height:18px;
      border-radius:999px;
      border:2px solid #d2d7e0;
      position:relative;
      flex-shrink:0;
      margin-top:2px;
    }

    .db-create-engine-card.is-selected .db-create-engine-radio {
      border-color:var(--brand);
    }

    .db-create-engine-card.is-selected .db-create-engine-radio::after {
      content:"";
      position:absolute;
      inset:3px;
      border-radius:999px;
      background:var(--brand);
    }

    .db-create-engine-title {
      font-size:17px;
      font-weight:800;
      letter-spacing:-.03em;
      line-height:1.3;
    }

    .db-create-engine-meta {
      color:var(--t2);
      font-size:13px;
      line-height:1.55;
    }

    .db-create-engine-submeta {
      color:var(--t3);
      font-size:12px;
      line-height:1.5;
    }

    .db-create-size-summary {
      display:grid;
      gap:10px;
      padding:16px;
      border-radius:18px;
      border:1px solid rgba(214,216,219,.86);
      background:#fbfcfe;
    }

    .db-create-size-pill {
      width:max-content;
      min-height:28px;
      padding:0 10px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:var(--brand-bg);
      color:var(--brand);
      font-size:12px;
      font-weight:800;
    }

    .db-create-size-pill svg {
      width:14px;
      height:14px;
      flex-shrink:0;
    }

    .db-create-size-summary-title {
      font-size:18px;
      font-weight:800;
      letter-spacing:-.03em;
    }

    .db-create-size-summary-copy {
      color:var(--t2);
      font-size:13px;
      line-height:1.6;
    }

    .db-create-size-hint {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .db-create-size-chip {
      min-height:28px;
      padding:0 10px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      background:#f4f6fa;
      color:var(--t2);
      font-size:12px;
      font-weight:700;
    }

    .db-create-status-card {
      display:grid;
      gap:16px;
      padding:20px;
      border-radius:22px;
      border:1px solid rgba(214,216,219,.86);
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,251,255,.94));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.8),
        0 12px 24px rgba(15,23,42,.04);
    }

    .db-create-status-head {
      display:grid;
      gap:8px;
    }

    .db-create-status-kicker {
      width:max-content;
      min-height:28px;
      padding:0 10px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:var(--brand-bg);
      color:var(--brand);
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
    }

    .db-create-status-title {
      font-size:22px;
      font-weight:800;
      letter-spacing:-.04em;
      line-height:1.25;
    }

    .db-create-status-copy {
      color:var(--t2);
      font-size:14px;
      line-height:1.7;
    }

    .db-create-status-list {
      display:grid;
      gap:12px;
    }

    .db-create-status-row {
      display:grid;
      grid-template-columns:auto minmax(0, 1fr) auto;
      gap:12px;
      align-items:center;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid rgba(214,216,219,.82);
      background:#fff;
    }

    .db-create-status-row.is-active {
      border-color:color-mix(in srgb, var(--brand) 26%, transparent);
      background:color-mix(in srgb, var(--brand) 4%, #fff);
    }

    .db-create-status-row.is-complete {
      border-color:rgba(16,185,129,.22);
      background:rgba(236,253,245,.86);
    }

    .db-create-status-dot {
      width:28px;
      height:28px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:#d7dbe2;
      color:#fff;
      flex-shrink:0;
    }

    .db-create-status-row.is-active .db-create-status-dot {
      background:var(--brand);
    }

    .db-create-status-row.is-complete .db-create-status-dot {
      background:#10b981;
    }

    .db-create-status-label {
      font-size:14px;
      font-weight:700;
      color:var(--t1);
      line-height:1.45;
    }

    .db-create-status-state {
      font-size:12px;
      font-weight:800;
      color:var(--t3);
      white-space:nowrap;
    }

    .db-create-status-row.is-active .db-create-status-state {
      color:var(--brand);
    }

    .db-create-status-row.is-complete .db-create-status-state {
      color:#059669;
    }

    @media (max-width:860px) {
      .db-create-engine-grid {
        grid-template-columns:1fr;
      }
      .db-create-progress-track {
        grid-template-columns:1fr;
        gap:12px;
      }
    }
  </style>
</head>

        search: { icon: "travel_explore", label: "검색" },
        vector: { icon: "hub", label: "벡터" },
        unknown: { icon: "storage", label: "기타" }
      };
      const STATUS_META = {
        running: { label: "Running", tone: "healthy" },
        stopped: { label: "Stopped", tone: "muted" },
        restarting: { label: "Restarting", tone: "review" },
        error: { label: "Needs attention", tone: "incident" },
        unknown: { label: "Unknown", tone: "info" }
      };
      const HEALTH_TONE = {
        healthy: "healthy",
        degraded: "incident",
        unknown: "info"
      };
      const BACKUP_LABEL = {
        none: "없음",
        daily: "Daily",
        weekly: "Weekly",
        monthly: "Monthly"
      };

      function buildQuery(params) {
        const searchParams = new URLSearchParams();
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value === undefined || value === null || value === "") {
            return;
          }
          searchParams.set(key, String(value));
        });
        const query = searchParams.toString();
        return query ? `?${query}` : "";
      }

      async function requestJson(path, options) {
        const response = await fetch(`${API_BASE}${path}`, {
          credentials: "same-origin",
          headers: {
            Accept: "application/json"
          },
          ...(options || {})
        });

        if (!response.ok) {
          let message = `${response.status} ${response.statusText}`;
          try {
            const payload = await response.json();
            const apiMessage = payload?.message || payload?.error?.message || payload?.error || payload?.code;
            if (apiMessage) {
              message = `${response.status} ${apiMessage}`;
            }
          } catch {
            try {
              const text = await response.text();
              if (text) {
                message = `${response.status} ${text}`;
              }
            } catch {
              // ignore body parsing failure
            }
          }

          throw new Error(message);
        }

        return response.json();
      }

      async function fetchJson(path, params) {
        return requestJson(`${path}${buildQuery(params)}`);
      }

      function extractData(payload, fallback) {
        if (payload && typeof payload === "object" && "data" in payload) {
          return payload.data;
        }
        return payload ?? fallback;
      }

      function extractItems(payload) {
        const direct = payload && Array.isArray(payload.items) ? payload.items : null;
        if (direct) {
          return direct;
        }
        const nested = payload && payload.data && Array.isArray(payload.data.items) ? payload.data.items : null;
        return nested || [];
      }

      function extractPageTotal(payload, fallback) {
        if (payload && payload.page && Number.isFinite(payload.page.total)) {
          return payload.page.total;
        }
        if (payload && payload.data && payload.data.page && Number.isFinite(payload.data.page.total)) {
          return payload.data.page.total;
        }
        return fallback;
      }

      function extractNextCursor(payload) {
        if (payload && payload.page && typeof payload.page.nextCursor === "string") {
          return payload.page.nextCursor;
        }
        if (payload && payload.data && payload.data.page && typeof payload.data.page.nextCursor === "string") {
          return payload.data.page.nextCursor;
        }
        return null;
      }

      async function fetchAllDatabases(limit = FETCH_LIMIT) {
        const items = [];
        let cursor = null;
        let total = 0;
        let hasNext = true;

        while (hasNext) {
          const payload = await fetchJson("/databases", {
            limit,
            ...(cursor ? { cursor } : {})
          });
          const pageItems = extractItems(payload);
          const nextCursor = extractNextCursor(payload);
          const pageTotal = extractPageTotal(payload, total || pageItems.length);

          items.push(...pageItems);
          total = pageTotal;
          cursor = nextCursor;
          hasNext = Boolean(nextCursor);

          if (!pageItems.length || items.length >= pageTotal) {
            hasNext = false;
          }
        }

        return {
          items,
          page: {
            total: total || items.length
          }
        };
      }

      function formatNumber(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) {
          return "-";
        }
        return new Intl.NumberFormat("ko-KR").format(amount);
      }

      function formatBytes(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount) || amount <= 0) {
          return "0B";
        }
        const units = ["B", "KB", "MB", "GB", "TB"];
        let displayValue = amount;
        let unitIndex = 0;

        while (displayValue >= 1024 && unitIndex < units.length - 1) {
          displayValue /= 1024;
          unitIndex += 1;
        }

        const digits = displayValue >= 10 || unitIndex === 0 ? 0 : 1;
        return `${displayValue.toFixed(digits)}${units[unitIndex]}`;
      }

      function formatDate(value) {
        if (!value) {
          return "N/A";
        }
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "N/A";
        }
        return new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit"
        }).format(date);
      }

      function formatDateTime(value) {
        if (!value) {
          return "최근 수정 정보 없음";
        }
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "최근 수정 정보 없음";
        }
        return `Updated ${new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date)}`;
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function toInitials(value) {
        const source = String(value || "").trim();
        if (!source) {
          return "DB";
        }

        const parts = source
          .replace(/[@._-]+/g, " ")
          .split(/\s+/)
          .filter(Boolean);

        if (parts.length === 1) {
          return parts[0].slice(0, 2).toUpperCase();
        }

        return parts
          .slice(0, 2)
          .map(part => part.charAt(0).toUpperCase())
          .join("");
      }

      function getOwnerName(owner) {
        return owner?.displayName || owner?.userId || owner?.email || "Workspace Owner";
      }

      function getPrincipalName(principal) {
        if (typeof principal === "string") {
          return principal;
        }
        return principal?.displayName || principal?.userId || principal?.email || "";
      }

      function normalizeKey(value) {
        return String(value || "").trim().toLowerCase();
      }

      function normalizeStatus(value) {
        const normalized = normalizeKey(value);
        if (!normalized) {
          return "unknown";
        }

        if (["run", "running", "ready", "active", "healthy"].includes(normalized)) {
          return "running";
        }

        if (["stop", "stopped", "inactive", "disabled"].includes(normalized)) {
          return "stopped";
        }

        if (["restart", "restarting", "starting", "pending"].includes(normalized)) {
          return "restarting";
        }

        if (["error", "failed", "failure", "critical", "incident"].includes(normalized)) {
          return "error";
        }

        return normalized;
      }

      function normalizeSeverity(value, status) {
        const normalized = normalizeKey(value);
        if (["healthy", "ok", "success", "normal"].includes(normalized)) {
          return "healthy";
        }

        if (["degraded", "warning", "warn"].includes(normalized)) {
          return "degraded";
        }

        if (["critical", "incident", "error", "failed"].includes(normalized)) {
          return "critical";
        }

        if (normalized === "unknown") {
          return "unknown";
        }

        const normalizedStatus = normalizeStatus(status);
        if (normalizedStatus === "running") {
          return "healthy";
        }
        if (normalizedStatus === "error") {
          return "critical";
        }
        if (normalizedStatus === "stopped") {
          return "unknown";
        }

        return normalized || "unknown";
      }

      function buildHealthLabel(health, status) {
        const severity = normalizeSeverity(health?.severity, status);
        if (health?.label) {
          return health.label;
        }
        if (severity === "healthy") {
          return "Healthy";
        }
        if (severity === "degraded") {
          return "Degraded";
        }
        if (severity === "critical") {
          return "Needs attention";
        }
        return "Unknown";
      }

      function isSamePrincipal(left, right) {
        if (!left || !right) {
          return false;
        }

        if (typeof left === "string" || typeof right === "string") {
          const leftValue = normalizeKey(getPrincipalName(left));
          const rightValue = normalizeKey(getPrincipalName(right));
          return Boolean(leftValue && rightValue && leftValue === rightValue);
        }

        return ["sub", "email", "userId", "displayName"].some(key => {
          const leftValue = normalizeKey(left[key]);
          const rightValue = normalizeKey(right[key]);
          return leftValue && rightValue && leftValue === rightValue;
        });
      }

      function getResourceAuthors(resource) {
        const rawAuthors = Array.isArray(resource?.author)
          ? resource.author
          : Array.isArray(resource?.authors)
            ? resource.authors
            : Array.isArray(resource?.collaborators)
              ? resource.collaborators
              : [];

        const authors = rawAuthors.length > 0 && isSamePrincipal(rawAuthors[0], resource?.owner)
          ? rawAuthors.slice(1)
          : rawAuthors;

        return authors.filter(author => !isSamePrincipal(author, resource?.owner));
      }

      function getResolvedStatusValue(resource) {
        return resource?.status
          || resource?.runtime?.status
          || resource?.runtimeStatus
          || resource?.state
          || resource?.phase
          || resource?.health?.status
          || "";
      }

      function getResolvedHealth(resource) {
        const baseHealth = resource?.health && typeof resource.health === "object"
          ? resource.health
          : {};

        return {
          ...baseHealth,
          severity: baseHealth.severity || resource?.severity || resource?.healthSeverity || "",
          label: baseHealth.label || resource?.healthLabel || ""
        };
      }

      function deriveHealthSummary(panel) {
        const items = Array.isArray(panel?.items) ? panel.items : [];
        const summary = items.reduce((acc, item) => {
          const severity = normalizeSeverity(item?.health?.severity, item?.status);
          if (severity === "healthy") {
            acc.healthy += 1;
          } else if (severity === "degraded" || severity === "critical") {
            acc.degraded += 1;
          } else {
            acc.unknown += 1;
          }
          return acc;
        }, { healthy: 0, degraded: 0, unknown: 0 });

        return {
          healthy: summary.healthy,
          degraded: summary.degraded,
          unknown: summary.unknown,
          total: items.length
        };
      }

      function resolveHealthSummary(panel) {
        const derivedSummary = deriveHealthSummary(panel);
        const apiSummary = panel?.summary;
        const apiHealthy = Number(apiSummary?.healthy ?? 0);
        const apiDegraded = Number(apiSummary?.degraded ?? 0);
        const apiUnknown = Number(apiSummary?.unknown ?? 0);
        const apiTotal = Number(apiSummary?.total ?? 0);
        const apiHasValues = apiTotal > 0 || apiHealthy > 0 || apiDegraded > 0 || apiUnknown > 0;

        if (apiHasValues) {
          return {
            healthy: apiHealthy,
            degraded: apiDegraded,
            unknown: apiUnknown,
            total: apiTotal || apiHealthy + apiDegraded + apiUnknown
          };
        }

        return derivedSummary;
      }

      function getHealthIssueItems(panel) {
        const items = Array.isArray(panel?.items) ? panel.items : [];

        return items.filter(item => {
          const severity = normalizeSeverity(item?.health?.severity, item?.status);
          return severity === "degraded" || severity === "critical" || severity === "unknown";
        });
      }

      function toHealthPanelItem(resource) {
        return {
          id: resource?.id,
          name: resource?.name,
          engine: resource?.engine,
          status: getResolvedStatusValue(resource),
          bindingCount: Number(resource?.bindingCount ?? 0),
          updatedAt: resource?.updatedAt,
          health: getResolvedHealth(resource)
        };
      }

      function buildStatsHealthSummary(stats, fallbackTotal) {
        const total = Number(stats?.totalDatabases ?? fallbackTotal ?? 0);
        const healthy = Number(stats?.runningCount ?? 0);
        const degraded = Number(stats?.issueCount ?? 0);
        const unknown = Math.max(0, total - healthy - degraded);

        return { healthy, degraded, unknown, total };
      }

      function mergeHealthPanel(panel, resources, stats) {
        const items = Array.isArray(panel?.items) ? panel.items : [];
        const resourceItems = Array.isArray(resources) ? resources : [];
        const resourceMap = new Map();

        resourceItems.forEach(resource => {
          if (resource?.id) {
            resourceMap.set(`id:${resource.id}`, resource);
          }
          if (resource?.name) {
            resourceMap.set(`name:${normalizeKey(resource.name)}`, resource);
          }
        });

        const baseItems = items.length ? items : resourceItems.map(toHealthPanelItem);
        const mergedItems = baseItems.map(item => {
          const matchedResource = resourceMap.get(`id:${item?.id}`) || resourceMap.get(`name:${normalizeKey(item?.name)}`);
          const currentHealth = getResolvedHealth(item);
          const resourceHealth = getResolvedHealth(matchedResource);
          const currentStatus = getResolvedStatusValue(item);
          const resourceStatus = getResolvedStatusValue(matchedResource);
          const currentSeverity = normalizeSeverity(currentHealth?.severity, currentStatus);
          const resourceSeverity = normalizeSeverity(resourceHealth?.severity, resourceStatus);
          const shouldUseResourceHealth = currentSeverity === "unknown" && resourceSeverity !== "unknown";

          return {
            id: item?.id || matchedResource?.id,
            name: item?.name || matchedResource?.name,
            engine: item?.engine || matchedResource?.engine,
            status: shouldUseResourceHealth ? resourceStatus : (currentStatus || resourceStatus),
            bindingCount: Number(item?.bindingCount ?? matchedResource?.bindingCount ?? 0),
            updatedAt: item?.updatedAt || matchedResource?.updatedAt,
            health: shouldUseResourceHealth
              ? (resourceHealth || currentHealth)
              : (currentHealth || resourceHealth || { label: "", severity: "" })
          };
        });

        const mergedDerivedSummary = deriveHealthSummary({ items: mergedItems });
        const resourceDerivedSummary = deriveHealthSummary({ items: resourceItems.map(toHealthPanelItem) });
        const apiSummary = resolveHealthSummary({ items: mergedItems, summary: panel?.summary });
        const statsSummary = buildStatsHealthSummary(stats, resourceItems.length);
        const apiAllUnknown = apiSummary.total > 0 && apiSummary.healthy === 0 && apiSummary.degraded === 0 && apiSummary.unknown === apiSummary.total;
        const mergedHasSignal = mergedDerivedSummary.healthy > 0 || mergedDerivedSummary.degraded > 0;
        const resourceHasSignal = resourceDerivedSummary.healthy > 0 || resourceDerivedSummary.degraded > 0;
        const statsHasSignal = statsSummary.healthy > 0 || statsSummary.degraded > 0;
        const summary = apiAllUnknown && (mergedHasSignal || resourceHasSignal || statsHasSignal)
          ? (mergedHasSignal ? mergedDerivedSummary : (resourceHasSignal ? resourceDerivedSummary : statsSummary))
          : apiSummary;

        return {
          items: mergedItems,
          summary
        };
      }

      function getEngineMeta(engine) {
        return ENGINE_META[engine] || {
          category: "unknown",
          icon: "storage",
          label: engine ? `Database · ${engine}` : "Database",
          color: "linear-gradient(135deg,#475569,#94a3b8)",
          logo: ENGINE_LOGOS.unknown
        };
      }

      function getStatusMeta(resource) {
        const normalizedStatus = normalizeStatus(resource?.status);
        const normalizedSeverity = normalizeSeverity(resource?.health?.severity, normalizedStatus);

        if (HEALTH_TONE[normalizedSeverity]) {
          const tone = HEALTH_TONE[normalizedSeverity];
          const label = buildHealthLabel(resource?.health, normalizedStatus) || STATUS_META[normalizedStatus]?.label || "Unknown";
          return { label, tone };
        }

        return STATUS_META[normalizedStatus] || STATUS_META.unknown;
      }

      function getBackupLabel(backup) {
        return BACKUP_LABEL[backup] || backup || "없음";
      }

      function abbreviateName(value) {
        const normalized = String(value || "").trim();
        if (!normalized) {
          return "DB";
        }
        const segments = normalized
          .split(/[^a-zA-Z0-9]+/)
          .filter(Boolean);
        if (segments.length >= 2) {
          return segments
            .slice(0, 2)
            .map(segment => segment.charAt(0).toUpperCase())
            .join("");
        }
        return normalized.slice(0, 2).toUpperCase();
      }

      function buildEngineFilters(filterData) {
        const engines = Array.isArray(filterData?.engines) ? filterData.engines : [];
        const grouped = engines.reduce((acc, item) => {
          const meta = getEngineMeta(item.value);
          const category = meta.category || "unknown";
          acc[category] = (acc[category] || 0) + Number(item.count || 0);
          return acc;
        }, {});

        return [
          { id: "all", icon: "apps", label: "전체" },
          ...Object.entries(grouped).map(([category]) => {
            const filterMeta = FILTER_META[category] || FILTER_META.unknown;
            return {
              id: category,
              icon: filterMeta.icon,
              label: filterMeta.label
            };
          })
        ];
      }

      function buildResourceDescription(resourceTotal) {
        if (!Number.isFinite(resourceTotal) || resourceTotal <= 0) {
          return "조회 가능한 데이터베이스 리소스가 없습니다. 권한이나 연결 상태를 확인해 주세요.";
        }

        return `${formatNumber(resourceTotal)}개의 데이터베이스 리소스를 API 기준으로 렌더링합니다. 각 카드는 사용량, 백업 정책, 최근 수정 시각, bindings, restart 액션을 실제 응답으로 연결합니다.`;
      }

      function normalizeDatabaseSizeInput(value) {

      function buildCreatedDatabaseResource(engineId, name, size) {

        const slug = normalizedName.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
        return {

          meta: `${option.title} 리소스가 생성되었습니다. 콘솔 연결과 바인딩은 상세 화면에서 이어서 진행합니다.`,

                <button class="hub-lite-create-action ghost" type="button" id="databaseCreateBack">취소</button>
                <button class="hub-lite-create-action primary" type="button" id="databaseCreateNext">다음</button>
                <button class="hub-lite-create-action primary" type="button" id="databaseCreateDone" hidden disabled><span class="material-icons-round">check_circle</span>완료</button>
              </div>
            </form>
          </div>
        `;

        document.body.appendChild(modal);

        const elements = {
          modal,
          stepBadge: modal.querySelector("#databaseCreateStepBadge"),
          subtitle: modal.querySelector("#databaseCreateSubtitle"),
          progress: modal.querySelector("#databaseCreateProgress"),
          form: modal.querySelector("#databaseCreateForm"),
          stages: Array.from(modal.querySelectorAll("[data-db-create-step]")),
          engineGrid: modal.querySelector("#databaseCreateEngineGrid"),
          sizeSummary: modal.querySelector("#databaseCreateSizeSummary"),
          nameInput: modal.querySelector("#databaseCreateNameInput"),
          sizeInput: modal.querySelector("#databaseCreateSizeInput"),
          statusTitle: modal.querySelector("#databaseCreateStatusTitle"),
          statusCopy: modal.querySelector("#databaseCreateStatusCopy"),
          statusList: modal.querySelector("#databaseCreateStatusList"),
          close: modal.querySelector("#databaseCreateClose"),
          back: modal.querySelector("#databaseCreateBack"),
          next: modal.querySelector("#databaseCreateNext"),
          done: modal.querySelector("#databaseCreateDone")
        };

        const stepMeta = [
          { label: "DB 종류", subtitle: "먼저 사용할 DB 종류를 선택해주세요." },
          { label: "DB 정보", subtitle: "선택한 DB의 이름과 사이즈를 입력해주세요." },
          { label: "생성 상태", subtitle: "생성 진행 상황을 확인해주세요." }
        ];

        const renderProgress = () => {
          elements.progress.innerHTML = stepMeta.map((item, index) => {
            const step = index + 1;
            const isCurrent = step === dbCreateState.step;
            const isComplete = step < dbCreateState.step || (step === 3 && dbCreateState.statusDone);
            const value = step === 1
              ? (DB_CREATE_ENGINE_OPTIONS.find((option) => option.id === dbCreateState.engine)?.title || "")
              : step === 2
                ? [String(dbCreateState.name || "").trim(), formatDatabaseSizeValue(dbCreateState.size)].filter(Boolean).join(" · ")
                : (dbCreateState.statusDone ? "완료" : "진행 중");
            return `
              <div class="hub-lite-create-progress-item ${isCurrent ? "is-current" : ""} ${isComplete ? "is-complete" : ""}">
                <div class="hub-lite-create-progress-line">
                  <span class="hub-lite-create-progress-rail ${index === 0 ? "is-hidden" : ""}"></span>
                  <span class="hub-lite-create-progress-dot">${isComplete ? '<span class="material-icons-round" style="font-size:15px">done</span>' : step}</span>
                  <span class="hub-lite-create-progress-rail ${index === stepMeta.length - 1 ? "is-hidden" : ""}"></span>
                </div>
                <div class="hub-lite-create-progress-label">${item.label}</div>
                <div class="hub-lite-create-progress-value">${value || " "}</div>
              </div>
            `;
          }).join("");
        };

        const renderEngineGrid = () => {
          elements.engineGrid.innerHTML = DB_CREATE_ENGINE_OPTIONS.map((item) => {
            const engineMeta = getEngineMeta(item.id);
            return `
              <button class="db-create-engine-card ${dbCreateState.engine === item.id ? "is-selected" : ""}" type="button" data-db-engine="${item.id}">
                <div class="db-create-engine-head">
                  <span class="db-create-engine-icon" aria-hidden="true">${engineMeta.logo}</span>
                  <span class="db-create-engine-radio" aria-hidden="true"></span>
                </div>
                <div class="db-create-engine-title">${item.title}</div>
                <div class="db-create-engine-meta">${item.desc}</div>
                <div class="db-create-engine-submeta">${item.meta} · ${item.hint}</div>
              </button>
            `;
          }).join("");
        };

        const renderSizeSummary = () => {
          const option = getDatabaseCreateEngineOption();
          const engineMeta = getEngineMeta(option.id);
          elements.sizeSummary.innerHTML = `
            <div class="db-create-size-pill">${engineMeta.logo}${option.title}</div>
            <div class="db-create-size-summary-title">${option.title} 리소스 크기를 입력합니다</div>
            <div class="db-create-size-summary-copy">${option.desc}</div>
            <div class="db-create-size-hint">
              <span class="db-create-size-chip">${option.meta}</span>
              <span class="db-create-size-chip">${option.sizeHint}</span>
            </div>
          `;
          elements.nameInput.value = dbCreateState.name;
          elements.sizeInput.placeholder = option.sizeHint;
          elements.sizeInput.value = normalizeDatabaseSizeInput(dbCreateState.size);
        };

        const renderStatus = () => {
          const option = getDatabaseCreateEngineOption();
          const nameValue = String(dbCreateState.name || "").trim() || option.title;
          const sizeValue = formatDatabaseSizeValue(dbCreateState.size) || `${String(option.sizeHint || "").replace(/^예:\s*/, "").split(",")[0].trim()}Gi` || "20Gi";
          if (dbCreateState.errorMessage) {
            elements.statusTitle.textContent = `${nameValue} 생성에 실패했습니다`;
            elements.statusCopy.textContent = dbCreateState.errorMessage;
          } else {
            elements.statusTitle.textContent = dbCreateState.statusDone
              ? `${nameValue} ${sizeValue} 생성이 완료되었습니다`
              : `${nameValue} ${sizeValue} 생성이 진행 중입니다`;
            elements.statusCopy.textContent = dbCreateState.statusDone
              ? "이제 상세 화면에서 바인딩과 콘솔 연결을 이어서 진행할 수 있습니다."
              : "선택한 DB 정보를 기준으로 실제 생성 API를 호출하고 상태를 정리합니다.";
          }
          elements.statusList.innerHTML = DB_CREATE_STATUS_STEPS.map((label, index) => {
            const isComplete = index < dbCreateState.statusIndex || dbCreateState.statusDone;
            const isFailed = Boolean(dbCreateState.errorMessage) && index === Math.min(dbCreateState.statusIndex, DB_CREATE_STATUS_STEPS.length - 1);
            const isActive = !dbCreateState.statusDone && !dbCreateState.errorMessage && index === dbCreateState.statusIndex;
            const stateLabel = isFailed ? "실패" : (isComplete ? "완료" : (isActive ? "진행 중" : "대기"));
            return `
              <div class="db-create-status-row ${isComplete ? "is-complete" : ""} ${isActive ? "is-active" : ""}">
                <span class="db-create-status-dot">
                  <span class="material-icons-round">${isFailed ? "error" : (isComplete ? "done" : (isActive ? "autorenew" : "more_horiz"))}</span>
                </span>
                <div class="db-create-status-label">${label}</div>
                <div class="db-create-status-state">${stateLabel}</div>
              </div>
            `;
          }).join("");
        };

        const renderStages = () => {
          elements.stages.forEach((stage) => {
            stage.hidden = Number(stage.dataset.dbCreateStep) !== dbCreateState.step;
          });
        };

        const syncHeader = () => {
          const meta = stepMeta[dbCreateState.step - 1];
          elements.stepBadge.textContent = String(dbCreateState.step);
          elements.subtitle.textContent = meta.subtitle;
        };

        const syncActions = () => {
          const isProcessing = dbCreateState.step === 3 && dbCreateState.isSubmitting;
          const isComplete = dbCreateState.step === 3 && dbCreateState.statusDone;
          elements.back.textContent = dbCreateState.step === 1 ? "취소" : "뒤로";
          elements.back.hidden = isProcessing || isComplete;
          elements.next.hidden = dbCreateState.step === 3;
          elements.done.hidden = !isComplete;
          elements.back.style.display = isProcessing || isComplete ? "none" : "";
          elements.next.style.display = dbCreateState.step === 3 ? "none" : "";
          elements.done.style.display = isComplete ? "" : "none";
          elements.done.disabled = !dbCreateState.statusDone;
          elements.back.disabled = dbCreateState.isSubmitting || isComplete;
          if (dbCreateState.step === 1) {
            elements.next.textContent = "다음";
            elements.next.disabled = isProcessing || isComplete || !dbCreateState.engine || dbCreateState.isSubmitting;
          } else if (dbCreateState.step === 2) {
            elements.next.innerHTML = `<span class="material-icons-round">rocket_launch</span>생성 시작`;
            elements.next.disabled = isProcessing || isComplete || !String(dbCreateState.name || "").trim() || !normalizeDatabaseSizeInput(dbCreateState.size) || dbCreateState.isSubmitting;
          }
        };

        const rerender = () => {
          syncHeader();
          renderProgress();
          renderStages();
          renderEngineGrid();
          renderSizeSummary();
          renderStatus();
          syncActions();
        };

        const closeModal = () => {
          modal.hidden = true;
          document.body.style.overflow = "";
          resetDatabaseCreateState();
          rerender();
        };

        const startDatabaseCreate = async () => {
          clearDatabaseCreateTimer();
          dbCreateState.statusIndex = 0;
          dbCreateState.statusDone = false;
          dbCreateState.created = false;
          dbCreateState.isSubmitting = true;
          dbCreateState.errorMessage = "";
          rerender();

          const tick = () => {
            if (!dbCreateState.isSubmitting || dbCreateState.statusDone || dbCreateState.errorMessage) {
              return;
            }

            dbCreateState.statusIndex = Math.min(dbCreateState.statusIndex + 1, DB_CREATE_STATUS_STEPS.length - 1);
            rerender();
            dbCreateState.timer = window.setTimeout(tick, 900);
          };

          dbCreateState.timer = window.setTimeout(tick, 900);

          try {
            await requestJson("/databases", {
              method: "POST",
              headers: {
                Accept: "application/json",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                name: String(dbCreateState.name || "").trim(),
                engine: dbCreateState.engine,
                size: formatDatabaseSizeValue(dbCreateState.size)
              })
            });
            dbCreateState.isSubmitting = false;
            dbCreateState.statusDone = true;
            dbCreateState.created = true;
            dbCreateState.statusIndex = DB_CREATE_STATUS_STEPS.length;
            clearDatabaseCreateTimer();
            rerender();
            await loadDatabaseHub();
          } catch (error) {
            dbCreateState.isSubmitting = false;
            dbCreateState.statusDone = false;
            dbCreateState.created = false;
            dbCreateState.errorMessage = String(error?.message || "데이터베이스 생성에 실패했습니다.").replace(/^\d+\s*/, "").trim();
            clearDatabaseCreateTimer();
            rerender();
          }
        };

        elements.engineGrid.addEventListener("click", (event) => {
          const button = event.target.closest("[data-db-engine]");
          if (!button) return;
          dbCreateState.engine = button.dataset.dbEngine || "";
          rerender();
        });

        elements.sizeInput.addEventListener("input", (event) => {
          dbCreateState.size = normalizeDatabaseSizeInput(event.target.value || "");
          event.target.value = dbCreateState.size;
          syncActions();
          renderProgress();
        });
        elements.nameInput.addEventListener("input", (event) => {
          dbCreateState.name = event.target.value || "";
          syncActions();
          renderProgress();
        });

        elements.close.addEventListener("click", closeModal);
        elements.back.addEventListener("click", () => {
          if (dbCreateState.step === 1) {
            closeModal();
            return;
          }
          if (dbCreateState.step === 3) {
            if (dbCreateState.created) {
              closeModal();
              return;
            }
            clearDatabaseCreateTimer();
            dbCreateState.step = 2;
            dbCreateState.statusIndex = 0;
            dbCreateState.statusDone = false;
            dbCreateState.created = false;
            rerender();
            return;
          }
          dbCreateState.step -= 1;
          rerender();
        });

        elements.next.addEventListener("click", async () => {
          if (dbCreateState.isSubmitting) {
            return;
          }
          if (dbCreateState.step === 1 && dbCreateState.engine) {
            dbCreateState.step = 2;
            rerender();
            requestAnimationFrame(() => elements.nameInput.focus());
            return;
          }
          if (dbCreateState.step === 2 && String(dbCreateState.name || "").trim() && normalizeDatabaseSizeInput(dbCreateState.size)) {
            elements.back.disabled = true;
            elements.next.disabled = true;
            dbCreateState.step = 3;
            rerender();
            await startDatabaseCreate();
          }
        });

        elements.done.addEventListener("click", closeModal);

        modal.addEventListener("click", (event) => {
          if (event.target === modal) {
            closeModal();
          }
        });

        modal.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !modal.hidden) {
            closeModal();
          }
        });

        rerender();
        return modal;
      }

      function wireDatabaseCreateAction() {
        const button = document.querySelector(".control-actions .create-btn");
        if (!button || button.dataset.databaseCreateBound === "true") {
          return;
        }

        button.dataset.databaseCreateBound = "true";
        button.addEventListener("click", (event) => {
          event.preventDefault();
          resetDatabaseCreateState();
          const modal = ensureDatabaseCreateModal();
          const firstEngine = modal.querySelector("[data-db-engine]");
          modal.hidden = false;
          document.body.style.overflow = "hidden";
          requestAnimationFrame(() => {
            if (firstEngine) firstEngine.focus();
          });
        });
      }

      function toResource(resource, bindings) {
        const engineMeta = getEngineMeta(resource.engine);
        const statusMeta = getStatusMeta(resource);
        const projects = bindings.filter(item => item.targetType === "project").map(item => toConnection(item, engineMeta));
        const consoles = bindings.filter(item => item.targetType === "console").map(item => toConnection(item, engineMeta));
        const ownerName = getOwnerName(resource.owner);
        const collaborators = getResourceAuthors(resource);

        return {
          id: resource.id,
          categories: ["all", engineMeta.category].filter(Boolean),
          status: statusMeta,
          engine: resource.version ? `${engineMeta.label} · v${resource.version}` : engineMeta.label,
          icon: engineMeta.icon,
          name: resource.name,
          meta: resource.summary || "Database resource",
          color: engineMeta.color,
          owner: {
            initials: toInitials(ownerName),
            name: ownerName,
            meta: resource.owner?.email || "No email",
            color: engineMeta.color
          },
          sharing: {
            collaborators: collaborators.map(collaborator => ({
              initials: toInitials(getOwnerName(collaborator)),
              color: "linear-gradient(135deg,#6366f1,#818cf8)"
            }))
          },
          details: [
            { icon: "link", text: `Bindings ${formatNumber(resource.bindingCount)}` },
            { icon: "backup", text: `Backup ${getBackupLabel(resource.backup)}` }
          ].filter(Boolean),
          usage: {
            label: "Storage",
            value: Number.isFinite(resource.usage?.usagePercent) ? resource.usage.usagePercent : 0,
            meta: resource.usage?.storageLabel || "usage unavailable",
            color: engineMeta.color
          },
          connectionsLabel: "Connected Projects",
          connectionsEqualWidth: true,
          connectionsMaxItems: 4,
          connectionsLayoutClass: "is-fixed-projects",
          connections: projects,
          secondaryConnectionsLabel: "Connected Consoles",
          secondaryConnectionsMaxItems: 2,
          secondaryConnectionsLayoutClass: "is-fixed-consoles",
          secondaryConnections: consoles,
          footer: formatDateTime(resource.updatedAt),
          actions: [
            {
              label: "Detail",
              icon: "open_in_new",
              kind: "open",
              href: `workspace_database_detail.html?db=${encodeURIComponent(resource.name)}`
            },
            {
              label: resource.capabilities?.canRestart ? "Restart" : "No Access",
              icon: "restart_alt",

      async function fetchBindingsMap(resources) {
        const entries = await Promise.all((resources || []).map(async item => {
          try {
            const payload = await fetchJson(`/databases/${encodeURIComponent(item.id)}/bindings`);
            return [item.id, extractItems(payload)];
          } catch (error) {
            return [item.id, []];
          }
        }));

        return Object.fromEntries(entries);
      }

      function getRestartButtonById(restartId) {
        return Array.from(document.querySelectorAll("[data-restart-id]"))
          .find(button => button.getAttribute("data-restart-id") === String(restartId));
      }

      function markCardAsPreparing(restartId) {
        const button = getRestartButtonById(restartId);
        const card = button?.closest("[data-resource-card]");
        const statusPill = card?.querySelector(".status-pill");

        if (card) {
          card.style.opacity = "0.58";
          card.style.filter = "saturate(0.72)";
        }

        if (statusPill) {
          statusPill.className = "status-pill tone-review";
          statusPill.textContent = "Preparing";
        }

        if (button) {
          button.disabled = true;
          button.classList.add("is-disabled");
          button.style.display = "none";
        }
      }

      function syncPendingRestartCards() {
        pendingRestarts.forEach((_, restartId) => {
          markCardAsPreparing(restartId);
        });
      }

      async function waitForRestartCompletion(restartId) {
        await sleep(3000);

        for (let attempt = 0; attempt < RESTART_POLL_MAX_ATTEMPTS; attempt += 1) {
          try {
            const response = await fetchJson(`/databases/${encodeURIComponent(restartId)}`);
            const database = extractData(response, null);
            const normalizedStatus = normalizeStatus(getResolvedStatusValue(database));
            const normalizedSeverity = normalizeSeverity(database?.health?.severity, getResolvedStatusValue(database));

            if (normalizedStatus !== "restarting" && (normalizedStatus === "running" || normalizedSeverity === "healthy")) {
              return true;
            }
          } catch (error) {
            console.warn("[database_hub] restart poll failed", error);
          }

          await sleep(RESTART_POLL_INTERVAL_MS);
        }

        return false;
      }

      function attachRestartHandlers() {
        document.querySelectorAll("[data-restart-id]").forEach(button => {
          if (button.dataset.restartBound === "true") {
            return;
          }

          button.dataset.restartBound = "true";
          button.addEventListener("click", async event => {
            event.preventDefault();

            const restartId = button.getAttribute("data-restart-id");
            const restartName = button.getAttribute("data-restart-name") || "database";

            if (!restartId || button.classList.contains("is-disabled") || button.disabled) {
              return;
            }

            button.disabled = true;
            button.classList.add("is-disabled");

            try {
              pendingRestarts.set(restartId, {
                name: restartName,
                startedAt: Date.now()
              });
              markCardAsPreparing(restartId);

              await requestJson(`/databases/${encodeURIComponent(restartId)}/restart`, {
                method: "POST"
              });
            } catch (error) {
              console.error("[database_hub] restart failed", error);
              pendingRestarts.delete(restartId);
              await loadDatabaseHub();
              return;
            }

            const completed = await waitForRestartCompletion(restartId);
            pendingRestarts.delete(restartId);

            if (completed) {
              await loadDatabaseHub();
              return;
            }

            await loadDatabaseHub();
          });
        });
      }

      function renderConfig(config) {
        lastRenderedConfig = config;
        const nextConfig = {
          ...config,
          resources: [...createdDatabaseResources, ...(config.resources || [])]
        };
        window.HUB_CONFIG = nextConfig;
        if (typeof window.renderWorkspaceResourceHub === "function") {
          window.renderWorkspaceResourceHub(nextConfig);
          syncPendingRestartCards();
          attachRestartHandlers();
          wireDatabaseCreateAction();
          if (typeof window.refreshConceptEndpointOverlay === "function") {
            requestAnimationFrame(() => {
              window.refreshConceptEndpointOverlay();
            });
          }
        }
      }

      async function loadDatabaseHub() {
        const results = await Promise.allSettled([
          fetchAllDatabases(),
          fetchJson("/databases/stats"),
          fetchJson("/databases/filters"),
          fetchJson("/panels/tips", { surface: "databases" }),
          fetchJson("/panels/guide-links", { surface: "databases" }),
          fetchJson("/databases/panels/health")
        ]);

        const [
          databasesResult,
          statsResult,
          filtersResult,
          tipsResult,
          guideResult,
          healthResult
        ] = results;

        const databasesPayload = databasesResult.status === "fulfilled" ? databasesResult.value : null;
        const statsPayload = statsResult.status === "fulfilled" ? extractData(statsResult.value, null) : null;
        const filtersPayload = filtersResult.status === "fulfilled" ? extractData(filtersResult.value, null) : null;
        const tipsPayload = tipsResult.status === "fulfilled" ? extractData(tipsResult.value, null) : null;
        const guidePayload = guideResult.status === "fulfilled" ? extractData(guideResult.value, null) : null;
        const healthPayload = healthResult.status === "fulfilled" ? extractData(healthResult.value, null) : null;

        const databaseItems = extractItems(databasesPayload);
        const sortedDatabaseItems = databaseItems.slice().sort((left, right) => {
          const leftTime = new Date(left?.createdAt || left?.updatedAt || 0).getTime();
          const rightTime = new Date(right?.createdAt || right?.updatedAt || 0).getTime();
          return rightTime - leftTime;
        });
        const mergedHealthPayload = mergeHealthPanel(healthPayload, sortedDatabaseItems, statsPayload);
        const bindingsMap = await fetchBindingsMap(sortedDatabaseItems);
        const resourceTotal = extractPageTotal(databasesPayload, sortedDatabaseItems.length);
        const config = {
          ...FALLBACK_CONFIG,
          resourcePageSize: DEFAULT_RESOURCE_LIMIT,
          heroStats: buildHeroStats(statsPayload, mergedHealthPayload),
          filters: buildEngineFilters(filtersPayload),
          resourceDescription: buildResourceDescription(resourceTotal),
          resources: sortedDatabaseItems.map(item => toResource(item, bindingsMap[item.id] || [])),
          summary: null,
          mainPanels: [
            buildTipsPanel(tipsPayload),
            buildGuidePanel(guidePayload)
          ],
          sidebarPanels: [
            buildHealthPanel(mergedHealthPayload)
          ]
        };

        renderConfig(config);
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", loadDatabaseHub, { once: true });
      } else {
        loadDatabaseHub();
      }
    })();
  </script>
  <script src="concept_endpoint_overlay.js"></script>
</body>
</html>
