<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permission Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    :root {
      --bg:#fff0f7;
      --surface:#ffffff;
      --surface-soft:#fcfbff;
      --surface-deep:#1f1632;
      --border:#ece7f4;
      --border-strong:#ddd5ea;
      --text:#241f31;
      --muted:#655f74;
      --subtle:#948da7;
      --good:#0f766e;
      --good-bg:#dbfaf1;
      --warn:#c2410c;
      --warn-bg:#ffedd5;
      --danger:#b91c1c;
      --danger-bg:#fee2e2;
      --brand:#be185d;
      --brand-strong:#9d174d;
      --brand-bg:#ffdbe9;
      --brand-soft:rgba(190,24,93,.18);
      --accent:#fb7185;
      --max:1280px;
      --nav-max:1520px;
      --radius:22px;
      --gap:20px;
      --shadow-soft:0 14px 32px rgba(31,22,50,.06);
      --shadow-strong:0 18px 40px rgba(31,22,50,.09);
      --border-2:#ddd5ea;
      --t1:#241f31;
      --t2:#655f74;
      --t3:#948da7;
      --purple:#7c5fcf;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at top left, var(--brand-soft), transparent 30%),
        radial-gradient(circle at top right, rgba(251,113,133,.10), transparent 24%),
        linear-gradient(180deg, #fff8fb 0%, var(--bg) 100%);
      -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; cursor:pointer; }

    .topbar {
      position:sticky;
      top:0;
      z-index:200;
      height:56px;
      background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .topbar-inner {
      max-width:var(--nav-max);
      height:100%;
      margin:0 auto;
      padding:0 24px;
      display:flex;
      align-items:center;
      gap:12px;
      position:relative;
    }
    .topbar-brand {
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
      padding-right:2px;
    }
    .brand-mark {
      width:40px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .brand-mark img { width:35px; height:20px; display:block; }
    .brand-name {
      font-size:15px;
      font-weight:800;
      letter-spacing:-.35px;
      white-space:nowrap;
    }
    .logo-menu {
      flex-shrink:0;
      display:flex;
      align-items:center;
    }
    .menu-trigger {
      display:flex;
      align-items:center;
      gap:8px;
      height:40px;
      padding:0 11px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fbfcfe;
      font-size:13px;
      font-weight:700;
      color:var(--t1);
      transition:background .15s, box-shadow .15s;
    }
    .menu-trigger:hover,
    .logo-menu.is-open .menu-trigger {
      background:var(--bg);
      box-shadow:inset 0 0 0 1px var(--border);
    }
    .menu-trigger .material-icons-round:first-child {
      font-size:18px;
      color:var(--t2);
    }
    .menu-caret {
      font-size:18px;
      color:var(--t3);
      transition:transform .18s ease, color .15s ease;
    }
    .logo-menu.is-open .menu-caret {
      transform:rotate(180deg);
      color:var(--brand);
    }
    .service-popover {
      position:fixed;
      left:0;
      top:56px;
      width:100vw;
      background:linear-gradient(180deg, rgba(252,251,254,.98) 0%, rgba(246,243,251,.98) 100%);
      border-top:1px solid rgba(236,231,244,.9);
      border-bottom:1px solid var(--border);
      box-shadow:0 18px 36px rgba(31,22,50,.08);
      padding:18px 0 20px;
      z-index:240;
    }
    .service-popover[hidden] { display:none; }
    .service-popover-inner {
      max-width:var(--nav-max);
      margin:0 auto;
      padding:0 24px;
    }
    .service-groups {
      display:grid;
      grid-template-columns:repeat(6, minmax(0, 1fr));
    }
    .service-group {
      min-width:0;
      padding:0 30px;
    }
    .service-group + .service-group { border-left:1px solid var(--border); }
    .service-group-title {
      font-size:15px;
      font-weight:700;
      margin-bottom:18px;
    }
    .service-links { display:grid; gap:18px; }
    .service-link {
      display:grid;
      grid-template-columns:18px minmax(0, 1fr);
      gap:10px;
      padding:7px 10px;
      margin:0 -10px;
      border-radius:10px;
      font-size:13px;
      font-weight:600;
      transition:background .15s ease, color .15s ease;
    }
    .service-link:hover {
      background:rgba(255,255,255,.84);
      color:var(--brand);
    }
    .service-link.is-current {
      background:rgba(255,255,255,.84);
      color:var(--brand);
      box-shadow:inset 0 0 0 1px rgba(190,24,93,.08);
    }
    .service-link-icon {
      font-size:17px;
      color:var(--t2);
      margin-top:2px;
    }
    .service-link:hover .service-link-icon,
    .service-link.is-current .service-link-icon { color:var(--brand); }
    .service-link-copy { display:grid; gap:4px; min-width:0; }
    .service-link-desc {
      font-size:12px;
      line-height:1.45;
      color:var(--t2);
      font-weight:400;
    }
    .service-link:hover .service-link-desc,
    .service-link.is-current .service-link-desc { color:var(--t1); }
    .service-outlinks {
      position:relative;
      left:50%;
      width:100vw;
      box-sizing:border-box;
      margin:16px 0 -20px;
      padding:9px max(24px, calc((100vw - var(--nav-max)) / 2 + 24px)) 10px;
      transform:translateX(-50%);
      border-top:1px solid rgba(31,22,50,.10);
      display:flex;
      align-items:center;
      justify-content:flex-start;
      flex-wrap:wrap;
      gap:10px;
      background:rgba(252,251,254,.72);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
    }
    .service-outlinks-title {
      color:var(--t3);
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.72;
    }
    .service-outlink-list {
      display:flex;
      align-items:center;
      justify-content:flex-start;
      flex-wrap:wrap;
      gap:0;
    }
    .service-outlink {
      min-width:0;
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:3px 8px;
      color:var(--t2);
      text-decoration:none;
      font-size:12px;
      font-weight:600;
      transition:color .15s ease;
    }
    .service-outlink + .service-outlink {
      border-left:1px solid var(--border);
    }
    .service-outlink:hover {
      color:var(--brand);
    }
    .service-outlink-icon,
    .service-outlink-arrow {
      color:currentColor;
      font-size:13px;
      opacity:.48;
      transition:opacity .15s ease;
    }
    .service-outlink:hover .service-outlink-icon,
    .service-outlink:hover .service-outlink-arrow {
      opacity:.8;
    }
    .service-outlink-copy {
      min-width:0;
      display:inline-flex;
      align-items:center;
    }
    .service-outlink-title {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .service-outlink-desc {
      display:none;
    }
    .search-wrap {
      flex:1;
      max-width:440px;
      min-width:0;
      position:relative;
    }
    .search-wrap .ico {
      position:absolute;
      left:13px;
      top:50%;
      transform:translateY(-50%);
      font-size:17px;
      color:var(--t3);
      pointer-events:none;
    }
    .search-input {
      width:100%;
      height:36px;
      border:1.5px solid var(--border);
      border-radius:20px;
      padding:0 72px 0 38px;
      background:var(--bg);
      outline:none;
      font-size:13px;
      color:var(--t1);
      transition:border .15s, box-shadow .15s;
    }
    .search-input:focus {
      border-color:var(--brand);
      background:var(--surface);
      box-shadow:0 0 0 3px rgba(190,24,93,.08);
    }
    .search-ai {
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      height:22px;
      padding:0 7px;
      border-radius:999px;
      display:flex;
      align-items:center;
      gap:3px;
      background:linear-gradient(135deg, #f6f0ff 0%, #eef4ff 100%);
      border:1px solid rgba(124,95,207,.18);
      font-size:10px;
      font-weight:700;
      color:var(--purple);
      letter-spacing:.02em;
      pointer-events:none;
    }
    .search-ai .material-icons-round { font-size:12px; }
    .tb-spacer { flex:1; }
    .tb-icon {
      width:34px;
      height:34px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--t2);
      position:relative;
    }
    .tb-icon:hover { background:var(--bg); }
    .tb-icon .material-icons-round { font-size:20px; }
    .tb-icon .dot {
      position:absolute;
      top:5px;
      right:5px;
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--brand);
      border:2px solid var(--surface);
    }
    .avatar {
      width:32px;
      height:32px;
      border-radius:50%;
      background:var(--brand);
      color:#fff;
      font-size:12px;
      font-weight:600;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .page {
      max-width:var(--max);
      margin:0 auto;
      padding:28px 24px 44px;
      display:grid;
      gap:22px;
    }
    .breadcrumbs {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      font-size:12px;
      color:var(--subtle);
    }
    .breadcrumbs a {
      color:var(--muted);
      font-weight:700;
    }
    .breadcrumbs .material-icons-round {
      font-size:15px;
      color:#bcc6d4;
    }
    .panel {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-soft);
    }
    .hero {
      overflow:hidden;
      position:relative;
      padding:28px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.96), rgba(255,250,253,.92)),
        linear-gradient(135deg, var(--brand-soft), rgba(251,113,133,.06));
    }
    .hero::after {
      content:"";
      position:absolute;
      right:-80px;
      top:-90px;
      width:280px;
      height:280px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(190,24,93,.12) 0%, rgba(190,24,93,0) 68%);
      pointer-events:none;
    }
    .hero-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      margin-bottom:22px;
    }
    .eyebrow {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:14px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .hero-title-row {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }
    .hero-title {
      font-size:34px;
      font-weight:800;
      letter-spacing:-.04em;
    }
    .pill {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .pill.status-healthy { color:var(--good); background:var(--good-bg); }
    .pill.status-warning { color:var(--warn); background:var(--warn-bg); }
    .pill.status-danger { color:var(--danger); background:var(--danger-bg); }
    .pill.engine { color:var(--brand); background:var(--brand-bg); }
    .hero-desc {
      max-width:760px;
      color:var(--muted);
      line-height:1.65;
      font-size:15px;
    }
    .hero-actions {
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:10px;
    }
    .action-btn {
      display:inline-flex;
      align-items:center;
      gap:8px;
      height:42px;
      padding:0 16px;
      border-radius:14px;
      border:1px solid transparent;
      font-size:13px;
      font-weight:800;
      transition:.16s ease;
    }
    .action-btn.primary {
      background:linear-gradient(135deg,var(--brand),var(--brand-strong));
      color:#fff;
      box-shadow:0 14px 28px rgba(190,24,93,.22);
    }
    .action-btn.secondary {
      background:#fff;
      border-color:var(--border);
      color:var(--text);
    }
    .action-btn:hover { transform:translateY(-1px); }
    .hero-stats {
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:14px;
    }
    .stat-card {
      padding:18px;
      border-radius:18px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(236,231,244,.96);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
    }
    .stat-label {
      color:var(--subtle);
      font-size:12px;
      font-weight:700;
      margin-bottom:8px;
    }
    .stat-value {
      font-size:27px;
      font-weight:800;
      letter-spacing:-.04em;
      margin-bottom:5px;
    }
    .stat-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .section {
      padding:20px;
    }
    .section-head {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:16px;
    }
    .section-kicker {
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-bottom:6px;
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .section-title {
      font-size:18px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:4px;
    }
    .section-desc {
      color:var(--subtle);
      line-height:1.55;
      font-size:12px;
    }
    .section-link {
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:var(--brand);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .layout {
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(280px, 320px);
      gap:var(--gap);
      align-items:start;
    }
    .main-col,
    .side-col {
      display:grid;
      gap:var(--gap);
    }
    .main-col {
      min-width:0;
    }
    .side-persistent {
      display:grid;
      gap:var(--gap);
      position:sticky;
      top:76px;
      align-self:start;
    }
    .timeline-panel {
      padding:20px;
      border:1px solid #ebedf0;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(250,251,253,.96) 100%);
      box-shadow:0 10px 26px rgba(15,23,42,.04);
    }
    .panel-header {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:16px;
    }
    .panel-title-wrap {
      display:grid;
      gap:4px;
    }
    .panel-kicker {
      display:flex;
      align-items:center;
      gap:6px;
      color:#9298a0;
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .panel-kicker .material-icons-round {
      font-size:14px;
    }
    .panel-title {
      font-size:18px;
      font-weight:800;
      letter-spacing:-.03em;
      color:#2f3236;
    }
    .panel-subtitle {
      color:#9298a0;
      font-size:12px;
      line-height:1.55;
    }

    .overview-grid,
    .target-grid,
    .editor-grid {
      display:grid;
      gap:16px;
    }
    .overview-grid {
      grid-template-columns:1fr;
    }
    .target-grid {
      grid-template-columns:repeat(2, minmax(0,1fr));
    }
    .editor-grid {
      grid-template-columns:1fr;
    }
    .card {
      padding:16px;
      border-radius:16px;
      border:1px solid var(--border);
      background:var(--surface-soft);
    }
    .card-title {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
      margin-bottom:12px;
    }
    .card-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:14px;
    }
    .card-desc {
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }
    .inline-actions {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:flex-end;
    }
    .owner-list,
    .manager-list {
      display:grid;
      gap:12px;
    }
    .kv-list,
    .checkpoint-list,
    .request-list,
    .target-list {
      display:grid;
      gap:12px;
    }
    .kv-row,
    .checkpoint-row,
    .request-row,
    .target-row,
    .owner-row,
    .manager-row {
      display:grid;
      gap:10px;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid var(--border);
      background:#fff;
    }
    .kv-row {
      grid-template-columns:132px minmax(0,1fr);
      align-items:center;
      gap:12px;
    }
    .kv-key {
      color:var(--subtle);
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .kv-value {
      font-size:14px;
      font-weight:700;
      color:var(--text);
      line-height:1.55;
    }
    .checkpoint-row {
      grid-template-columns:auto minmax(0,1fr);
      align-items:start;
    }
    .checkpoint-icon {
      width:34px;
      height:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      color:var(--brand);
      background:var(--brand-bg);
    }
    .checkpoint-title {
      font-size:14px;
      font-weight:800;
      margin-bottom:4px;
    }
    .checkpoint-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .person-avatar {
      width:38px;
      height:38px;
      border-radius:14px;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:12px;
      font-weight:800;
      background:linear-gradient(135deg,var(--brand),var(--accent));
    }
    .person-name {
      font-size:14px;
      font-weight:800;
      margin-bottom:3px;
    }
    .person-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .owner-row {
      grid-template-columns:auto minmax(0,1fr) auto;
      align-items:center;
    }
    .owner-main {
      min-width:0;
      display:grid;
      gap:4px;
    }
    .owner-role {
      color:var(--brand);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .disclosure {
      margin-top:14px;
      border:1px solid var(--border);
      border-radius:18px;
      background:#fff;
      overflow:hidden;
    }
    .disclosure summary {
      list-style:none;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:15px 16px;
      cursor:pointer;
      font-size:14px;
      font-weight:800;
    }
    .disclosure summary::-webkit-details-marker {
      display:none;
    }
    .disclosure-meta {
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .disclosure-icon {
      transition:transform .16s ease;
    }
    .disclosure[open] .disclosure-icon {
      transform:rotate(180deg);
    }
    .disclosure-body {
      padding:0 16px 16px;
      border-top:1px solid var(--border);
    }
    .editor-shell {
      display:grid;
      grid-template-columns:minmax(190px, 220px) minmax(0, 1fr);
      gap:14px;
      min-width:0;
      align-items:start;
    }
    .editor-sidebar,
    .editor-detail {
      min-width:0;
      border:1px solid var(--border);
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(252,249,255,.94));
    }
    .editor-sidebar {
      display:grid;
      grid-template-rows:auto auto minmax(0, 1fr);
      min-height:640px;
      overflow:hidden;
    }
    .editor-detail {
      padding:18px;
      display:grid;
      gap:16px;
      align-content:start;
      overflow:hidden;
    }
    .editor-toolbar {
      display:flex;
      gap:10px;
      padding:16px 16px 12px;

      display:flex;
      justify-content:center;
      min-height:100%;

      transform:translateX(-50%);

      font-weight:800;
      white-space:nowrap;

      const normalized = name
        .toLowerCase()

      return `${normalized || `member${fallbackIndex + 1}`}@lge.com`;
    }

    function inferRoleGroupIndexes(roleName, roleIndex, groupCount) {
      if (!groupCount) return [];
      const lower = roleName.toLowerCase();
      if (lower.includes("admin")) return [0];
      if (lower.includes("viewer") || lower.includes("readonly")) return [Math.min(2, groupCount - 1)];
      if (lower.includes("developer")) return [Math.min(1, groupCount - 1)];
      if (
        lower.includes("operator") ||
        lower.includes("maintainer") ||
        lower.includes("approver") ||
        lower.includes("publisher") ||
        lower.includes("uploader") ||
        lower.includes("reviewer") ||
        lower === "user"
      ) {
        return [Math.min(1, groupCount - 1)];
      }
      return [Math.min(roleIndex, groupCount - 1)];
    }

    function createRoleAssignments(currentRealm) {
      const loginLabels = ["Today", "1d ago", "2d ago", "4d ago", "7d ago", "12d ago"];
      return currentRealm.roles.map((role, roleIndex) => {
        const groupIndexes = inferRoleGroupIndexes(role.name, roleIndex, currentRealm.memberGroups.length);
        const groups = groupIndexes
          .map((groupIndex) => currentRealm.memberGroups[groupIndex])
          .filter(Boolean);

        const users = groups.flatMap((group, groupIndex) =>
          group.people.map((person, personIndex) => ({
            name: person.name,
            email: createEmail(person.name, personIndex),
            lastLogin: loginLabels[(roleIndex + groupIndex + personIndex) % loginLabels.length],
            meta: person.meta
          }))
        ).filter((person, index, array) => (
          array.findIndex((candidate) => candidate.email === person.email) === index
        ));

        const linkedGroups = groups.map((group, groupIndex) => ({
          name: `${group.title} Group`,
          description: group.meta,
          members: group.count,
          source: group.people.map((person) => person.name).join(", ") || `role ${role.name}`,
          id: `${role.name}-${groupIndex}`
        }));

        return {
          ...role,
          users,
          groups: linkedGroups
        };
      });
    }

    const menuWrap = document.getElementById("serviceMenuWrap");
    const menuButton = document.getElementById("serviceMenuButton");
    const menuPopover = document.getElementById("serviceMenuPopover");

    if (menuWrap && menuButton && menuPopover) {
      const setOpen = (open) => {
        menuWrap.classList.toggle("is-open", open);
        menuButton.setAttribute("aria-expanded", String(open));
        menuPopover.hidden = !open;
      };

      setOpen(false);

      menuButton.addEventListener("click", (event) => {
        event.preventDefault();
        setOpen(!menuWrap.classList.contains("is-open"));
      });

      document.addEventListener("click", (event) => {
        if (!menuWrap.contains(event.target)) setOpen(false);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setOpen(false);
          menuButton.focus();
        }
      });
    }

    const filterButtons = Array.from(document.querySelectorAll("[data-filter]"));
    const requestRows = Array.from(document.querySelectorAll("[data-request-status]"));
    const requestSummary = document.getElementById("requestSummary");
    const roleList = document.getElementById("roleList");
    const roleListSummary = document.getElementById("roleListSummary");
    const roleSearchInput = document.getElementById("roleSearchInput");
    const userSearchInput = document.getElementById("userSearchInput");
    const groupSearchInput = document.getElementById("groupSearchInput");
    const selectedRoleName = document.getElementById("selectedRoleName");
    const selectedRoleSummary = document.getElementById("selectedRoleSummary");
    const selectedRoleMeta = document.getElementById("selectedRoleMeta");
    const selectedRoleApproval = document.getElementById("selectedRoleApproval");
    const userTableBody = document.getElementById("userTableBody");
    const groupTableBody = document.getElementById("groupTableBody");
    const userTableSummary = document.getElementById("userTableSummary");
    const groupTableSummary = document.getElementById("groupTableSummary");

    const editorState = {
      activeRole: editorRoles[0] ? editorRoles[0].name : "",
      roleQuery: "",
      userQuery: "",
      groupQuery: ""
    };

    function includesQuery(values, query) {
      const normalizedQuery = query.trim().toLowerCase();
      if (!normalizedQuery) return true;
      return values.some((value) => String(value).toLowerCase().includes(normalizedQuery));
    }

    function getFilteredRoles() {
      return editorRoles.filter((item) => includesQuery([item.name, item.summary, item.approval], editorState.roleQuery));
    }

    function syncActiveRole(filteredRoles) {
      if (filteredRoles.some((item) => item.name === editorState.activeRole)) return;
      editorState.activeRole = filteredRoles[0] ? filteredRoles[0].name : "";
    }

    function renderEditor() {
      const filteredRoles = getFilteredRoles();
      syncActiveRole(filteredRoles);
      const activeRole = filteredRoles.find((item) => item.name === editorState.activeRole) || null;

      roleList.innerHTML = renderRoleList(filteredRoles, editorState.activeRole);
      roleListSummary.textContent = `${filteredRoles.length} / ${editorRoles.length}`;

      Array.from(roleList.querySelectorAll("[data-role-name]")).forEach((button) => {
        button.addEventListener("click", () => {
          editorState.activeRole = button.dataset.roleName;
          renderEditor();
        });
      });

      if (!activeRole) {
        selectedRoleName.textContent = "Role 없음";
        selectedRoleSummary.textContent = "선택 가능한 Role이 없습니다.";
        selectedRoleMeta.textContent = "";
        selectedRoleApproval.className = "tone-pill review";
        selectedRoleApproval.textContent = "확인 필요";
        userTableBody.innerHTML = renderUserRows([]);
        groupTableBody.innerHTML = renderGroupRows([]);
        userTableSummary.textContent = "0건";
        groupTableSummary.textContent = "0건";
        return;
      }

      const filteredUsers = activeRole.users.filter((item) => (
        includesQuery([item.name, item.email, item.meta, item.lastLogin], editorState.userQuery)
      ));
      const filteredGroups = activeRole.groups.filter((item) => (
        includesQuery([item.name, item.description, item.members, item.source], editorState.groupQuery)
      ));

      selectedRoleName.textContent = activeRole.name;
      selectedRoleSummary.textContent = activeRole.summary;
      selectedRoleMeta.textContent = `${activeRole.capabilities.join(" · ")} · 사용자 ${filteredUsers.length}명 · 그룹 ${filteredGroups.length}개`;
      selectedRoleApproval.className = `tone-pill ${approvalTone(activeRole.approval)}`;
      selectedRoleApproval.textContent = activeRole.approval;
      userTableBody.innerHTML = renderUserRows(filteredUsers);
      groupTableBody.innerHTML = renderGroupRows(filteredGroups);
      userTableSummary.textContent = `${filteredUsers.length}건`;
      groupTableSummary.textContent = `${filteredGroups.length}건`;
    }

    function updateRequestFilter(status) {
      filterButtons.forEach((button) => {
        button.classList.toggle("is-active", button.dataset.filter === status);
      });

      let visibleCount = 0;
      requestRows.forEach((row) => {
        const match = status === "all" || row.dataset.requestStatus === status;
        row.style.display = match ? "" : "none";
        if (match) visibleCount += 1;
      });

      const labelMap = {
        all: "전체 요청",
        pending: "대기 요청",
        review: "검토 요청",
        done: "완료 이력"
      };
      requestSummary.textContent = `${labelMap[status]} ${visibleCount}건`;
    }

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => updateRequestFilter(button.dataset.filter));
    });
    roleSearchInput.addEventListener("input", (event) => {
      editorState.roleQuery = event.target.value;
      renderEditor();
    });
    userSearchInput.addEventListener("input", (event) => {
      editorState.userQuery = event.target.value;
      renderEditor();
    });
    groupSearchInput.addEventListener("input", (event) => {
      editorState.groupQuery = event.target.value;
      renderEditor();
    });

    renderEditor();
    updateRequestFilter("all");
  </script>
