<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Permission Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    :root {
      --bg:#fff0f7;
      --surface:#ffffff;
      --surface-soft:#fcfbff;
      --surface-deep:#1f1632;
      --border:#ece7f4;
      --border-strong:#ddd5ea;
      --text:#241f31;
      --muted:#655f74;
      --subtle:#948da7;
      --good:#0f766e;
      --good-bg:#dbfaf1;
      --warn:#c2410c;
      --warn-bg:#ffedd5;
      --danger:#b91c1c;
      --danger-bg:#fee2e2;
      --brand:#be185d;
      --brand-strong:#9d174d;
      --brand-bg:#ffdbe9;
      --brand-soft:rgba(190,24,93,.18);
      --accent:#fb7185;
      --max:1280px;
      --nav-max:1520px;
      --radius:22px;
      --gap:20px;
      --shadow-soft:0 14px 32px rgba(31,22,50,.06);
      --shadow-strong:0 18px 40px rgba(31,22,50,.09);
      --border-2:#ddd5ea;
      --t1:#241f31;
      --t2:#655f74;
      --t3:#948da7;
      --purple:#7c5fcf;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at top left, var(--brand-soft), transparent 30%),
        radial-gradient(circle at top right, rgba(251,113,133,.10), transparent 24%),
        linear-gradient(180deg, #fff8fb 0%, var(--bg) 100%);
      -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; cursor:pointer; }

    .topbar {
      position:sticky;
      top:0;
      z-index:200;
      height:84px;
      background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .topbar-inner {
      max-width:var(--nav-max);
      height:100%;
      margin:0 auto;
      padding:10px 24px;
      display:flex;
      align-items:center;
      gap:12px;
      position:relative;
    }
    .topbar-brand {
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
      padding-right:2px;
    }
    .brand-mark {
      width:40px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .brand-mark img { width:35px; height:20px; display:block; }
    .brand-name {
      font-size:15px;
      font-weight:800;
      letter-spacing:-.35px;
      white-space:nowrap;
    }
    .logo-menu {
      flex-shrink:0;
      display:flex;
      align-items:center;
    }
    .menu-trigger {
      display:flex;
      align-items:center;
      gap:8px;
      height:40px;
      padding:0 11px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fbfcfe;
      font-size:13px;
      font-weight:700;
      color:var(--t1);
      transition:background .15s, box-shadow .15s;
    }
    .menu-trigger:hover,
    .logo-menu.is-open .menu-trigger {
      background:var(--bg);
      box-shadow:inset 0 0 0 1px var(--border);
    }
    .menu-trigger .material-icons-round:first-child {
      font-size:18px;
      color:var(--t2);
    }
    .menu-caret {
      font-size:18px;
      color:var(--t3);
      transition:transform .18s ease, color .15s ease;
    }
    .logo-menu.is-open .menu-caret {
      transform:rotate(180deg);
      color:var(--brand);
    }
    .service-popover {
      position:fixed;
      left:0;
      top:84px;
      width:100vw;
      background:linear-gradient(180deg, rgba(252,251,254,.98) 0%, rgba(246,243,251,.98) 100%);
      border-top:1px solid rgba(236,231,244,.9);
      border-bottom:1px solid var(--border);
      box-shadow:0 18px 36px rgba(31,22,50,.08);
      padding:18px 0 20px;
      z-index:240;
    }
    .service-popover[hidden] { display:none; }
    .service-popover-inner {
      max-width:var(--nav-max);
      margin:0 auto;
      padding:0 24px;
    }
    .service-popover-shell {
      display:grid;
      grid-template-columns:minmax(240px, 280px) minmax(0, 1fr);
      gap:18px;
      align-items:start;
    }
    .service-mega-intro {
      padding:22px;
      border:1px solid rgba(190,24,93,.12);
      border-radius:24px;
      background:
        radial-gradient(circle at top right, rgba(251,113,133,.16), transparent 38%),
        linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(255,245,250,.96) 100%);
      box-shadow:0 16px 28px rgba(31,22,50,.05);
    }
    .service-mega-kicker {
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-bottom:12px;
      color:var(--brand);
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .service-mega-title {
      font-size:24px;
      font-weight:800;
      letter-spacing:-.04em;
      margin-bottom:10px;
      color:var(--t1);
    }
    .service-mega-desc {
      color:var(--t2);
      font-size:13px;
      line-height:1.65;
    }
    .service-mega-points {
      display:grid;
      gap:10px;
      margin-top:18px;
    }
    .service-mega-point {
      display:grid;
      grid-template-columns:28px minmax(0, 1fr);
      gap:10px;
      align-items:start;
      color:var(--t1);
      font-size:12px;
      line-height:1.55;
    }
    .service-mega-point .material-icons-round {
      width:28px;
      height:28px;
      border-radius:10px;
      display:grid;
      place-items:center;
      color:var(--brand);
      background:rgba(190,24,93,.10);
      font-size:16px;
    }
    .service-groups {
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:14px;
    }
    .service-group {
      min-width:0;
      padding:18px;
      border:1px solid rgba(236,231,244,.96);
      border-radius:22px;
      background:rgba(255,255,255,.78);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
    }
    .service-group + .service-group { border-left:none; }
    .service-group-title {
      font-size:14px;
      font-weight:800;
      margin-bottom:16px;
    }
    .service-links { display:grid; gap:18px; }
    .service-link {
      display:grid;
      grid-template-columns:18px minmax(0, 1fr);
      gap:10px;
      padding:7px 10px;
      margin:0 -10px;
      border-radius:10px;
      font-size:13px;
      font-weight:600;
      transition:background .15s ease, color .15s ease;
    }
    .service-link:hover {
      background:rgba(255,255,255,.84);
      color:var(--brand);
    }
    .service-link.is-current {
      background:rgba(255,255,255,.84);
      color:var(--brand);
      box-shadow:inset 0 0 0 1px rgba(190,24,93,.08);
    }
    .service-link-icon {
      font-size:17px;
      color:var(--t2);
      margin-top:2px;
    }
    .service-link:hover .service-link-icon,
    .service-link.is-current .service-link-icon { color:var(--brand); }
    .service-link-copy { display:grid; gap:4px; min-width:0; }
    .service-link-desc {
      font-size:12px;
      line-height:1.45;
      color:var(--t2);
      font-weight:400;
    }
    .service-link:hover .service-link-desc,
    .service-link.is-current .service-link-desc { color:var(--t1); }
    .service-outlinks {
      position:relative;
      left:50%;
      width:100vw;
      box-sizing:border-box;
      margin:16px 0 -20px;
      padding:9px max(24px, calc((100vw - var(--nav-max)) / 2 + 24px)) 10px;
      transform:translateX(-50%);
      border-top:1px solid rgba(31,22,50,.10);
      display:flex;
      align-items:center;
      justify-content:flex-start;
      flex-wrap:wrap;
      gap:10px;
      background:rgba(252,251,254,.72);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
    }
    .service-outlinks-title {
      color:var(--t3);
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.72;
    }
    .service-outlink-list {
      display:flex;
      align-items:center;
      justify-content:flex-start;
      flex-wrap:wrap;
      gap:0;
    }
    .service-outlink {
      min-width:0;
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:3px 8px;
      color:var(--t2);
      text-decoration:none;
      font-size:12px;
      font-weight:600;
      transition:color .15s ease;
    }
    .service-outlink + .service-outlink {
      border-left:1px solid var(--border);
    }
    .service-outlink:hover {
      color:var(--brand);
    }
    .service-outlink-icon,
    .service-outlink-arrow {
      color:currentColor;
      font-size:13px;
      opacity:.48;
      transition:opacity .15s ease;
    }
    .service-outlink:hover .service-outlink-icon,
    .service-outlink:hover .service-outlink-arrow {
      opacity:.8;
    }
    .service-outlink-copy {
      min-width:0;
      display:inline-flex;
      align-items:center;
    }
    .service-outlink-title {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .service-outlink-desc {
      display:none;
    }
    .search-wrap {
      width:100%;
      max-width:520px;
      min-width:0;
      position:relative;
    }
    .search-wrap .ico {
      position:absolute;
      left:13px;
      top:50%;
      transform:translateY(-50%);
      font-size:17px;
      color:var(--t3);
      pointer-events:none;
    }
    .search-input {
      width:100%;
      height:36px;
      border:1.5px solid var(--border);
      border-radius:20px;
      padding:0 72px 0 38px;
      background:var(--bg);
      outline:none;
      font-size:13px;
      color:var(--t1);
      transition:border .15s, box-shadow .15s;
    }
    .search-input:focus {
      border-color:var(--brand);
      background:var(--surface);
      box-shadow:0 0 0 3px rgba(190,24,93,.08);
    }
    .search-ai {
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      height:22px;
      padding:0 7px;
      border-radius:999px;
      display:flex;
      align-items:center;
      gap:3px;
      background:linear-gradient(135deg, #f6f0ff 0%, #eef4ff 100%);
      border:1px solid rgba(124,95,207,.18);
      font-size:10px;
      font-weight:700;
      color:var(--purple);
      letter-spacing:.02em;
      pointer-events:none;
    }
    .search-ai .material-icons-round { font-size:12px; }
    .tb-spacer { flex:1; }
    .tb-icon {
      width:34px;
      height:34px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--t2);
      position:relative;
    }
    .tb-icon:hover { background:var(--bg); }
    .tb-icon .material-icons-round { font-size:20px; }
    .tb-icon .dot {
      position:absolute;
      top:5px;
      right:5px;
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--brand);
      border:2px solid var(--surface);
    }
    .avatar {
      width:32px;
      height:32px;
      border-radius:50%;
      background:var(--brand);
      color:#fff;
      font-size:12px;
      font-weight:600;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .page {
      max-width:var(--max);
      margin:0 auto;
      padding:28px 24px 44px;
      display:grid;
      gap:22px;
    }
    .breadcrumbs {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      font-size:12px;
      color:var(--subtle);
    }
    .breadcrumbs a {
      color:var(--muted);
      font-weight:700;
    }
    .breadcrumbs .material-icons-round {
      font-size:15px;
      color:#bcc6d4;
    }
    .panel {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-soft);
    }
    .hero {
      overflow:hidden;
      position:relative;
      padding:28px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.96), rgba(255,250,253,.92)),
        linear-gradient(135deg, var(--brand-soft), rgba(251,113,133,.06));
    }
    .hero::after {
      content:"";
      position:absolute;
      right:-80px;
      top:-90px;
      width:280px;
      height:280px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(190,24,93,.12) 0%, rgba(190,24,93,0) 68%);
      pointer-events:none;
    }
    .hero-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      margin-bottom:22px;
    }
    .eyebrow {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:14px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .hero-title-row {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }
    .hero-title {
      font-size:34px;
      font-weight:800;
      letter-spacing:-.04em;
    }
    .pill {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .pill.status-healthy { color:var(--good); background:var(--good-bg); }
    .pill.status-warning { color:var(--warn); background:var(--warn-bg); }
    .pill.status-danger { color:var(--danger); background:var(--danger-bg); }
    .pill.engine { color:var(--brand); background:var(--brand-bg); }
    .hero-desc {
      max-width:760px;
      color:var(--muted);
      line-height:1.65;
      font-size:15px;
    }
    .hero-actions {
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:10px;
    }
    .action-btn {
      display:inline-flex;
      align-items:center;
      gap:8px;
      height:42px;
      padding:0 16px;
      border-radius:14px;
      border:1px solid transparent;
      font-size:13px;
      font-weight:800;
      transition:.16s ease;
    }
    .action-btn.primary {
      background:linear-gradient(135deg,var(--brand),var(--brand-strong));
      color:#fff;
      box-shadow:0 14px 28px rgba(190,24,93,.22);
    }
    .action-btn.secondary {
      background:#fff;
      border-color:var(--border);
      color:var(--text);
    }
    .action-btn:hover { transform:translateY(-1px); }
    .hero-stats {
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:14px;
    }
    .stat-card {
      padding:18px;
      border-radius:18px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(236,231,244,.96);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
    }
    .stat-label {
      color:var(--subtle);
      font-size:12px;
      font-weight:700;
      margin-bottom:8px;
    }
    .stat-value {
      font-size:27px;
      font-weight:800;
      letter-spacing:-.04em;
      margin-bottom:5px;
    }
    .stat-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .section {
      padding:20px;
    }
    .section-head {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:16px;
    }
    .section-kicker {
      display:inline-flex;
      align-items:center;
      gap:6px;
      margin-bottom:6px;
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .section-title {
      font-size:18px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:4px;
    }
    .section-desc {
      color:var(--subtle);
      line-height:1.55;
      font-size:12px;
    }
    .section-link {
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:var(--brand);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .layout {
      display:grid;
      grid-template-columns:minmax(0, 1fr) minmax(280px, 320px);
      gap:var(--gap);
      align-items:start;
    }
    .main-col,
    .side-col {
      display:grid;
      gap:var(--gap);
    }
    .main-col {
      min-width:0;
    }
    .side-persistent {
      display:grid;
      gap:var(--gap);
      position:sticky;
      top:76px;
      align-self:start;
    }
    .timeline-panel {
      padding:20px;
      border:1px solid #ebedf0;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(250,251,253,.96) 100%);
      box-shadow:0 10px 26px rgba(15,23,42,.04);
    }
    .panel-header {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:16px;
    }
    .panel-title-wrap {
      display:grid;
      gap:4px;
    }
    .panel-kicker {
      display:flex;
      align-items:center;
      gap:6px;
      color:#9298a0;
      font-size:11px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .panel-kicker .material-icons-round {
      font-size:14px;
    }
    .panel-title {
      font-size:18px;
      font-weight:800;
      letter-spacing:-.03em;
      color:#2f3236;
    }
    .panel-subtitle {
      color:#9298a0;
      font-size:12px;
      line-height:1.55;
    }

    .overview-grid,
    .target-grid,
    .editor-grid {
      display:grid;
      gap:16px;
    }
    .overview-grid {
      grid-template-columns:1fr;
    }
    .target-grid {
      grid-template-columns:repeat(2, minmax(0,1fr));
    }
    .editor-grid {
      grid-template-columns:1fr;
    }
    .card {
      padding:16px;
      border-radius:16px;
      border:1px solid var(--border);
      background:var(--surface-soft);
    }
    .card-title {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
      margin-bottom:12px;
    }
    .card-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:14px;
    }
    .card-desc {
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }
    .inline-actions {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:flex-end;
    }
    .owner-list,
    .manager-list {
      display:grid;
      gap:12px;
    }
    .kv-list,
    .checkpoint-list,
    .request-list,
    .target-list {
      display:grid;
      gap:12px;
    }
    .kv-row,
    .checkpoint-row,
    .request-row,
    .target-row,
    .owner-row,
    .manager-row {
      display:grid;
      gap:10px;
      padding:14px 16px;
      border-radius:16px;
      border:1px solid var(--border);
      background:#fff;
    }
    .kv-row {
      grid-template-columns:132px minmax(0,1fr);
      align-items:center;
      gap:12px;
    }
    .kv-key {
      color:var(--subtle);
      font-size:12px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
    }
    .kv-value {
      font-size:14px;
      font-weight:700;
      color:var(--text);
      line-height:1.55;
    }
    .checkpoint-row {
      grid-template-columns:auto minmax(0,1fr);
      align-items:start;
    }
    .checkpoint-icon {
      width:34px;
      height:34px;
      border-radius:12px;
      display:grid;
      place-items:center;
      color:var(--brand);
      background:var(--brand-bg);
    }
    .checkpoint-title {
      font-size:14px;
      font-weight:800;
      margin-bottom:4px;
    }
    .checkpoint-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .person-avatar {
      width:38px;
      height:38px;
      border-radius:14px;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:12px;
      font-weight:800;
      background:linear-gradient(135deg,var(--brand),var(--accent));
    }
    .person-name {
      font-size:14px;
      font-weight:800;
      margin-bottom:3px;
    }
    .person-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .owner-row {
      grid-template-columns:auto minmax(0,1fr) auto;
      align-items:center;
    }

      font-size:10px;
      font-weight:800;
      white-space:nowrap;
      flex-shrink:0;

    function buildQuery(searchParams) {
      const query = new URLSearchParams();
      Object.entries(searchParams || {}).forEach(([key, value]) => {
        if (value === undefined || value === null || value === "") {
          return;
        }
        query.set(key, String(value));
      });
      const encoded = query.toString();
      return encoded ? `?${encoded}` : "";
    }

    async function requestJson(path, options = {}) {
      const { allowStatus = [] } = options;
      const response = await fetch(`${API_BASE}${path}`, {
        credentials: "same-origin",
        headers: {
          Accept: "application/json"
        }
      });

      if (!response.ok) {
        if (allowStatus.includes(response.status)) {
          return { __status: response.status };
        }

        const payload = await response.json().catch(() => null);
        const message = payload && payload.error && payload.error.message
          ? payload.error.message
          : `${response.status} ${response.statusText}`;
        const error = new Error(message);
        error.status = response.status;
        throw error;
      }

      return response.json();
    }

    function extractData(payload) {
      if (!payload || payload.__status) {
        return null;
      }
      if (payload && typeof payload === "object" && "data" in payload) {
        return payload.data;
      }
      return payload;
    }

    function extractItems(payload) {
      if (!payload || payload.__status) {
        return [];
      }
      if (Array.isArray(payload.items)) {
        return payload.items;
      }
      if (payload.data && Array.isArray(payload.data.items)) {
        return payload.data.items;
      }
      if (Array.isArray(payload.data)) {
        return payload.data;
      }
      if (Array.isArray(payload)) {
        return payload;
      }
      return [];
    }

    function extractNextCursor(payload) {
      if (!payload || payload.__status) {
        return null;
      }
      if (payload.page && typeof payload.page.nextCursor === "string") {
        return payload.page.nextCursor;
      }
      if (payload.data && payload.data.page && typeof payload.data.page.nextCursor === "string") {
        return payload.data.page.nextCursor;
      }
      return null;
    }

    async function fetchAllPages(path, params = {}, options = {}) {
      const items = [];
      let cursor = null;

      while (true) {
        const payload = await requestJson(`${path}${buildQuery({
          ...params,
          ...(cursor ? { cursor } : {})
        })}`, options);

        if (payload && payload.__status) {
          return { items: [], status: payload.__status };
        }

        items.push(...extractItems(payload));
        cursor = extractNextCursor(payload);
        if (!cursor) {
          break;
        }
      }

      return { items, status: 200 };
    }

    function normalizeText(value) {

    function formatNumber(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric)
        ? new Intl.NumberFormat("ko-KR").format(numeric)
        : "-";
    }

    function formatDateTime(value, fallback = "정보 없음") {
      if (!value) {
        return fallback;
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return fallback;
      }

      return new Intl.DateTimeFormat("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function formatRequestDate(value) {
      return formatDateTime(value, "시간 정보 없음");
    }

    function formatRelativeLogin(value) {
      if (!value) {
        return "Never";
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "Unknown";
      }

      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const startOfTarget = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const dayDiff = Math.floor((startOfToday.getTime() - startOfTarget.getTime()) / 86400000);

      if (dayDiff <= 0) {
        return "Today";
      }
      if (dayDiff === 1) {
        return "Yesterday";
      }
      return `${dayDiff}d ago`;
    }

    function toInitials(value) {
      const source = normalizeText(value);
      if (!source) {
        return "NA";
      }

      const parts = source.split(/\s+/).filter(Boolean);
      if (parts.length > 1) {
        return parts.slice(0, 2).map((part) => part.charAt(0).toUpperCase()).join("");
      }

      return source.replace(/[^a-zA-Z0-9가-힣]/g, "").slice(0, 2).toUpperCase() || "NA";

        <article class="owner-row">
          <div class="person-avatar">${escapeHtml(item.initials)}</div>
          <div class="owner-main">
            <div class="person-name">${escapeHtml(item.name)}</div>
            <div class="person-meta">${escapeHtml(item.meta)}</div>
          </div>
          <div class="owner-role">${escapeHtml(item.role)}</div>
        </article>
      `).join("");
    }

    function renderHistory(items) {
      if (!items.length) {
        return `
          <div class="timeline-row" data-kind="info">
            <div class="timeline-rail"><span class="timeline-dot" aria-hidden="true"></span></div>
            <div class="timeline-card">
              <div class="timeline-card-head">
                <div class="timeline-main">
                  <div class="timeline-title">최근 활동이 없습니다.</div>
                  <div class="timeline-meta">현재 realm에서 표시할 활동 이력이 없습니다.</div>
                </div>
                <div class="timeline-chip">Info</div>
              </div>
            </div>
          </div>
        `;
      }

      return items.map((item) => `
        <div class="timeline-row" data-kind="${escapeHtml(item.kind)}">
          <div class="timeline-rail"><span class="timeline-dot" aria-hidden="true"></span></div>
          <div class="timeline-card">
            <div class="timeline-card-head">
              <div class="timeline-main">
                <div class="timeline-title">${escapeHtml(item.title)}</div>
                <div class="timeline-meta">${escapeHtml(item.detail)}</div>
              </div>
              <div class="timeline-chip">${escapeHtml(item.kindLabel)}</div>
            </div>
          </div>
        </div>
      `).join("");
    }

    function createOidcConfig(currentRealmId, currentRealmName, oidcAccess) {
      if (oidcAccess && typeof oidcAccess === "object") {
        return [
          { key: "Realm ID", value: normalizeText(oidcAccess.realmId) || currentRealmId || "-" },
          { key: "Issuer", value: normalizeText(oidcAccess.issuer) || "-" },
          { key: "Auth Endpoint", value: normalizeText(oidcAccess.authorizationEndpoint) || "-" },
          { key: "Token Endpoint", value: normalizeText(oidcAccess.tokenEndpoint) || "-" },
          { key: "UserInfo", value: normalizeText(oidcAccess.userinfoEndpoint) || "-" },
          { key: "JWKS URI", value: normalizeText(oidcAccess.jwksUri) || "-" },
          { key: "Client ID", value: normalizeText(oidcAccess.clientId) || "-" },
          { key: "Redirect URI", value: normalizeText(oidcAccess.redirectUri || oidcAccess.callbackPath) || "-" },
          { key: "Scopes", value: Array.isArray(oidcAccess.scopes) ? oidcAccess.scopes.join(" ") : "-" },
          {
            key: "Claims",
            value: oidcAccess.claims
              ? Object.entries(oidcAccess.claims).map(([key, value]) => `${key} -> ${value}`).join(", ")
              : "-"
          }
        ];
      }

      const realmSlugSource = normalizeText(currentRealmName) || normalizeText(currentRealmId) || "permission-realm";
      const realmSlug = realmSlugSource
        .toLowerCase()
        .replace(/[^a-z0-9-]+/g, "-")
        .replace(/(^-+|-+$)/g, "");
      const clientId = `${realmSlug || "permission-realm"}-web`;
      return [
        { key: "Realm ID", value: currentRealmId || "-" },
        { key: "Issuer", value: `https://sso.workspace.local/realms/${realmSlug}` },
        { key: "Auth Endpoint", value: `https://sso.workspace.local/realms/${realmSlug}/protocol/openid-connect/auth` },
        { key: "Token Endpoint", value: `https://sso.workspace.local/realms/${realmSlug}/protocol/openid-connect/token` },
        { key: "UserInfo", value: `https://sso.workspace.local/realms/${realmSlug}/protocol/openid-connect/userinfo` },
        { key: "JWKS URI", value: `https://sso.workspace.local/realms/${realmSlug}/protocol/openid-connect/certs` },
        { key: "Client ID", value: clientId },
        { key: "Redirect URI", value: `https://workspace.local/auth/callback/${realmSlug}` },
        { key: "Scopes", value: "openid profile email groups roles" },
        { key: "Claims", value: "groups -> memberOf, realm_access.roles -> roles" }
      ];
    }

    function renderState(title, description) {
      document.title = `${title} - Permission Detail`;
      app.innerHTML = `
        <div
          data-ax-topbar
          data-active-key="permission"
          data-search-placeholder="Realm, Role, 요청 상태를 검색하세요..."
          data-search-source="workspace-permission-detail"
          data-search-source-label="Permission Detail"
          data-search-default-type="permission"
        ></div>
        <main class="page" style="padding-top:48px;">
          <section class="panel hero">
            <div class="hero-top">
              <div>
                <div class="eyebrow"><span class="material-icons-round" style="font-size:16px;">shield</span>Accessibility · IAM & Approvals</div>
                <div class="hero-title-row">
                  <h1 class="hero-title">${escapeHtml(title)}</h1>
                </div>
                <p class="hero-desc">${escapeHtml(description)}</p>
              </div>
              <div class="hero-actions">
                <a class="action-btn secondary" href="workspace_permission_hub.html"><span class="material-icons-round" style="font-size:18px;">arrow_back</span>Permission Hub</a>
              </div>
            </div>
          </section>
        </main>
      `;

      mountRenderedTopbar();
    }

    function mountRenderedTopbar() {
      if (typeof window.mountAxStudioTopbar !== "function") {
        return;
      }

      document.querySelectorAll("[data-ax-topbar]").forEach((host) => {
        if (!host.dataset.axTopbarMounted) {
          window.mountAxStudioTopbar(host);
          host.dataset.axTopbarMounted = "true";
        }
      });
    }

    function toRoleSummary(roleName, memberCount, memberAccessStatus) {
      if (memberAccessStatus === 403) {
        return "멤버 상세 조회 권한 필요";
      }
      if (roleName === "admin") {
        return `관리 권한 role · 멤버 ${formatNumber(memberCount)}명`;
      }
      return `배정 멤버 ${formatNumber(memberCount)}명`;
    }

    function toRoleApproval(capabilities) {
      if (capabilities && capabilities.canApprove) {
        return "관리 가능";
      }
      if (capabilities && capabilities.canRequest) {
        return "요청 가능";
      }
      return "조회 전용";
    }

    function buildRoleAccessMeta({ roleName, memberCount, directUserCount, groupCount, canInspectMembers, canInspectGroups, approvalLabel, currentUserRoles }) {
      const items = [
        `role:${roleName}`,
        `유효 멤버 ${formatNumber(memberCount)}명`
      ];

      items.push(
        canInspectMembers
          ? `직접 사용자 ${formatNumber(directUserCount)}명`
          : "사용자 상세 제한"
      );
      items.push(
        canInspectGroups
          ? `연결 그룹 ${formatNumber(groupCount)}개`
          : "그룹 상세 제한"
      );

      if (approvalLabel) {
        items.push(`현재 사용자 ${approvalLabel}`);
      }

      if (Array.isArray(currentUserRoles) && currentUserRoles.includes(roleName)) {
        items.push("현재 사용자 보유 role");
      }

      return items;
    }

    function formatAccessSource(value) {
      if (value === "system-admin") {
        return "System admin";
      }
      if (value === "user-iam") {
        return "User IAM";
      }
      return "Permission API";
    }

    function buildHistory(detail, requests, access) {
      const items = [];
      items.push({
        kind: "activity",
        kindLabel: "Realm",
        title: `${normalizeText(detail.name) || "Permission Realm"} 상태`,
        detail: `${detail.status === "review" ? "Review" : "Active"} · 최근 변경 ${formatDateTime(detail.updatedAt)}`
      });

      requests.slice(0, 2).forEach((request) => {
        const statusLabel = requestLabel(request.status);
        items.push({
          kind: "request",
          kindLabel: "Request",
          title: `${normalizeText(request.roleName) || "role"} 요청 ${statusLabel}`,
          detail: `${normalizeText(request.requester && request.requester.name) || "Unknown"} · ${formatRequestDate(request.decidedAt || request.createdAt)}`
        });
      });

      if (access.members === 403 || access.groups === 403) {
        items.push({
          kind: "review",
          kindLabel: "Access",
          title: "권한 관리 상세 조회 제한",
          detail: "현재 계정에는 role별 사용자 또는 그룹 상세 조회 권한이 없습니다."
        });
      }

      return items.slice(0, 3);
    }

    function buildViewModel(detail, roles, membersResult, groupsResult, bindingsData, requestsResult, oidcAccess) {
      const typeMeta = toTypeMeta(detail.kind);
      const statusMeta = toStatusLabel(detail.status);
      const capabilities = detail.capabilities || {};
      const access = detail.access || {};
      const currentUserRoles = Array.isArray(detail.currentUserRoles) && detail.currentUserRoles.length
        ? detail.currentUserRoles
        : (Array.isArray(access.currentUserRoles) ? access.currentUserRoles : []);
      const accessLevelLabel = access.accessLevel === "manage"
        ? "관리 가능"
        : (capabilities.canRequest ? "요청 가능" : "조회 가능");
      const accessSourceLabel = formatAccessSource(access.visibilitySource);
      const members = membersResult.items || [];
      const groups = groupsResult.items || [];
      const requests = requestsResult.items || [];
      const canInspectMembers = access.canInspectMembers !== undefined ? Boolean(access.canInspectMembers) : membersResult.status !== 403;
      const canInspectGroups = access.canInspectGroups !== undefined ? Boolean(access.canInspectGroups) : groupsResult.status !== 403;
      const canInspectBindings = access.canInspectBindings !== undefined ? Boolean(access.canInspectBindings) : Array.isArray(bindingsData);
      const bindingSource = canInspectBindings ? bindingsData : (Array.isArray(detail.boundProjects) ? detail.boundProjects : []);
      const requestCounts = requests.reduce((counts, item) => {
        const normalizedStatus = normalizeRequestStatus(item && item.status);
        counts.total += 1;
        counts[normalizedStatus] += 1;
        return counts;
      }, {
        total: 0,
        pending: 0,
        approved: 0,
        rejected: 0
      });
      const approvalLabel = toRoleApproval(capabilities);

      const editorRoles = roles.map((role) => {
        const roleMembers = canInspectMembers
          ? members.filter((member) => Array.isArray(member.roles) && member.roles.includes(role.name))
          : [];
        const roleGroups = canInspectGroups
          ? groups.filter((group) => Array.isArray(group.roles) && group.roles.includes(role.name))
          : [];

        const users = roleMembers.map((member) => ({
          name: normalizeText(member.name) || normalizeText(member.userId) || normalizeText(member.id) || "Unknown",
          email: normalizeText(member.email) || "-",
          lastLogin: formatRelativeLogin(member.lastLoginedAt),
          meta: Array.isArray(member.roles) ? member.roles.join(", ") : role.name
        }));

        const mappedGroups = roleGroups.map((group) => ({
          id: normalizeText(group.id) || `${role.name}-group`,
          name: normalizeText(group.name) || "Unnamed Group",
          description: normalizeText(group.description) || normalizeText(group.path) || "-",
          members: `${formatNumber(group.memberCount)}명`,
          source: Array.isArray(group.roles) ? group.roles.join(", ") : role.name
        }));

        return {
          name: role.name,
          members: String(role.memberCount),
          summary: toRoleSummary(role.name, role.memberCount, membersResult.status),
          approval: currentUserRoles.includes(role.name) ? "보유중" : approvalLabel,
          canInspectMembers,
          canInspectGroups,
          accessMeta: buildRoleAccessMeta({
            roleName: role.name,
            memberCount: role.memberCount,
            directUserCount: roleMembers.length,
            groupCount: roleGroups.length,
            canInspectMembers,
            canInspectGroups,
            approvalLabel,
            currentUserRoles
          }),
          users,
          groups: mappedGroups
        };
      });

      const owners = [];
      if (detail.owner) {
        owners.push({
          initials: toInitials(detail.owner.name || detail.owner.userId),
          name: normalizeText(detail.owner.name) || normalizeText(detail.owner.userId) || "Unknown",
          meta: normalizeText(detail.owner.email) || `${normalizeText(detail.name) || "Realm"} owner`,
          role: normalizeText(detail.owner.role) || "owner"
        });
      }
      if (canInspectMembers) {
        members
          .filter((member) => Array.isArray(member.roles) && member.roles.includes("admin"))
          .slice(0, 3)
          .forEach((member) => {
            if (owners.some((item) => normalizeText(item.name) === normalizeText(member.name) || normalizeText(item.meta) === normalizeText(member.email))) {
              return;
            }

            owners.push({
              initials: toInitials(member.name || member.userId),
              name: normalizeText(member.name) || normalizeText(member.userId) || "Unknown",
              meta: normalizeText(member.email) || normalizeText(detail.name) || "admin",
              role: "admin"
            });
          });
      }

      const connectedProjects = bindingSource.map((project) => ({
        type: "Project",
        name: normalizeText(project.label || project.name) || normalizeText(project.id) || "Unnamed Project",
        meta: normalizeText(project.description) || (normalizeText(project.role) ? `binding role · ${project.role}` : "Permission Realm binding"),
        href: toProjectHref(project)
      }));
      const projectCount = canInspectBindings ? connectedProjects.length : Number(detail.projectCount || 0);

      return {
        title: normalizeText(detail.name) || normalizeText(params.get("name")) || "Permission Realm",
        typeLabel: typeMeta.typeLabel,
        statusLabel: statusMeta.label,
        statusTone: statusMeta.tone,
        description: normalizeText(detail.summary) || normalizeText(detail.description) || "실제 Permission API 응답으로 realm 상세 상태를 보여줍니다.",
        relatedAction: {
          href: "workspace_projects_hub.html",
          label: "프로젝트 허브 보기"
        },
        realmSectionDescription: owners.length
          ? "사용자 IAM 기준으로 확인된 Realm 소유자와 필요한 OIDC 접근 정보를 함께 보여줍니다."
          : "사용자 IAM 기준 realm 소유자 정보를 우선 확인하고, 없으면 제한 사유와 OIDC 접근 정보만 보여줍니다.",
        accessSectionDescription: currentUserRoles.length
          ? `현재 사용자 role ${currentUserRoles.join(", ")} 기준으로 Role 상세를 해석합니다.`
          : "현재 사용자 IAM 접근 기준으로 Role 상세와 제한 범위를 함께 보여줍니다.",
        heroStats: [
          {
            label: "포함 Role",
            value: formatNumber(roles.length),
            meta: currentUserRoles.length
              ? `내 role ${currentUserRoles.join(", ")} · 전체 ${formatNumber(roles.length)}개`
              : (roles.length ? roles.map((role) => `${role.name} ${formatNumber(role.memberCount)}`).join(" · ") : "등록된 role 없음")
          },
          {
            label: "배정 인원",
            value: formatNumber(detail.memberCount),
            meta: canInspectMembers
              ? `중복포함 ${formatNumber(detail.memberCount)}명`
              : "상세 멤버는 권한 범위에 따라 제한됩니다."
          },
          {
            label: "연결된 프로젝트",
            value: formatNumber(projectCount),
            meta: canInspectBindings ? `프로젝트 ${formatNumber(connectedProjects.length)}건` : "프로젝트 상세는 접근 권한에 따라 제한됩니다."
          },
          {
            label: "권한 요청",
            value: formatNumber(requestCounts.total),
            meta: `대기 ${formatNumber(requestCounts.pending)}건 · 승인 ${formatNumber(requestCounts.approved)}건 · 거절 ${formatNumber(requestCounts.rejected)}건`
          }
        ],
        overview: [
          { key: "가시성 기준", value: accessSourceLabel },
          { key: "내 접근 수준", value: accessLevelLabel },
          { key: "내 Realm Role", value: currentUserRoles.join(", ") || "없음" },
          { key: "식별자", value: normalizeText(detail.id) || "-" },
          { key: "Capabilities", value: Object.entries(capabilities).filter(([, enabled]) => enabled).map(([key]) => key).join(", ") || "없음" }
        ],
        checkpoints: [
          {
            icon: capabilities.canApprove ? "verified_user" : (currentUserRoles.length ? "badge" : "visibility"),
            title: currentUserRoles.length ? `내 role ${currentUserRoles.join(", ")}` : (capabilities.canApprove ? "관리 가능한 Realm" : "조회 가능한 Realm"),
            meta: capabilities.canApprove
              ? `${accessSourceLabel} 기준으로 멤버, 요청, 바인딩 상세를 관리할 수 있습니다.`
              : `${accessSourceLabel} 기준으로 노출 가능한 permission API 데이터만 표시합니다.`
          },
          {
            icon: canInspectMembers && canInspectGroups ? "groups" : "lock",
            title: canInspectMembers && canInspectGroups
              ? `사용자 ${formatNumber(members.length)}명 · 그룹 ${formatNumber(groups.length)}개`
              : "권한 관리 상세 조회 제한",
            meta: canInspectMembers && canInspectGroups
              ? "role별 사용자 목록과 그룹 목록을 실제 API 응답으로 구성했습니다."
              : "권한 범위에 따라 사용자/그룹 상세는 제한될 수 있습니다."
          },
          {
            icon: requests.length ? "pending_actions" : "event_available",
            title: requests.length ? `요청 ${formatNumber(requests.length)}건 확인` : "진행 중인 요청 없음",
            meta: requests.length
              ? `대기 ${formatNumber(requestCounts.pending)}건 · 승인 ${formatNumber(requestCounts.approved)}건 · 거절 ${formatNumber(requestCounts.rejected)}건`
              : "현재 realm 기준 권한 요청이 없습니다."
          }
        ],
        owners,
        oidcConfig: createOidcConfig(detail.id, detail.name, oidcAccess),
        editorRoles,
        requests: requests.map((request) => ({
          status: request.status,
          title: `${normalizeText(request.roleName) || "role"} access request`,
          meta: `${normalizeText(request.requester && request.requester.name) || "Unknown"} · ${normalizeText(request.reason) || "사유 없음"}`,
          submeta: request.status === "pending"
            ? `요청 생성 · ${formatRequestDate(request.createdAt)}`
            : `${requestLabel(request.status)} 처리 · ${formatRequestDate(request.decidedAt || request.createdAt)}`,
          actionLabel: request.status === "pending" ? "요청 확인" : "처리 결과"
        })),
        requestCounts,
        connectedProjects,
        changeHistory: buildHistory(detail, requests, {
          members: membersResult.status,
          groups: groupsResult.status,
          bindings: canInspectBindings ? 200 : 403
        })
      };
    }

      app.innerHTML = `
      <div
        data-ax-topbar

                <span class="pill status-${model.statusTone === "healthy" ? "healthy" : model.statusTone === "review" ? "warning" : "danger"}">${escapeHtml(model.statusLabel)}</span>
              </div>
              <p class="hero-desc">${escapeHtml(model.description)}</p>

            <div class="hero-actions">
              <a class="action-btn secondary" href="workspace_permission_hub.html"><span class="material-icons-round" style="font-size:18px;">arrow_back</span>Permission Hub</a>
              <a class="action-btn primary" href="${escapeHtml(model.relatedAction.href)}"><span class="material-icons-round" style="font-size:18px;">open_in_new</span>${escapeHtml(model.relatedAction.label)}</a>
            </div>
          </div>
          <div class="hero-stats">${renderStats(model.heroStats)}</div>
        </section>

        <div class="layout">
          <div class="main-col">
            <section class="panel section">
              <div class="section-head">
                <div>
                  <div class="section-kicker"><span class="material-icons-round">monitor_heart</span>Realm</div>
                  <h2 class="section-title">Realm 정보</h2>
                  <p class="section-desc">${escapeHtml(model.realmSectionDescription)}</p>
                  </div>
                </div>
                <div class="overview-grid">
                  <article class="card">
                    <div class="card-head">
                      <div>
                        <div class="card-title">소유자 정보</div>
                        <div class="card-desc">기본으로 생성된 admin 그룹 owner를 볼 수 있습니다.</div>

                  <div class="owner-list">${renderOwners(model.owners)}</div>

                    </summary>

                      <div class="kv-list">${renderKvList(model.oidcConfig)}</div>
                    </div>
                  </details>
                </article>

            </section>

            <section class="panel section">
              <div class="section-head">
                <div>
                  <div class="section-kicker"><span class="material-icons-round">edit_square</span>Access</div>
                  <h2 class="section-title">권한 관리</h2>
                  <p class="section-desc">${escapeHtml(model.accessSectionDescription)}</p>
                </div>
              </div>
              <div class="editor-shell">
                <aside class="editor-sidebar">
                  <div class="editor-toolbar">
                    <label class="search-field">
                      <span class="material-icons-round" style="font-size:18px;">search</span>
                      <input id="roleSearchInput" type="search" placeholder="역할 검색" />
                    </label>
                    <button class="mini-btn primary" type="button">+ 역할</button>
                  </div>

    function bindPageInteractions(editorRoles) {
      const filterButtons = Array.from(document.querySelectorAll("[data-filter]"));
      const requestRows = Array.from(document.querySelectorAll("[data-request-status]"));
      const requestSummary = document.getElementById("requestSummary");
      const roleList = document.getElementById("roleList");
      const roleListSummary = document.getElementById("roleListSummary");
      const roleSearchInput = document.getElementById("roleSearchInput");
      const userSearchInput = document.getElementById("userSearchInput");
      const groupSearchInput = document.getElementById("groupSearchInput");
      const selectedRoleName = document.getElementById("selectedRoleName");
      const selectedRoleSummary = document.getElementById("selectedRoleSummary");
      const selectedRoleMeta = document.getElementById("selectedRoleMeta");
      const selectedRoleApproval = document.getElementById("selectedRoleApproval");
      const userTableBody = document.getElementById("userTableBody");
      const groupTableBody = document.getElementById("groupTableBody");
      const userTableSummary = document.getElementById("userTableSummary");
      const groupTableSummary = document.getElementById("groupTableSummary");
      const userPrevPageBtn = document.getElementById("userPrevPageBtn");
      const userNextPageBtn = document.getElementById("userNextPageBtn");
      const groupPrevPageBtn = document.getElementById("groupPrevPageBtn");
      const groupNextPageBtn = document.getElementById("groupNextPageBtn");

      const editorState = {
        activeRole: editorRoles[0] ? editorRoles[0].name : "",
        roleQuery: "",
        userQuery: "",
        groupQuery: "",
        userPage: 1,
        groupPage: 1
      };

      function includesQuery(values, query) {
        const normalizedQuery = query.trim().toLowerCase();
        if (!normalizedQuery) return true;
        return values.some((value) => String(value).toLowerCase().includes(normalizedQuery));
      }

      function getFilteredRoles() {
        return editorRoles.filter((item) => includesQuery([item.name, item.summary, item.approval], editorState.roleQuery));
      }

      function syncActiveRole(filteredRoles) {
        if (filteredRoles.some((item) => item.name === editorState.activeRole)) return;
        editorState.activeRole = filteredRoles[0] ? filteredRoles[0].name : "";
      }

      function renderEditor() {
        const filteredRoles = getFilteredRoles();
        syncActiveRole(filteredRoles);
        const activeRole = filteredRoles.find((item) => item.name === editorState.activeRole) || null;

        roleList.innerHTML = renderRoleList(filteredRoles, editorState.activeRole);
        roleListSummary.textContent = `${filteredRoles.length} / ${editorRoles.length}`;

        Array.from(roleList.querySelectorAll("[data-role-name]")).forEach((button) => {
          button.addEventListener("click", () => {
            editorState.activeRole = button.dataset.roleName;
            editorState.userPage = 1;
            editorState.groupPage = 1;
            renderEditor();
          });
        });

        if (!activeRole) {
          selectedRoleName.textContent = "Role 없음";
          selectedRoleSummary.textContent = "선택 가능한 Role이 없습니다.";
          selectedRoleMeta.textContent = "";
          selectedRoleApproval.className = "tone-pill review";
          selectedRoleApproval.textContent = "확인 필요";
          userTableBody.innerHTML = renderUserRows([]);
          groupTableBody.innerHTML = renderGroupRows([]);
          userTableSummary.textContent = "0건";
          groupTableSummary.textContent = "0건";
          userPrevPageBtn.disabled = true;
          userNextPageBtn.disabled = true;
          groupPrevPageBtn.disabled = true;
          groupNextPageBtn.disabled = true;
          return;
        }

        const filteredUsers = activeRole.users.filter((item) => (
          includesQuery([item.name, item.email, item.meta, item.lastLogin], editorState.userQuery)
        ));
        const filteredGroups = activeRole.groups.filter((item) => (
          includesQuery([item.name, item.description, item.members, item.source], editorState.groupQuery)
        ));
        const pagedUsers = paginateClientItems(filteredUsers, editorState.userPage);
        const pagedGroups = paginateClientItems(filteredGroups, editorState.groupPage);

        editorState.userPage = pagedUsers.page;
        editorState.groupPage = pagedGroups.page;

        selectedRoleName.textContent = activeRole.name;
        selectedRoleSummary.textContent = activeRole.summary;
        selectedRoleMeta.textContent = activeRole.accessMeta.join(" · ");
        selectedRoleApproval.className = `tone-pill ${approvalTone(activeRole.approval)}`;
        selectedRoleApproval.textContent = activeRole.approval;
        userTableBody.innerHTML = renderUserRows(pagedUsers.items, { restricted: !activeRole.canInspectMembers });
        groupTableBody.innerHTML = renderGroupRows(pagedGroups.items, { restricted: !activeRole.canInspectGroups });
        userTableSummary.textContent = activeRole.canInspectMembers ? formatClientPageSummary(pagedUsers) : "조회 권한 없음";
        groupTableSummary.textContent = activeRole.canInspectGroups ? formatClientPageSummary(pagedGroups) : "조회 권한 없음";
        userPrevPageBtn.disabled = !activeRole.canInspectMembers || pagedUsers.page <= 1;
        userNextPageBtn.disabled = !activeRole.canInspectMembers || pagedUsers.page >= pagedUsers.totalPages;
        groupPrevPageBtn.disabled = !activeRole.canInspectGroups || pagedGroups.page <= 1;
        groupNextPageBtn.disabled = !activeRole.canInspectGroups || pagedGroups.page >= pagedGroups.totalPages;
      }

      function updateRequestFilter(status) {
        filterButtons.forEach((button) => {
          button.classList.toggle("is-active", button.dataset.filter === status);
        });

        let visibleCount = 0;
        requestRows.forEach((row) => {
          const match = status === "all" || row.dataset.requestStatus === status;
          row.style.display = match ? "" : "none";
          if (match) visibleCount += 1;
        });

        const labelMap = {
          all: "전체 요청",
          pending: "대기 요청",
          approved: "승인 요청",
          rejected: "거절 요청"
        };
        requestSummary.textContent = `${labelMap[status]} ${visibleCount}건`;
      }

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => updateRequestFilter(button.dataset.filter));
      });
      roleSearchInput.addEventListener("input", (event) => {
        editorState.roleQuery = event.target.value;
        renderEditor();
      });
      userSearchInput.addEventListener("input", (event) => {
        editorState.userQuery = event.target.value;
        editorState.userPage = 1;
        renderEditor();
      });
      groupSearchInput.addEventListener("input", (event) => {
        editorState.groupQuery = event.target.value;
        editorState.groupPage = 1;
        renderEditor();
      });
      userPrevPageBtn.addEventListener("click", () => {
        editorState.userPage = Math.max(editorState.userPage - 1, 1);
        renderEditor();
      });
      userNextPageBtn.addEventListener("click", () => {
        editorState.userPage += 1;
        renderEditor();
      });
      groupPrevPageBtn.addEventListener("click", () => {
        editorState.groupPage = Math.max(editorState.groupPage - 1, 1);
        renderEditor();
      });
      groupNextPageBtn.addEventListener("click", () => {
        editorState.groupPage += 1;
        renderEditor();
      });

      renderEditor();
      updateRequestFilter("all");
    }

    async function loadRealmDetail() {
      if (!realmKey) {
        renderState("Realm 식별자 필요", "Permission Hub에서 realm을 선택한 뒤 상세 화면으로 진입해 주세요.");
        return;
      }

      renderState("Permission Detail", "실제 permission API 데이터를 불러오고 있습니다.");

      try {
        const [detailPayload, oidcPayload, rolesPayload, membersResult, groupsResult, bindingsPayload, requestsResult] = await Promise.all([
          requestJson(`/realms/${encodeURIComponent(realmKey)}`),
          requestJson(`/realms/${encodeURIComponent(realmKey)}/oidc`),
          requestJson(`/realms/${encodeURIComponent(realmKey)}/roles`),
          fetchAllPages(`/realms/${encodeURIComponent(realmKey)}/members`, { limit: 100 }, { allowStatus: [403] }),
          fetchAllPages(`/realms/${encodeURIComponent(realmKey)}/groups`, { limit: 100 }, { allowStatus: [403] }),
          requestJson(`/realms/${encodeURIComponent(realmKey)}/bindings`, { allowStatus: [403] }),
          fetchAllPages(`/realms/${encodeURIComponent(realmKey)}/requests`, { limit: 100 }, { allowStatus: [403] })
        ]);

        const detail = extractData(detailPayload) || {};
        const oidcAccess = extractData(oidcPayload) || null;
        const roles = extractData(rolesPayload) || [];
        const bindings = extractData(bindingsPayload);
        const requests = {
          items: requestsResult.items || [],
          status: requestsResult.status || 200
        };

        const model = buildViewModel(detail, roles, membersResult, groupsResult, bindings, requests, oidcAccess);
        renderPage(model);
        bindPageInteractions(model.editorRoles);
      } catch (error) {
        console.error("Failed to load permission detail", error);
        renderState("Permission Detail 로드 실패", error && error.message ? error.message : "실제 permission API 응답을 불러오지 못했습니다.");
      }
    }

    loadRealmDetail();
  </script>
