<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool Inventory Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <style>
    .selector-grid,
    .field-grid,
    .summary-grid {
      display:grid;
      gap:16px;
    }
    .selector-grid {
      grid-template-columns:repeat(3, minmax(0, 1fr));
    }
    .summary-grid {
      grid-template-columns:repeat(3, minmax(0, 1fr));
    }
    .selector-card,
    .field-card,
    .summary-card {
      display:block;
      padding:18px;
      border-radius:18px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }
    .selector-card {
      transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease, background .15s ease;
    }
    .selector-card:hover {
      border-color:rgba(37,99,235,.16);
      box-shadow:0 14px 28px rgba(15,23,42,.08);
      transform:translateY(-1px);
    }
    .selector-card.is-active {
      border-color:rgba(37,99,235,.22);
      box-shadow:0 16px 30px rgba(15,23,42,.08), inset 0 0 0 1px rgba(37,99,235,.08);
      background:linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }
    .selector-top,
    .summary-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:12px;
    }
    .selector-icon,
    .summary-icon {
      width:42px;
      height:42px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--brand-bg);
      color:var(--brand);
      flex-shrink:0;
    }
    .selector-icon .material-icons-round,
    .summary-icon .material-icons-round {
      font-size:20px;
    }
    .selector-title,
    .summary-title {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
      margin-bottom:4px;
    }
    .selector-desc,
    .summary-desc {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .selector-meta {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:14px;
    }
    .selector-chip {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:#f3f6fb;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
      border:1px solid var(--border);
    }
    .field-grid.two {
      grid-template-columns:repeat(2, minmax(0, 1fr));
    }
    .field-card {
      padding:18px 18px 16px;
    }
    .field-label {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      font-weight:700;
      color:var(--muted);
      margin-bottom:10px;
    }
    .field-value {
      min-height:46px;
      display:flex;
      align-items:center;
      gap:10px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#fbfcfe;
      color:var(--text);
      font-size:14px;
      font-weight:600;
      line-height:1.45;
    }
    .field-value.is-multi {
      align-items:flex-start;
      flex-direction:column;
    }
    .field-help {
      margin-top:8px;
      color:var(--subtle);
      font-size:12px;
      line-height:1.5;
    }
    .field-tokens {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .field-token {
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      background:var(--brand-bg);
      color:var(--brand);
      font-size:12px;
      font-weight:700;
    }
    .action-row {
      display:flex;
      justify-content:flex-end;
      gap:12px;
      margin-top:24px;
    }
    .inline-note {
      color:var(--subtle);
      font-size:12px;
      line-height:1.5;
      margin-top:10px;
    }
    .input-grid {
      display:grid;
      gap:16px;
      grid-template-columns:repeat(2, minmax(0, 1fr));
    }
    .input-card {
      padding:18px;
      border-radius:18px;
      border:1px solid var(--border);
      background:linear-gradient(180deg, #ffffff 0%, #fbfcff 100%);
    }
    .input-label {
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      margin-bottom:10px;
    }
    .field-input,
    .field-select,
    .field-textarea {
      width:100%;
      border:1px solid var(--border);
      border-radius:14px;
      background:#fbfcfe;
      color:var(--text);
      font-size:14px;
      font-weight:600;
      padding:13px 14px;
      outline:none;
      transition:border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    .field-input:focus,
    .field-select:focus,
    .field-textarea:focus {
      border-color:rgba(37,99,235,.35);
      box-shadow:0 0 0 4px rgba(37,99,235,.08);
      background:#fff;
    }
    .field-select {
      appearance:none;
    }
    .field-textarea {
      min-height:116px;
      resize:vertical;
      font-family:inherit;
      line-height:1.55;
    }
    .fixed-value {
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#f8fbff;
      font-size:14px;
      font-weight:700;
      color:var(--text);
    }
    .fixed-note {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--brand-bg);
      color:var(--brand);
      font-size:12px;
      font-weight:800;
      border:1px solid rgba(37,99,235,.12);
    }
    @media (max-width: 920px) {
      .selector-grid,
      .summary-grid,
      .field-grid.two,
      .input-grid {
        grid-template-columns:1fr;
      }
      .action-row {
        flex-direction:column;
      }
      .action-row .action-btn {
        width:100%;
        justify-content:center;
      }
    }
    .action-btn.is-disabled {
      pointer-events:none;
      opacity:.58;
      cursor:progress;
    }
    .submit-feedback {
      margin-top:14px;
      padding:13px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:#f8fafc;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .submit-feedback[data-tone="success"] {
      border-color:rgba(22,163,74,.24);
      background:rgba(22,163,74,.08);
      color:#166534;
    }
    .submit-feedback[data-tone="error"] {
      border-color:rgba(220,38,38,.18);
      background:rgba(254,242,242,.95);
      color:#b91c1c;
    }
    .submit-feedback[data-tone="progress"] {
      border-color:rgba(37,99,235,.18);
      background:rgba(239,246,255,.95);
      color:#1d4ed8;
    }
  </style>
</head>

    function renderServiceGroups() {
      return serviceGroups.map((group) => `
        <section class="service-group">
          <div class="service-group-title">${group.title}</div>
          <div class="service-links">
            ${group.links.map(([href, icon, title, desc, key]) => `
              <a class="service-link${key === "tool-inventory" ? " is-current" : ""}" href="${href}">
                <span class="material-icons-round service-link-icon">${icon}</span>
                <span class="service-link-copy">
                  <span class="service-link-title">${title}</span>
                  <span class="service-link-desc">${desc}</span>
                </span>
              </a>
            `).join("")}
          </div>
        </section>
      `).join("");
    }

    function renderActions(actions) {
      return actions.map((action) => {
        const commonAttrs = [
          `class="action-btn ${action.variant || "secondary"}"`,
          action.href ? `href="${action.href}"` : "",
          action.action ? `data-action="${action.action}"` : "",
          action.id ? `id="${action.id}"` : ""
        ].filter(Boolean).join(" ");

        if (action.element === "button") {
          return `
            <button ${commonAttrs} type="button">
              <span class="material-icons-round">${action.icon}</span>${action.label}
            </button>
          `;
        }

        return `
          <a ${commonAttrs}>
            <span class="material-icons-round">${action.icon}</span>${action.label}
          </a>
        `;
      }).join("");
    }

    function renderStats(stats) {
      return stats.map((stat) => `
        <article class="stat-card">
          <div class="stat-label">${stat.label}</div>
          <div class="stat-value">${stat.value}</div>
          <div class="stat-meta">${stat.meta || ""}</div>
        </article>
      `).join("");
    }

    function renderTypeSelector() {
      return Object.values(types).map((item) => `

            <div>
              <div class="selector-title">${item.title}</div>
              <div class="selector-desc">${item.description}</div>

    function renderFieldValue(value) {
      if (Array.isArray(value)) {
        return `
          <div class="field-value is-multi">
            <div class="field-tokens">
              ${value.map((item) => `<span class="field-token">${item}</span>`).join("")}
            </div>
          </div>
        `;
      }
      return `<div class="field-value">${value}</div>`;
    }

    function renderFields(fields) {
      return fields.map((field) => `
        <article class="field-card">
          <div class="field-label"><span class="material-icons-round" style="font-size:16px;">subdirectory_arrow_right</span>${field.label}</div>
          ${renderFieldValue(field.value)}
          ${field.help ? `<div class="field-help">${field.help}</div>` : ""}
        </article>
      `).join("");
    }

    function isInteractiveRegisterType() {

      document.addEventListener("click", (event) => {
        if (!menuWrap.contains(event.target)) setOpen(false);

        if (event.key === "Escape") {
          setOpen(false);
          menuButton.focus();
        }
      });

      bindInteractiveMcpInputs();

      registerState.validateStatus = status;
      registerState.validateMessage = message;
      registerState.validateMeta = meta;
      if (status !== "ok") {
        registerState.validatedTools = [];
        registerState.validatedToolCount = 0;
      }
      updateInteractiveMcpFunctionSection();
    }

    function getRegisterButtons() {
      return Array.from(document.querySelectorAll('[data-action="submit-register-request"]'));
    }

      getRegisterButtons().forEach((button) => {
        button.classList.toggle("is-disabled", registerState.isSubmitting);
        button.setAttribute("aria-disabled", String(registerState.isSubmitting));
      });
    }

    function updateSubmitStatus(tone, message) {
      registerState.submitTone = tone;
      registerState.submitMessage = message;
      const feedback = document.getElementById("submitFeedback");
      if (!feedback) return;
      feedback.dataset.tone = tone;
      feedback.textContent = message;
    }

    function maskSecret(value) {
      const trimmed = String(value || "").trim();
      if (!trimmed) return "미입력";
      if (trimmed.length <= 6) return `${trimmed.slice(0, 1)}***${trimmed.slice(-1)}`;
      return `${trimmed.slice(0, 3)}***${trimmed.slice(-3)}`;
    }

    function isSupportedMcpAddressName(value) {
      return /^[a-z0-9_]+$/.test(String(value || "").trim());
    }

    function buildMcpAuthPayload() {
      const authType = String(registerState.authType || "none").trim() || "none";
      if (authType === "none") {
        return { authType };
      }

      const secret = registerState.authSecret.trim();
      if (!secret) {
        throw new Error("선택한 authType에 맞는 키 또는 토큰 값을 입력해 주세요.");
      }

      if (authType === "bearer_static") {
        return {
          authType,
          authConfig: {
            token: secret,
            scheme: "Bearer"
          },
          headers: {
            Authorization: `Bearer ${secret}`
          }
        };
      }

      if (authType === "api_key_static") {
        return {
          authType,
          authConfig: {
            apiKey: secret,
            headerName: "X-API-Key"
          },
          headers: {
            "X-API-Key": secret
          }
        };
      }

      if (authType === "cookie_static") {
        return {
          authType,
          authConfig: {
            cookie: secret
          },
          headers: {
            Cookie: secret
          }
        };
      }

      throw new Error("현재 화면에서는 선택한 authType을 지원하지 않습니다.");
    }

    function buildCreateInventoryPayload() {
      if (!isInteractiveRegisterType()) {
        throw new Error("현재 샘플 화면에서는 External/Internal/Direct 등록 요청만 실제 생성할 수 있습니다.");
      }

      if (registerState.validateStatus !== "ok") {
        throw new Error("등록 요청 전에 validate를 먼저 통과해 주세요.");
      }

      const endpointUrl = registerState.endpointUrl.trim();
      if (!endpointUrl) {
        throw new Error(`${getEndpointLabel()} 주소를 입력해 주세요.`);
      }

      const payload = {
        name: registerState.inventoryName.trim() || `${current.key}_mcp_request`,
        description: registerState.description.trim(),
        kind: "mcp",
        scopeType: current.key,
        endpointUrl
      };

      if (current.key === "direct") {
        payload.format = getSelectedFormat();
        if (requiresOpenapiSpec()) {
          const openapiSpecUrl = registerState.openapiSpecUrl.trim();
          if (!openapiSpecUrl) {
            throw new Error("REST 포맷은 OpenAPI 주소를 함께 입력해 주세요.");
          }
          payload.openapiSpecUrl = openapiSpecUrl;
        } else {
          payload.transport = "streamable_http";
        }
      } else {
        payload.transport = "streamable_http";
      }

      Object.assign(payload, buildMcpAuthPayload());

      if (Array.isArray(registerState.validatedTools) && registerState.validatedTools.length > 0) {
        payload.tools = registerState.validatedTools.map((toolName) => ({ name: toolName }));
      }

      return payload;
    }

    async function submitRegisterRequest() {
      if (registerState.isSubmitting) return;

      let payload;
      try {
        payload = buildCreateInventoryPayload();
      } catch (error) {
        updateSubmitStatus("error", error.message || "등록 요청 payload를 만들지 못했습니다.");
        return;
      }

      registerState.isSubmitting = true;
      syncRegisterButtons();
      updateSubmitStatus("progress", "등록 요청을 생성하고 있습니다. validate 결과를 기준으로 `/api/v2/tool-inventory`를 호출합니다.");

      try {
        const response = await fetch("/api/v2/tool-inventory", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(result?.error?.message || "등록 요청 생성에 실패했습니다.");
        }

        const requestId = result?.data?.id || "";
        updateSubmitStatus("success", requestId
          ? `등록 요청이 생성되었습니다. request id: ${requestId}`
          : "등록 요청이 생성되었습니다.");

        window.setTimeout(() => {
          const nextUrl = requestId
            ? `workspace_tool_inventory_hub.html?requestId=${encodeURIComponent(requestId)}`
            : "workspace_tool_inventory_hub.html";
          window.location.href = nextUrl;
        }, 900);
      } catch (error) {
        updateSubmitStatus("error", error?.message || "등록 요청 중 네트워크 오류가 발생했습니다.");
      } finally {
        registerState.isSubmitting = false;
        syncRegisterButtons();
      }
    }

    function bindRegisterActions() {
      getRegisterButtons().forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          submitRegisterRequest();
        });
      });
      syncRegisterButtons();
    }

    function normalizeValidatedTool(entry) {
      if (typeof entry === "string") {
        return entry.trim();
      }

      if (!entry || typeof entry !== "object" || Array.isArray(entry)) {
        return "";
      }

      return String(
        entry.name
        || entry.id
        || entry.label
        || entry.title
        || entry.toolName
        || entry.displayName
        || entry?.function?.name
        || entry?.tool?.name
        || entry?.metadata?.name
        || entry?.attributes?.name
        || ""
      ).trim();
    }

    function isToolLikeArray(candidate) {
      if (!Array.isArray(candidate) || candidate.length === 0) {
        return false;
      }

      const normalized = candidate.map(normalizeValidatedTool).filter(Boolean);
      return normalized.length > 0;
    }

    function findNestedToolArray(root) {
      if (!root || typeof root !== "object") {
        return [];
      }

      const queue = [root];
      const visited = new Set();

      while (queue.length > 0) {
        const currentNode = queue.shift();
        if (!currentNode || typeof currentNode !== "object") {
          continue;
        }

        if (visited.has(currentNode)) {
          continue;
        }
        visited.add(currentNode);

        if (Array.isArray(currentNode)) {
          if (isToolLikeArray(currentNode)) {
            return currentNode;
          }
          currentNode.forEach(item => {
            if (item && typeof item === "object") {
              queue.push(item);
            }
          });
          continue;
        }

        Object.values(currentNode).forEach(value => {
          if (Array.isArray(value) && isToolLikeArray(value)) {
            queue.unshift(value);
            return;
          }

          if (value && typeof value === "object") {
            queue.push(value);
          }
        });
      }

      return [];
    }

    function extractValidatedTools(validation) {
      const candidateArrays = [
        validation?.tools,
        validation?.items,
        validation?.server?.tools,
        validation?.result?.tools,
        validation?.data?.tools,
        validation?.capabilities?.tools,
        validation?.tooling?.representativeItems,
        validation?.result?.items,
        validation?.data?.items,
        validation?.data?.result?.tools,
        validation?.data?.result?.items,
        validation?.server?.capabilities?.tools,
        validation?.server?.result?.tools,
        validation?.validation?.tools,
        findNestedToolArray(validation)
      ];

      const toolArray = candidateArrays.find((candidate) => isToolLikeArray(candidate)) || [];
      const tools = toolArray
        .map(normalizeValidatedTool)
        .filter(Boolean);

      const toolCountCandidates = [
        validation?.toolCount,
        validation?.itemCount,
        validation?.summary?.toolCount,
        validation?.server?.toolCount,
        validation?.data?.toolCount,
        validation?.data?.itemCount,
        validation?.result?.toolCount,
        validation?.result?.itemCount,
        validation?.capabilities?.toolCount,
        tools.length
      ];
      const toolCount = toolCountCandidates.find((value) => Number.isFinite(Number(value)));

      return {
        tools,
        toolCount: Number(toolCount || 0)
      };
    }

    async function runMcpValidate() {
      if (!isInteractiveRegisterType()) return;

      const endpointUrl = registerState.endpointUrl.trim();
      if (!endpointUrl) {
        updateValidateStatus("idle", getValidateIdleMessage(), "아직 검사하지 않았습니다.");
        return;
      }

      if (requiresOpenapiSpec() && !registerState.openapiSpecUrl.trim()) {
        updateValidateStatus(
          "idle",
          "OpenAPI 주소를 함께 입력하면 validate를 수행합니다.",
          "REST 포맷은 endpointUrl 과 openapiSpecUrl 이 모두 필요합니다.",
        );
        return;
      }

      const inventoryName = registerState.inventoryName.trim() || `${current.key}_mcp_draft`;
      if (!isSupportedMcpAddressName(inventoryName)) {
        updateValidateStatus(
          "failed",
          "Inventory 이름에는 영문 소문자, 숫자, `_`만 사용할 수 있습니다.",
          "이 값이 MCP 주소 이름으로 함께 사용되기 때문에 `-`, 공백, 대문자는 허용되지 않습니다.",
        );
        return;
      }

      const requestSeq = registerState.validateRequestSeq + 1;
      registerState.validateRequestSeq = requestSeq;

      updateValidateStatus("checking", getValidateCheckingMessage(), "입력 변경을 감지해 validate를 다시 실행했습니다.");

      const payload = {
        name: inventoryName,
        description: registerState.description.trim(),
        kind: "mcp",
        scopeType: current.key,
        endpointUrl
      };

      if (current.key === "direct") {
        payload.format = getSelectedFormat();
        if (requiresOpenapiSpec()) {
          payload.openapiSpecUrl = registerState.openapiSpecUrl.trim();
        } else {
          payload.transport = "streamable_http";
        }
      } else {
        payload.transport = "streamable_http";
      }

      try {
        Object.assign(payload, buildMcpAuthPayload());
      } catch (error) {
        updateValidateStatus("failed", error.message, "인증 입력 형식을 확인한 뒤 다시 시도해 주세요.");
        return;
      }

      try {
        const response = await fetch("/api/v2/tool-inventory/validate", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "same-origin",
          body: JSON.stringify(payload)
        });

        const result = await response.json().catch(() => ({}));
        if (requestSeq !== registerState.validateRequestSeq) return;

        if (!response.ok) {
          const errorMessage = result?.error?.message || "validate 호출에 실패했습니다.";
          updateValidateStatus("failed", errorMessage, "Endpoint 또는 인증 정보를 다시 확인해 주세요.");
          return;
        }

        const extracted = extractValidatedTools(result?.data?.validation || null);
        registerState.validatedTools = extracted.tools;
        registerState.validatedToolCount = extracted.toolCount;
        const sourceType = result?.data?.sourceType === "openapi" ? "REST" : "MCP";
        updateValidateStatus("ok", `OK · ${sourceType} validate를 통과했습니다.`, `${sourceType} source 검사가 완료되었고 ${extracted.toolCount}개의 tool을 확인했습니다.`);
      } catch (error) {
        if (requestSeq !== registerState.validateRequestSeq) return;
        updateValidateStatus("failed", error?.message || "validate 요청 중 네트워크 오류가 발생했습니다.", "브라우저 세션 인증 또는 API 연결 상태를 확인해 주세요.");
      }
    }

    function scheduleMcpValidate() {
      if (registerState.validateTimer) {
        window.clearTimeout(registerState.validateTimer);
      }

      registerState.validateTimer = window.setTimeout(() => {
        runMcpValidate();
      }, 700);
    }

    function bindInteractiveMcpInputs() {
      if (!isInteractiveRegisterType()) return;

      const nameInput = document.getElementById("inventoryNameInput");
      const descriptionInput = document.getElementById("inventoryDescriptionInput");
      const formatInput = document.getElementById("inventoryFormatInput");
      const endpointInput = document.getElementById("inventoryEndpointInput");
      const openapiInput = document.getElementById("inventoryOpenapiInput");
      const authTypeInput = document.getElementById("inventoryAuthTypeInput");
      const authSecretInput = document.getElementById("inventoryAuthSecretInput");

      if (!nameInput || !descriptionInput || !endpointInput || !authTypeInput || !authSecretInput) return;

      nameInput.addEventListener("input", (event) => {
        registerState.inventoryName = event.target.value;
        scheduleMcpValidate();
      });

      nameInput.addEventListener("blur", () => {
        registerState.inventoryName = nameInput.value;
        if (registerState.validateTimer) {
          window.clearTimeout(registerState.validateTimer);
          registerState.validateTimer = null;
        }
        runMcpValidate();
      });

      descriptionInput.addEventListener("input", (event) => {
        registerState.description = event.target.value;
      });

      if (formatInput) {
        formatInput.addEventListener("change", (event) => {
          registerState.format = event.target.value === "rest" ? "rest" : "mcp";
          updateInteractiveMcpSections();
          updateInteractiveMcpFunctionSection();
          scheduleMcpValidate();
        });
      }

      endpointInput.addEventListener("input", (event) => {
        registerState.endpointUrl = event.target.value;
        scheduleMcpValidate();
      });

      endpointInput.addEventListener("blur", () => {
        registerState.endpointUrl = endpointInput.value;
        if (registerState.validateTimer) {
          window.clearTimeout(registerState.validateTimer);
          registerState.validateTimer = null;
        }
        runMcpValidate();
      });

      if (openapiInput) {
        openapiInput.addEventListener("input", (event) => {
          registerState.openapiSpecUrl = event.target.value;
          scheduleMcpValidate();
        });

        openapiInput.addEventListener("blur", () => {
          registerState.openapiSpecUrl = openapiInput.value;
          if (registerState.validateTimer) {
            window.clearTimeout(registerState.validateTimer);
            registerState.validateTimer = null;
          }
          runMcpValidate();
        });
      }

      authTypeInput.addEventListener("change", (event) => {
        registerState.authType = event.target.value;
        registerState.authSecret = "";
        updateInteractiveMcpSections();
        updateInteractiveMcpFunctionSection();
        scheduleMcpValidate();
      });

      authSecretInput.addEventListener("input", (event) => {
        registerState.authSecret = event.target.value;
        updateInteractiveMcpFunctionSection();
        scheduleMcpValidate();
      });
    }

    bindInteractiveMcpInputs();
    bindRegisterActions();
  </script>
  <script src="ax_studio_topbar.js"></script>
