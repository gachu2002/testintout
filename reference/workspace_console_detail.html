<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Console Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="workspace_detail_shared.css" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    .material-icons-round {
      font-family: "Material Icons Round";
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "liga";
      -webkit-font-feature-settings: "liga";
      font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      flex: 0 0 auto;
    }
    .layout {
      grid-template-columns:minmax(0, 1fr);
    }
    .side-col {
      display:none;
    }
    .hero-actions {
      align-items:center;
    }
    .section-kicker {
      display:inline-flex;
      align-items:center;
      gap:4px;
      margin-bottom:6px;
    }
    .section-kicker .material-icons-round {
      font-size:15px;
    }
    .console-hero-feedback {
      position:relative;
      z-index:1;
      margin-top:14px;
      padding:12px 14px;
      border-radius:14px;
      background:rgba(255, 255, 255, .72);
      border:1px solid var(--border);
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .console-hero-feedback.is-success {
      color:var(--good);
      background:var(--good-bg);
      border-color:rgba(15, 118, 110, .14);
    }
    .console-hero-feedback.is-warning {
      color:var(--warn);
      background:var(--warn-bg);
      border-color:rgba(194, 65, 12, .14);
    }
    .binding-head-actions {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
    }
    .binding-summary {
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:5px 10px;
      border-radius:999px;
      background:var(--brand-bg);
      color:var(--brand);
      font-size:12px;
      font-weight:700;
      white-space:nowrap;
    }
    .binding-summary .material-icons-round { font-size:15px; }
    .binding-summary strong {
      display:none;
    }
    .binding-status-pill {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:74px;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      line-height:1;
      white-space:nowrap;
    }
    .binding-status-pill.tone-healthy {
      background:var(--good-bg);
      color:var(--good);
    }
    .binding-status-pill.tone-muted {
      background:#eef2f7;
      color:#667085;
    }
    .binding-status-pill.tone-incident {
      background:#fee2e2;
      color:#b91c1c;
    }
    .binding-status-pill.tone-pending {
      background:#f5f3ff;
      color:#7c3aed;
    }
    .bind-feedback {
      min-height:18px;
      margin-top:12px;
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .bind-feedback.is-success { color:var(--good); }
    .bind-feedback.is-warning { color:var(--warn); }
    .empty-state {
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:120px;
      padding:20px;
      border:1px dashed var(--border);
      border-radius:18px;
      background:var(--surface-soft);
      color:var(--muted);
      font-size:14px;
      text-align:center;
    }
    .bind-modal-backdrop {
      position:fixed;
      inset:0;
      z-index:420;
      display:grid;
      place-items:center;
      padding:24px;
      background:rgba(15, 23, 42, .42);
      backdrop-filter:blur(8px);
    }
    .bind-modal-backdrop[hidden] { display:none; }
    .bind-modal-shell {
      width:min(760px, 100%);
      max-height:min(720px, calc(100vh - 48px));
      overflow:hidden;
      display:flex;
      flex-direction:column;
      padding:24px;
      border-radius:24px;
      border:1px solid rgba(255, 255, 255, .5);
      background:linear-gradient(180deg, rgba(255,255,255,.98) 0%, rgba(248,250,252,.98) 100%);
      box-shadow:var(--shadow-strong);
    }
    .bind-modal-head {
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:flex-start;
      margin-bottom:18px;
      flex:0 0 auto;
    }
    .bind-modal-copy h2 {
      font-size:28px;
      line-height:1.06;
      letter-spacing:-.04em;
      margin-bottom:8px;
    }
    .bind-modal-copy p {
      color:var(--muted);
      font-size:14px;
      line-height:1.6;
    }
    .bind-modal-kicker {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:var(--brand-bg);
      color:var(--brand);
      font-size:12px;
      font-weight:700;
      margin-bottom:12px;
    }
    .bind-modal-kicker .material-icons-round { font-size:15px; }
    .bind-modal-close {
      width:40px;
      height:40px;
      flex:0 0 auto;
      border-radius:12px;
      border:1px solid var(--border);
      background:var(--surface);
      color:var(--muted);
      display:grid;
      place-items:center;
    }
    .bind-modal-close:hover {
      color:var(--brand);
      border-color:rgba(37,99,235,.18);
    }
    .bind-modal-body {
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
    }
    .bind-option-list {
      display:grid;
      gap:12px;
      margin-bottom:18px;
      padding-right:6px;
      overflow:auto;
      min-height:0;
      max-height:100%;
    }
    .bind-option-list::-webkit-scrollbar { width:10px; }
    .bind-option-list::-webkit-scrollbar-thumb {
      background:rgba(148, 163, 184, .45);
      border-radius:999px;
      border:2px solid rgba(255,255,255,.95);
    }
    .bind-option-list::-webkit-scrollbar-track { background:transparent; }
    .bind-option {
      width:100%;
      padding:16px 18px;
      border-radius:18px;
      border:1px solid var(--border);
      background:var(--surface);
      text-align:left;
      transition:border-color .16s ease, box-shadow .16s ease, transform .16s ease;
    }
    .bind-option:hover {
      border-color:rgba(37,99,235,.22);
      box-shadow:0 12px 28px rgba(15,23,42,.06);
      transform:translateY(-1px);
    }
    .bind-option.is-selected {
      border-color:var(--brand);
      box-shadow:0 0 0 3px var(--brand-soft);
      background:linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
    }
    .bind-option.is-bound {
      opacity:.58;
    }
    .bind-option-top {
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:8px;
    }
    .bind-option-name {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
      margin-bottom:4px;
    }
    .bind-option-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .bind-option-tags {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:12px;
    }
    .bind-option-tag {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:#f3f6fb;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .bind-modal-actions {
      display:flex;
      justify-content:flex-end;
      gap:10px;
      flex-wrap:wrap;
      flex:0 0 auto;
      padding-top:16px;
      border-top:1px solid var(--border);
      background:linear-gradient(180deg, rgba(248,250,252,0) 0%, rgba(248,250,252,.96) 24%);
    }
    .action-btn[disabled] {
      opacity:.5;
      cursor:not-allowed;
      pointer-events:none;
    }
    @media (max-width: 720px) {
      .binding-head-actions {
        width:100%;
        justify-content:flex-start;
      }
      .bind-modal-backdrop { padding:16px; }
      .bind-modal-shell {
        max-height:calc(100vh - 32px);
        padding:20px;
        border-radius:22px;
      }
      .bind-modal-copy h2 { font-size:24px; }
      .bind-modal-head { align-items:center; }
      .bind-modal-actions > * { width:100%; justify-content:center; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    function renderTable(headers, rows) {
      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>${headers.map((header) => `<th>${header}</th>`).join("")}</tr>
            </thead>
            <tbody>
              ${rows.map((row) => `
                <tr>${row.map((cell) => `<td>${cell}</td>`).join("")}</tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderProgress(items) {
      return items.map((item) => `
        <article class="progress-card">
          <div class="progress-top">
            <div class="progress-title">${item.title}</div>
            <div class="progress-value">${item.value}</div>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${item.percent}%;"></div></div>
          <div class="progress-meta">${item.meta}</div>
        </article>
      `).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderBindingStatus(status) {
      const key = String(status || "").toLowerCase();
      const tone = key === "running" ? "healthy" : key === "stopped" ? "muted" : key ? "incident" : "pending";
      const label = key === "running"
        ? "Healthy"
        : key === "stopped"
          ? "Stopped"
          : key === "error"
            ? "Issue"
            : key === "starting"
              ? "Starting"
              : key === "stopping"
                ? "Stopping"
                : "Unknown";

      return `<span class="binding-status-pill tone-${tone}">${label}</span>`;
    }

    function renderBindingTable(items) {
      if (!Array.isArray(items) || !items.length) {
        return `<div class="empty-state" data-binding-empty>현재 연결된 DB가 없습니다.</div>`;
      }

      return `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>DB</th>
                <th>Engine</th>
                <th>Health</th>
              </tr>
            </thead>
            <tbody>
              ${items.map((item) => `
                <tr>
                  <td>${escapeHtml(item?.name || "-")}</td>
                  <td>${escapeHtml(item?.engine || "-")}</td>
                  <td>${renderBindingStatus(item?.status)}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderDbOptions(options) {
      if (!Array.isArray(options) || !options.length) {
        return `<div class="empty-state">바인딩 가능한 DB가 없습니다.</div>`;
      }

      return options.map((option) => `
        <button
          class="bind-option"
          type="button"
          data-bind-option
          data-db-id="${escapeHtml(option.id)}"
          data-db-name="${escapeHtml(option.name)}"
        >
          <div class="bind-option-top">
            <div>
              <div class="bind-option-name">${escapeHtml(option.name)}</div>
              <div class="bind-option-meta">${escapeHtml(option.description || option.meta || "연결 가능한 데이터베이스")}</div>
            </div>
            <span class="pill engine">${escapeHtml(option.engine || "database")}</span>
          </div>
          <div class="bind-option-tags">
            <span class="bind-option-tag"><span class="material-icons-round" style="font-size:14px;">verified_user</span>${escapeHtml(option.statusLabel || "상태 확인 중")}</span>
          </div>
        </button>
      `).join("");
    }

    function buildShellItem() {
      return {
        title: "Console Loading",
        description: "실제 Console API 응답을 불러오는 중입니다.",
        heroIcon: "web",
        typeLabel: "Database Console",
        statusLabel: "Loading",
        statusTone: "review",
        actions: [
          { label: "Run", icon: "play_circle", variant: "primary", kind: "button", actionKey: "run", disabled: true },
          { label: "Open", icon: "open_in_new", kind: "button", actionKey: "open", disabled: true },
          { label: "Stop", icon: "stop_circle", kind: "button", actionKey: "stop", disabled: true }
        ],
        heroStats: [
          { label: "CPU", value: "-", meta: "메트릭을 불러오는 중입니다." },
          { label: "Memory", value: "-", meta: "메트릭을 불러오는 중입니다." },
          { label: "Bound DB", value: "-", meta: "연결 정보를 불러오는 중입니다." }
        ],
        theme: { bg: "#e8f7f0", brand: "#15803d", brandH: "#166534", brandBg: "#d4f6df", brandSoft: "rgba(21,128,61,.18)", accent: "#34d399" },
        mainHtml: `
          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">bar_chart</span>Usage</div>
                <h2 class="section-title">리소스 사용량</h2>
                <p class="section-desc">콘솔별 CPU, Memory 사용량을 실제 메트릭 기준으로 보여줍니다.</p>
              </div>
            </div>
            <div class="stats-grid two" data-usage-cards>${renderProgress([
              { title: "CPU", value: "-", percent: 0, meta: "메트릭을 불러오는 중입니다." },
              { title: "Memory", value: "-", percent: 0, meta: "메트릭을 불러오는 중입니다." }
            ])}</div>
          </section>

          <section class="panel section">
            <div class="section-head">
              <div>
                <div class="section-kicker"><span class="material-icons-round">lan</span>Bound Databases</div>
                <h2 class="section-title">Binding DB</h2>
                <p class="section-desc">이 콘솔에 실제로 연결된 DB 목록과 상태를 확인할 수 있습니다.</p>
              </div>
              <div class="binding-head-actions">
                <div class="binding-summary" data-binding-summary>
                  <span class="material-icons-round">storage</span>
                  <strong data-binding-count>0</strong>
                  <span data-binding-summary-text>연결 정보 로딩 중</span>
                </div>
                <button class="action-btn primary" type="button" data-bind-open disabled>
                  <span class="material-icons-round" style="font-size:18px;">link</span>
                  DB 바인딩
                </button>
              </div>
            </div>
            <div data-binding-table>${renderBindingTable([])}</div>
            <div class="bind-feedback" data-bind-feedback aria-live="polite"></div>
            <div class="bind-modal-backdrop" data-bind-modal hidden>
              <div class="bind-modal-shell" role="dialog" aria-modal="true" aria-labelledby="bindDbModalTitle">
                <div class="bind-modal-head">
                  <div class="bind-modal-copy">
                    <div class="bind-modal-kicker"><span class="material-icons-round">link</span>DB Binding</div>
                    <h2 id="bindDbModalTitle">바인딩할 DB를 선택할 수 있습니다</h2>
                    <p>현재 콘솔 타입과 호환되는 DB만 실제 API 기준으로 불러옵니다.</p>
                  </div>
                  <button class="bind-modal-close" type="button" aria-label="팝업 닫기" data-bind-close>
                    <span class="material-icons-round">close</span>
                  </button>
                </div>
                <div class="bind-modal-body">
                  <div class="bind-option-list" data-bind-options>${renderDbOptions([])}</div>
                  <div class="bind-modal-actions">
                    <button class="action-btn ghost" type="button" data-bind-close>취소</button>
                    <button class="action-btn primary" type="button" data-bind-confirm disabled>선택한 DB 바인딩</button>
                  </div>
                </div>
              </div>
            </div>
          </section>
        `,
        sidebarHtml: ``
      };
    }

    window.DETAIL_PAGE_CONFIG = {
      paramName: "id",
      pageTitle: "Console Detail",
      hubLabel: "Consoles Hub",
      hubHref: "workspace_tools_hub.html",
      activeHubKey: "tools",
      eyebrow: "Development · Database Console",
      searchPlaceholder: "콘솔 이름, 연결 DB, 운영 메모를 검색하세요...",
      items: {
        loading: buildShellItem()
      }
    };
  </script>

        heroSection: document.querySelector(".hero"),
        usageHost: document.querySelector("[data-usage-cards]"),
        bindingTable: document.querySelector("[data-binding-table]"),
        bindingCount: document.querySelector("[data-binding-count]"),
        bindingSummaryText: document.querySelector("[data-binding-summary-text]"),
        bindFeedback: document.querySelector("[data-bind-feedback]"),
        bindModal: document.querySelector("[data-bind-modal]"),
        bindOpenButton: document.querySelector("[data-bind-open]"),
        bindOptionsHost: document.querySelector("[data-bind-options]"),
        bindConfirmButton: document.querySelector("[data-bind-confirm]"),
        bindCloseButtons: Array.from(document.querySelectorAll("[data-bind-close]")),
        runButton: document.querySelector('[data-action-key="run"]'),
        openButton: document.querySelector('[data-action-key="open"]'),
        stopButton: document.querySelector('[data-action-key="stop"]')
      };
      const breadcrumbLabel = Array.from(document.querySelectorAll(".breadcrumbs span"))
        .filter((node) => !node.classList.contains("material-icons-round"))
        .at(-1);
      const heroFeedback = document.createElement("div");
      heroFeedback.className = "console-hero-feedback";
      heroFeedback.setAttribute("aria-live", "polite");
      heroFeedback.hidden = true;
      if (dom.heroSection) {
        dom.heroSection.appendChild(heroFeedback);
      }

      let currentConsoleId = null;
      let currentDetail = null;
      let currentBindings = [];
      let selectedDatabaseId = null;
      let availableDatabases = [];
      let actionInFlight = false;
      let bindInFlight = false;

      function buildQuery(params) {
        const searchParams = new URLSearchParams();
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value === undefined || value === null || value === "") {
            return;
          }
          searchParams.set(key, String(value));
        });
        const query = searchParams.toString();
        return query ? `?${query}` : "";
      }

      async function requestJson(path, options) {
        const response = await fetch(`${API_BASE}${path}`, {
          credentials: "same-origin",
          headers: {
            Accept: "application/json",
            ...(options && options.body ? { "Content-Type": "application/json" } : {})
          },
          ...(options || {})
        });

        if (!response.ok) {
          let message = `${response.status} ${response.statusText}`;
          try {
            const payload = await response.json();
            message = payload?.error?.message || payload?.message || message;
          } catch (error) {
            // ignore parse failure
          }
          throw new Error(message);
        }

        return response.json();
      }

      function extractData(payload, fallback) {
        if (payload && typeof payload === "object" && "data" in payload) {
          return payload.data;
        }
        return payload ?? fallback;
      }

      function extractItems(payload) {
        const data = extractData(payload, {});
        if (Array.isArray(data?.items)) {
          return data.items;
        }
        if (Array.isArray(payload?.items)) {
          return payload.items;
        }
        return [];
      }

      async function fetchJson(path, params) {
        return requestJson(`${path}${buildQuery(params)}`);
      }

      function setHeroFeedback(message, tone) {
        heroFeedback.textContent = message || "";
        heroFeedback.classList.remove("is-success", "is-warning");
        heroFeedback.hidden = !message;
        if (tone) {
          heroFeedback.classList.add(tone);
        }
      }

      function setBindFeedback(message, tone) {
        if (!dom.bindFeedback) {
          return;
        }
        dom.bindFeedback.textContent = message || "";
        dom.bindFeedback.classList.remove("is-success", "is-warning");
        if (tone) {
          dom.bindFeedback.classList.add(tone);
        }
      }

      function updateTheme(type) {
        const theme = TYPE_META[type]?.theme || TYPE_META.phpmyadmin.theme;
        rootStyle.setProperty("--bg", theme.bg);
        rootStyle.setProperty("--brand", theme.brand);
        rootStyle.setProperty("--brand-h", theme.brandH || theme.brand);
        rootStyle.setProperty("--brand-bg", theme.brandBg);
        rootStyle.setProperty("--brand-soft", theme.brandSoft);
        rootStyle.setProperty("--accent", theme.accent || theme.brand);
      }

      function formatPercent(value) {
        return Number.isFinite(value) ? `${Number(value).toFixed(1)}%` : "측정값 없음";
      }

      function getUsageDisplayValue(card) {
        if (Number.isFinite(card?.percent)) {
          return `${card.percent.toFixed(1)}%`;
        }

        if (Number(card?.usedValue) === 0) {
          return "0.0%";
        }

        return "측정값 없음";
      }

      function buildUsageMeta(card) {
        const parts = [];
        if (card?.limitLabel) {
          parts.push(`${card.limitLabel} quota`);
        }
        if (card?.requestLabel) {
          parts.push(`request ${card.requestLabel}`);
        }
        if (Number.isFinite(card?.percent)) {
          parts.push(`${card.percent.toFixed(1)}% 사용`);
        }
        return parts.join(" · ") || "메트릭을 수집하는 중입니다.";
      }

      function toUsageProgress(detail) {
        const usage = detail?.usage || {};
        return [
          {
            title: "CPU",
            value: getUsageDisplayValue(usage?.cpu),
            percent: Number.isFinite(usage?.cpu?.percent) ? usage.cpu.percent : 0,
            meta: buildUsageMeta(usage?.cpu)
          },
          {
            title: "Memory",
            value: getUsageDisplayValue(usage?.memory),
            percent: Number.isFinite(usage?.memory?.percent) ? usage.memory.percent : 0,
            meta: buildUsageMeta(usage?.memory)
          }
        ];
      }

      function updateHeroStat(labelName, nextValue, nextMeta) {
        const card = document.querySelector(`[data-stat-card="${labelName}"]`);
        if (!card) {
          return;
        }
        const valueNode = card.querySelector(".stat-value");
        const metaNode = card.querySelector(".stat-meta");
        if (valueNode) {
          valueNode.textContent = nextValue;
        }
        if (metaNode) {
          metaNode.textContent = nextMeta;
        }
      }

      function updateHero(detail, bindings) {
        const typeMeta = TYPE_META[detail?.type] || {};
        document.title = `${detail?.name || "Console Detail"} · Console Detail`;
        if (dom.title) {
          dom.title.textContent = detail?.name || "Console Detail";
        }
        if (dom.description) {
          dom.description.textContent = TYPE_DESCRIPTIONS[detail?.type] || detail?.summary || "";
        }
        if (dom.eyebrow) {
          dom.eyebrow.innerHTML = `<span class="material-icons-round" style="font-size:16px;">${typeMeta.icon || detail?.icon || "web"}</span>${typeMeta.eyebrow || "Development · Database Console"}`;
        }
        if (dom.statusPill) {
          const tone = STATUS_TONES[detail?.status] || "review";
          dom.statusPill.textContent = detail?.statusLabel || STATUS_LABELS[detail?.status] || "Unknown";
          dom.statusPill.className = `pill tone-${tone}`;
          dom.statusPill.setAttribute("data-status-pill", "");
        }
        if (breadcrumbLabel) {
          breadcrumbLabel.textContent = detail?.name || "Console Detail";
        }

        const cpuPercent = getUsageDisplayValue(detail?.usage?.cpu);
        const memoryPercent = getUsageDisplayValue(detail?.usage?.memory);
        updateHeroStat("CPU", cpuPercent, `${detail?.usage?.cpu?.usedLabel || "-"} / ${detail?.usage?.cpu?.limitLabel || "-"}`);
        updateHeroStat("Memory", memoryPercent, `${detail?.usage?.memory?.usedLabel || "-"} / ${detail?.usage?.memory?.limitLabel || "-"}`);
        updateHeroStat(
          "Bound DB",
          String(bindings.length),
          bindings.length ? bindings.map((binding) => binding.name).slice(0, 3).join(" · ") : "연결된 DB 없음"
        );
      }

      function updateUsage(detail) {
        if (!dom.usageHost) {
          return;
        }
        dom.usageHost.innerHTML = renderProgress(toUsageProgress(detail));
      }

      function renderBindings(bindings) {
        currentBindings = Array.isArray(bindings) ? bindings : [];
        if (dom.bindingTable) {
          dom.bindingTable.innerHTML = renderBindingTable(currentBindings);
        }
        if (dom.bindingCount) {
          dom.bindingCount.textContent = String(currentBindings.length);
        }
        if (dom.bindingSummaryText) {
          dom.bindingSummaryText.textContent = currentBindings.length ? `${currentBindings.length}개 연결됨` : "연결된 DB 없음";
        }
      }

      function syncActionButtons(detail) {
        const canStart = Boolean(detail?.capabilities?.canStart);
        const canOpen = Boolean(detail?.capabilities?.canOpen);
        const canStop = Boolean(detail?.capabilities?.canStop);
        const canManageBindings = Boolean(detail?.capabilities?.canManageBindings);

        if (dom.runButton) {
          dom.runButton.disabled = actionInFlight || !canStart;
        }
        if (dom.openButton) {
          dom.openButton.disabled = actionInFlight || !canOpen;
        }
        if (dom.stopButton) {
          dom.stopButton.disabled = actionInFlight || !canStop;
        }
        if (dom.bindOpenButton) {
          dom.bindOpenButton.disabled = bindInFlight || !canManageBindings;
        }
      }

      async function fetchDetail(consoleId) {
        const [detailPayload, bindingsPayload] = await Promise.all([
          fetchJson(`/consoles/${encodeURIComponent(consoleId)}`),
          fetchJson(`/consoles/${encodeURIComponent(consoleId)}/bindings`)
        ]);
        return {
          detail: extractData(detailPayload, {}),
          bindings: extractItems(bindingsPayload)
        };
      }

      async function fetchAllDatabases() {
        const items = [];
        let cursor = null;
        let hasNext = true;

        while (hasNext) {
          const payload = await fetchJson("/databases", {
            limit: 100,
            sort: "name",
            ...(cursor ? { cursor } : {})
          });
          const pageItems = extractItems(payload);
          const page = extractData(payload, {})?.page || payload?.page || {};

          items.push(...pageItems);
          cursor = typeof page?.nextCursor === "string" ? page.nextCursor : null;
          hasNext = Boolean(cursor) && pageItems.length > 0;
        }

        return items;
      }

      function toBindableOptions(databases, detail, bindings) {
        const compatibleEngine = COMPATIBLE_ENGINES[detail?.type];
        const boundIds = new Set((bindings || []).map((item) => String(item?.id || "")));

        return (Array.isArray(databases) ? databases : [])
          .filter((item) => !compatibleEngine || item?.engine === compatibleEngine)
          .filter((item) => !boundIds.has(String(item?.id || "")))
          .map((item) => ({
            id: item?.id,
            name: item?.name || "Database",
            engine: item?.engine || "database",
            statusLabel: item?.health?.label || item?.status || "unknown",
            description: item?.summary || item?.endpoint || "연결 가능한 데이터베이스"
          }))
          .sort((a, b) => a.name.localeCompare(b.name));
      }

      function attachBindOptionEvents() {
        const buttons = Array.from(document.querySelectorAll("[data-bind-option]"));
        buttons.forEach((button) => {
          button.addEventListener("click", () => {
            selectedDatabaseId = button.dataset.dbId || null;
            buttons.forEach((candidate) => candidate.classList.toggle("is-selected", candidate === button));
            if (dom.bindConfirmButton) {
              dom.bindConfirmButton.disabled = !selectedDatabaseId || bindInFlight;
            }
          });
        });
      }

      async function refreshBindOptions() {
        if (!dom.bindOptionsHost || !currentDetail) {
          return;
        }

        if (!availableDatabases.length) {
          availableDatabases = await fetchAllDatabases();
        }

        const options = toBindableOptions(availableDatabases, currentDetail, currentBindings);
        dom.bindOptionsHost.innerHTML = renderDbOptions(options);
        selectedDatabaseId = null;
        if (dom.bindConfirmButton) {
          dom.bindConfirmButton.disabled = true;
        }
        attachBindOptionEvents();
      }

      function closeBindModal() {
        if (dom.bindModal) {
          dom.bindModal.hidden = true;
        }
        selectedDatabaseId = null;
        if (dom.bindConfirmButton) {
          dom.bindConfirmButton.disabled = true;
        }
      }

      async function openBindModal() {
        if (!dom.bindModal || !currentDetail?.capabilities?.canManageBindings) {
          return;
        }

        dom.bindModal.hidden = false;
        if (dom.bindOptionsHost) {
          dom.bindOptionsHost.innerHTML = `<div class="empty-state">바인딩 가능한 DB를 확인하는 중입니다.</div>`;
        }

        try {
          await refreshBindOptions();
        } catch (error) {
          if (dom.bindOptionsHost) {
            dom.bindOptionsHost.innerHTML = `<div class="empty-state">DB 목록을 불러오지 못했습니다.</div>`;
          }
          setBindFeedback(error.message || "DB 목록을 불러오지 못했습니다.", "is-warning");
        }
      }

      async function applyDetail(consoleId, feedbackMessage, feedbackTone) {
        const { detail, bindings } = await fetchDetail(consoleId);
        currentConsoleId = consoleId;
        currentDetail = detail;
        updateTheme(detail?.type);
        updateHero(detail, bindings);
        updateUsage(detail);
        renderBindings(bindings);
        syncActionButtons(detail);
        if (feedbackMessage) {
          setHeroFeedback(feedbackMessage, feedbackTone);
        } else {
          setHeroFeedback("");
        }
      }

      async function pollUntilStable(consoleId, expectedStates, pendingMessage, successMessage, successTone) {
        setHeroFeedback(pendingMessage);

        for (let index = 0; index < POLL_MAX_ATTEMPTS; index += 1) {
          await new Promise((resolve) => setTimeout(resolve, POLL_INTERVAL_MS));
          const { detail, bindings } = await fetchDetail(consoleId);
          currentDetail = detail;
          updateTheme(detail?.type);
          updateHero(detail, bindings);
          updateUsage(detail);
          renderBindings(bindings);
          syncActionButtons(detail);

          if (expectedStates.includes(detail?.status)) {
            setHeroFeedback(successMessage, successTone);
            return;
          }
        }

        setHeroFeedback("상태 반영을 기다리는 중입니다. 잠시 후 다시 확인해 주세요.", "is-warning");
      }

      async function handleLifecycleAction(action) {
        if (!currentConsoleId || actionInFlight) {
          return;
        }

        actionInFlight = true;
        syncActionButtons(currentDetail);
        setHeroFeedback("요청을 처리하는 중입니다.");

        try {
          await requestJson(`/consoles/${encodeURIComponent(currentConsoleId)}/${action}`, {
            method: "POST"
          });

          if (action === "start") {
            await pollUntilStable(
              currentConsoleId,
              ["running"],
              "콘솔 시작 작업을 요청했습니다. 실제 상태를 확인하는 중입니다.",
              `${currentDetail?.name || "Console"} 콘솔이 실행되었습니다.`,
              "is-success"
            );
          } else if (action === "stop") {
            await pollUntilStable(
              currentConsoleId,
              ["stopped"],
              "콘솔 중지 작업을 요청했습니다. 실제 상태를 확인하는 중입니다.",
              `${currentDetail?.name || "Console"} 콘솔이 중지되었습니다.`,
              "is-warning"
            );
          }
        } catch (error) {
          setHeroFeedback(error.message || "요청을 처리하지 못했습니다.", "is-warning");
        } finally {
          actionInFlight = false;
          syncActionButtons(currentDetail);
        }
      }

      async function handleOpenConsole() {
        if (!currentConsoleId || actionInFlight) {
          return;
        }

        actionInFlight = true;
        syncActionButtons(currentDetail);
        setHeroFeedback("콘솔 접속 URL을 준비하는 중입니다.");

        try {
          const payload = await requestJson(`/consoles/${encodeURIComponent(currentConsoleId)}/open`, {
            method: "POST"
          });
          const data = extractData(payload, {});
          const opened = data?.url ? window.open(data.url, "_blank", "noopener") : null;
          if (!opened) {
            throw new Error("새 탭을 열지 못했습니다. 브라우저 팝업 설정을 확인해 주세요.");
          }
          setHeroFeedback(`${currentDetail?.name || "Console"} 콘솔을 새 탭에서 열었습니다.`, "is-success");
        } catch (error) {
          setHeroFeedback(error.message || "콘솔을 열지 못했습니다.", "is-warning");
        } finally {
          actionInFlight = false;
          syncActionButtons(currentDetail);
        }
      }

      async function handleBindConfirm() {
        if (!currentConsoleId || !selectedDatabaseId || bindInFlight) {
          return;
        }

        bindInFlight = true;
        syncActionButtons(currentDetail);
        if (dom.bindConfirmButton) {
          dom.bindConfirmButton.disabled = true;
        }

        try {
          await requestJson(`/consoles/${encodeURIComponent(currentConsoleId)}/bindings`, {
            method: "POST",
            body: JSON.stringify({ databaseId: selectedDatabaseId })
          });
          availableDatabases = [];
          closeBindModal();
          await applyDetail(currentConsoleId);
          setBindFeedback("선택한 DB를 실제 콘솔 바인딩에 추가했습니다.", "is-success");
        } catch (error) {
          setBindFeedback(error.message || "DB 바인딩에 실패했습니다.", "is-warning");
        } finally {
          bindInFlight = false;
          syncActionButtons(currentDetail);
        }
      }

      async function resolveConsoleId() {
        const params = new URLSearchParams(window.location.search);
        const directId = String(params.get("id") || "").trim();
        if (directId) {
          return directId;
        }

        const legacyKey = String(params.get("item") || "").trim();
        const legacyType = DETAIL_KEY_TO_TYPE[legacyKey];
        if (!legacyType) {
          return null;
        }

        const payload = await fetchJson("/consoles", {
          limit: 1,
          sort: "-updatedAt",
          "filter[type]": legacyType
        });
        const items = extractItems(payload);
        return items[0]?.id || null;
      }

      dom.bindCloseButtons.forEach((button) => {
        button.addEventListener("click", closeBindModal);
      });

      if (dom.bindModal) {
        dom.bindModal.addEventListener("click", (event) => {
          if (event.target === dom.bindModal) {
            closeBindModal();
          }
        });
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && dom.bindModal && !dom.bindModal.hidden) {
          closeBindModal();
        }
      });

      if (dom.bindOpenButton) {
        dom.bindOpenButton.addEventListener("click", openBindModal);
      }
      if (dom.bindConfirmButton) {
        dom.bindConfirmButton.addEventListener("click", handleBindConfirm);
      }
      if (dom.runButton) {
        dom.runButton.addEventListener("click", () => handleLifecycleAction("start"));
      }
      if (dom.stopButton) {
        dom.stopButton.addEventListener("click", () => handleLifecycleAction("stop"));
      }
      if (dom.openButton) {
        dom.openButton.addEventListener("click", handleOpenConsole);
      }

      (async () => {
        try {
          const consoleId = await resolveConsoleId();
          if (!consoleId) {
            throw new Error("콘솔 ID를 확인하지 못했습니다.");
          }

          await applyDetail(consoleId);
        } catch (error) {
          setHeroFeedback(error.message || "콘솔 상세 정보를 불러오지 못했습니다.", "is-warning");
          if (dom.description) {
            dom.description.textContent = "Console 상세 데이터를 불러오지 못했습니다.";
          }
          if (dom.bindingTable) {
            dom.bindingTable.innerHTML = `<div class="empty-state">상세 데이터를 불러오지 못했습니다.</div>`;
          }
        }
      })();
    })();
  </script>
</body>
</html>
