<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    :root {
      --bg:#edf4ff;
      --surface:#ffffff;
      --surface-soft:#fbfcfe;
      --surface-deep:#0f172a;
      --border:#e7ebf0;
      --border-strong:#d5dbe4;
      --text:#202631;
      --muted:#5c6675;
      --subtle:#8a93a2;
      --good:#0f766e;
      --good-bg:#d9fbf1;
      --warn:#d97706;
      --warn-bg:#fff2d8;
      --danger:#b91c1c;
      --danger-bg:#fee2e2;
      --max:1360px;
      --nav-max:1520px;
      --radius:22px;
      --shadow:0 18px 40px rgba(15,23,42,.08);
      --shadow-soft:0 10px 24px rgba(15,23,42,.05);
      --brand:#2563eb;
      --brand-bg:#cfe2ff;
      --brand-soft:rgba(37,99,235,.18);
      --accent:#06b6d4;
      --border-2:#d5dbe4;
      --t1:#202631;
      --t2:#5c6675;
      --t3:#8a93a2;
      --purple:#7c5fcf;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at top left, var(--brand-soft), transparent 28%),
        radial-gradient(circle at top right, rgba(6,182,212,.10), transparent 24%),
        linear-gradient(180deg, #f7f9fc 0%, var(--bg) 100%);
      -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; cursor:pointer; }

    .topbar {
      position:sticky;
      top:0;
      z-index:200;
      height:56px;
      background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .topbar-inner {
      max-width:var(--nav-max);
      height:100%;
      margin:0 auto;
      padding:0 24px;
      display:flex;
      align-items:center;
      gap:12px;
      position:relative;
    }
    .topbar-brand {
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
      padding-right:2px;
    }
    .brand-mark {
      width:40px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .brand-mark img { width:35px; height:20px; display:block; }
    .brand-name {
      font-size:15px;
      font-weight:800;
      letter-spacing:-.35px;
      white-space:nowrap;
    }
    .logo-menu {
      flex-shrink:0;
      display:flex;
      align-items:center;
    }
    .menu-trigger {
      display:flex;
      align-items:center;
      gap:8px;
      height:40px;
      padding:0 11px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fbfcfe;
      font-size:13px;
      font-weight:700;
      color:var(--t1);
      transition:background .15s, box-shadow .15s;
    }
    .menu-trigger:hover,
    .logo-menu.is-open .menu-trigger {
      background:var(--bg);
      box-shadow:inset 0 0 0 1px var(--border);
    }
    .menu-trigger .material-icons-round:first-child {
      font-size:18px;
      color:var(--t2);
    }
    .menu-caret {
      font-size:18px;
      color:var(--t3);
      transition:transform .18s ease, color .15s ease;
    }
    .logo-menu.is-open .menu-caret {
      transform:rotate(180deg);
      color:var(--brand);
    }
    .service-popover {
      position:fixed;
      left:0;
      top:56px;
      width:100vw;
      background:linear-gradient(180deg, rgba(247,248,251,.98) 0%, rgba(243,245,249,.98) 100%);
      border-top:1px solid rgba(235,237,240,.9);
      border-bottom:1px solid var(--border);
      box-shadow:0 18px 36px rgba(15,23,42,.08);
      padding:18px 0 20px;
      z-index:240;
    }
    .service-popover[hidden] { display:none; }
    .service-popover-inner {
      max-width:var(--nav-max);
      margin:0 auto;
      padding:0 24px;
    }
    .service-groups {
      display:grid;
      grid-template-columns:repeat(6, minmax(0, 1fr));
    }
    .service-group {
      min-width:0;
      padding:0 30px;
    }
    .service-group + .service-group { border-left:1px solid var(--border); }
    .service-group-title {
      font-size:15px;
      font-weight:700;
      margin-bottom:18px;
    }
    .service-links { display:grid; gap:18px; }
    .service-link {
      display:grid;
      grid-template-columns:18px minmax(0, 1fr);
      gap:10px;
      padding:7px 10px;
      margin:0 -10px;
      border-radius:10px;
      font-size:13px;
      font-weight:600;
      transition:background .15s ease, color .15s ease;
    }
    .service-link:hover {
      background:rgba(255,255,255,.84);
      color:var(--brand);
    }
    .service-link.is-current {
      background:rgba(255,255,255,.84);
      color:var(--brand);
      box-shadow:inset 0 0 0 1px rgba(37,99,235,.08);
    }
    .service-link-icon {
      font-size:17px;
      color:var(--t2);
      margin-top:2px;
    }
    .service-link:hover .service-link-icon,
    .service-link.is-current .service-link-icon { color:var(--brand); }
    .service-link-copy { display:grid; gap:4px; min-width:0; }
    .service-link-desc {
      font-size:12px;
      line-height:1.45;
      color:var(--t2);
      font-weight:400;
    }
    .service-link:hover .service-link-desc,
    .service-link.is-current .service-link-desc { color:var(--t1); }
    .service-outlinks {
      position:relative;
      left:50%;
      width:100vw;
      box-sizing:border-box;
      margin:16px 0 -20px;
      padding:9px max(24px, calc((100vw - var(--nav-max)) / 2 + 24px)) 10px;
      transform:translateX(-50%);
      border-top:1px solid rgba(15,23,42,.10);
      display:flex;
      align-items:center;
      justify-content:flex-start;
      flex-wrap:wrap;
      gap:10px;
      background:rgba(248,250,252,.72);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
    }
    .service-outlinks-title {
      color:var(--t3);
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.72;
    }
    .service-outlink-list {
      display:flex;
      align-items:center;
      justify-content:flex-start;
      flex-wrap:wrap;
      gap:0;
    }
    .service-outlink {
      min-width:0;
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:3px 8px;
      color:var(--t2);
      text-decoration:none;
      font-size:12px;
      font-weight:600;
      transition:color .15s ease;
    }
    .service-outlink + .service-outlink {
      border-left:1px solid var(--border);
    }
    .service-outlink:hover {
      color:var(--brand);
    }
    .service-outlink-icon,
    .service-outlink-arrow {
      color:currentColor;
      font-size:13px;
      opacity:.48;
      transition:opacity .15s ease;
    }
    .service-outlink:hover .service-outlink-icon,
    .service-outlink:hover .service-outlink-arrow {
      opacity:.8;
    }
    .service-outlink-copy {
      min-width:0;
      display:inline-flex;
      align-items:center;
    }
    .service-outlink-title {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .service-outlink-desc {
      display:none;
    }
    .search-wrap {
      flex:1;
      max-width:440px;
      min-width:0;
      position:relative;
    }
    .search-wrap .ico {
      position:absolute;
      left:13px;
      top:50%;
      transform:translateY(-50%);
      font-size:17px;
      color:var(--t3);
      pointer-events:none;
    }
    .search-input {
      width:100%;
      height:36px;
      border:1.5px solid var(--border);
      border-radius:20px;
      padding:0 72px 0 38px;
      background:var(--bg);
      outline:none;
      font-size:13px;
      color:var(--t1);
      transition:border .15s, box-shadow .15s;
    }
    .search-input:focus {
      border-color:var(--brand);
      background:var(--surface);
      box-shadow:0 0 0 3px rgba(37,99,235,.08);
    }
    .search-ai {
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      height:22px;
      padding:0 7px;
      border-radius:999px;
      display:flex;
      align-items:center;
      gap:3px;
      background:linear-gradient(135deg, #f6f0ff 0%, #eef4ff 100%);
      border:1px solid rgba(124,95,207,.18);
      font-size:10px;
      font-weight:700;
      color:var(--purple);
      letter-spacing:.02em;
      pointer-events:none;
    }
    .search-ai .material-icons-round { font-size:12px; }
    .tb-spacer { flex:1; }
    .tb-icon {
      width:34px;
      height:34px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--t2);
      position:relative;
    }
    .tb-icon:hover { background:var(--bg); }
    .tb-icon .material-icons-round { font-size:20px; }
    .tb-icon .dot {
      position:absolute;
      top:5px;
      right:5px;
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--brand);
      border:2px solid var(--surface);
    }
    .avatar {
      width:32px;
      height:32px;
      border-radius:50%;
      background:var(--brand);
      color:#fff;
      font-size:12px;
      font-weight:600;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .page {
      max-width:var(--max);
      margin:0 auto;
      padding:28px 24px 44px;
      display:grid;
      gap:22px;
    }
    .breadcrumbs {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      font-size:12px;
      color:var(--subtle);
    }
    .breadcrumbs a {
      color:var(--muted);
      font-weight:700;
    }
    .breadcrumbs .material-icons-round {
      font-size:15px;
      color:#bcc6d4;
    }
    .panel {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-soft);
    }
    .hero {
      overflow:hidden;
      position:relative;
      padding:28px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.96), rgba(248,251,255,.92)),
        linear-gradient(135deg, var(--brand-soft), rgba(6,182,212,.06));
    }
    .hero::after {
      content:"";
      position:absolute;
      right:-80px;
      top:-90px;
      width:280px;
      height:280px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(37,99,235,.12) 0%, rgba(37,99,235,0) 68%);
      pointer-events:none;
    }
    .hero-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      margin-bottom:22px;
    }
    .eyebrow {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:14px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .hero-title-row {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }
    .hero-title {
      font-size:34px;
      font-weight:800;
      letter-spacing:-.04em;
    }
    .pill {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      border:1px solid transparent;
      white-space:nowrap;
    }
    .pill.status-healthy { color:var(--good); background:var(--good-bg); }
    .pill.status-warning { color:var(--warn); background:var(--warn-bg); }
    .pill.status-danger { color:var(--danger); background:var(--danger-bg); }
    .pill.engine { color:var(--brand); background:var(--brand-bg); }
    .hero-desc {
      max-width:760px;
      color:var(--muted);
      line-height:1.65;
      font-size:15px;
    }
    .hero-actions {
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:10px;
    }
    .action-btn {
      display:inline-flex;
      align-items:center;
      gap:8px;
      height:42px;
      padding:0 16px;
      border-radius:14px;
      border:1px solid transparent;
      font-size:13px;
      font-weight:800;
      transition:.16s ease;
    }
    .action-btn.primary {
      background:linear-gradient(135deg,var(--brand),#1d4ed8);
      color:#fff;
      box-shadow:0 14px 28px rgba(37,99,235,.22);
    }
    .action-btn.secondary {
      background:#fff;
      border-color:var(--border);
      color:var(--text);
    }
    .action-btn:hover { transform:translateY(-1px); }
    .hero-stats {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(180px,1fr));
      gap:14px;
    }
    .stat-card {
      padding:18px;
      border-radius:18px;
      background:rgba(255,255,255,.86);
      border:1px solid rgba(231,235,240,.96);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
    }
    .stat-label {
      color:var(--subtle);
      font-size:12px;
      font-weight:700;
      margin-bottom:8px;
    }
    .stat-value {
      font-size:27px;
      font-weight:800;
      letter-spacing:-.04em;
      margin-bottom:5px;
    }
    .stat-value small {
      margin-left:4px;
      font-size:14px;
      font-weight:700;
      color:var(--muted);
    }
    .stat-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .layout {
      display:grid;
      grid-template-columns:1fr;
      gap:22px;
      align-items:start;
    }
    .section-tabs {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:-2px;
    }
    .section-tab {
      display:inline-flex;
      align-items:center;
      gap:8px;
      height:40px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid var(--border);
      background:rgba(255,255,255,.82);
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      transition:.16s ease;
    }
    .section-tab:hover {
      border-color:var(--border-strong);
      background:#fff;
      color:var(--text);
    }
    .section-tab.is-active {
      color:var(--brand);
      border-color:rgba(37,99,235,.24);
      background:var(--brand-bg);
      box-shadow:inset 0 0 0 1px rgba(37,99,235,.08);
    }
    .section-tab .material-icons-round {
      font-size:16px;
    }
    [data-detail-panel][hidden] { display:none; }
    .main-col,
    .side-col {
      display:grid;
      gap:22px;
    }
    .section {
      padding:24px;
    }
    .section-head {
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-start;
      margin-bottom:20px;
    }
    .section-kicker {
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:8px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .section-title {
      font-size:22px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:6px;
    }
    .section-desc {
      color:var(--muted);
      line-height:1.6;
      font-size:14px;
    }
    .section-link {
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:var(--brand);
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .usage-grid {
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:18px;
    }
    .usage-card {
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-soft);
      padding:20px;
    }
    .usage-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:14px;
    }
    .usage-name {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .usage-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      margin-top:4px;
    }
    .usage-value {
      font-size:28px;
      font-weight:800;
      letter-spacing:-.04em;
      text-align:right;
    }
    .usage-track {
      height:14px;
      border-radius:999px;
      background:#e8edf5;
      overflow:hidden;
      margin-bottom:12px;
    }
    .usage-fill {
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,var(--brand),var(--accent));
    }
    .usage-legend {
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .mini-stats {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
      margin-top:16px;
    }
    .mini-stat {
      padding:14px;
      border-radius:16px;
      background:#fff;
      border:1px solid var(--border);
    }
    .mini-stat-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      margin-bottom:6px;
    }
    .mini-stat-value {
      font-size:18px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:4px;
    }
    .mini-stat-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .trend-chart {
      display:flex;
      align-items:flex-end;
      gap:8px;
      height:162px;
      padding:14px 6px 6px;
    }
    .trend-bar-wrap {
      flex:1;
      min-width:0;
      display:grid;
      justify-items:center;
      gap:8px;
    }
    .trend-bar {
      width:100%;
      max-width:34px;
      border-radius:14px 14px 10px 10px;
      background:linear-gradient(180deg, rgba(37,99,235,.28), rgba(6,182,212,.88));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
    }
    .trend-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:700;
    }
    .trend-summary {
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:14px;
      padding-top:14px;
      border-top:1px dashed var(--border-strong);
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .section-card-spacer {
      margin-top:18px;
    }
    .peak-grid {
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:12px;
    }
    .peak-card {
      padding:14px;
      border-radius:16px;
      background:#fff;
      border:1px solid var(--border);
    }
    .peak-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      margin-bottom:6px;
    }
    .peak-value {
      font-size:20px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:4px;
    }
    .peak-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .project-list,
    .event-list,
    .kv-list,
    .checkpoint-list,
    .member-list,
    .snapshot-list {
      display:grid;
      gap:12px;
    }
    .project-card,
    .event-row,
    .checkpoint-row,
    .member-row,
    .snapshot-row {
      display:grid;
      gap:12px;
      padding:16px 18px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-soft);
    }
    .project-card {
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
    }
    .project-main {
      min-width:0;
      display:grid;
      gap:7px;
    }
    .project-top {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }
    .project-name {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .project-meta,
    .event-meta,
    .checkpoint-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .project-tags {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .tag {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--border);
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .project-side {

      background:#fff;
      color:var(--muted);

      line-height:1.6;

      align-items:center;
      justify-content:space-between;
      gap:12px;

    .secret-value {
      min-width:0;
      max-width:100%;

    .secret-actions {
      display:flex;
      align-items:center;
      gap:8px;
      flex-shrink:0;
    }

      border-radius:10px;

      align-items:center;
      justify-content:center;
      background:#eef4ff;
      color:var(--brand);

      background:#dbeafe;
      transform:translateY(-1px);

      background:#dcfce7;
      color:#15803d;
    }

      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      display:inline-flex;
      align-items:center;
      gap:6px;
      width:max-content;

      gap:10px;
      margin-top:14px;

    .snapshot-title {

      line-height:1.5;

      function buildQuery(params) {
        const searchParams = new URLSearchParams();
        Object.entries(params || {}).forEach(([key, value]) => {
          if (value === undefined || value === null || value === "") {
            return;
          }
          searchParams.set(key, String(value));
        });
        const query = searchParams.toString();
        return query ? `?${query}` : "";
      }

      async function requestJson(path, options) {
        const response = await fetch(`${API_BASE}${path}`, {
          credentials: "same-origin",
          headers: {
            Accept: "application/json"
          },
          ...(options || {})
        });

        if (!response.ok) {
          let message = `${response.status} ${response.statusText}`;
          try {
            const payload = await response.json();
            const apiMessage = payload?.message || payload?.error?.message || payload?.error || payload?.code;
            if (apiMessage) {
              message = `${response.status} ${apiMessage}`;
            }
          } catch {
            try {
              const text = await response.text();
              if (text) {
                message = `${response.status} ${text}`;
              }
            } catch {
              // ignore body parsing failure
            }
          }

          const error = new Error(message);
          error.status = response.status;
          throw error;
        }

        return response.json();
      }

      async function fetchJson(path, params) {
        return requestJson(`${path}${buildQuery(params)}`);
      }

      function extractData(payload, fallback) {
        if (payload && typeof payload === "object" && "data" in payload) {
          return payload.data;
        }
        return payload ?? fallback;
      }

      function extractItems(payload) {
        const direct = payload && Array.isArray(payload.items) ? payload.items : null;
        if (direct) {
          return direct;
        }
        const nested = payload && payload.data && Array.isArray(payload.data.items) ? payload.data.items : null;
        return nested || [];
      }

      function formatNumber(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount)) {
          return "-";
        }
        return new Intl.NumberFormat("ko-KR").format(amount);
      }

      function formatBytes(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount) || amount <= 0) {
          return "0B";
        }

        const units = ["B", "KB", "MB", "GB", "TB", "PB"];
        let displayValue = amount;
        let unitIndex = 0;

        while (displayValue >= 1024 && unitIndex < units.length - 1) {
          displayValue /= 1024;
          unitIndex += 1;
        }

        const digits = displayValue >= 10 || unitIndex === 0 ? 0 : 1;
        return `${displayValue.toFixed(digits)} ${units[unitIndex]}`;
      }

      function formatDateTime(value) {
        if (!value) {
          return "N/A";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "N/A";
        }

        return new Intl.DateTimeFormat("ko-KR", {
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        }).format(date);
      }

      function formatRelativeTime(value) {
        if (!value) {
          return "최근";
        }

        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return "최근";
        }

        const diffMs = Date.now() - date.getTime();
        const diffMinutes = Math.max(0, Math.floor(diffMs / 60000));

        if (diffMinutes < 1) return "방금 전";
        if (diffMinutes < 60) return `${diffMinutes}분 전`;

        const diffHours = Math.floor(diffMinutes / 60);
        if (diffHours < 24) return `${diffHours}시간 전`;

        const diffDays = Math.floor(diffHours / 24);
        return `${Math.max(diffDays, 1)}일 전`;
      }

      function normalizeText(value, fallback = "-") {
        const normalized = String(value ?? "").trim();
        return normalized || fallback;
      }

      function normalizeInlineText(value) {
        return String(value ?? "").trim().replace(/\s+/g, " ");
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function maskSecret(value) {
        const normalized = normalizeInlineText(value);
        if (!normalized) {
          return "N/A";
        }

        return "•".repeat(Math.max(8, Math.min(normalized.length, 16)));
      }

      function formatCompactBytes(value) {
        const amount = Number(value);
        if (!Number.isFinite(amount) || amount <= 0) {
          return { value: "0", suffix: "B" };
        }

        const units = ["B", "KB", "MB", "GB", "TB", "PB"];
        let displayValue = amount;
        let unitIndex = 0;

        while (displayValue >= 1024 && unitIndex < units.length - 1) {
          displayValue /= 1024;
          unitIndex += 1;
        }

        const digits = displayValue >= 100 || unitIndex === 0 ? 0 : 1;
        return {
          value: displayValue.toFixed(digits),
          suffix: units[unitIndex]
        };
      }

      function formatQuotaMeta(usedBytes, quotaBytes) {
        const quotaLabel = formatBytes(quotaBytes);
        if (!quotaBytes || quotaBytes <= 0) {
          return `${quotaLabel} quota`;
        }

        const percent = Math.max(0, Math.min(100, (Number(usedBytes || 0) / quotaBytes) * 100));
        return `${quotaLabel} quota 중 ${percent.toFixed(1)}%`;
      }

      function formatQuotaMetaFromLabels(quotaLabel, usagePercent) {
        const normalizedQuota = normalizeInlineText(quotaLabel);
        if (!normalizedQuota) {
          return "N/A quota";

        if (!Number.isFinite(usagePercent)) {
          return `${normalizedQuota} quota`;

        return `${normalizedQuota} quota 중 ${usagePercent.toFixed(1)}%`;

        const normalized = normalizeInlineText(label);

        if (match) {
          return {

            suffix: match[2]
          };
        }

        return formatCompactBytes(fallbackBytes);

      function buildParticipantMembers(detail) {
        const owner = detail?.owner || null;

          if (ownerKey) {

          members.push({

            usage: `계정 ${normalizeText(owner?.userId || owner?.sub, "N/A")}`,

          });
        }

        (Array.isArray(detail?.collaborators) ? detail.collaborators : []).forEach((member) => {
          const memberKey = member?.sub || member?.email || member?.userId;
          if (!memberKey || seen.has(memberKey)) {
            return;
          }

          seen.add(memberKey);
          members.push({
            name: getUserDisplayName(member),
            role: "Author",
            pill: { label: "Author", tone: "healthy" },

            usage: `계정 ${normalizeText(member?.userId || member?.sub, "N/A")}`,

      }

      function buildMemberMeta(members) {
        const items = Array.isArray(members) ? members : [];
        if (!items.length) {
          return "single node";
        }

        const primaryCount = items.filter(item => /primary|master/i.test(String(item.role || item.pill?.label || ""))).length;
        const replicaCount = items.filter(item => /replica|secondary/i.test(String(item.role || item.pill?.label || ""))).length;
        const otherCount = Math.max(0, items.length - primaryCount - replicaCount);
        const parts = [];

        if (primaryCount) parts.push(`primary ${primaryCount}`);
        if (replicaCount) parts.push(`replica ${replicaCount}`);
        if (otherCount) parts.push(`others ${otherCount}`);

        return parts.length ? parts.join(" · ") : `${items.length} nodes`;
      }

      function toTopology(detail) {
        const topology = detail?.runtime?.topology || {};
        const totalMembers = Number.isFinite(topology.totalMembers) ? topology.totalMembers : null;
        const primaryMembers = Number.isFinite(topology.primaryMembers) ? topology.primaryMembers : null;
        const replicaMembers = Number.isFinite(topology.replicaMembers) ? topology.replicaMembers : null;
        const runningMembers = Number.isFinite(topology.runningMembers) ? topology.runningMembers : null;

        return {
          totalMembers,
          primaryMembers,
          replicaMembers,
          runningMembers
        };
      }

      function buildTopologyMeta(topology) {
        const parts = [];

        if (Number.isFinite(topology.primaryMembers) && topology.primaryMembers > 0) {
          parts.push(`primary ${topology.primaryMembers}`);
        }
        if (Number.isFinite(topology.replicaMembers) && topology.replicaMembers > 0) {
          parts.push(`replica ${topology.replicaMembers}`);
        }
        if (Number.isFinite(topology.runningMembers)) {
          parts.push(`running ${topology.runningMembers}`);
        }

        return parts.length ? parts.join(" · ") : "single node";
      }

      function buildConnectedMeta(projectBindings, consoleBindings) {
        const projectCount = projectBindings.length;
        const consoleCount = consoleBindings.length;
        const parts = [];

        if (projectCount > 0) parts.push(`project ${projectCount}`);
        if (consoleCount > 0) parts.push(`console ${consoleCount}`);

        return parts.length ? parts.join(" · ") : "연결된 리소스 없음";
      }

      function buildBackupMeta(backupLabel) {
        const normalizedBackup = String(backupLabel || "none").trim().toLowerCase();
        if (!normalizedBackup || normalizedBackup === "none") {
          return "자동 백업 정책이 설정되어 있지 않습니다.";
        }

        return `${normalizedBackup} 정책 기준으로 백업이 구성됩니다.`;
      }

      function pickLastAccessSource(projectBindings, consoleBindings) {
        const firstProject = projectBindings[0]?.name;
        const firstConsole = consoleBindings[0]?.name;

        if (firstProject) {
          return `${firstProject} · binding`;
        }
        if (firstConsole) {
          return `${firstConsole} · console`;
        }

        return "최근 갱신 기준";
      }

      function toStatusTone(detail) {
        const severity = String(detail?.health?.severity || "").toLowerCase();
        const status = String(detail?.status || "").toLowerCase();

        if (severity === "healthy" || status === "running") {
          return "healthy";
        }
        if (severity === "unknown" || status === "unknown" || status === "stopped") {
          return "warning";
        }
        return "danger";
      }

      function toStatusLabel(detail) {
        const status = String(detail?.status || "").trim();
        if (!status) {
          return "Unknown";
        }
        return status.charAt(0).toUpperCase() + status.slice(1);
      }

      function toEngineMeta(engine) {
        return DETAIL_THEME_BY_ENGINE[engine] || {
          bg: "#edf4ff",
          brand: "#2563eb",
          brandBg: "#cfe2ff",
          brandSoft: "rgba(37,99,235,.18)",
          accent: "#06b6d4",
          label: engine ? String(engine).toUpperCase() : "Database"
        };
      }

      function buildTrendBars(usagePercent) {
        const labels = ["Thu", "Fri", "Sat", "Sun", "Mon", "Tue", "Wed"];
        const base = Number.isFinite(usagePercent) ? usagePercent : 24;

        return labels.map((label, index) => ({
          label,
          value: Math.max(18, Math.min(96, Math.round(base * (0.72 + index * 0.05))))
        }));
      }

      function buildBindingsForDetail(bindings) {
        return (bindings || [])
          .filter(item => item.targetType === "project")
          .map(item => ({
            name: item.targetName,
            href: `workspace_project_detail.html?project=${encodeURIComponent(item.targetName)}`,

            deployment: "연결됨"

      function buildConsoleBindings(bindings) {
        return (bindings || [])
          .filter(item => item.targetType === "console")
          .map(item => ({
            id: item.targetId,
            name: item.targetName,
            meta: item.description || "이 데이터베이스와 연결된 콘솔입니다.",
            typeLabel: "Console",
            status: "unknown",
            statusLabel: "Connected",
            statusTone: "warning",
            openUrl: null,
            canOpen: false,
            canStart: false
          }));
      }

      function toConsoleStatusTone(item) {
        const severity = String(item?.health?.severity || "").toLowerCase();
        const status = String(item?.status || "").toLowerCase();

        if (severity === "healthy" || status === "running") {
          return "healthy";
        }
        if (status === "starting" || status === "stopping" || severity === "warning" || status === "unknown") {
          return "warning";
        }
        return "danger";
      }

      async function resolveConsoleDetails(bindings) {
        const consoleBindings = (bindings || []).filter(item => item.targetType === "console" && item.targetId);
        if (!consoleBindings.length) {
          return [];
        }

        const results = await Promise.all(consoleBindings.map(async (item) => {
          try {
            const payload = await fetchJson(`/consoles/${encodeURIComponent(item.targetId)}`);
            const detail = extractData(payload, null);

            if (!detail) {
              return {
                id: item.targetId,
                name: item.targetName,
                meta: item.description || "이 데이터베이스와 연결된 콘솔입니다.",
                typeLabel: "Console",
                status: "unknown",
                statusLabel: "Unknown",
                openUrl: null,
                canOpen: false,
                canStart: false,
                canStop: false,
                health: { severity: "unknown" }
              };
            }

            return {
              id: detail.id || item.targetId,
              name: detail.name || item.targetName,
              meta: detail.summary || item.description || "이 데이터베이스와 연결된 콘솔입니다.",
              typeLabel: detail.typeLabel || "Console",
              status: detail.status || "unknown",
              statusLabel: detail.statusLabel || "Unknown",
              openUrl: detail.openUrl || null,
              canOpen: Boolean(detail.capabilities?.canOpen || detail.status === "running"),
              canStart: Boolean(detail.capabilities?.canStart || detail.status === "stopped"),
              canStop: Boolean(detail.capabilities?.canStop || detail.status === "running"),
              health: detail.health || null
            };
          } catch (error) {
            return {
              id: item.targetId,
              name: item.targetName,
              meta: item.description || "이 데이터베이스와 연결된 콘솔입니다.",
              typeLabel: "Console",
              status: "unknown",
              statusLabel: "Unknown",
              openUrl: null,
              canOpen: false,
              canStart: false,
              canStop: false,
              health: { severity: "unknown" }
            };
          }
        }));

        return results;
      }

      async function resolveApiDatabaseDetail(requestedId) {
        if (!requestedId) {
          return null;
        }

        const normalizedRequest = String(requestedId).trim().toLowerCase();
        if (!normalizedRequest) {
          return null;
        }

        try {
          const listPayload = await fetchJson("/databases", { q: requestedId, limit: 100 });
          const items = extractItems(listPayload);
          const matched = items.find(item => String(item?.name || "").trim().toLowerCase() === normalizedRequest)
            || items.find(item => String(item?.id || "").trim() === requestedId);

          if (matched?.id) {
            const detailPayload = await fetchJson(`/databases/${encodeURIComponent(matched.id)}`);
            return extractData(detailPayload, null);
          }

          const detailPayload = await fetchJson(`/databases/${encodeURIComponent(requestedId)}`);
          return extractData(detailPayload, null);
        } catch (error) {
          console.error("[database_detail] failed to fetch database detail", error);
          return null;
        }
      }

      const setConsoleStatusMarkup = (node, icon, text = "") => {
        if (!node) {
          return;

        node.innerHTML = `<span class="material-icons-round" aria-label="${text || ""}">${icon}</span>${text ? ` ${text}` : ""}`;
      };

        consoleModeButtons.forEach((button) => {
          button.disabled = false;
          button.dataset.consolePreviewOnly = disabled ? "true" : "false";
        });
      };

      const setConsoleModeConsoleId = (consoleId) => {
        consoleModeButtons.forEach((button) => {
          button.dataset.openConsoleId = consoleId || "";
        });
      };

      const setConsoleTerminalConnected = (connected) => {
        if (consoleTerminalEl) {
          consoleTerminalEl.textContent = renderConsoleTerminal(selectedConsoleMode, connected);
        }
      };

      const setConsolePrimaryButton = (consoleId, {
        action = "start",
        icon = "play_arrow",
        label = "Run",
        disabled = false
      } = {}) => {
        if (!consoleId) {
          return;

        document.querySelectorAll(`[data-console-primary-action="${consoleId}"]`).forEach((button) => {
          button.disabled = disabled;
          button.dataset.startConsoleId = action === "start" ? consoleId : "";
          button.dataset.stopConsoleId = action === "stop" ? consoleId : "";
          button.innerHTML = `<span class="material-icons-round">${icon}</span>${label}`;
        });
      };

      const setConsoleBindingAction = (consoleId, {
        action = "disabled",
        label = "열기 불가",
        disabled = false
      } = {}) => {
        if (!consoleId) {
          return;
        }

        document.querySelectorAll(`[data-console-binding-action="${consoleId}"]`).forEach((button) => {
          button.disabled = disabled || action === "disabled";
          button.dataset.openConsoleId = action === "open" ? consoleId : "";
          button.dataset.startConsoleId = action === "start" ? consoleId : "";
          button.dataset.stopConsoleId = action === "stop" ? consoleId : "";
          button.innerHTML = `${label}<span class="material-icons-round">chevron_right</span>`;
        });
      };

      const applyConsoleRunningState = (consoleId, statusNode, statusLabel = "사용 가능") => {
        setConsoleOpenStatus(consoleId, "check_circle", statusLabel);
        setConsoleStatusMarkup(statusNode, "check_circle", statusLabel);
        setConsolePrimaryButton(consoleId, {
          action: "stop",
          icon: "stop_circle",
          label: "Stop",
          disabled: false
        });
        setConsoleBindingAction(consoleId, {
          action: "open",
          label: "바로 열기",
          disabled: false
        });
        setConsoleModeConsoleId(consoleId);
        setConsoleModeDisabled(false);
        setConsoleTerminalConnected(true);
        setConsoleLiveNote("현재 콘솔을 사용할 수 있습니다. 필요하면 Stop으로 중지할 수 있습니다.");
      };

      const applyConsoleStoppedState = (consoleId, statusNode, statusLabel = "중지") => {
        setConsoleOpenStatus(consoleId, "pause_circle", statusLabel);
        setConsoleStatusMarkup(statusNode, "pause_circle", statusLabel);
        setConsolePrimaryButton(consoleId, {
          action: "start",
          icon: "play_arrow",
          label: "Run",
          disabled: false
        });
        setConsoleBindingAction(consoleId, {
          action: "start",
          label: "Run",
          disabled: false
        });
        setConsoleModeConsoleId("");
        setConsoleModeDisabled(true);
        setConsoleTerminalConnected(false);
        setConsoleLiveNote("현재 콘솔이 중지되어 있습니다. Run으로 기동한 뒤 Bash 또는 DB CLI로 바로 들어갈 수 있습니다.");
      };

      const setConsoleStartButtonsState = (consoleId, {
        disabled = true,
        icon = "schedule",
        label = "시작 중"
      } = {}) => {
        if (!consoleId) {
          return;
        }

        document.querySelectorAll(`[data-start-console-id="${consoleId}"]`).forEach((button) => {
          button.disabled = disabled;
          button.innerHTML = `<span class="material-icons-round">${icon}</span>${label}`;
        });
      };

      const setConsoleStopButtonsState = (consoleId, {
        disabled = true,
        icon = "schedule",
        label = "중지 중"
      } = {}) => {
        if (!consoleId) {
          return;
        }

        document.querySelectorAll(`[data-stop-console-id="${consoleId}"]`).forEach((button) => {
          button.disabled = disabled;
          button.innerHTML = `<span class="material-icons-round">${icon}</span>${label}`;
        });
      };

      const wait = (ms) => new Promise((resolve) => {
        window.setTimeout(resolve, ms);
      });

      const pollConsoleUntilReady = async (consoleId, statusNode) => {
        if (!consoleId) {
          return;
        }

        const maxAttempts = 30;
        const intervalMs = 2000;

        for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
          try {
            const payload = await fetchJson(`/consoles/${encodeURIComponent(consoleId)}`);
            const detail = extractData(payload, null);
            const status = String(detail?.status || "").toLowerCase();
            const statusLabel = detail?.statusLabel || "Unknown";
            const canOpen = Boolean(detail?.capabilities?.canOpen || status === "running");

            if (canOpen) {
              applyConsoleRunningState(consoleId, statusNode, "사용 가능");
              return;
            }

            if (status === "error") {
              setConsoleOpenStatus(consoleId, "error", statusLabel);
              setConsoleStatusMarkup(statusNode, "error", statusLabel);
              setConsoleStartButtonsState(consoleId, {
                disabled: false,
                icon: "play_arrow",
                label: "Run"
              });
              setConsoleModeDisabled(false);
              setConsoleLiveNote("콘솔 시작 중 오류가 발생했습니다.");
              return;
            }

            setConsoleOpenStatus(consoleId, "schedule", statusLabel);
            setConsoleStatusMarkup(statusNode, "schedule", statusLabel);
          } catch {
            // ignore transient polling failures
          }

          await wait(intervalMs);
        }

        setConsoleOpenStatus(consoleId, "schedule", "준비 중");
        setConsoleStatusMarkup(statusNode, "schedule", "준비 중");
        setConsoleStartButtonsState(consoleId, {
          disabled: false,
          icon: "refresh",
          label: "다시 시도"
        });
        setConsoleModeDisabled(false);
        setConsoleLiveNote("콘솔 준비 확인이 지연되고 있습니다. 잠시 후 다시 확인해 주세요.");
      };

      const pollConsoleUntilStopped = async (consoleId, statusNode) => {
        if (!consoleId) {
          return;
        }

        const maxAttempts = 30;
        const intervalMs = 2000;

        for (let attempt = 0; attempt < maxAttempts; attempt += 1) {
          try {
            const payload = await fetchJson(`/consoles/${encodeURIComponent(consoleId)}`);
            const detail = extractData(payload, null);
            const status = String(detail?.status || "").toLowerCase();
            const statusLabel = detail?.statusLabel || "Unknown";

            if (status === "stopped") {
              applyConsoleStoppedState(consoleId, statusNode, "중지");
              return;
            }

            if (status === "error") {
              setConsoleOpenStatus(consoleId, "error", statusLabel);
              setConsoleStatusMarkup(statusNode, "error", statusLabel);
              setConsoleStopButtonsState(consoleId, {
                disabled: false,
                icon: "stop_circle",
                label: "Stop"
              });
              setConsoleLiveNote("콘솔 중지 중 오류가 발생했습니다.");
              return;
            }

            setConsoleOpenStatus(consoleId, "schedule", statusLabel);
            setConsoleStatusMarkup(statusNode, "schedule", statusLabel);
          } catch {
            // ignore transient polling failures
          }

          await wait(intervalMs);
        }

        setConsoleOpenStatus(consoleId, "schedule", "중지 중");
        setConsoleStatusMarkup(statusNode, "schedule", "중지 중");
        setConsoleStopButtonsState(consoleId, {
          disabled: false,
          icon: "stop_circle",
          label: "Stop"
        });
        setConsoleLiveNote("콘솔 중지 확인이 지연되고 있습니다. 잠시 후 다시 확인해 주세요.");
      };

      const openConsoleInNewTab = async (consoleId, statusNode) => {
        if (!consoleId) {
          return;
        }

        setConsoleStatusMarkup(statusNode, "progress_activity", "Opening");

        try {
          const payload = await requestJson(`/consoles/${encodeURIComponent(consoleId)}/open`, {
            method: "POST"
          });
          const result = extractData(payload, payload);
          const targetUrl = result?.url;

          if (!targetUrl) {
            throw new Error("Console open URL is missing");
          }

          window.open(targetUrl, "_blank", "noopener");
          setConsoleStatusMarkup(statusNode, "check_circle", "Opened");
          if (consoleConnectStatusEl && statusNode === consoleConnectStatusEl) {
            setConsoleLiveNote("새 탭에서 콘솔을 열었습니다.");
          }
        } catch (error) {
          const rawMessage = String(error?.message || "Open failed").replace(/^\d+\s*/, "").trim();
          const shortMessage = rawMessage.length > 42 ? `${rawMessage.slice(0, 42)}...` : rawMessage;
          setConsoleStatusMarkup(statusNode, "error", shortMessage || "Open failed");
          if (consoleConnectStatusEl && statusNode === consoleConnectStatusEl) {
            setConsoleLiveNote(shortMessage || "Open failed");
          }
        }
      };

      const startConsoleRuntime = async (consoleId, button, statusNode) => {
        if (!consoleId) {
          return;
        }

        const originalHtml = button ? button.innerHTML : "";
        if (button) {
          button.disabled = true;
          button.innerHTML = '<span class="material-icons-round">progress_activity</span>시작 중';
        }
        setConsoleOpenStatus(consoleId, "progress_activity", "시작 중");
        setConsoleStatusMarkup(statusNode, "progress_activity", "시작 중");
        setConsoleStartButtonsState(consoleId, {
          disabled: true,
          icon: "progress_activity",
          label: "시작 중"
        });
        setConsoleModeDisabled(true);
        setConsoleLiveNote("시작 요청을 보냈습니다. 콘솔이 준비되면 Bash 또는 DB CLI로 열 수 있습니다.");

        try {
          await requestJson(`/consoles/${encodeURIComponent(consoleId)}/start`, {
            method: "POST"
          });
          setConsoleOpenStatus(consoleId, "schedule", "시작 중");
          setConsoleStatusMarkup(statusNode, "schedule", "시작 중");
          setConsoleStartButtonsState(consoleId, {
            disabled: true,
            icon: "schedule",
            label: "시작 중"
          });
          await pollConsoleUntilReady(consoleId, statusNode);
        } catch (error) {
          const rawMessage = String(error?.message || "Start failed").replace(/^\d+\s*/, "").trim();
          const shortMessage = rawMessage.length > 42 ? `${rawMessage.slice(0, 42)}...` : rawMessage;
          setConsoleOpenStatus(consoleId, "error", shortMessage || "Start failed");
          setConsoleStatusMarkup(statusNode, "error", shortMessage || "Start failed");
          setConsoleStartButtonsState(consoleId, {
            disabled: false,
            icon: "play_arrow",
            label: "Run"
          });
          if (button) {
            button.disabled = false;
            button.innerHTML = originalHtml;
          }
          setConsoleModeDisabled(false);
          setConsoleLiveNote(shortMessage || "Start failed");
        }
      };

      const stopConsoleRuntime = async (consoleId, button, statusNode) => {
        if (!consoleId) {
          return;
        }

        if (button) {
          button.disabled = true;
          button.innerHTML = '<span class="material-icons-round">progress_activity</span>중지 중';
        }

        setConsoleOpenStatus(consoleId, "progress_activity", "중지 중");
        setConsoleStatusMarkup(statusNode, "progress_activity", "중지 중");
        setConsoleStopButtonsState(consoleId, {
          disabled: true,
          icon: "progress_activity",
          label: "중지 중"
        });
        setConsoleModeDisabled(true);
        setConsoleLiveNote("중지 요청을 보냈습니다. 콘솔 중지 여부를 확인하는 중입니다.");

        try {
          await requestJson(`/consoles/${encodeURIComponent(consoleId)}/stop`, {
            method: "POST"
          });
          setConsoleOpenStatus(consoleId, "schedule", "중지 중");
          setConsoleStatusMarkup(statusNode, "schedule", "중지 중");
          setConsoleStopButtonsState(consoleId, {
            disabled: true,
            icon: "schedule",
            label: "중지 중"
          });
          await pollConsoleUntilStopped(consoleId, statusNode);
        } catch (error) {
          const rawMessage = String(error?.message || "Stop failed").replace(/^\d+\s*/, "").trim();
          const shortMessage = rawMessage.length > 42 ? `${rawMessage.slice(0, 42)}...` : rawMessage;
          setConsoleOpenStatus(consoleId, "error", shortMessage || "Stop failed");
          setConsoleStatusMarkup(statusNode, "error", shortMessage || "Stop failed");
          setConsoleStopButtonsState(consoleId, {
            disabled: false,
            icon: "stop_circle",
            label: "Stop"
          });
          setConsoleModeDisabled(false);
          setConsoleLiveNote(shortMessage || "Stop failed");
        }
      };

      if (consoleModeButtons.length && consoleTerminalEl) {
        consoleModeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            selectedConsoleMode = button.dataset.consoleMode || "dbcli";
            consoleModeButtons.forEach((item) => item.classList.toggle("active", item === button));
            const consoleId = button.dataset.openConsoleId;
            const connected = Boolean(consoleId);
            consoleTerminalEl.textContent = renderConsoleTerminal(selectedConsoleMode, connected);

            if (!consoleId && consoleConnectStatusEl && !consoleConnectStatusEl.dataset.consoleOpenStatus) {
              setConsoleStatusMarkup(consoleConnectStatusEl, "check_circle", selectedConsoleMode === "bash" ? "Bash 연결됨" : "DB CLI 연결됨");
            }
            if (consoleId) {
              setConsoleLiveNote(selectedConsoleMode === "bash"
                ? "Bash 프리뷰를 보고 있습니다. 실제 콘솔 열기는 아래 연결 카드에서 할 수 있습니다."
                : "DB CLI 프리뷰를 보고 있습니다. 실제 콘솔 열기는 아래 연결 카드에서 할 수 있습니다.");
            } else {
              setConsoleLiveNote(selectedConsoleMode === "bash"
                ? "Bash 예제 프리뷰를 보고 있습니다. 콘솔이 준비되면 실제로 열 수 있습니다."
                : "DB CLI 예제 프리뷰를 보고 있습니다. 콘솔이 준비되면 실제로 열 수 있습니다.");
            }
          });
        });
      }

      if (snapshotListEl && manualSnapshotButton) {
        manualSnapshotButton.addEventListener("click", () => {
          const now = new Date();
          const pad = (value) => String(value).padStart(2, "0");
          const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
          const createdAt = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())} KST`;
          const expiresAt = new Date(now);
          expiresAt.setDate(expiresAt.getDate() + 3);

          db.snapshots.recent.unshift({
            name: `manual-${stamp}`,
            cycle: "Manual",
            pill: { label: "Creating", tone: "warning" },
            meta: `${createdAt} 생성 요청 · 수동 스냅샷`,
            extraLeft: "보관 72시간",
            extraRight: `${pad(expiresAt.getMonth() + 1)}월 ${pad(expiresAt.getDate())}일 만료 예정`
          });

          db.snapshots.recent = db.snapshots.recent.slice(0, 10);

          snapshotListEl.innerHTML = renderSnapshots();
          if (snapshotRotationCountEl) {
            snapshotRotationCountEl.textContent = `${Math.min(db.snapshots.recent.length, 10)} / 10`;
          }
        });
      }

      const copyText = async (text) => {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }

        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.setAttribute("readonly", "true");
        textarea.style.position = "absolute";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
      };

      if (secretToggleButtons.length) {
        secretToggleButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const row = button.closest("[data-secret-row]");
            const valueNode = row?.querySelector("[data-secret-value]");
            if (!valueNode) {
              return;
            }

            const nextVisible = valueNode.dataset.secretVisibleState !== "true";
            valueNode.dataset.secretVisibleState = String(nextVisible);
            valueNode.textContent = nextVisible ? valueNode.dataset.secretVisible || "" : valueNode.dataset.secretHidden || "";
            valueNode.classList.toggle("masked", !nextVisible);
            button.setAttribute("aria-label", nextVisible ? "패스워드 숨기기" : "패스워드 보기");
            const icon = button.querySelector(".material-icons-round");
            if (icon) {
              icon.textContent = nextVisible ? "visibility_off" : "visibility";
            }
          });
        });
      }

      if (secretCopyButtons.length) {
        secretCopyButtons.forEach((button) => {
          button.addEventListener("click", async () => {
            const row = button.closest("[data-secret-row]");
            const valueNode = row?.querySelector("[data-secret-value]");
            const rawSecret = valueNode?.dataset.secretVisible || "";
            if (!rawSecret) {
              return;
            }

            try {
              await copyText(rawSecret);
              button.classList.add("is-copied");
              const icon = button.querySelector(".material-icons-round");
              if (icon) {
                icon.textContent = "check";
              }

              window.setTimeout(() => {
                button.classList.remove("is-copied");
                const resetIcon = button.querySelector(".material-icons-round");
                if (resetIcon) {
                  resetIcon.textContent = "content_copy";
                }
              }, 1200);
            } catch (error) {
              console.error("[database_detail] failed to copy password", error);
            }
          });
        });
      }

      const setConsoleOpenStatus = (consoleId, icon, text = "") => {
        document.querySelectorAll(`[data-console-open-status="${consoleId}"]`).forEach((node) => {
          node.innerHTML = `<span class="material-icons-round" aria-label="${text || ""}">${icon}</span>${text ? ` ${text}` : ""}`;
        });
      };

      document.addEventListener("click", async (event) => {
        const primaryButton = event.target.closest("[data-console-primary-action]");
        if (primaryButton) {
          const startConsoleId = primaryButton.dataset.startConsoleId;
          const stopConsoleId = primaryButton.dataset.stopConsoleId;

          if (startConsoleId) {
            await startConsoleRuntime(startConsoleId, primaryButton, consoleConnectStatusEl);
          } else if (stopConsoleId) {
            await stopConsoleRuntime(stopConsoleId, primaryButton, consoleConnectStatusEl);
          }
          return;
        }

        const bindingButton = event.target.closest("[data-console-binding-action]");
        if (!bindingButton) {
          return;
        }

        const statusNode = bindingButton
          .closest(".console-binding-side")
          ?.querySelector("[data-console-open-status]");
        const consoleId = bindingButton.dataset.openConsoleId;
        const startConsoleId = bindingButton.dataset.startConsoleId;
        const stopConsoleId = bindingButton.dataset.stopConsoleId;

        if (startConsoleId) {
          await startConsoleRuntime(startConsoleId, bindingButton, statusNode || consoleConnectStatusEl);
          return;
        }

        if (stopConsoleId) {
          await stopConsoleRuntime(stopConsoleId, bindingButton, statusNode || consoleConnectStatusEl);
          return;
        }

        if (!consoleId) {
          return;
        }

        bindingButton.disabled = true;
        setConsoleOpenStatus(consoleId, "progress_activity", "Opening");

        try {
          const payload = await requestJson(`/consoles/${encodeURIComponent(consoleId)}/open`, {
            method: "POST"
          });
          const result = extractData(payload, payload);
          const targetUrl = result?.url;

          if (!targetUrl) {
            throw new Error("Console open URL is missing");
          }

          window.open(targetUrl, "_blank", "noopener");
          setConsoleOpenStatus(consoleId, "check_circle", "Opened");
        } catch (error) {
          const rawMessage = String(error?.message || "Open failed").replace(/^\d+\s*/, "").trim();
          const shortMessage = rawMessage.length > 42 ? `${rawMessage.slice(0, 42)}...` : rawMessage;
          setConsoleOpenStatus(consoleId, "error", shortMessage || "Open failed");
        } finally {
          bindingButton.disabled = false;
        }
      });
    })();
  </script>
  <script src="ax_studio_topbar.js"></script>
</body>
</html>
