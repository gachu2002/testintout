<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Detail</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link rel="stylesheet" href="ax_studio_topbar.css" />
  <style>
    :root {
      --bg:#edf4ff;
      --surface:#ffffff;
      --surface-soft:#fbfcfe;
      --surface-deep:#0f172a;
      --border:#e7ebf0;
      --border-strong:#d5dbe4;
      --text:#202631;
      --muted:#5c6675;
      --subtle:#8a93a2;
      --good:#0f766e;
      --good-bg:#d9fbf1;
      --warn:#d97706;
      --warn-bg:#fff2d8;
      --danger:#b91c1c;
      --danger-bg:#fee2e2;
      --max:1360px;
      --nav-max:1520px;
      --radius:22px;
      --shadow:0 18px 40px rgba(15,23,42,.08);
      --shadow-soft:0 10px 24px rgba(15,23,42,.05);
      --brand:#2563eb;
      --brand-bg:#cfe2ff;
      --brand-soft:rgba(37,99,235,.18);
      --accent:#06b6d4;
      --border-2:#d5dbe4;
      --t1:#202631;
      --t2:#5c6675;
      --t3:#8a93a2;
      --purple:#7c5fcf;
    }

    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height:100vh;
      color:var(--text);
      background:
        radial-gradient(circle at top left, var(--brand-soft), transparent 28%),
        radial-gradient(circle at top right, rgba(6,182,212,.10), transparent 24%),
        linear-gradient(180deg, #f7f9fc 0%, var(--bg) 100%);
      -webkit-font-smoothing:antialiased;
    }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; cursor:pointer; }

    .topbar {
      position:sticky;
      top:0;
      z-index:200;
      height:56px;
      background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .topbar-inner {
      max-width:var(--nav-max);
      height:100%;
      margin:0 auto;
      padding:0 24px;
      display:flex;
      align-items:center;
      gap:12px;
      position:relative;
    }
    .topbar-brand {
      display:flex;
      align-items:center;
      gap:10px;
      flex-shrink:0;
      padding-right:2px;
    }
    .brand-mark {
      width:40px;
      height:24px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .brand-mark img { width:35px; height:20px; display:block; }
    .brand-name {
      font-size:15px;
      font-weight:800;
      letter-spacing:-.35px;
      white-space:nowrap;
    }
    .logo-menu {
      flex-shrink:0;
      display:flex;
      align-items:center;
    }
    .menu-trigger {
      display:flex;
      align-items:center;
      gap:8px;
      height:40px;
      padding:0 11px;
      border:1px solid var(--border);
      border-radius:12px;
      background:#fbfcfe;
      font-size:13px;
      font-weight:700;
      color:var(--t1);
      transition:background .15s, box-shadow .15s;
    }
    .menu-trigger:hover,
    .logo-menu.is-open .menu-trigger {
      background:var(--bg);
      box-shadow:inset 0 0 0 1px var(--border);
    }
    .menu-trigger .material-icons-round:first-child {
      font-size:18px;
      color:var(--t2);
    }
    .menu-caret {
      font-size:18px;
      color:var(--t3);
      transition:transform .18s ease, color .15s ease;
    }
    .logo-menu.is-open .menu-caret {
      transform:rotate(180deg);
      color:var(--brand);
    }
    .service-popover {
      position:fixed;
      left:0;
      top:56px;
      width:100vw;
      background:linear-gradient(180deg, rgba(247,248,251,.98) 0%, rgba(243,245,249,.98) 100%);
      border-top:1px solid rgba(235,237,240,.9);
      border-bottom:1px solid var(--border);
      box-shadow:0 18px 36px rgba(15,23,42,.08);
      padding:18px 0 20px;
      z-index:240;
    }
    .service-popover[hidden] { display:none; }
    .service-popover-inner {
      max-width:var(--nav-max);
      margin:0 auto;
      padding:0 24px;
    }
    .service-groups {
      display:grid;
      grid-template-columns:repeat(6, minmax(0, 1fr));
    }
    .service-group {
      min-width:0;
      padding:0 30px;
    }
    .service-group + .service-group { border-left:1px solid var(--border); }
    .service-group-title {
      font-size:15px;
      font-weight:700;
      margin-bottom:18px;
    }
    .service-links { display:grid; gap:18px; }
    .service-link {
      display:grid;
      grid-template-columns:18px minmax(0, 1fr);
      gap:10px;
      padding:7px 10px;
      margin:0 -10px;
      border-radius:10px;
      font-size:13px;
      font-weight:600;
      transition:background .15s ease, color .15s ease;
    }
    .service-link:hover {
      background:rgba(255,255,255,.84);
      color:var(--brand);
    }
    .service-link.is-current {
      background:rgba(255,255,255,.84);
      color:var(--brand);
      box-shadow:inset 0 0 0 1px rgba(37,99,235,.08);
    }
    .service-link-icon {
      font-size:17px;
      color:var(--t2);
      margin-top:2px;
    }
    .service-link:hover .service-link-icon,
    .service-link.is-current .service-link-icon { color:var(--brand); }
    .service-link-copy { display:grid; gap:4px; min-width:0; }
    .service-link-desc {
      font-size:12px;
      line-height:1.45;
      color:var(--t2);
      font-weight:400;
    }
    .service-link:hover .service-link-desc,
    .service-link.is-current .service-link-desc { color:var(--t1); }
    .service-outlinks {
      position:relative;
      left:50%;
      width:100vw;
      box-sizing:border-box;
      margin:16px 0 -20px;
      padding:9px max(24px, calc((100vw - var(--nav-max)) / 2 + 24px)) 10px;
      transform:translateX(-50%);
      border-top:1px solid rgba(15,23,42,.10);
      display:flex;
      align-items:center;
      justify-content:flex-start;
      flex-wrap:wrap;
      gap:10px;
      background:rgba(248,250,252,.72);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.72);
    }
    .service-outlinks-title {
      color:var(--t3);
      font-size:10px;
      font-weight:700;
      letter-spacing:.08em;
      text-transform:uppercase;
      opacity:.72;
    }
    .service-outlink-list {
      display:flex;
      align-items:center;
      justify-content:flex-start;
      flex-wrap:wrap;
      gap:0;
    }
    .service-outlink {
      min-width:0;
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:3px 8px;
      color:var(--t2);
      text-decoration:none;
      font-size:12px;
      font-weight:600;
      transition:color .15s ease;
    }
    .service-outlink + .service-outlink {
      border-left:1px solid var(--border);
    }
    .service-outlink:hover {
      color:var(--brand);
    }
    .service-outlink-icon,
    .service-outlink-arrow {
      color:currentColor;
      font-size:13px;
      opacity:.48;
      transition:opacity .15s ease;
    }
    .service-outlink:hover .service-outlink-icon,
    .service-outlink:hover .service-outlink-arrow {
      opacity:.8;
    }
    .service-outlink-copy {
      min-width:0;
      display:inline-flex;
      align-items:center;
    }
    .service-outlink-title {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .service-outlink-desc {
      display:none;
    }
    .search-wrap {
      flex:1;
      max-width:440px;
      min-width:0;
      position:relative;
    }
    .search-wrap .ico {
      position:absolute;
      left:13px;
      top:50%;
      transform:translateY(-50%);
      font-size:17px;
      color:var(--t3);
      pointer-events:none;
    }
    .search-input {
      width:100%;
      height:36px;
      border:1.5px solid var(--border);
      border-radius:20px;
      padding:0 72px 0 38px;
      background:var(--bg);
      outline:none;
      font-size:13px;
      color:var(--t1);
      transition:border .15s, box-shadow .15s;
    }
    .search-input:focus {
      border-color:var(--brand);
      background:var(--surface);
      box-shadow:0 0 0 3px rgba(37,99,235,.08);
    }
    .search-ai {
      position:absolute;
      right:12px;
      top:50%;
      transform:translateY(-50%);
      height:22px;
      padding:0 7px;
      border-radius:999px;
      display:flex;
      align-items:center;
      gap:3px;
      background:linear-gradient(135deg, #f6f0ff 0%, #eef4ff 100%);
      border:1px solid rgba(124,95,207,.18);
      font-size:10px;
      font-weight:700;
      color:var(--purple);
      letter-spacing:.02em;
      pointer-events:none;
    }
    .search-ai .material-icons-round { font-size:12px; }
    .tb-spacer { flex:1; }
    .tb-icon {
      width:34px;
      height:34px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--t2);
      position:relative;
    }
    .tb-icon:hover { background:var(--bg); }
    .tb-icon .material-icons-round { font-size:20px; }
    .tb-icon .dot {
      position:absolute;
      top:5px;
      right:5px;
      width:7px;
      height:7px;
      border-radius:50%;
      background:var(--brand);
      border:2px solid var(--surface);
    }
    .avatar {
      width:32px;
      height:32px;
      border-radius:50%;
      background:var(--brand);
      color:#fff;
      font-size:12px;
      font-weight:600;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .page {
      max-width:var(--max);
      margin:0 auto;
      padding:28px 24px 44px;
      display:grid;
      gap:22px;
    }
    .breadcrumbs {
      display:flex;
      align-items:center;
      gap:8px;
      flex-wrap:wrap;
      font-size:12px;
      color:var(--subtle);
    }
    .breadcrumbs a {
      color:var(--muted);
      font-weight:700;
    }
    .breadcrumbs .material-icons-round {
      font-size:15px;
      color:#bcc6d4;
    }
    .panel {
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow-soft);
    }
    .hero {
      overflow:hidden;
      position:relative;
      padding:28px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.96), rgba(248,251,255,.92)),
        linear-gradient(135deg, var(--brand-soft), rgba(6,182,212,.06));
    }
    .hero::after {
      content:"";
      position:absolute;
      right:-80px;
      top:-90px;
      width:280px;
      height:280px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(37,99,235,.12) 0%, rgba(37,99,235,0) 68%);
      pointer-events:none;
    }
    .hero-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:20px;
      margin-bottom:22px;
    }
    .eyebrow {
      display:inline-flex;
      align-items:center;
      gap:8px;
      margin-bottom:14px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .hero-title-row {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:12px;
      margin-bottom:12px;
    }
    .hero-title {
      font-size:34px;
      font-weight:800;
      letter-spacing:-.04em;
    }
    .pill {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      font-weight:800;
      border:1px solid transparent;
      white-space:nowrap;
    }
    .pill.status-healthy { color:var(--good); background:var(--good-bg); }
    .pill.status-warning { color:var(--warn); background:var(--warn-bg); }
    .pill.status-danger { color:var(--danger); background:var(--danger-bg); }
    .pill.engine { color:var(--brand); background:var(--brand-bg); }
    .hero-desc {
      max-width:760px;
      color:var(--muted);
      line-height:1.65;
      font-size:15px;
    }
    .hero-actions {
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:10px;
    }
    .action-btn {
      display:inline-flex;
      align-items:center;
      gap:8px;
      height:42px;
      padding:0 16px;
      border-radius:14px;
      border:1px solid transparent;
      font-size:13px;
      font-weight:800;
      transition:.16s ease;
    }
    .action-btn.primary {
      background:linear-gradient(135deg,var(--brand),#1d4ed8);
      color:#fff;
      box-shadow:0 14px 28px rgba(37,99,235,.22);
    }
    .action-btn.secondary {
      background:#fff;
      border-color:var(--border);
      color:var(--text);
    }
    .action-btn:hover { transform:translateY(-1px); }
    .hero-stats {
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:14px;
    }
    .stat-card {
      padding:18px;
      border-radius:18px;
      background:rgba(255,255,255,.86);
      border:1px solid rgba(231,235,240,.96);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.65);
    }
    .stat-label {
      color:var(--subtle);
      font-size:12px;
      font-weight:700;
      margin-bottom:8px;
    }
    .stat-value {
      font-size:27px;
      font-weight:800;
      letter-spacing:-.04em;
      margin-bottom:5px;
    }
    .stat-value small {
      margin-left:4px;
      font-size:14px;
      font-weight:700;
      color:var(--muted);
    }
    .stat-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .layout {
      display:grid;
      grid-template-columns:1fr;
      gap:22px;
      align-items:start;
    }
    .main-col,
    .side-col {
      display:grid;
      gap:22px;
    }
    .section {
      padding:24px;
    }
    .section-head {
      display:flex;
      justify-content:space-between;
      gap:16px;
      align-items:flex-start;
      margin-bottom:20px;
    }
    .section-kicker {
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin-bottom:8px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .section-title {
      font-size:22px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:6px;
    }
    .section-desc {
      color:var(--muted);
      line-height:1.6;
      font-size:14px;
    }
    .section-link {
      display:inline-flex;
      align-items:center;
      gap:6px;
      color:var(--brand);
      font-size:13px;
      font-weight:800;
      white-space:nowrap;
    }

    .usage-grid {
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:18px;
    }
    .usage-card {
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-soft);
      padding:20px;
    }
    .usage-head {
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:14px;
    }
    .usage-name {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .usage-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      margin-top:4px;
    }
    .usage-value {
      font-size:28px;
      font-weight:800;
      letter-spacing:-.04em;
      text-align:right;
    }
    .usage-track {
      height:14px;
      border-radius:999px;
      background:#e8edf5;
      overflow:hidden;
      margin-bottom:12px;
    }
    .usage-fill {
      height:100%;
      border-radius:inherit;
      background:linear-gradient(90deg,var(--brand),var(--accent));
    }
    .usage-legend {
      display:flex;
      justify-content:space-between;
      gap:12px;
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .mini-stats {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:12px;
      margin-top:16px;
    }
    .mini-stat {
      padding:14px;
      border-radius:16px;
      background:#fff;
      border:1px solid var(--border);
    }
    .mini-stat-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      margin-bottom:6px;
    }
    .mini-stat-value {
      font-size:18px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:4px;
    }
    .mini-stat-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .trend-chart {
      display:flex;
      align-items:flex-end;
      gap:8px;
      height:162px;
      padding:14px 6px 6px;
    }
    .trend-bar-wrap {
      flex:1;
      min-width:0;
      display:grid;
      justify-items:center;
      gap:8px;
    }
    .trend-bar {
      width:100%;
      max-width:34px;
      border-radius:14px 14px 10px 10px;
      background:linear-gradient(180deg, rgba(37,99,235,.28), rgba(6,182,212,.88));
      box-shadow:inset 0 1px 0 rgba(255,255,255,.45);
    }
    .trend-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:700;
    }
    .trend-summary {
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:14px;
      padding-top:14px;
      border-top:1px dashed var(--border-strong);
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }
    .section-card-spacer {
      margin-top:18px;
    }
    .peak-grid {
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:12px;
    }
    .peak-card {
      padding:14px;
      border-radius:16px;
      background:#fff;
      border:1px solid var(--border);
    }
    .peak-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.04em;
      text-transform:uppercase;
      margin-bottom:6px;
    }
    .peak-value {
      font-size:20px;
      font-weight:800;
      letter-spacing:-.03em;
      margin-bottom:4px;
    }
    .peak-meta {
      color:var(--muted);
      font-size:12px;
      line-height:1.5;
    }

    .project-list,
    .event-list,
    .kv-list,
    .checkpoint-list,
    .member-list,
    .snapshot-list {
      display:grid;
      gap:12px;
    }
    .project-card,
    .event-row,
    .checkpoint-row,
    .member-row,
    .snapshot-row {
      display:grid;
      gap:12px;
      padding:16px 18px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-soft);
    }
    .project-card {
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
    }
    .project-main {
      min-width:0;
      display:grid;
      gap:7px;
    }
    .project-top {
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      gap:10px;
    }
    .project-name {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .project-meta,
    .event-meta,
    .checkpoint-meta {
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }
    .project-tags {
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }
    .tag {
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
      border:1px solid var(--border);
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    .project-side {
      display:grid;
      gap:8px;
      justify-items:end;
      text-align:right;
    }
    .tiny-label {
      color:var(--subtle);
      font-size:11px;
      font-weight:800;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    .tiny-value {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .project-link {
      display:inline-flex;
      align-items:center;
      gap:5px;
      color:var(--brand);
      font-size:12px;
      font-weight:800;
    }
    .console-binding-card {
      grid-template-columns:minmax(0,1fr) auto;
      align-items:center;
    }
    .console-binding-side {
      display:grid;
      gap:8px;
      justify-items:end;
      text-align:right;
    }
    .console-binding-status {
      font-size:16px;
      font-weight:800;
      letter-spacing:-.02em;
    }
    .console-workbench {

        <main class="page">
          <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a href="portal_launchpad.html">Launchpad</a>
            <span class="material-icons-round" aria-hidden="true">chevron_right</span>
            <a href="workspace_database_hub.html">Database Hub</a>
            <span class="material-icons-round" aria-hidden="true">chevron_right</span>
            <span>${db.title}</span>
          </nav>

          <section class="panel hero">
            <div class="hero-top">
              <div>
                <div class="eyebrow"><span class="material-icons-round">database</span>${db.eyebrow}</div>
                <div class="hero-title-row">
                  <h1 class="hero-title">${db.title}</h1>
                  <span class="pill ${statusClassMap[db.statusTone] || "status-healthy"}">${db.statusLabel}</span>
                  <span class="pill engine">${db.engineLabel}</span>
                </div>
                <p class="hero-desc">${db.description}</p>
              </div>
              <div class="hero-actions">
                ${db.actions.map((action, index) => `
                  <a class="action-btn ${index === 0 ? "secondary" : "primary"}" href="${action.href}">
                    <span class="material-icons-round">${action.icon}</span>${action.label}
                  </a>
                `).join("")}
              </div>
            </div>
            <div class="hero-stats">${renderHeroStats()}</div>
          </section>

          <div class="layout">
            <div class="main-col">
              <section class="panel section">
                <div class="section-head">
                  <div>
                    <div class="section-kicker"><span class="material-icons-round">stacked_bar_chart</span>Usage Overview</div>
                    <h2 class="section-title">DB 사용량</h2>
                    <p class="section-desc">현재 사용량과 최대 사용 리소스를 중심으로 볼 수 있습니다.</p>
                  </div>
                </div>
                <article class="usage-card">
                  <div class="usage-head">
                    <div>
                      <div class="usage-name">${db.usage.primary.name}</div>
                      <div class="usage-meta">${db.usage.primary.meta}</div>
                    </div>
                    <div class="usage-value">${db.usage.primary.percent}%</div>
                  </div>
                  <div class="usage-track"><div class="usage-fill" style="width:${db.usage.primary.percent}%;"></div></div>
                  <div class="usage-legend">
                    <span>${db.usage.primary.value}</span>
                    <span>${db.usage.primary.legendRight}</span>
                  </div>
                  <div class="usage-meta" style="margin-top:8px;">${db.usage.primary.legendLeft}</div>
                  <div class="mini-stats">${renderMiniStats()}</div>
                </article>
                <article class="card section-card-spacer">
                  <div class="card-title">최대 사용 리소스</div>
                  <div class="peak-grid">${renderPeakUsage()}</div>
                </article>
              </section>

              <section class="panel section">
                <div class="section-head">
                  <div>
                    <div class="section-kicker"><span class="material-icons-round">monitor_heart</span>Status</div>
                    <h2 class="section-title">DB 상태</h2>
                    <p class="section-desc">실행 상태와 운영 상태를 간단히 볼 수 있습니다.</p>
                  </div>
                </div>
                <div class="access-grid">
                  <article class="card">
                    <div class="card-title">상태 개요</div>
                    <div class="kv-list">${renderKvList([{ key: "Runtime State", value: db.statusLabel }, { key: "Engine", value: db.engineLabel }, ...db.runtime.overview])}</div>
                  </article>
                  <article class="card">
                    <div class="card-title">운영 상태</div>
                    <div class="checkpoint-list">${renderCheckpoints()}</div>
                    <div class="member-list section-card-spacer">${renderClusterMembers()}</div>
                  </article>
                </div>
              </section>

              <section class="panel section">
                <div class="section-head">
                  <div>
                    <div class="section-kicker"><span class="material-icons-round">restore_page</span>Snapshots</div>
                    <h2 class="section-title">DB 스냅샷 관리</h2>
                    <p class="section-desc">수동 생성과 최근 스냅샷 목록을 간단히 볼 수 있습니다.</p>
                  </div>
                </div>
                <article class="card">
                  <div class="card-head">
                    <div>
                      <div class="card-title">스냅샷 관리</div>
                      <div class="card-desc">최신 스냅샷 목록은 최대 10개까지 순환 보관 기준으로 정리됩니다.</div>
                    </div>
                    <button class="inline-btn" id="manualSnapshotButton" type="button">
                      <span class="material-icons-round">photo_camera</span>
                      수동 스냅샷
                    </button>
                  </div>
                  <div class="snapshot-manage">
                    <article class="snapshot-action-card">
                      <div>
                        <div class="snapshot-action-title">${db.snapshots.manual.name}</div>
                        <div class="snapshot-action-meta">${db.snapshots.manual.meta}</div>
                      </div>
                      <div class="snapshot-badges">
                        <span class="tag">${db.snapshots.manual.cycle}</span>
                        <span class="tag">${db.snapshots.manual.extraLeft}</span>
                        <span class="tag">${db.snapshots.manual.extraRight}</span>
                      </div>
                    </article>
                    <div class="snapshot-policy-grid">${renderSnapshotPolicies()}</div>
                    <div class="card-head" style="margin-bottom:0;">
                      <div class="card-title">스냅샷 목록</div>
                      <div class="snapshot-rotation-note" id="snapshotRotationCount">${Math.min(db.snapshots.recent.length, 10)} / 10</div>
                    </div>
                    <div class="snapshot-list" id="snapshotList">${renderSnapshots()}</div>
                  </div>
                </article>
              </section>

              <section class="panel section">
                <div class="section-head">
                  <div>
                    <div class="section-kicker"><span class="material-icons-round">vpn_key</span>Access</div>
                    <h2 class="section-title">DB 접근 정보</h2>
                    <p class="section-desc">접속 경로와 계정 정보를 볼 수 있습니다.</p>
                  </div>
                  <a class="section-link" href="workspace_permission_hub.html">접근 정책 보기<span class="material-icons-round">chevron_right</span></a>
                </div>
                <div class="access-grid">
                  <article class="card">
                    <div class="card-title">접속 경로</div>
                    <div class="kv-list">${renderKvList(db.access.overview)}</div>
                  </article>
                  <article class="card">
                    <div class="card-title">계정 및 정책</div>
                    <div class="kv-list">${renderKvList(db.access.credentials)}</div>
                  </article>
                </div>
              </section>

              <section class="panel section">
                <div class="section-head">
                  <div>
                    <div class="section-kicker"><span class="material-icons-round">link</span>Connected Projects</div>
                    <h2 class="section-title">연결된 프로젝트</h2>
                    <p class="section-desc">연결된 프로젝트와 역할을 볼 수 있습니다.</p>
                  </div>
                  <a class="section-link" href="workspace_projects_hub.html">프로젝트 허브 보기<span class="material-icons-round">chevron_right</span></a>
                </div>
                <div class="project-list">${renderBindings()}</div>
              </section>

              <section class="panel section">
                <div class="section-head">
                  <div>
                    <div class="section-kicker"><span class="material-icons-round">terminal</span>Connected Consoles</div>
                    <h2 class="section-title">연결된 콘솔</h2>
                    <p class="section-desc">연결된 콘솔과 웹 콘솔 진입 상태를 볼 수 있습니다.</p>
                  </div>
                </div>
                <div class="console-workbench">${renderConsoleWorkbench()}</div>
                <div class="project-list">${renderConsoleBindings()}</div>
              </section>
            </div>
          </div>
        </main>
      `;

      const menuWrap = document.getElementById("serviceMenuWrap");
      const menuButton = document.getElementById("serviceMenuButton");
      const menuPopover = document.getElementById("serviceMenuPopover");

      if (menuWrap && menuButton && menuPopover) {
        const setOpen = (open) => {
          menuWrap.classList.toggle("is-open", open);
          menuButton.setAttribute("aria-expanded", String(open));
          menuPopover.hidden = !open;
        };

        setOpen(false);

        menuButton.addEventListener("click", (event) => {
          event.preventDefault();
          setOpen(!menuWrap.classList.contains("is-open"));
        });

        document.addEventListener("click", (event) => {
          if (!menuWrap.contains(event.target)) setOpen(false);
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            setOpen(false);
            menuButton.focus();
          }
        });
      }

      const snapshotListEl = document.getElementById("snapshotList");
      const manualSnapshotButton = document.getElementById("manualSnapshotButton");
      const snapshotRotationCountEl = document.getElementById("snapshotRotationCount");
      const consoleModeButtons = Array.from(document.querySelectorAll("[data-console-mode]"));
      const consoleTerminalEl = document.getElementById("consoleTerminal");
      const consoleConnectButton = document.getElementById("connectConsoleButton");
      const consoleConnectStatusEl = document.getElementById("consoleConnectStatus");
      let selectedConsoleMode = "dbcli";

      if (snapshotListEl && manualSnapshotButton) {
        manualSnapshotButton.addEventListener("click", () => {
          const now = new Date();
          const pad = (value) => String(value).padStart(2, "0");
          const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;
          const createdAt = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())} KST`;
          const expiresAt = new Date(now);
          expiresAt.setDate(expiresAt.getDate() + 3);

          db.snapshots.recent.unshift({
            name: `manual-${stamp}`,
            cycle: "Manual",
            pill: { label: "Creating", tone: "warning" },
            meta: `${createdAt} 생성 요청 · 수동 스냅샷`,
            extraLeft: "보관 72시간",
            extraRight: `${pad(expiresAt.getMonth() + 1)}월 ${pad(expiresAt.getDate())}일 만료 예정`
          });

          db.snapshots.recent = db.snapshots.recent.slice(0, 10);

          snapshotListEl.innerHTML = renderSnapshots();
          if (snapshotRotationCountEl) {
            snapshotRotationCountEl.textContent = `${Math.min(db.snapshots.recent.length, 10)} / 10`;
          }
        });
      }

      const renderConsoleTerminal = (mode, connected) => {
        const title = mode === "bash" ? "Bash 선택됨" : "DB CLI 선택됨";
        const body = mode === "bash" ? consolePreset.bash : consolePreset.dbcli;
        const suffix = connected ? "\n\nsession status: connected" : "";
        return `${title}\n\n${body}${suffix}`;
      };

      if (consoleModeButtons.length && consoleTerminalEl) {
        consoleModeButtons.forEach((button) => {
          button.addEventListener("click", () => {
            selectedConsoleMode = button.dataset.consoleMode || "dbcli";
            consoleModeButtons.forEach((item) => item.classList.toggle("active", item === button));
            consoleTerminalEl.textContent = renderConsoleTerminal(selectedConsoleMode, false);
            if (consoleConnectStatusEl) {
              consoleConnectStatusEl.innerHTML = '<span class="material-icons-round">cable</span>연결 대기';
            }
          });
        });
      }

      if (consoleConnectButton && consoleTerminalEl) {
        consoleConnectButton.addEventListener("click", () => {
          consoleTerminalEl.textContent = renderConsoleTerminal(selectedConsoleMode, true);
          if (consoleConnectStatusEl) {
            consoleConnectStatusEl.innerHTML = `<span class="material-icons-round">check_circle</span>${selectedConsoleMode === "bash" ? "Bash 연결됨" : "DB CLI 연결됨"}`;
          }
        });
      }
    })();
  </script>
  <script src="ax_studio_topbar.js"></script>
